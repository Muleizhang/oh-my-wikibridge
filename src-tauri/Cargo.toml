[package]
name = "wikibridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "wikibridge_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
calamine = "0.31"
scraper = "0.24"
csv = "1"
jieba-rs = "0.8"
regex = "1"
nalgebra = "0.34"
rand = "0.9"
tempfile = "3"
wait-timeout = "0.2"
oxigraph = { version = "0.5", default-features = false }
