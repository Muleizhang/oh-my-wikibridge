<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>纹样图录 · 中国纹样全集</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f0e8;color:#203d31;font:16px/1.55 system-ui,"Microsoft YaHei",sans-serif}header{background:#153e33;color:#fcf8eb;padding:15px max(calc((100vw - 1180px)/2),4vw);border-bottom:3px solid #bba273}header b{font:600 22px Georgia,serif}header span{margin-left:16px;font-size:14px}main{max-width:1180px;margin:auto;padding:26px 20px 50px}h1,h2{font-family:"Noto Serif CJK SC","Songti SC",serif}h1{font-size:clamp(34px,5vw,52px);margin:6px 0}h2{font-size:22px;margin:0 0 12px}h3{margin:0}p{margin:8px 0}.head,.toolbar,.tabs,.views{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.head{justify-content:space-between}.toolbar{justify-content:space-between;margin:10px 0 20px}.sub,figcaption,small{font-size:13px;color:#52665b}.columns{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}.panel{min-width:0;padding:20px;background:#fffdf6;border:1px solid #d8dcca;border-radius:12px}.source{margin-top:18px}.tabs button,button,select{font:inherit;font-size:14px;border:1px solid #a6b6a7;border-radius:6px;padding:7px 12px;background:#fffdf6;color:#214637;cursor:pointer}button[aria-pressed=true],button.active{background:#224e3f;color:white}.views{align-items:stretch;flex-wrap:nowrap}.views figure{flex:1;min-width:0;margin:0}.views img{width:100%;height:160px;object-fit:contain;background:#f0ede1}.network{background:#f4f5ec;padding:6px;overflow:auto}.network svg{display:block;width:100%;min-width:480px}blockquote{margin:8px 0;padding:5px 12px;border-left:3px solid #b88b51}.scan{max-width:100%;max-height:120px;display:block;margin:10px 0}.page{position:relative;max-width:640px;margin:10px auto}.page img{width:100%;display:block}.box{position:absolute;border:2px solid #a64226;background:#ffce3720}.tabs{margin-top:12px}.artifact{display:block;text-align:left;margin:6px 0;width:100%}.artifact small{display:block}.artifact.active small{color:#dfebde}.result{margin-top:16px}summary{cursor:pointer}footer{margin-top:25px}button:focus-visible,select:focus-visible{outline:3px solid #bd8847}@media(max-width:800px){.columns{grid-template-columns:1fr}.views img{height:145px}.panel{padding:14px}main{padding:16px 12px}}
</style><header><b>WikiBridge</b><span>纹样知识图谱</span></header><main>
<div class="head"><div><small id="book"></small><h1 id="heading"></h1></div><label>选择纹样　<select id="motifs"></select></label></div>
<div class="toolbar"><span id="count"></span><button id="ask">查询器物与出处</button></div>
<div class="columns"><section class="panel"><h2>纹样与器物</h2><div class="network"><svg id="network"></svg></div><div id="objects"></div></section>
<section class="panel"><h2 id="selected"></h2><p class="sub" id="locator"></p><div class="views"><figure><img id="detail"><figcaption id="detailLabel"></figcaption></figure><figure><img id="whole"><figcaption>器物全图</figcaption></figure></div><div class="tabs" id="edges"></div></section></div>
<section class="panel source"><h2>原页证据</h2><strong id="claim"></strong><blockquote id="quote"></blockquote><img class="scan" id="caption" alt="原书文字区域"><details id="source"><summary id="proofLocator"></summary><div class="page"><img id="page" alt="完整原页"><div class="box" id="box"></div></div></details></section>
<section class="panel result" id="answer" hidden><h2>器物与出处</h2><div id="lines"></div></section><footer class="sub">吴山编著《中国纹样全集》第一册。四个图版条目经扫描图核读。时代依据所属图版分期，材质据器名中的“陶”字。</footer>
</main><script id="data" type="application/json">__BOOK_DATA__</script><script>
__DRAW_NETWORK__
const {manifest,images}=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id), img=url=>images[url.split('/').pop()];
const titles={decorated_with:'饰有纹样',period:'所属时代',made_of:'材质',uses_technique:'工艺'};
const rows=manifest.rows, links=rows.filter(r=>r.predicate==='decorated_with');
const refs=new Map(manifest.evidence.map(e=>[e.id,e]));
let groups=[], selected;
function button(parent,label,action,active=false){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=action;b.setAttribute('aria-pressed',String(active));parent.append(b);return b}
function show(id){
 selected=id;const r=rows.find(r=>r.id===id), g=groups.find(g=>g[0].artifactId===r.artifactId), item=g[0], e=refs.get(r.evidenceId);
 drawNetwork($('network'),groups,id,show);
 $('selected').textContent=item.artifact;$('locator').textContent=item.locator;
 $('detail').src=img(item.detailUrl);$('detail').alt=item.object+' · '+item.detailLabel;$('whole').src=img(item.imageUrl);$('whole').alt=item.artifact;$('detailLabel').textContent=item.detailLabel;
 $('objects').replaceChildren();for(const group of groups){const o=group[0];button($('objects'),o.artifact+'　·　'+o.locator,()=>show(o.id),o.artifactId===item.artifactId).classList.add('artifact')}
 $('edges').replaceChildren();for(const edge of g)button($('edges'),titles[edge.predicate]+' · '+edge.object,()=>show(edge.id),edge.id===id);
 $('claim').textContent=r.artifact+' → '+titles[r.predicate]+' → '+r.object;$('quote').textContent=e.text;
 $('proofLocator').textContent='打开原页 · '+e.locator;$('caption').src=img(e.captionUrl);$('page').src=img(e.previewUrl);
 const [x,y,x2,y2]=e.bbox;Object.assign($('box').style,{left:x*100+'%',top:y*100+'%',width:(x2-x)*100+'%',height:(y2-y)*100+'%'});
}
function change(){const name=$('motifs').value;groups=links.filter(r=>r.object===name).map(l=>rows.filter(r=>r.artifactId===l.artifactId));
 $('heading').textContent=name;$('count').textContent=groups.length+' 件器物 · 点击图中关系可核对图版和出处';$('answer').hidden=true;$('source').open=false;show(groups[0][0].id)}
$('ask').onclick=()=>{$('answer').hidden=false;$('lines').replaceChildren();for(const g of groups){const p=document.createElement('p');p.textContent=g[0].artifact+'（'+g[0].locator+'）　';$('lines').append(p);for(const r of g)button(p,titles[r.predicate]+' · '+r.object,()=>{show(r.id);$('source').open=true;$('claim').scrollIntoView()})}$('answer').scrollIntoView()};
$('book').textContent=manifest.title;for(const n of new Set(links.map(r=>r.object)))$('motifs').add(new Option(n,n));$('motifs').onchange=change;change();
</script></html>
