      const tw = ctx.measureText(e.name).width;
      const padX = 14, bh = 28;
      const bx = p.x - tw * 0.5 - padX;
      const by = labelY - bh * 0.5;
      e._hitBox = [bx, by, bx + tw + padX * 2, by + bh];

      ctx.fillStyle = isHov
        ? hexAlpha(col, dark ? 0.24 : 0.16)
        : (dark ? 'rgba(13,16,24,0.72)' : 'rgba(252,250,245,0.82)');
      roundRect(ctx, bx, by, tw + padX * 2, bh, 14);
      ctx.fill();
      ctx.strokeStyle = hexAlpha(col, isHov ? 0.88 : 0.36);
      ctx.lineWidth = isHov ? 1.3 : 1;
      ctx.stroke();

      ctx.fillStyle = isHov ? (dark ? '#fff6e4' : col) : (dark ? '#efece4' : '#1e1c19');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(e.name, p.x, labelY + 0.5);
      ctx.textBaseline = 'alphabetic';
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     6. VIEW 2 — Clustered 2D / 3D Knowledge Graph Engine
     ═══════════════════════════════════════════════════════════════ */
  const graph = {
    canvas: null, ctx: null, w: 0, h: 0, dpr: 1,
    // 2D camera
    panX: 0, panY: 0, zoom: 1,
    targetPanX: 0, targetPanY: 0, targetZoom: 1,
    // 3D camera
    yaw: -0.32, pitch: 0.24, targetYaw: -0.32, targetPitch: 0.24,
    velYaw: 0, velPitch: 0,
    // Scene graph
    core: null,
    clusters: [],   // { id, name, kind, isUnlabeled, color, items, tx,ty,tz, x,y,z, r, sr, sx,sy,sz }
    nodes: [],      // { item, cluster, tx,ty,tz, x,y,z, baseR, sx,sy,sz, sr }
    hoveredNode: null,
    hoveredCluster: null,
    dragging: false, dragMoved: false, dragSX: 0, dragSY: 0,
    stars: [],
    morphT: 1,
  };

  function initGraph() {
    graph.canvas = $('graphCanvas');
    graph.ctx = graph.canvas.getContext('2d');
    graph.stars = Array.from({ length: 110 }, (_, i) => ({
      x: ((i * 6271) % 10000) / 10000,
      y: ((i * 93563) % 10000) / 10000,
      r: 0.5 + (i % 4) * 0.3,
      a: 0.06 + (i % 6) * 0.025,
    }));
    bindGraphEvents();
    resizeGraph();
  }

  function resizeGraph() {
    if (!graph.canvas) return;
    graph.dpr = Math.min(window.devicePixelRatio || 1, 2);
    graph.w = window.innerWidth;
    graph.h = window.innerHeight;
    graph.canvas.width = Math.round(graph.w * graph.dpr);
    graph.canvas.height = Math.round(graph.h * graph.dpr);
  }

  function getFocalItems(kind, id) {
    if (kind === 'era') return G.eraById.get(id)?.items || [];
    if (kind === 'material') return G.matById.get(id)?.items || [];
    if (kind === 'motif') return G.motifById.get(id)?.items || [];
    return [];
  }

  function clusterKeysOf(item, clusterBy) {
    if (clusterBy === 'era') return item.eraGroups.length ? item.eraGroups : ['未标时代'];
    if (clusterBy === 'material') return item.materials.length ? item.materials : ['未标材质'];
    return item.motifs.length ? item.motifs : ['未标纹样'];
  }

  function rebuildGraphScene(resetCamera = true) {
    const items = getFocalItems(state.focusKind, state.focusId);
    const groupMap = new Map();

    for (const it of items) {
      const keys = clusterKeysOf(it, state.clusterBy);
      for (const k of keys) {
        const isUnlabeled = k.startsWith('未标');
        if (isUnlabeled && !state.showUnlabeled) continue;
        if (!groupMap.has(k)) {
          groupMap.set(k, { id: k, name: k, kind: state.clusterBy, isUnlabeled, items: [] });
        }
        const grp = groupMap.get(k);
        if (!grp.items.includes(it)) grp.items.push(it);
      }
    }

    let clusters = [...groupMap.values()];
    if (state.clusterBy === 'era') {
      clusters.sort((a, b) => {
        if (a.isUnlabeled !== b.isUnlabeled) return a.isUnlabeled ? 1 : -1;
        return eraChronology(a.name).order - eraChronology(b.name).order;
      });
    } else {
      clusters.sort((a, b) => {
        if (a.isUnlabeled !== b.isUnlabeled) return a.isUnlabeled ? 1 : -1;
        return b.items.length - a.items.length || a.name.localeCompare(b.name, 'zh-Hans');
      });
    }

    // Previous node coordinates for silky spring transitions
    const prevNodePos = new Map(graph.nodes.map(n => [n.item.id + '|' + n.cluster.id, [n.x, n.y, n.z]]));
    const prevClusPos = new Map(graph.clusters.map(c => [c.id, [c.x, c.y, c.z]]));

    // Representative thumbnail for the focal center core
    const repImg = items[0]?.thumbUrl || '';
    graph.core = {
      id: state.focusId,
      name: state.focusId,
      kind: state.focusKind,
      count: items.length,
      thumbUrl: repImg,
      x: 0, y: 0, z: 0, r: 44, sx: 0, sy: 0, sr: 44,
    };

    // Compute clean, mathematically non-overlapping orbital constellation layout (2D & 3D!)
    const is3D = state.dim === '3d';
    const maxVisibleInCluster = c => c.isUnlabeled ? Math.min(c.items.length, 18) : c.items.length;

    // Step A: size each cluster halo based on visible specimen count
    for (const c of clusters) {
      const cnt = maxVisibleInCluster(c);
      c.shownItems = c.items.slice(0, cnt);
      c.hiddenCount = c.items.length - cnt;
      c.haloR = cnt <= 1 ? 52 : Math.min(138, 44 + 17.5 * Math.sqrt(cnt));
      c.hubR = c.isUnlabeled ? 16 : 20;
    }

    // Step B: Partition into 1 or 2 concentric rings when there are many clusters so ZERO halos overlap!
    const rings = [];
    if (clusters.length <= 8) {
      rings.push(clusters);
    } else {
      // Primary inner ring: top major clusters (up to 7); outer ring: remaining clusters
      const innerCount = Math.min(7, Math.max(5, clusters.filter(c => !c.isUnlabeled && c.items.length >= 2).length));
      rings.push(clusters.slice(0, innerCount));
      rings.push(clusters.slice(innerCount));
    }

    let prevRingOuter = 82;
    rings.forEach((ring, rIdx) => {
      if (!ring.length) return;
      const gap = 28;
      const circumferenceNeeded = ring.reduce((s, c) => s + c.haloR * 2 + gap, 0);
      const maxHalo = Math.max(...ring.map(c => c.haloR));
      const minRadiusByCircum = ring.length === 1 ? 185 : circumferenceNeeded / (Math.PI * 2);
      const ringRadius = Math.max(prevRingOuter + maxHalo + 36, minRadiusByCircum);
      prevRingOuter = ringRadius + maxHalo;

      // Allocate angular spans proportional to each cluster's haloR
      const totalSpan = ring.reduce((s, c) => s + c.haloR + gap * 0.5, 0);
      let angle = -Math.PI * 0.5 + (rIdx * 0.35);

      ring.forEach((c, ci) => {
        const wedge = ((c.haloR + gap * 0.5) / totalSpan) * Math.PI * 2;
        const midA = angle + wedge * 0.5;
        angle += wedge;

        c.orbitR = ringRadius;
        c.orbitAngle = midA;
        if (is3D) {
          // Graceful 3D tilted celestial shells
          const elev = Math.sin(midA * 2 + rIdx * 1.4) * 0.42 + (rIdx === 1 ? (ci % 2 === 0 ? 0.32 : -0.32) : 0);
          c.tx = ringRadius * Math.cos(midA) * Math.cos(elev);
          c.ty = ringRadius * Math.sin(midA) * 0.78 + ringRadius * Math.sin(elev) * 0.42;
          c.tz = ringRadius * Math.sin(midA) * Math.sin(elev) * 0.85 + ringRadius * Math.cos(midA * 2 + rIdx) * 0.36;
        } else {
          c.tx = ringRadius * Math.cos(midA);
          c.ty = ringRadius * Math.sin(midA);
          c.tz = 0;
        }

        const prev = prevClusPos.get(c.id);
        c.x = prev ? prev[0] : c.tx * 0.25;
        c.y = prev ? prev[1] : c.ty * 0.25;
        c.z = prev ? prev[2] : c.tz * 0.25;
      });
    });

    // Step C: Pack specimen medallions cleanly inside each cluster halo (phyllotaxis / clean ring!)
    const nodes = [];
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (const c of clusters) {
      const list = c.shownItems;
      const cnt = list.length;
      const nodeR = cnt <= 4 ? 19 : (cnt <= 10 ? 16 : 13.5);
      list.forEach((it, i) => {
        let lx, ly, lz = 0;
        if (cnt === 1) {
          const a = c.orbitAngle;
          lx = Math.cos(a) * 34;
          ly = Math.sin(a) * 34;
        } else if (cnt <= 6) {
          const a = c.orbitAngle + (i / cnt) * Math.PI * 2;
          const dist = Math.max(36, c.haloR * 0.58);
          lx = Math.cos(a) * dist;
          ly = Math.sin(a) * dist;
        } else {
          const frac = (i + 0.6) / cnt;
          const dist = 30 + Math.sqrt(frac) * (c.haloR - nodeR - 26);
          const a = i * golden + c.orbitAngle;
          lx = Math.cos(a) * dist;
          ly = Math.sin(a) * dist;
        }
        if (is3D) {
          const phi = (i / Math.max(1, cnt)) * Math.PI * 2 + c.orbitAngle;
          lz = Math.sin(phi * 1.5) * Math.min(48, c.haloR * 0.45);
        }
        const tx = c.tx + lx, ty = c.ty + ly, tz = c.tz + lz;
        const prev = prevNodePos.get(it.id + '|' + c.id);
        nodes.push({
          item: it,
          cluster: c,
          tx, ty, tz,
          x: prev ? prev[0] : c.tx * 0.35,
          y: prev ? prev[1] : c.ty * 0.35,
          z: prev ? prev[2] : c.tz * 0.35,
          baseR: nodeR,
          sx: 0, sy: 0, sz: 0, sr: nodeR,
        });
        getSprite(it.thumbUrl);
      });
    }

    graph.clusters = clusters;
    graph.nodes = nodes;

    if (resetCamera) {
      fitGraphCamera(prevRingOuter + 40);
    }
  }

  function fitGraphCamera(extentRadius) {
    const availW = Math.max(360, graph.w - 80);
    const availH = Math.max(320, graph.h - 170);
    const span = Math.max(240, extentRadius * 2);
    const z = Math.max(0.36, Math.min(1.18, Math.min(availW / span, availH / span)));
    graph.targetPanX = 0;
    graph.targetPanY = 10;
    graph.targetZoom = z;
    if (state.dim === '3d') {
      graph.targetYaw = -0.32;
      graph.targetPitch = 0.24;
    }
  }

  function renderGraphHud() {
    const kindEl = $('focusKind');
    kindEl.textContent = KIND_LABEL[state.focusKind];
    kindEl.className = 'focus-kind ' + state.focusKind;
    $('focusLabel').textContent = state.focusId;
    const totalItems = getFocalItems(state.focusKind, state.focusId).length;
    $('focusMeta').textContent = `${totalItems} 条 · ${graph.clusters.length} 簇`;
    $('graphBack').disabled = state.history.length === 0;

    // Breadcrumb trail (last 3 steps)
    const trailEl = $('graphTrail');
    trailEl.replaceChildren();
    const recent = state.history.slice(-3);
    recent.forEach((step, idx) => {
      const sep = document.createElement('span');
      sep.textContent = '›';
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = step.id;
      b.onclick = () => {
        const cut = state.history.length - recent.length + idx;
        state.history = state.history.slice(0, cut);
        openGraph(step.kind, step.id, { clusterBy: step.clusterBy, pushHistory: false });
      };
      trailEl.append(sep, b);
    });

    // ClusterBy toggle buttons
    const cs = $('clusterSwitch');
    cs.replaceChildren();
    for (const [val, lbl] of clusterOptionsFor(state.focusKind)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = lbl;
      b.setAttribute('aria-pressed', String(state.clusterBy === val));
      b.onclick = () => {
        if (state.clusterBy === val) return;
        state.clusterBy = val;
        rebuildGraphScene(true);
        renderGraphHud();
        syncHash();
      };
      cs.append(b);
    }

    // 2D / 3D toggle
    $('dimSwitch').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.dim === state.dim));
    });

    $('toggleUnlabeled').setAttribute('aria-pressed', String(state.showUnlabeled));

    // Bottom quick cluster chips (click to pivot directly into that cluster's graph!)
    const strip = $('clusterStrip');
    strip.replaceChildren();
    const stripLbl = document.createElement('span');
    stripLbl.className = 'dock-label';
    stripLbl.textContent = KIND_LABEL[state.clusterBy] + '簇';
    strip.append(stripLbl);

    for (const c of graph.clusters) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      const col = colorFor(c.kind, c.name);
      b.innerHTML = `<span class="dot" style="background:${col}"></span><span>${esc(c.name)}</span><span class="num">${c.items.length}</span>`;
      b.onmouseenter = () => { graph.hoveredCluster = c; };
      b.onmouseleave = () => { if (graph.hoveredCluster === c) graph.hoveredCluster = null; };
      b.onclick = () => {
        if (!c.isUnlabeled) openGraph(c.kind, c.id);
      };
      if (c.isUnlabeled) b.style.opacity = '0.62';
      strip.append(b);
    }
  }

  function projectPoint(x, y, z) {
    const cx = graph.w * 0.5 + graph.panX;
    const cy = graph.h * 0.52 + graph.panY;
    if (state.dim === '2d') {
      return { x: cx + x * graph.zoom, y: cy + y * graph.zoom, z: 0, k: graph.zoom };
    }
    const cyaw = Math.cos(graph.yaw), syaw = Math.sin(graph.yaw);
    const cp = Math.cos(graph.pitch), sp = Math.sin(graph.pitch);
    const rx = x * cyaw + z * syaw;
    const rz1 = z * cyaw - x * syaw;
    const ry = y * cp - rz1 * sp;
    const depth = y * sp + rz1 * cp;
    const camD = 980;
    const persp = camD / Math.max(180, camD - depth);
    const k = graph.zoom * persp;
    return { x: cx + rx * k, y: cy + ry * k, z: depth, k };
  }

  function bindGraphEvents() {
    const c = graph.canvas;
    c.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      graph.dragging = true;
      graph.dragMoved = false;
      graph.dragSX = e.clientX;
      graph.dragSY = e.clientY;
      graph.velYaw = 0; graph.velPitch = 0;
      c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', e => {
      if (graph.dragging) {
        const dx = e.clientX - graph.dragSX;
        const dy = e.clientY - graph.dragSY;
        if (Math.hypot(dx, dy) > 4) graph.dragMoved = true;
        if (state.dim === '3d') {
          graph.targetYaw += dx * 0.0065;
          graph.targetPitch = Math.max(-1.15, Math.min(1.15, graph.targetPitch - dy * 0.006));
          graph.velYaw = dx * 0.002;
          graph.velPitch = -dy * 0.0018;
        } else {
          graph.targetPanX += dx;
          graph.targetPanY += dy;
        }
        graph.dragSX = e.clientX;
        graph.dragSY = e.clientY;
        hideTip();
        return;
      }
      hitTestGraph(e.clientX, e.clientY);
    });
    c.addEventListener('pointerup', e => {
      if (!graph.dragging) return;
      graph.dragging = false;
      if (!graph.dragMoved) {
        hitTestGraph(e.clientX, e.clientY);
        if (stageOverlay?.graphScene) {
          const hit = stageOverlay.hoveredNode;
          if (hit) {
            if (hit.artifactId) openDrawer(hit.artifactId);
            else if (['era', 'material', 'motif'].includes(hit.kind) && !hit.isOntology) {
              clearStageOverlay();
              openGraph(hit.kind, hit.label);
            }
          } else {
            closeDrawer();
          }
          return;
        }
        if (graph.hoveredNode) {
          openDrawer(graph.hoveredNode.item.id);
        } else if (graph.hoveredCluster && !graph.hoveredCluster.isUnlabeled) {
          // One-click pivot from any cluster hub into its own clustered 2D/3D graph!
          openGraph(graph.hoveredCluster.kind, graph.hoveredCluster.id);
        } else {
          closeDrawer();
        }
      }
    });
    c.addEventListener('pointerleave', () => {
      graph.hoveredNode = null;
      graph.hoveredCluster = null;
      if (stageOverlay) stageOverlay.hoveredNode = null;
      hideTip();
    });
    c.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      graph.targetZoom = Math.max(0.28, Math.min(3.2, graph.targetZoom * factor));
    }, { passive: false });
    c.addEventListener('dblclick', () => {
      if (!graph.hoveredNode && !graph.hoveredCluster) {
        const maxR = stageOverlay?.graphScene
          ? (stageOverlay.graphScene.extent || 360)
          : Math.max(240, ...graph.clusters.map(cl => (cl.orbitR || 200) + cl.haloR));
        fitGraphCamera(maxR + 30);
      }
    });
  }

  function hitTestGraph(mx, my) {
    // Dedicated Reasoning Overlay Stage hit-testing (works in both 2D & 3D!)
    if (stageOverlay?.graphScene) {
      let best = null, bestZ = -Infinity;
      for (const n of stageOverlay.graphScene.nodes) {
        const d = Math.hypot(mx - n.sx, my - n.sy);
        if (d <= n.sr + 6 && n.sz >= bestZ) { best = n; bestZ = n.sz; }
      }
      stageOverlay.hoveredNode = best;
      graph.canvas.classList.toggle('pointer', Boolean(best));
      if (best) {
        const tags = [];
        if (best.roleTag) tags.push(`<span class="tip-tag">${esc(best.roleTag)}</span>`);
        if (best.sub) tags.push(`<span class="tip-tag">${esc(best.sub)}</span>`);
        const hint = best.artifactId ? '点击查看原书扫描图与红框证据' : (best.isOntology ? 'RDFS 本体抽象类节点' : '点击进入该实体的聚类图谱 →');
        showTip(mx, my, `<strong>${esc(best.label)}</strong>${tags.length ? `<div class="tip-tags">${tags.join('')}</div>` : ''}<div class="tip-hint">${hint}</div>`);
      } else {
        hideTip();
      }
      return;
    }

    // 1) Check specimen nodes front-to-back (highest z first)
    let hitNode = null, bestZ = -Infinity;
    for (const n of graph.nodes) {
      const d = Math.hypot(mx - n.sx, my - n.sy);
      if (d <= n.sr + 4 && n.sz >= bestZ) { hitNode = n; bestZ = n.sz; }
    }
    graph.hoveredNode = hitNode;

    // 2) Check cluster hubs & clickable cluster label pills
    let hitCluster = null;
    if (!hitNode) {
      let bestCZ = -Infinity;
      for (const c of graph.clusters) {
        const dHub = Math.hypot(mx - c.sx, my - c.sy);
        const inPill = c._labelBox && mx >= c._labelBox[0] && mx <= c._labelBox[2] && my >= c._labelBox[1] && my <= c._labelBox[3];
        if ((dHub <= c.sr + 6 || inPill) && c.sz >= bestCZ) {
          hitCluster = c; bestCZ = c.sz;
        }
      }
    }
    graph.hoveredCluster = hitCluster;
    graph.canvas.classList.toggle('pointer', Boolean(hitNode || (hitCluster && !hitCluster.isUnlabeled)));

    if (hitNode) {
      const it = hitNode.item;
      const tags = [
        ...it.periods.map(p => `<span class="tip-tag">${esc(p)}</span>`),
        ...it.materials.map(m => `<span class="tip-tag">${esc(m)}</span>`),
        ...it.motifs.slice(0, 3).map(m => `<span class="tip-tag">${esc(m)}</span>`),
      ];
      showTip(mx, my, `<strong>${esc(it.title)}</strong><div class="tip-tags">${tags.join('')}</div><div class="tip-hint">点击查看详情、原页证据与快捷跳转</div>`);
    } else if (hitCluster) {
      const nextDefault = defaultClusterFor(hitCluster.kind);
      const hint = hitCluster.isUnlabeled
        ? '该条目在原数据中尚未标注此属性'
        : `点击进入「${esc(hitCluster.name)}」图谱（默认按${KIND_LABEL[nextDefault]}聚类）→`;
      showTip(mx, my, `<strong>${esc(hitCluster.name)}</strong><div class="tip-tags"><span class="tip-tag">${KIND_LABEL[hitCluster.kind]}聚类</span><span class="tip-tag">${hitCluster.items.length} 条</span></div><div class="tip-hint">${hint}</div>`);
    } else {
      hideTip();
    }
  }

  function drawGraph(timeSec) {
    const { ctx, w, h, dpr } = graph;
    if (!w || !h || !graph.core) return;

    // Smooth camera & inertia
    graph.panX += (graph.targetPanX - graph.panX) * 0.14;
    graph.panY += (graph.targetPanY - graph.panY) * 0.14;
    graph.zoom += (graph.targetZoom - graph.zoom) * 0.14;
    if (state.dim === '3d') {
      if (!graph.dragging) {
        graph.targetYaw += graph.velYaw;
        graph.targetPitch = Math.max(-1.15, Math.min(1.15, graph.targetPitch + graph.velPitch));
        graph.velYaw *= 0.92;
        graph.velPitch *= 0.92;
        // Very subtle celestial drift when idle
        if (Math.abs(graph.velYaw) < 0.0002 && !graph.hoveredNode && !graph.hoveredCluster) {
          graph.targetYaw += 0.00065;
        }
      }
      graph.yaw += (graph.targetYaw - graph.yaw) * 0.14;
      graph.pitch += (graph.targetPitch - graph.pitch) * 0.14;
    }

    // Spring-morph cluster and node coordinates
    for (const c of graph.clusters) {
      c.x += (c.tx - c.x) * 0.15;
      c.y += (c.ty - c.y) * 0.15;
      c.z += (c.tz - c.z) * 0.15;
    }
    for (const n of graph.nodes) {
      n.x += (n.tx - n.x) * 0.15;
      n.y += (n.ty - n.y) * 0.15;
      n.z += (n.tz - n.z) * 0.15;
    }

    const dark = currentTheme() === 'dark';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 1) Backdrop
    const bgGrad = ctx.createRadialGradient(w * 0.5, h * 0.52, 20, w * 0.5, h * 0.52, Math.max(w, h) * 0.68);
    if (dark) {
      bgGrad.addColorStop(0, '#141824');
      bgGrad.addColorStop(0.6, '#0b0d13');
      bgGrad.addColorStop(1, '#07090d');
    } else {
      bgGrad.addColorStop(0, '#fdfcf9');
      bgGrad.addColorStop(0.65, '#f6f4ee');
      bgGrad.addColorStop(1, '#ede8dd');
    }
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    // Subtle background starfield / academic chart dots
    for (const s of graph.stars) {
      ctx.fillStyle = dark ? `rgba(232,224,205,${s.a})` : `rgba(50,45,38,${s.a * 0.45})`;
      ctx.beginPath();
      ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // If a dedicated Reasoning Overlay Scene (path / compare / predict) is active, render it in full 2D/3D!
    if (stageOverlay?.graphScene) {
      drawReasoningStage(ctx, stageOverlay.graphScene, dark, timeSec);
      return;
    }

    // 2) Project core, clusters, and nodes
    const coreP = projectPoint(0, 0, 0);
    graph.core.sx = coreP.x; graph.core.sy = coreP.y; graph.core.sr = graph.core.r * coreP.k;

    const ringRadii = [...new Set(graph.clusters.map(c => Math.round(c.orbitR || 0)))].filter(Boolean);

    // 3) Subtle Celestial Orbital Guide Rings
    for (const rr of ringRadii) {
      ctx.beginPath();
      const segs = 90;
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        const p = projectPoint(Math.cos(a) * rr, Math.sin(a) * rr, 0);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = dark ? 'rgba(239,236,228,0.065)' : 'rgba(30,28,25,0.075)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 7]);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    const activeCluster = graph.hoveredCluster || graph.hoveredNode?.cluster || null;
    const selectedItemId = graph.hoveredNode?.item.id || state.drawerItemId;
    const coreCol = colorFor(graph.core.kind, graph.core.name);

    for (const c of graph.clusters) {
      const p = projectPoint(c.x, c.y, c.z);
      c.sx = p.x; c.sy = p.y; c.sz = p.z; c.sk = p.k;
      c.sr = c.hubR * p.k;
      c.haloSr = c.haloR * p.k;
    }

    // 4) Cluster Halos & Core-to-Cluster Spokes (depth-ordered)
    const sortedClusters = [...graph.clusters].sort((a, b) => a.sz - b.sz);
    for (const c of sortedClusters) {
      const col = colorFor(c.kind, c.name);
      const isAct = activeCluster === c;
      const dimAlpha = activeCluster && !isAct ? 0.30 : 1.0;
      const depthFade = state.dim === '3d' ? Math.max(0.32, Math.min(1, (c.sz + 520) / 720)) : 1;
      const a = dimAlpha * depthFade;

      // Translucent cluster constellation halo
      const hg = ctx.createRadialGradient(c.sx, c.sy, c.sr * 0.5, c.sx, c.sy, c.haloSr);
      hg.addColorStop(0, hexAlpha(col, (dark ? 0.14 : 0.09) * a * (isAct ? 1.55 : 1)));
      hg.addColorStop(0.75, hexAlpha(col, (dark ? 0.045 : 0.03) * a));
      hg.addColorStop(1, hexAlpha(col, 0));
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(c.sx, c.sy, c.haloSr, 0, Math.PI * 2);
      ctx.fill();

      // Delicate dashed perimeter enclosing the cluster
      ctx.beginPath();
      ctx.arc(c.sx, c.sy, c.haloSr, 0, Math.PI * 2);
      ctx.strokeStyle = hexAlpha(col, (isAct ? 0.55 : 0.22) * a);
      ctx.lineWidth = isAct ? 1.3 : 0.85;
      ctx.setLineDash(c.isUnlabeled ? [2, 5] : [4, 5]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Curved filament connecting Center Core -> Cluster Hub
      ctx.beginPath();
      const mx = (coreP.x + c.sx) * 0.5 - (c.sy - coreP.y) * 0.09;
      const my = (coreP.y + c.sy) * 0.5 + (c.sx - coreP.x) * 0.09;
      ctx.moveTo(coreP.x, coreP.y);
      ctx.quadraticCurveTo(mx, my, c.sx, c.sy);
      ctx.strokeStyle = hexAlpha(col, (isAct ? 0.72 : 0.28) * a);
      ctx.lineWidth = isAct ? 1.65 : 1.0;
      ctx.stroke();
    }

    // 5) Project all specimen nodes & draw intra-cluster constellation filaments
    for (const n of graph.nodes) {
      const p = projectPoint(n.x, n.y, n.z);
      n.sx = p.x; n.sy = p.y; n.sz = p.z; n.sk = p.k;
      n.sr = n.baseR * p.k;

      const c = n.cluster;
      const col = colorFor(c.kind, c.name);
      const isAct = activeCluster === c || n.item.id === selectedItemId;
      const dimAlpha = activeCluster && !isAct ? 0.22 : 1;
      const depthFade = state.dim === '3d' ? Math.max(0.28, Math.min(1, (n.sz + 520) / 720)) : 1;

      ctx.beginPath();
      ctx.moveTo(c.sx, c.sy);
      ctx.lineTo(n.sx, n.sy);
      ctx.strokeStyle = hexAlpha(col, (isAct ? 0.45 : 0.18) * dimAlpha * depthFade);
      ctx.lineWidth = isAct ? 1.15 : 0.75;
      ctx.stroke();
    }

    // Cross-cluster co-occurrence arcs when hovering a specimen node!
    if (graph.hoveredNode) {
      const hn = graph.hoveredNode;
      const hMotifs = new Set(hn.item.motifs);
      for (const n of graph.nodes) {
        if (n === hn || n.cluster === hn.cluster) continue;
        const shared = n.item.id === hn.item.id || (hMotifs.size && n.item.motifs.some(m => hMotifs.has(m)));
        if (shared) {
          ctx.beginPath();
          ctx.moveTo(hn.sx, hn.sy);
          ctx.quadraticCurveTo(coreP.x, coreP.y, n.sx, n.sy);
          ctx.strokeStyle = dark ? 'rgba(216,179,119,0.48)' : 'rgba(143,78,50,0.42)';
          ctx.lineWidth = 1.2;
          ctx.setLineDash([3, 4]);
          ctx.stroke();
        }
      }
      ctx.setLineDash([]);
    }

    // 6) Depth-sorted paint pass: Core + Cluster Hubs + Specimen Medallions
    const drawables = [];
    drawables.push({ type: 'core', z: coreP.z });
    for (const c of graph.clusters) drawables.push({ type: 'cluster', z: c.sz + 0.5, obj: c });
    for (const n of graph.nodes) drawables.push({ type: 'node', z: n.sz + (n.item.id === selectedItemId ? 40 : 0), obj: n });
    drawables.sort((a, b) => a.z - b.z);

    for (const d of drawables) {
      if (d.type === 'core') {
        drawCoreHub(ctx, graph.core, coreCol, dark, timeSec);
      } else if (d.type === 'cluster') {
        drawClusterHub(ctx, d.obj, activeCluster, dark);
      } else {
        drawSpecimenNode(ctx, d.obj, activeCluster, selectedItemId, dark);
      }
    }
  }

  function drawCoreHub(ctx, core, col, dark, timeSec) {
    const r = core.sr;
    const pulse = 1 + 0.04 * Math.sin(timeSec * 1.8);

    // Majestic outer celestial aura
    const glow = ctx.createRadialGradient(core.sx, core.sy, r * 0.6, core.sx, core.sy, r * 2.5 * pulse);
    glow.addColorStop(0, hexAlpha(col, dark ? 0.34 : 0.20));
    glow.addColorStop(0.5, hexAlpha(col, dark ? 0.10 : 0.06));
    glow.addColorStop(1, hexAlpha(col, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(core.sx, core.sy, r * 2.5 * pulse, 0, Math.PI * 2);
    ctx.fill();

    // Decorative outer astronomical ring
    ctx.beginPath();
    ctx.arc(core.sx, core.sy, r + 6, 0, Math.PI * 2);
    ctx.strokeStyle = hexAlpha(col, 0.45);
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Core disc
    const sp = getSprite(core.thumbUrl);
    const bmp = sp?.status === 'ready' ? (dark ? sp.dark : sp.light) : null;
    if (bmp && core.kind === 'motif') {
      ctx.drawImage(bmp, core.sx - r, core.sy - r, r * 2, r * 2);
      ctx.fillStyle = dark ? 'rgba(9,11,16,0.45)' : 'rgba(250,248,243,0.48)';
      ctx.beginPath();
      ctx.arc(core.sx, core.sy, r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const dg = ctx.createRadialGradient(core.sx - r * 0.25, core.sy - r * 0.25, 2, core.sx, core.sy, r);
      if (dark) {
        dg.addColorStop(0, hexAlpha(col, 0.36));
        dg.addColorStop(1, '#12151f');
      } else {
        dg.addColorStop(0, '#ffffff');
        dg.addColorStop(1, hexAlpha(col, 0.16));
      }
      ctx.fillStyle = dg;
      ctx.beginPath();
      ctx.arc(core.sx, core.sy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(core.sx, core.sy, r, 0, Math.PI * 2);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Core serif label inside disc
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const fs = Math.max(12, Math.min(18, r * 0.38));
    ctx.font = `600 ${fs}px "Noto Serif SC","Songti SC",serif`;
    ctx.fillStyle = dark ? '#faf5ea' : '#1e1c19';
    const shortName = core.name.length > 6 ? core.name.slice(0, 6) + '…' : core.name;
    ctx.fillText(shortName, core.sx, core.sy - 4);
    ctx.font = `500 ${Math.max(9, fs * 0.58)}px ui-monospace,monospace`;
    ctx.fillStyle = col;
    ctx.fillText(`${KIND_LABEL[core.kind]} · ${core.count}`, core.sx, core.sy + fs * 0.72);
    ctx.textBaseline = 'alphabetic';
  }

  function drawClusterHub(ctx, c, activeCluster, dark) {
    const col = colorFor(c.kind, c.name);
    const isAct = activeCluster === c;
    const dimAlpha = activeCluster && !isAct ? 0.32 : 1;
    const depthFade = state.dim === '3d' ? Math.max(0.32, Math.min(1, (c.sz + 520) / 720)) : 1;
    const alpha = dimAlpha * depthFade;
    const r = Math.max(8, c.sr * (isAct ? 1.16 : 1));

    ctx.save();
    ctx.globalAlpha = alpha;

    // Hub glow
    if (isAct || dark) {
      const g = ctx.createRadialGradient(c.sx, c.sy, 2, c.sx, c.sy, r * 2.1);
      g.addColorStop(0, hexAlpha(col, isAct ? 0.45 : 0.22));
      g.addColorStop(1, hexAlpha(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(c.sx, c.sy, r * 2.1, 0, Math.PI * 2);
      ctx.fill();
    }

    // Hub medallion circle
    ctx.fillStyle = dark ? '#131722' : '#fcfaf5';
    ctx.beginPath();
    ctx.arc(c.sx, c.sy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = isAct ? 2.2 : 1.5;
    ctx.stroke();

    // Count inside hub
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `600 ${Math.max(10, Math.min(13, r * 0.62))}px ui-monospace,monospace`;
    ctx.fillStyle = col;
    ctx.fillText(String(c.items.length), c.sx, c.sy + 0.5);

    // Clean clickable Cluster Label Pill outside top edge of cluster halo
    const labelText = c.name + (c.hiddenCount > 0 ? ` (+${c.hiddenCount})` : '');
    const ly = c.sy - c.haloSr - 12;
    ctx.font = `600 12.5px "Noto Serif SC","Songti SC",serif`;
    const tw = ctx.measureText(labelText).width;
    const pw = tw + 18, ph = 22;
    const px = c.sx - pw * 0.5, py = ly - ph * 0.5;
    c._labelBox = [px, py, px + pw, py + ph];

    ctx.fillStyle = isAct
      ? hexAlpha(col, dark ? 0.28 : 0.16)
      : (dark ? 'rgba(13,16,24,0.82)' : 'rgba(252,250,245,0.92)');
    roundRect(ctx, px, py, pw, ph, 11);
    ctx.fill();
    ctx.strokeStyle = hexAlpha(col, isAct ? 0.92 : 0.42);
    ctx.lineWidth = isAct ? 1.3 : 0.9;
    ctx.stroke();

    ctx.fillStyle = isAct ? (dark ? '#fff7e8' : col) : (dark ? '#efece4' : '#211e1a');
    ctx.fillText(labelText, c.sx, ly + 0.5);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  function drawSpecimenNode(ctx, n, activeCluster, selectedItemId, dark) {
    const it = n.item;
    const col = colorFor(n.cluster.kind, n.cluster.name);
    const isSel = it.id === selectedItemId || Boolean(stageOverlay?.artifactSet?.has(it.id));
    const isAct = isSel || activeCluster === n.cluster;
    const dimAlpha = (activeCluster || stageOverlay?.artifactSet) && !isAct ? 0.22 : 1;
    const depthFade = state.dim === '3d' ? Math.max(0.28, Math.min(1, (n.sz + 520) / 720)) : 1;
    const r = Math.max(5, n.sr * (isSel ? 1.24 : 1));

    ctx.save();
    ctx.globalAlpha = dimAlpha * depthFade;

    if (isSel) {
      const g = ctx.createRadialGradient(n.sx, n.sy, r * 0.6, n.sx, n.sy, r * 2.1);
      g.addColorStop(0, hexAlpha(col, 0.48));
      g.addColorStop(1, hexAlpha(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r * 2.1, 0, Math.PI * 2);
      ctx.fill();
    }

    const sp = getSprite(it.thumbUrl);
    const bmp = sp?.status === 'ready' ? (dark ? sp.dark : sp.light) : null;
    if (bmp) {
      ctx.drawImage(bmp, n.sx - r, n.sy - r, r * 2, r * 2);
    } else {
      ctx.fillStyle = dark ? '#1a1f2c' : '#ece7dc';
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
    ctx.strokeStyle = isSel ? (dark ? '#f7e1b5' : '#8f4e32') : hexAlpha(col, isAct ? 0.82 : 0.50);
    ctx.lineWidth = isSel ? 2.2 : 1.15;
    ctx.stroke();

    // Concise label beneath node only when selected, hovered cluster, or zoomed closely
    if (isSel || (activeCluster === n.cluster && r >= 13) || r >= 22) {
      const lbl = (it.motifs[0] && state.clusterBy !== 'motif' && state.focusKind !== 'motif')
        ? it.motifs[0]
        : (it.title.length > 9 ? it.title.slice(0, 8) + '…' : it.title);
      ctx.font = `500 10.5px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign = 'center';
      ctx.fillStyle = dark ? 'rgba(239,236,228,0.88)' : 'rgba(30,28,25,0.85)';
      ctx.fillText(lbl, n.sx, n.sy + r + 13);
    }
    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ═══════════════════════════════════════════════════════════════
     7. VIEW 3 — MUSEO Morandi Grid Catalog
     ═══════════════════════════════════════════════════════════════ */
  function renderCatalog() {
    $('catalogTabs').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.cat === state.catalogTab));
    });

    const list = state.catalogTab === 'era' ? G.eras
      : (state.catalogTab === 'material' ? G.materials : G.motifs);
    const nextClusterLabel = KIND_LABEL[defaultClusterFor(state.catalogTab)];
    $('catalogTitle').textContent = `${KIND_LABEL[state.catalogTab]}图录`;

    const grid = $('catalogGrid');
    grid.replaceChildren();

    for (const ent of list) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'entity-card';
      const col = colorFor(state.catalogTab, ent.name);
      card.style.setProperty('--card-tint', col);

      // Compute top sub-attribute summary chips (e.g. top materials inside an era, top motifs inside a material)
      const subCounts = new Map();
      const subKind = defaultClusterFor(state.catalogTab);
      for (const it of ent.items) {
        const vals = subKind === 'material' ? it.materials : (subKind === 'motif' ? it.motifs : it.eraGroups);
        for (const v of vals) subCounts.set(v, (subCounts.get(v) || 0) + 1);
      }
      const topSubs = [...subCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);

      const thumbsHtml = ent.items.slice(0, 4).map(it =>
        `<img src="${esc(it.thumbUrl)}" alt="" loading="lazy">`
      ).join('');

      card.innerHTML = `
        <div class="entity-card-top">
          <h3>${esc(ent.name)}</h3>
          <span class="entity-count">${ent.count}</span>
        </div>
        <div class="entity-thumbs">${thumbsHtml}</div>
        <div class="entity-subchips">${topSubs.map(([k, v]) => `<span>${esc(k)} ${v}</span>`).join('') || '<span>图录条目</span>'}</div>
        <div class="entity-cta">
          <span>按${nextClusterLabel}聚类查看</span>
          <span>2D / 3D ↗</span>
        </div>
      `;
      card.onclick = () => openGraph(state.catalogTab, ent.id);
      grid.append(card);
    }

    renderSpecimenGrid();
  }

  function renderSpecimenGrid() {
    const pageSize = 24;
    const total = G.items.length;
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    state.catalogPage = Math.max(0, Math.min(totalPages - 1, state.catalogPage));
    const slice = G.items.slice(state.catalogPage * pageSize, (state.catalogPage + 1) * pageSize);

    $('specimenHeading').textContent = `全部条目 · ${total}`;
    const pager = $('specimenPager');
    pager.replaceChildren();
    if (totalPages > 1) {
      const prev = document.createElement('button');
      prev.type = 'button'; prev.className = 'chip'; prev.textContent = '‹';
      prev.disabled = state.catalogPage === 0;
      prev.onclick = () => { state.catalogPage--; renderSpecimenGrid(); };
      const info = document.createElement('span');
      info.className = 'dock-label';
      info.textContent = `${state.catalogPage + 1} / ${totalPages}`;
      const next = document.createElement('button');
      next.type = 'button'; next.className = 'chip'; next.textContent = '›';
      next.disabled = state.catalogPage >= totalPages - 1;
      next.onclick = () => { state.catalogPage++; renderSpecimenGrid(); };
      pager.append(prev, info, next);
    }

    const sg = $('specimenGrid');
    sg.replaceChildren();
    for (const it of slice) {
      const card = document.createElement('article');
      card.className = 'spec-card';

      const wrap = document.createElement('div');
      wrap.className = 'spec-img-wrap';
      wrap.onclick = () => openDrawer(it.id);
      const im = document.createElement('img');
      im.src = it.thumbUrl;
      im.alt = it.title;
      im.loading = 'lazy';
      wrap.append(im);

      const body = document.createElement('div');
      body.className = 'spec-body';
      const title = document.createElement('div');
      title.className = 'spec-title';
      title.textContent = it.title;
      title.onclick = () => openDrawer(it.id);

      const tags = document.createElement('div');
      tags.className = 'spec-tags';
      for (const e of it.eraGroups.slice(0, 1)) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = e;
        b.onclick = () => openGraph('era', e);
        tags.append(b);
      }
      for (const m of it.materials.slice(0, 1)) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = m;
        b.onclick = () => openGraph('material', m);
        tags.append(b);
      }
      for (const mo of it.motifs.slice(0, 2)) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = mo;
        b.onclick = () => openGraph('motif', mo);
        tags.append(b);
      }
      body.append(title, tags);
      card.append(wrap, body);
      sg.append(card);
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     8. VIEW 4 — Original PDF Pages with BBox & Graph Jumps
     ═══════════════════════════════════════════════════════════════ */
  function renderPage(num, focusItemId = null) {
    const total = G.pages.length;
    state.currentPage = Math.max(1, Math.min(total, Number(num) || 1));
    const pageObj = G.pages[state.currentPage - 1];
    $('pageTitle').textContent = `原页 · 第 ${state.currentPage} 页`;
    $('pageInput').value = state.currentPage;
    $('pageInput').max = total;
    $('pageTotal').textContent = `/ ${total}`;
    $('prevPage').disabled = state.currentPage <= 1;
    $('nextPage').disabled = state.currentPage >= total;
    $('pageScan').src = pageObj?.previewUrl || '';
    $('pageBbox').hidden = true;

    const list = G.items.filter(it => it.page === state.currentPage);
    const box = $('pageItems');
    box.replaceChildren();

    if (!list.length) {
      const empty = document.createElement('p');
      empty.style.color = 'var(--ink-3)';
      empty.textContent = '本页暂无提取条目';
      box.append(empty);
      return;
    }

    const selectItem = (it, cardEl) => {
      state.activePageItemId = it.id;
      box.querySelectorAll('.page-item-card').forEach(el => el.classList.toggle('active', el === cardEl));
      if (it.bbox) {
        const [x1, y1, x2, y2] = it.bbox;
        Object.assign($('pageBbox').style, {
          left: (x1 * 100) + '%', top: (y1 * 100) + '%',
          width: ((x2 - x1) * 100) + '%', height: ((y2 - y1) * 100) + '%',
        });
        $('pageBbox').hidden = false;
      } else {
        $('pageBbox').hidden = true;
      }
    };

    list.forEach((it, idx) => {
      const card = document.createElement('div');
      card.className = 'page-item-card';
      card.onclick = () => selectItem(it, card);

      const head = document.createElement('div');
      head.className = 'page-item-title';
      head.innerHTML = `<strong>${esc(it.title)}</strong><small>${esc(it.status || it.locator)}</small>`;
      card.append(head);

      if (it.quote) {
        const q = document.createElement('blockquote');
        q.className = 'proof-quote';
        q.textContent = it.quote;
        card.append(q);
      }

      const chips = document.createElement('div');
      chips.className = 'rel-chips';
      for (const e of it.eraGroups) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'jump-pill era'; b.textContent = e;
        b.onclick = ev => { ev.stopPropagation(); openGraph('era', e); };
        chips.append(b);
      }
      for (const m of it.materials) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'jump-pill material'; b.textContent = m;
        b.onclick = ev => { ev.stopPropagation(); openGraph('material', m); };
        chips.append(b);
      }
      for (const mo of it.motifs) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'jump-pill motif'; b.textContent = mo;
        b.onclick = ev => { ev.stopPropagation(); openGraph('motif', mo); };
        chips.append(b);
      }
      if (chips.childElementCount) card.append(chips);
      box.append(card);

      if ((focusItemId && it.id === focusItemId) || (!focusItemId && idx === 0)) {
        selectItem(it, card);
      }
    });
  }

  /* ═══════════════════════════════════════════════════════════════
     9. Specimen & Proof Drawer + Entity Switcher + Command Palette
     ═══════════════════════════════════════════════════════════════ */
  function openDrawer(itemId) {
    const it = G.itemById.get(itemId);
    if (!it) return;
    state.drawerItemId = itemId;

    $('drawerTitle').textContent = it.title;
    $('drawerLoc').textContent = [it.locator, it.findspot ? it.findspot + '出土' : ''].filter(Boolean).join(' · ');
    $('drawerGotoPage').onclick = () => {
      state.currentPage = it.page;
      closeDrawer();
      switchView('pages');
      renderPage(it.page, it.id);
    };

    const sp = getSprite(it.thumbUrl);
    $('drawerFig').classList.toggle('mono', Boolean(sp?.isMono));
    $('drawerImg').src = it.plateUrl;
    $('drawerImg').alt = it.title;
    $('drawerFig').onclick = () => openLightbox(it.plateUrl, `${it.title} · ${it.locator}`);

    // Clickable relation jump pills (Era -> Material -> Motif)
    const rels = $('drawerRels');
    rels.replaceChildren();
    const addRelRow = (label, kind, values) => {
      if (!values.length) return;
      const row = document.createElement('div');
      row.className = 'rel-row';
      const l = document.createElement('span');
      l.className = 'rel-label'; l.textContent = label;
      const wrap = document.createElement('div');
      wrap.className = 'rel-chips';
      for (const v of values) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'jump-pill ' + kind;
        b.textContent = v;
        b.onclick = () => openGraph(kind, v);
        wrap.append(b);
      }
      row.append(l, wrap);
      rels.append(row);
    };
    addRelRow('时代', 'era', it.periods);
    addRelRow('材质', 'material', it.materials);
    addRelRow('纹样', 'motif', it.motifs);
    if (!rels.childElementCount) {
      const p = document.createElement('div');
      p.style.fontSize = '12px'; p.style.color = 'var(--ink-3)';
      p.textContent = '暂无已标注的时代、材质或纹样关系';
      rels.append(p);
    }

    $('drawerQuote').textContent = it.quote || '';
    $('drawerQuote').hidden = !it.quote;
    $('drawerCapImg').src = it.captionUrl || '';
    $('drawerCapImg').hidden = !it.captionUrl;
    $('drawerPageImg').src = it.pageUrl || '';
    $('drawerPageWrap').hidden = !it.pageUrl;
    if (it.bbox) {
      const [x1, y1, x2, y2] = it.bbox;
      Object.assign($('drawerBbox').style, {
        left: (x1 * 100) + '%', top: (y1 * 100) + '%',
        width: ((x2 - x1) * 100) + '%', height: ((y2 - y1) * 100) + '%',
      });
      $('drawerBbox').hidden = false;
    } else {
      $('drawerBbox').hidden = true;
    }

  // Quick Jump Command Palette
  let palItems = [], palIndex = 0;
  function openPalette() {
    $('paletteBackdrop').hidden = false;
    $('paletteInput').value = '';
    renderPalette();
    $('paletteInput').focus();

  function closePalette() { $('paletteBackdrop').hidden = true; }
  function renderPalette() {
    const q = $('paletteInput').value.trim().toLowerCase();
    const res = $('paletteResults');
    res.replaceChildren();
    palItems = [];
    palIndex = 0;

    const addGroup = (title, entries) => {
      if (!entries.length) return;
      const g = document.createElement('div');
      g.className = 'palette-group';
      g.textContent = title;
      res.append(g);
      for (const e of entries) {
        const idx = palItems.length;
        palItems.push(e);
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'palette-item' + (idx === 0 ? ' selected' : '');
        b.innerHTML = `<span>${esc(e.label)}</span><small>${esc(e.meta)}</small>`;
        b.onclick = () => { closePalette(); e.action(); };
        res.append(b);
      }
    };

    const pageMatch = q.match(/^(\d+)$/);
    if (pageMatch) {
      const p = Number(pageMatch[1]);
      if (p >= 1 && p <= G.pages.length) {
        addGroup('原页', [{ label: `PDF 第 ${p} 页`, meta: '原页核读', action: () => { state.currentPage = p; switchView('pages'); } }]);
      }
    }

    addGroup('时代 · 按材质聚类', G.eras.filter(e => !q || e.name.toLowerCase().includes(q)).slice(0, 8)
      .map(e => ({ label: e.name, meta: `${e.count} 条`, action: () => openGraph('era', e.id) })));
    addGroup('材质 · 按纹样聚类', G.materials.filter(m => !q || m.name.toLowerCase().includes(q)).slice(0, 8)
      .map(m => ({ label: m.name, meta: `${m.count} 条`, action: () => openGraph('material', m.id) })));
    addGroup('纹样 · 按时代聚类', G.motifs.filter(m => !q || m.name.toLowerCase().includes(q)).slice(0, 12)
      .map(m => ({ label: m.name, meta: `${m.count} 条`, action: () => openGraph('motif', m.id) })));
    if (q) {
      addGroup('器物条目', G.items.filter(i => i.title.toLowerCase().includes(q)).slice(0, 10)
        .map(i => ({ label: i.title, meta: `P.${i.page}`, action: () => openDrawer(i.id) })));
    }

  function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function tick(now) {

      else if (state.view === 'graph') drawGraph(t);

  async function loadManifest() {
    const inline = $('data')?.textContent?.trim();
    if (inline && inline.startsWith('{')) return JSON.parse(inline);
    const res = await fetch('manifest.json');
    if (!res.ok) throw new Error('无法读取 manifest.json');
    return res.json();

    $('openSwitcher').onclick = openSwitcher;

    $('zoomIn').onclick = () => { graph.targetZoom = Math.min(3.2, graph.targetZoom * 1.2); };

    $('zoomReset').onclick = () => {
      const maxR = stageOverlay?.graphScene
        ? (stageOverlay.graphScene.extent || 360)
        : Math.max(240, ...graph.clusters.map(cl => (cl.orbitR || 200) + cl.haloR));
      fitGraphCamera(maxR + 30);

    $('catalogTabs').querySelectorAll('button').forEach(b => {

    });

    $('nextPage').onclick = () => { renderPage(state.currentPage + 1); syncHash(); };
    $('pageForm').onsubmit = e => { e.preventDefault(); renderPage(Number($('pageInput').value)); syncHash(); };

    $('paletteBackdrop').onclick = e => { if (e.target === $('paletteBackdrop')) closePalette(); };
    $('paletteInput').oninput = renderPalette;
    $('paletteInput').onkeydown = e => {
      const btns = $('paletteResults').querySelectorAll('.palette-item');
      if (e.key === 'ArrowDown' && btns.length) {
        e.preventDefault(); palIndex = (palIndex + 1) % btns.length;
        btns.forEach((b, i) => b.classList.toggle('selected', i === palIndex));
        btns[palIndex].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp' && btns.length) {
        e.preventDefault(); palIndex = (palIndex - 1 + btns.length) % btns.length;
        btns.forEach((b, i) => b.classList.toggle('selected', i === palIndex));
        btns[palIndex].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter' && palItems[palIndex]) {
        e.preventDefault(); closePalette(); palItems[palIndex].action();
      }
    };

    window.addEventListener('keydown', e => {
      const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName || '');
      if (e.key === 'Escape') {
        if (!$('lightbox').hidden) $('lightbox').hidden = true;
        else if (!$('paletteBackdrop').hidden) closePalette();
        else if (!$('switcherPop').hidden) closeSwitcher();
        else if (!$('drawer').classList.contains('closed')) closeDrawer();
        else if (!$('reasoningPanel').classList.contains('closed')) toggleReasoning(false);
        else if (stageOverlay) clearStageOverlay();
      } else if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing)) {
        e.preventDefault(); openPalette();
      } else if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !e.altKey && !typing) {
        e.preventDefault(); toggleReasoning();
      } else if (state.view === 'graph' && state.dim === '3d' && !typing) {
        if (e.key === 'ArrowLeft') graph.targetYaw -= 0.16;
        else if (e.key === 'ArrowRight') graph.targetYaw += 0.16;
        else if (e.key === 'ArrowUp') graph.targetPitch = Math.max(-1.15, graph.targetPitch - 0.14);
        else if (e.key === 'ArrowDown') graph.targetPitch = Math.min(1.15, graph.targetPitch + 0.14);
      }
    });

    document.addEventListener('pointerdown', e => {
      const pop = $('switcherPop');
      if (!pop.hidden && !pop.contains(e.target) && !$('openSwitcher').contains(e.target)) {
        closeSwitcher();
      }
    });

    window.addEventListener('resize', () => { resizeRiver(); resizeGraph(); });
    window.addEventListener('hashchange', applyHash);
  }

  let R = null;

  const rState = {

    mode: 'symbolic', // 'symbolic' | 'agent'
    lens: 'path',     // 'path' | 'compare' | 'predict'
    useOntology: true,
