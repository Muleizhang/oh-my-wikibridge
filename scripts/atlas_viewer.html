  // Build 2D/3D Reasoning Stage Scene for Multi-Hop Paths
  function buildPathStageScene(pathRes, focusIndex = null) {
    const chosen = focusIndex !== null && pathRes.paths[focusIndex]
      ? [pathRes.paths[focusIndex]]
      : pathRes.paths;
    if (!chosen.length) {
      const nodes = [pathRes.source, pathRes.target].filter(Boolean).map((n, i) => ({
        key: n.key || `path:missing:${i}`, label: n.label, kind: n.kind || 'era',
        isOntology: Boolean(n.isOntology), artifactId: null,
        roleTag: n.missing ? '当前模式无此节点' : '本次未找到路径', sub: '',
        x: i ? 60 : -60, y: 0, z: 0, tx: i ? 220 : -220, ty: 0, tz: 0,
        baseR: 34, color: '#b7a58c', sx: 0, sy: 0, sz: 0, sr: 34,
      }));
      return { kind: 'path', nodes, edges: [], extent: 300 };
    }

    const nodeMap = new Map();
    const edges = [];
    const labeledEdges = new Set();
    const routes = chosen.map((p, rIdx) => {
      const seq = [
        { key: p.steps[0].fromKey, label: p.steps[0].fromLabel, kind: p.steps[0].fromKind, isOnt: p.steps[0].fromIsOntology },
        ...p.steps.map(s => ({ key: s.toKey, label: s.toLabel, kind: s.toKind, isOnt: s.toIsOntology })),
      ];
      seq.forEach((nd, cIdx) => {
        const isEnd = cIdx === 0 || cIdx === seq.length - 1;
        if (!nodeMap.has(nd.key)) {
          const aid = nd.key.startsWith('artifact:') ? nd.key.slice(9) : null;
          const artItem = aid ? G.itemById.get(aid) : null;
          const interpretation = nd.kind === 'interpretation' && G.interpretations.find(record => `interpretation:${record.id}` === nd.key);
          if (artItem?.thumbUrl) getSprite(artItem.thumbUrl);
          nodeMap.set(nd.key, {
            key: nd.key,
            label: nd.label,
            kind: nd.kind,
            isOntology: nd.isOnt,
            artifactId: aid,
            thumbUrl: artItem?.thumbUrl || '',
            plateUrl: artItem?.plateUrl || '',
            roleTag: isEnd ? (cIdx === 0 ? '推演起点' : '推演终点') : (nd.isOnt ? 'RDFS 本体类' : (aid ? '原书实证器物' : '语义桥接概念')),
            sub: artItem?.locator || interpretation?.locator || '',
            ...(interpretation && { onActivate: () => showInterpretationGraph(interpretation), hint: '点击查看文献关系' }),
            baseR: isEnd ? 34 : (aid ? 23 : (nd.isOnt ? 22 : 25)),
            color: nd.isOnt ? '#77b29c' : (isEnd ? '#e2ba74' : colorFor(nd.kind === 'artifact' ? 'motif' : nd.kind, nd.label)),
            sx: 0, sy: 0, sz: 0, sr: 22,
          });
        }
      });

      p.steps.forEach((s, sIdx) => {
        const label = s.isInferred ? (s.axiom || '⊑ 本体') : s.predicateLabel;
        const labelKey = JSON.stringify([s.fromKey, s.toKey, label]);
        edges.push({
          from: nodeMap.get(s.fromKey),
          to: nodeMap.get(s.toKey),
          label: labeledEdges.has(labelKey) ? '' : label,
          dashed: Boolean(s.isInferred),
          color: s.isInferred ? '#77b29c' : '#e2ba74',
          phase: sIdx * 0.23 + rIdx * 0.37,
        });
        labeledEdges.add(labelKey);
      });
      return seq.map(node => nodeMap.get(node.key));
    });

    const nodes = [...nodeMap.values()];
    layoutPathStage(nodes, edges, routes);
    const extent = Math.max(300, ...nodes.map(n => Math.hypot(n.tx, n.ty) + 60));
    return { kind: 'path', nodes, edges, extent };
  }

  function layoutPathStage(nodes, edges, routes) {
    const firstRoute = routes[0];
    const start = firstRoute[0], end = firstRoute.at(-1);
    const inner = nodes.filter(node => node !== start && node !== end);
    const neighbors = new Map(inner.map(node => [node, new Set()]));
    for (const { from, to } of edges) {
      if (!neighbors.has(from) || !neighbors.has(to)) continue;
      neighbors.get(from).add(to);
      neighbors.get(to).add(from);
    }

    // Keep branches that meet inside the graph next to one another.
    const groups = new Map();
    for (const node of inner) {
      if (groups.has(node)) continue;
      const group = groups.size;
      const pending = [node];
      groups.set(node, group);
      for (const current of pending) {
        for (const next of neighbors.get(current)) {
          if (groups.has(next)) continue;
          groups.set(next, group);
          pending.push(next);
        }
      }
    }
    const ordered = [...routes].sort((a, b) => (groups.get(a[1]) ?? -1) - (groups.get(b[1]) ?? -1));
    const halfWidth = Math.max(250, 86 * Math.max(...routes.map(route => route.length - 1)), 73 * Math.sqrt(nodes.length));
    const laneGap = Math.min(118, 740 / Math.max(1, ordered.length - 1));
    const anchors = new Map(inner.map(node => [node, { x: 0, y: 0, count: 0 }]));
    ordered.forEach((route, row) => {
      for (let col = 1; col < route.length - 1; col++) {
        const anchor = anchors.get(route[col]);
        anchor.x += (2 * col / (route.length - 1) - 1) * halfWidth;
        anchor.y += (row - (ordered.length - 1) / 2) * laneGap;
        anchor.count++;
      }
    });
    start.tx = -halfWidth;
    end.tx = halfWidth;
    start.ty = end.ty = 0;
    for (const node of inner) {
      const anchor = anchors.get(node);
      anchor.x /= anchor.count;
      anchor.y /= anchor.count;
      node.tx = anchor.x;
      node.ty = anchor.y;
    }

    // Settle the structure once so the existing spring can animate to stable coordinates.
    for (let pass = 0; pass < 40; pass++) {
      for (const node of inner) {
        const anchor = anchors.get(node);
        const linked = neighbors.get(node);
        let nearby = 0;
        for (const next of linked) nearby += next.ty - node.ty;
        node.tx += (anchor.x - node.tx) * 0.07;
        node.ty += (anchor.y - node.ty) * 0.10 + nearby * 0.07 / Math.max(1, linked.size);
      }
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          let dx = b.tx - a.tx, dy = b.ty - a.ty;
          let distance = Math.hypot(dx, dy);
          const gap = a.baseR + b.baseR + 67;
          if (distance >= gap) continue;
          if (distance < 0.001) { dx = 0; dy = 1; distance = 1; }
          const moveA = anchors.has(a), moveB = anchors.has(b);
          if (!moveA && !moveB) continue;
          const share = (gap - distance) / distance / (moveA && moveB ? 2 : 1);
          if (moveA) { a.tx -= dx * share; a.ty -= dy * share; }
          if (moveB) { b.tx += dx * share; b.ty += dy * share; }
        }
      }
    }
    for (const node of nodes) {
      node.tz = Math.max(-105, Math.min(105, node.ty * 0.23));
      node.x = node.tx * 0.25;
      node.y = node.ty * 0.25;
      node.z = 0;
    }
  }

  // Build 2D/3D Dual-Focal Contrast Constellation (Intersection vs NOT EXISTS Wings)
  function buildCompareStageScene(cmpRes, displayLabels) {
    const nodes = [];
    const edges = [];
    const colA = '#d48263';
    const colB = '#74ad99';
    const colShared = '#e2bb74';

    const nA = {
      key: 'cmp:A', label: cmpRes.entityA, kind: cmpRes.kind, isOntology: false,
      roleTag: `实体 A · ${cmpRes.countA} 条`, sub: `当前记录差集 ${cmpRes.primary.onlyA.length}`,
      x: -60, y: 0, z: 0, tx: -250, ty: 0, tz: 20, baseR: 38, color: colA, sx: 0, sy: 0, sz: 0, sr: 38,
    };
    const nB = {
      key: 'cmp:B', label: cmpRes.entityB, kind: cmpRes.kind, isOntology: false,
      roleTag: `实体 B · ${cmpRes.countB} 条`, sub: `当前记录差集 ${cmpRes.primary.onlyB.length}`,
      x: 60, y: 0, z: 0, tx: 250, ty: 0, tz: 20, baseR: 38, color: colB, sx: 0, sy: 0, sz: 0, sr: 38,
    };
    nodes.push(nA, nB);

    const selected = displayLabels?.length ? new Set(displayLabels) : null;
    const visible = items => selected ? items.filter(item => selected.has(item.label)) : items;
    const shared = visible(cmpRes.primary.shared).slice(0, 8);
    shared.forEach((item, i) => {
      const spread = Math.max(150, (shared.length - 1) * 82);
      const y = shared.length === 1 ? 0 : ((i / (shared.length - 1)) - 0.5) * spread;
      const z = Math.cos((i + 1) * 1.3) * 55;
      const nd = {
        key: `sh:${item.label}`, label: item.label, kind: item.kind,
        isOntology: item.kind === 'material' && !G.matById.has(item.label),
        roleTag: '两组都有记录', sub: `${cmpRes.entityA} ${item.countA} 件 · ${cmpRes.entityB} ${item.countB} 件`,
        x: 0, y: 0, z: 0, tx: 0, ty: y, tz: z, baseR: 20, color: colShared, sx: 0, sy: 0, sz: 0, sr: 20,
      };
      nodes.push(nd);
      edges.push({ from: nA, to: nd, label: '', dashed: false, color: colShared, phase: i * 0.14 });
      edges.push({ from: nd, to: nB, label: '', dashed: false, color: colShared, phase: i * 0.14 + 0.5 });
    });

    const fanWing = (list, anchor, dir, col, tag) => {
      const items = list.slice(0, 10);
      items.forEach((item, i) => {
        const frac = items.length === 1 ? 0.5 : i / (items.length - 1);
        const ang = (dir < 0 ? Math.PI : 0) + (frac - 0.5) * 2.15 * (dir < 0 ? -1 : 1);
        const rad = 165 + (i % 2) * 48;
        const tx = anchor.tx + Math.cos(ang) * rad;
        const ty = anchor.ty + Math.sin(ang) * rad;
        const tz = Math.sin(frac * Math.PI * 2) * 45;
        const nd = {
          key: `wing:${dir}:${item.label}`, label: item.label, kind: item.kind,
          isOntology: item.kind === 'material' && !G.matById.has(item.label),
          roleTag: tag, sub: `${item.count} 件`,
          x: anchor.tx, y: 0, z: 0, tx, ty, tz, baseR: 16.5, color: col, sx: 0, sy: 0, sz: 0, sr: 16.5,
        };
        nodes.push(nd);
        edges.push({ from: anchor, to: nd, label: '', dashed: true, color: col, phase: i * 0.2 });
      });
    };
    fanWing(visible(cmpRes.primary.onlyA), nA, -1, colA, `当前仅在 ${cmpRes.entityA} 检索到`);
    fanWing(visible(cmpRes.primary.onlyB), nB, 1, colB, `当前仅在 ${cmpRes.entityB} 检索到`);

    return { kind: 'compare', nodes, edges, extent: 490 };
  }

  // Build 2D/3D Abductive Prediction Constellation (Glowing Dashed Edges + Confidence Badges)
  function buildPredictStageScene(predRes) {
    const preds = predRes.predictions.slice(0, 12);
    if (!preds.length) return null;
    const targetGroups = new Map();
    for (const p of preds) {
      if (!targetGroups.has(p.predictedValue)) targetGroups.set(p.predictedValue, []);
      targetGroups.get(p.predictedValue).push(p);
    }

    const nodes = [];
    const edges = [];
    const groups = [...targetGroups.entries()];
    const gRad = groups.length === 1 ? 0 : Math.min(260, 150 + groups.length * 30);

    groups.forEach(([tVal, list], gi) => {
      const ga = (gi / Math.max(1, groups.length)) * Math.PI * 2 - Math.PI * 0.5;
      const gx = Math.cos(ga) * gRad;
      const gy = Math.sin(ga) * gRad;
      const gz = Math.sin(ga * 2) * 40;
      const col = colorFor(list[0].predictedKind, tVal);
      const hub = {
        key: `ptarget:${tVal}`, label: tVal, kind: list[0].predictedKind,
        roleTag: `推导目标 · ${list.length} 项候选`, sub: '点击进入聚类图谱',
        x: 0, y: 0, z: 0, tx: gx, ty: gy, tz: gz, baseR: 34, color: col, sx: 0, sy: 0, sz: 0, sr: 34,
      };
      nodes.push(hub);

      list.forEach((p, pi) => {
        const a = groups.length === 1
          ? (pi / Math.max(1, list.length)) * Math.PI * 2 - Math.PI * 0.5
          : ga + ((pi / Math.max(1, list.length)) - 0.5) * 2.2;
        const dist = 192 + (pi % 2) * 56;
        const art = G.itemById.get(p.artifactId);
        if (art?.thumbUrl) getSprite(art.thumbUrl);
        const nd = {
          key: `part:${p.artifactId}:${tVal}`,
          label: p.artifactTitle,
          kind: 'artifact',
          artifactId: p.artifactId,
          thumbUrl: art?.thumbUrl || '',
          plateUrl: art?.plateUrl || '',
          roleTag: `推理置信度 ${Math.round(p.confidence * 100)}% · Lift ${p.lift}×`,
          sub: p.ruleFormula,
          x: gx, y: gy, z: gz,
          tx: gx + Math.cos(a) * dist,
          ty: gy + Math.sin(a) * dist,
          tz: gz + Math.cos(pi * 1.4) * 52,
          baseR: 19, color: col, sx: 0, sy: 0, sz: 0, sr: 19,
        };
        nodes.push(nd);
        edges.push({
          from: nd, to: hub,
          label: `${Math.round(p.confidence * 100)}%`,
          dashed: true,
          color: col,
          phase: pi * 0.19 + gi * 0.3,
        });
      });
    });

    const extent = Math.max(330, ...nodes.map(n => Math.hypot(n.tx, n.ty) + 70));
    return { kind: 'predict', nodes, edges, extent };
  }

  function drawReasoningStage(ctx, scene, dark, timeSec) {
    // Spring-interpolate reasoning nodes smoothly
    for (const n of scene.nodes) {
      n.x += (n.tx - n.x) * 0.15;
      n.y += (n.ty - n.y) * 0.15;
      n.z += (n.tz - n.z) * 0.15;
      const p = projectPoint(n.x, n.y, n.z);
      n.sx = p.x; n.sy = p.y; n.sz = p.z; n.sk = p.k;
      n.sr = Math.max(9, n.baseR * p.k);
    }

    const hov = stageOverlay?.hoveredNode || null;
    const labelBoxes = scene.kind === 'path' ? scene.nodes.map(n => {
      const radius = n.sr * (n === hov || (n.artifactId && n.artifactId === state.drawerItemId) ? 1.16 : 1);
      return [n.sx - radius, n.sy - radius, n.sx + radius, n.sy + radius];
    }) : null;
    const reserveLabel = (x, y, width, height) => {
      const box = [x - width / 2, y - height / 2, x + width / 2, y + height / 2];
      if (labelBoxes.some(([l, t, r, b]) => box[0] < r && box[2] > l && box[1] < b && box[3] > t)) return false;
      labelBoxes.push(box);
      return true;
    };
    const nodeLabels = new Map();
    if (labelBoxes) {
      ctx.save();
      ctx.font = `600 11.5px "Noto Serif SC","Songti SC",serif`;
      for (const [index, n] of scene.nodes.entries()) {
        const radius = labelBoxes[index][2] - n.sx;
        if (!n.artifactId && radius >= 24) continue;
        const text = n.label.length > 10 ? n.label.slice(0, 9) + '…' : n.label;
        const width = ctx.measureText(text).width + 6;
        for (const y of [n.sy + radius + 11, n.sy - radius - 11]) {
          if (!reserveLabel(n.sx, y, width, 15)) continue;
          nodeLabels.set(n, y);
          break;
        }
      }
      ctx.restore();
    }

    // Subtle 3D celestial reference ring
    ctx.beginPath();
    for (let i = 0; i <= 72; i++) {
      const a = (i / 72) * Math.PI * 2;
      const p = projectPoint(Math.cos(a) * (scene.extent * 0.72), Math.sin(a) * (scene.extent * 0.72), 0);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = dark ? 'rgba(216,179,119,0.08)' : 'rgba(130,90,52,0.09)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw curved edges + animated traveling light pulses
    for (const e of scene.edges) {
      const a = e.from, b = e.to;
      if (!a || !b) continue;
      const dx = b.sx - a.sx, dy = b.sy - a.sy;
      const mx = (a.sx + b.sx) * 0.5 - dy * 0.08;
      const my = (a.sy + b.sy) * 0.5 + dx * 0.08;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(a.sx, a.sy);
      ctx.quadraticCurveTo(mx, my, b.sx, b.sy);
      ctx.strokeStyle = hexAlpha(e.color, dark ? (e.dashed ? 0.65 : 0.72) : (e.dashed ? 0.58 : 0.65));
      ctx.lineWidth = e.dashed ? 1.55 : 2.1;
      if (e.dashed) ctx.setLineDash([5, 5]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Animated traveling energy bead
      const tp = (timeSec * 0.48 + (e.phase || 0)) % 1;
      const u = 1 - tp;
      const px = u * u * a.sx + 2 * u * tp * mx + tp * tp * b.sx;
      const py = u * u * a.sy + 2 * u * tp * my + tp * tp * b.sy;
      ctx.fillStyle = dark ? '#fff4d4' : e.color;
      ctx.beginPath();
      ctx.arc(px, py, e.dashed ? 2.6 : 3.4, 0, Math.PI * 2);
      ctx.fill();

      // Concise edge predicate / confidence pill
      if (e.label) {
        ctx.font = `500 10.5px ${canvasFont()}`;
        const tw = ctx.measureText(e.label).width;
        let lx = mx, ly = my;
        let fits = !labelBoxes;
        if (labelBoxes) {
          for (const t of [0.5, 0.35, 0.65]) {
            const s = 1 - t;
            lx = s * s * a.sx + 2 * s * t * mx + t * t * b.sx;
            ly = s * s * a.sy + 2 * s * t * my + t * t * b.sy;
            if ((fits = reserveLabel(lx, ly, tw + 16, 21))) break;
          }
        }
        if (fits) {
          ctx.fillStyle = dark ? 'rgba(11,14,22,0.85)' : 'rgba(252,250,245,0.92)';
          roundRect(ctx, lx - tw * 0.5 - 6, ly - 9, tw + 12, 18, 9);
          ctx.fill();
          ctx.strokeStyle = hexAlpha(e.color, 0.45);
          ctx.lineWidth = 0.8;
          ctx.stroke();
          ctx.fillStyle = e.color;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(e.label, lx, ly);
          ctx.textBaseline = 'alphabetic';
        }
      }
      ctx.restore();
    }

    // Depth-sorted nodes
    const sorted = [...scene.nodes].sort((a, b) => a.sz - b.sz);
    for (const n of sorted) {
      const isHov = hov === n || (n.artifactId && n.artifactId === state.drawerItemId);
      const r = n.sr * (isHov ? 1.16 : 1);
      const depthFade = state.dim === '3d' ? Math.max(0.36, Math.min(1, (n.sz + 520) / 700)) : 1;

      ctx.save();
      ctx.globalAlpha = depthFade;

      // Halo glow
      const glow = ctx.createRadialGradient(n.sx, n.sy, r * 0.5, n.sx, n.sy, r * (isHov ? 2.4 : 1.7));
      glow.addColorStop(0, hexAlpha(n.color, isHov ? 0.46 : (dark ? 0.24 : 0.14)));
      glow.addColorStop(1, hexAlpha(n.color, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r * (isHov ? 2.4 : 1.7), 0, Math.PI * 2);
      ctx.fill();

      const sp = getSprite(n.thumbUrl, 0, n.plateUrl);
      const bmp = spriteBitmap(sp, dark);
      if (bmp && n.artifactId) {
        paintSprite(ctx, sp, bmp, n.sx, n.sy, r);
      } else {
        const dg = ctx.createRadialGradient(n.sx - r * 0.25, n.sy - r * 0.25, 2, n.sx, n.sy, r);
        if (dark) {
          dg.addColorStop(0, hexAlpha(n.color, 0.34));
          dg.addColorStop(1, '#121622');
        } else {
          dg.addColorStop(0, '#ffffff');
          dg.addColorStop(1, hexAlpha(n.color, 0.18));
        }
        ctx.fillStyle = dg;
        ctx.beginPath();
        ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
      ctx.strokeStyle = isHov ? (dark ? '#fff3d1' : '#8f4e32') : n.color;
      ctx.lineWidth = isHov ? 2.4 : 1.7;
      if (n.isOntology) ctx.setLineDash([4, 3]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Node text label
      const shortLbl = n.label.length > 10 ? n.label.slice(0, 9) + '…' : n.label;
      ctx.textAlign = 'center';
      if (!n.artifactId && r >= 24) {
        ctx.textBaseline = 'middle';
        ctx.font = `600 ${Math.max(11, Math.min(14, r * 0.37))}px "Noto Serif SC","Songti SC",serif`;
        ctx.fillStyle = dark ? '#faf5ea' : '#1e1c19';
        ctx.fillText(shortLbl, n.sx, n.sy);
        ctx.textBaseline = 'alphabetic';
      } else if (!labelBoxes || isHov || nodeLabels.has(n)) {
        ctx.font = `600 11.5px "Noto Serif SC","Songti SC",serif`;
        ctx.fillStyle = dark ? 'rgba(244,240,232,0.95)' : 'rgba(30,28,25,0.92)';
        ctx.fillText(shortLbl, n.sx, nodeLabels.has(n) ? nodeLabels.get(n) + 4 : n.sy + r + 15);
      }
      ctx.restore();
    }
  }

  function initReasoningStudio(manifest) {
    if (typeof createKGReasoner === 'function') {
      R = createKGReasoner(manifest);
      rState.summary = R.getCatalogSummary();
    }
    if (!R) return;

    $('rCmpKind').replaceChildren(...Object.keys(COMPARISON_DIMENSIONS)
      .filter(kind => (rState.summary[DIMENSIONS[kind].list] || []).length >= 2)
      .map(kind => new Option(KIND_LABEL[kind], kind)));
    $('rPredTarget').replaceChildren(...Object.entries(PREDICTION_DIMENSIONS)
      .filter(([, dim]) => (rState.summary[DIMENSIONS[dim.kind].list] || []).length)
      .map(([predicate, dim]) => new Option(`缺少${dim.label}`, predicate)));

    // Populate universal entity autocomplete datalist
    const dl = $('kgEntityDatalist');
    dl.replaceChildren();
    const addOpt = v => { const o = document.createElement('option'); o.value = v; dl.append(o); };
    rState.summary.eras.forEach(e => addOpt(e.name));
    rState.summary.materials.forEach(m => addOpt(m.name));
    rState.summary.motifs.forEach(mo => addOpt(mo.name));
    rState.summary.artifactTypes.forEach(type => addOpt(type.name));
    for (const dim of Object.values(EXTRA_DIMENSIONS)) rState.summary[dim.field].forEach(entry => addOpt(entry.name));

    // Default dynamic path & compare selections from whatever KG is loaded
    const eras = rState.summary.eras;
    const mats = rState.summary.materials;
    if (eras.length >= 2) {
      $('rPathSrc').value = eras[0].name;
      $('rPathDst').value = eras[1].name;
    } else if (mats.length >= 2) {
      $('rPathSrc').value = mats[0].name;
      $('rPathDst').value = mats[1].name;
    }

    // Dynamic path presets
    const pathPresets = $('rPathPresets');
    pathPresets.replaceChildren();
    const dynPairs = [];
    if (eras.length >= 2) dynPairs.push([eras[0].name, eras[1].name]);
    if (eras.length >= 3) dynPairs.push([eras[1].name, eras[eras.length - 1].name]);
    if (mats.length >= 2) dynPairs.push([mats[0].name, mats[1].name]);
    const cleanMotifs = rState.summary.motifs.filter(m => !/连续|边缘/.test(m.name));
    if (cleanMotifs.length >= 2) dynPairs.push([cleanMotifs[0].name, cleanMotifs[1].name]);
    for (const [a, b] of dynPairs.slice(0, 4)) {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'r-preset';
      btn.textContent = `${a} → ${b}`;
      btn.onclick = () => { $('rPathSrc').value = a; $('rPathDst').value = b; runPathLens(); };
      pathPresets.append(btn);
    }

    populateCompareSelects();

    // Wire Reasoning Studio UI events
    $('openReasoning').onclick = () => toggleReasoning();
    $('rClose').onclick = () => toggleReasoning(false);
    $('overlayClear').onclick = clearStageOverlay;

    $('rModeSeg').querySelectorAll('button').forEach(b => {
      b.onclick = () => setReasoningMode(b.dataset.rmode);
    });
    $('rLensSeg').querySelectorAll('button').forEach(b => {
      b.onclick = () => setSymbolicLens(b.dataset.lens);
    });
    $('rOntToggle').onclick = () => {
      rState.useOntology = !rState.useOntology;
      $('rOntToggle').setAttribute('aria-pressed', String(rState.useOntology));
      populateCompareSelects();
      runActiveSymbolicLens();
    };
    $('rRunPath').onclick = runPathLens;
    $('rPathSrc').onkeydown = $('rPathDst').onkeydown = e => { if (e.key === 'Enter') runPathLens(); };
    $('rPathMaxHops').onchange = $('rPathMaxPaths').onchange = runPathLens;
    $('rCmpKind').onchange = () => { populateCompareSelects(); runCompareLens(); };
    $('rCmpA').onchange = $('rCmpB').onchange = $('rCmpAxis').onchange = runCompareLens;
    $('rRunPredict').onclick = runPredictLens;
    $('rPredTarget').onchange = $('rPredSearch').oninput = populatePredictArtifacts;
    $('rPredArtifact').onchange = resetPredictResult;

    $('agentForm').onsubmit = e => {
      e.preventDefault();
      const q = $('agentInput').value.trim();
      if (q) sendAgentMessage(q);
    };
    $('agentClear').onclick = () => {
      rState.agentPending?.controller.abort();
      rState.agentPending = null;
      $('agentSend').disabled = false;
      rState.agentMessages = [];
      clearStageOverlay();
      renderAgentFeed();
    };

    renderAgentFeed();

    // Probe unified backend silently to check DeepSeek readiness
    if (window.location?.protocol === 'file:') return;
    fetch('/api/kg/status').then(r => r.ok ? r.json() : null).then(info => {
      if (info && info.deepseekReady) {
        rState.deepseekReady = true;
        rState.model = info.model || 'deepseek-flash';
        $('rStatusDot').classList.remove('off');
        const provider = info.agentProvider === 'openrouter' ? 'OpenRouter' : 'DeepSeek';
        $('rStatusText').textContent = `${provider} ${info.thinkingEnabled ? 'Thinking' : '就绪'}`;
        if (!rState.agentMessages.length) renderAgentFeed();
      }
    }).catch(() => {});
  }

  function populateCompareSelects() {
    const kind = $('rCmpKind').value;
    const values = kind === 'era' && !rState.useOntology
      ? [...new Set(G.items.flatMap(item => item.periods))].sort((a, b) => eraChronology(a).order - eraChronology(b).order)
      : (rState.summary[DIMENSIONS[kind]?.list] || []).map(item => item.name);
    const axes = ['motif', 'material', 'era', ...Object.keys(COMPARISON_DIMENSIONS).slice(3)]
      .filter(axis => axis !== kind && (rState.summary[DIMENSIONS[axis].list] || []).length);
    const fill = (select, options, label, fallback) => {
      const previous = select.value;
      select.replaceChildren(...options.map(value => new Option(label(value), value)));
      select.value = options.includes(previous) ? previous : fallback ?? '';
      select.disabled = !options.length;
    };
    fill($('rCmpA'), values, value => value, values[0]);
    const nextGroup = values.find(value => value !== $('rCmpA').value);
    fill($('rCmpB'), values, value => value, nextGroup);
    if ($('rCmpA').value === $('rCmpB').value) $('rCmpB').value = nextGroup ?? '';
    fill($('rCmpAxis'), axes, axis => KIND_LABEL[axis], axes[0]);
  }

  function setReasoningMode(mode) {
    rState.mode = mode;
    $('rModeSeg').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-selected', String(b.dataset.rmode === mode));
    });
    $('rPaneSymbolic').hidden = mode !== 'symbolic';
    $('rPaneAgent').hidden = mode !== 'agent';
    if (mode === 'symbolic' && !rState.lastSymbolic) runActiveSymbolicLens();
  }

  function setSymbolicLens(lens) {
    rState.lens = lens;
    $('rLensSeg').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.lens === lens));
    });
    $('rFormPath').hidden = lens !== 'path';
    $('rFormCompare').hidden = lens !== 'compare';
    $('rFormPredict').hidden = lens !== 'predict';
    if (lens === 'predict') populatePredictArtifacts();
    else runActiveSymbolicLens();
  }

  function runActiveSymbolicLens() {
    if (rState.lens === 'path') runPathLens();
    else if (rState.lens === 'compare') runCompareLens();
    else resetPredictResult();
  }

  function runPathLens() {
    const src = $('rPathSrc').value.trim();
    const dst = $('rPathDst').value.trim();
    if (!src || !dst) return;
    const res = R.findPaths(src, dst, {
      useOntology: rState.useOntology,
      maxHops: Number($('rPathMaxHops').value),
      maxPaths: Number($('rPathMaxPaths').value),
    });
    rState.lastSymbolic = res;

    const out = $('rSymbolicOut');
    out.replaceChildren();
    $('rSymbolicScroll').scrollTop = 0;
    if (!res.ok) {
      out.innerHTML = `<div class="r-card"><div class="r-card-title">${esc(res.error)}</div></div>`;
      applyAgentStageAction({ ...res, overlay: 'path' });
      return;
    }

    if (!res.paths.length) {
      out.innerHTML = `<div class="r-card"><div class="r-card-title">本次最多 ${res.search.maxHops} 跳，未找到关联路径</div><div style="font-size:12px;color:var(--ink-2)">${res.search.budgetExhausted ? '搜索预算已用尽，不能判断不连通。' : '当前图谱可能缺少时代、纹样或材质标注；未找到不代表历史上没有联系。'}</div></div>`;
      applyAgentStageAction({ ...res, overlay: 'path' });
      return;
    }

    const count = document.createElement('div');
    count.className = 'proof-line';
    count.textContent = `显示 ${res.paths.length} 条路径（上限 ${res.search.maxPaths} 条） · 优先显示经过不同节点的路径`
      + (res.ontologyUnlocked ? ' · 本体泛化找到关联' : '')
      + (res.search.budgetExhausted ? ' · 已达搜索预算' : '');
    out.append(count);

    const projectPathToCanvas = (idx, openGraphView = state.view !== 'river') => {
      out.querySelectorAll('.r-path-card').forEach((card, index) => {
        card.classList.toggle('active', idx === index);
        card.setAttribute('aria-pressed', String(idx === index));
      });
      const scene = buildPathStageScene(res, idx);
      const selPaths = idx !== null ? [res.paths[idx]] : res.paths;
      const artSet = new Set(selPaths.flatMap(p => p.artifactIds));
      const chains = selPaths.map(p => p.artifactIds).filter(c => c.length >= 2);
      const detail = idx === null ? `全部 ${selPaths.length} 条路径` : `路径 ${idx + 1} · ${selPaths[0].hops} 跳`;
      applyStageOverlay({
        type: 'path',
        banner: `路径推演 ${res.source.label} → ${res.target.label} · ${detail}${res.useOntology ? ' · 含本体闭包' : ' · 字面严格'}`,
        artifactSet: artSet,
        pathChains: chains,
        graphScene: scene,
      }, openGraphView);
    };

    const showAll = document.createElement('button');
    showAll.type = 'button'; showAll.className = 'mini-link';
    showAll.textContent = '在星图显示全部路径 ↗';
    showAll.onclick = () => {
      if (window.innerWidth <= 820) toggleReasoning(false);
      projectPathToCanvas(null, true);
    };
    count.append(' ', showAll);

    res.paths.forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = 'r-card r-path-card';
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', `在星图显示路径 ${idx + 1}，${p.hops} 跳`);
      card.setAttribute('aria-pressed', 'false');
      const selectPath = () => projectPathToCanvas(idx, true);
      card.onclick = event => {
        if (!event.target.closest('button, a, input, select, textarea')) selectPath();
      };
      card.onkeydown = event => {
        if (event.target === card && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          selectPath();
        }
      };

      const head = document.createElement('div');
      head.className = 'r-card-head';
      head.innerHTML = `<span class="r-card-title">路径 ${idx + 1} · ${p.hops} 跳</span>`;
      const askBtn = document.createElement('button');
      askBtn.type = 'button'; askBtn.className = 'mini-link r-path-ask';
      askBtn.textContent = 'AI 解读 →';
      askBtn.setAttribute('aria-label', `AI 解读路径 ${idx + 1}`);
      askBtn.onclick = () => {
        selectPath();
        bridgeToAgent(`请解读路径 ${idx + 1}（${p.hops} 跳）\n${[p.steps[0].fromLabel, ...p.steps.map(step => step.toLabel)].join(' → ')}`, {
          type: 'selected_path', index: idx + 1, nodeKeys: p.nodeKeys,
          edgeIds: p.steps.map(step => step.edgeId), useOntology: res.useOntology,
        });
      };
      head.append(askBtn);
      card.append(head);

      const chain = document.createElement('div');
      chain.className = 'chain-steps';
      p.steps.forEach((s, si) => {
        if (si === 0) chain.append(makeChainNode(s.fromKey, s.fromLabel, s.fromKind, s.fromIsOntology));
        const edge = document.createElement('span');
        edge.className = 'chain-edge' + (s.isInferred ? ' ont' : '');
        edge.textContent = s.isInferred ? '─⊑→' : `─${s.predicateLabel}→`;
        chain.append(edge, makeChainNode(s.toKey, s.toLabel, s.toKind, s.toIsOntology));
      });
      card.append(chain);

      for (const rule of p.rulesTriggered) {
        const pl = document.createElement('div');
        pl.className = 'proof-line';
        pl.innerHTML = `<code>${esc(rule.name)} · ${esc(rule.formula)}</code>`;
        card.append(pl);
      }

      out.append(card);
    });

    projectPathToCanvas(null);
  }

  function makeChainNode(key, label, kind, isOnt) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chain-node' + (isOnt ? ' ont' : '');
    b.textContent = label.length > 14 ? label.slice(0, 13) + '…' : label;
    b.title = label;
    b.onclick = () => {
      if (key.startsWith('artifact:')) openDrawer(key.slice(9));
      else if (kind === 'interpretation') {
        const interpretation = G.interpretations.find(record => `interpretation:${record.id}` === key);
        if (interpretation) showInterpretationGraph(interpretation);
      }
      else if (!isOnt && Object.hasOwn(DIMENSIONS, kind)) { clearStageOverlay(); openGraph(kind, label); }
    };
    return b;
  }

  function runCompareLens() {
    const kind = $('rCmpKind').value;
    const axis = $('rCmpAxis').value;
    const a = $('rCmpA').value, b = $('rCmpB').value;
    const out = $('rSymbolicOut');
    out.replaceChildren();
    if (!a || !b || a === b) {
      rState.lastSymbolic = null;
      clearStageOverlay();
      out.innerHTML = '<p class="cmp-note">请选择两个不同的比较对象。</p>';
      return;
    }
    const res = R.compareEntities(kind, a, b, { axis, useOntology: rState.useOntology });
    rState.lastSymbolic = res;
    if (!res.ok) {
      clearStageOverlay();
      out.innerHTML = `<div class="r-card"><div class="r-card-title">${esc(res.error)}</div></div>`;
      return;
    }

    const addBucket = (title, items) => {
      const card = document.createElement('div');
      card.className = 'r-card';
      card.innerHTML = `<div class="r-card-head"><span class="r-card-title">${esc(title)}</span><span class="r-badge">${items.length}</span></div>`;
      const renderItems = values => {
        const chips = document.createElement('div');
        chips.className = 'r-presets';
        const graphItems = dimensionIndex(axis);
        for (const item of values) {
          const label = axis === 'era' ? eraChronology(item.label).group : item.label;
          const clickable = graphItems?.has(label);
          const chip = document.createElement(clickable ? 'button' : 'span');
          chip.className = 'r-preset';
          chip.textContent = item.countA !== undefined ? `${item.label} (${item.countA}/${item.countB})` : `${item.label} (${item.count})`;
          if (clickable) {
            chip.type = 'button';
            chip.onclick = () => openGraph(axis, label);
          }
          chips.append(chip);
        }
        if (!values.length) chips.innerHTML = '<span class="cmp-note">暂无记录</span>';
        return chips;
      };
      card.append(renderItems(items.slice(0, 14)));
      if (items.length > 14) {
        const more = document.createElement('details');
        more.className = 'cmp-more';
        more.innerHTML = `<summary>展开其余 ${items.length - 14} 项</summary>`;
        more.append(renderItems(items.slice(14)));
        card.append(more);
      }
      out.append(card);
    };

    const axisLabel = KIND_LABEL[axis];
    const { shared, onlyA, onlyB, coverage } = res.primary;
    const note = document.createElement('p');
    note.className = 'cmp-note';
    note.textContent = `已标注${axisLabel}的器物 · ${a} ${coverage.withValuesA}/${coverage.totalA} 件 · ${b} ${coverage.withValuesB}/${coverage.totalB} 件`;
    out.append(note);
    addBucket(`两组共有的${axisLabel}`, shared);
    addBucket(`仅「${a}」有记录`, onlyA);
    addBucket(`仅「${b}」有记录`, onlyB);

    const secondary = document.createElement('details');
    const secondaryTitle = document.createElement('summary');
    const secondaryLabel = KIND_LABEL[res.secondary.axis];
    const secondaryCoverage = res.secondary.coverage;
    secondaryTitle.textContent = `${secondaryLabel}对比 · 共有 ${res.secondary.shared.length} · 差集 ${res.secondary.onlyA.length}/${res.secondary.onlyB.length}`;
    const secondaryNote = document.createElement('p');
    secondaryNote.textContent = `${secondaryLabel}标注覆盖：${a} ${secondaryCoverage.withValuesA}/${secondaryCoverage.totalA}，${b} ${secondaryCoverage.withValuesB}/${secondaryCoverage.totalB}。`;
    secondary.append(secondaryTitle, secondaryNote);
    for (const [title, values] of [['共有', res.secondary.shared], [`仅在 ${a} 检索到`, res.secondary.onlyA], [`仅在 ${b} 检索到`, res.secondary.onlyB]]) {
      const row = document.createElement('p');
      row.append(document.createTextNode(title + '：'));
      if (!values.length) row.append(document.createTextNode('无'));
      for (const value of values) {
        const button = document.createElement('button'); button.type = 'button'; button.className = 'r-preset';
        button.textContent = value.label;
        button.onclick = () => { clearStageOverlay(); openGraph(value.kind, value.label); };
        row.append(button);
      }
      secondary.append(row);
    }
    out.append(secondary);

    const askBtn = document.createElement('button');
    askBtn.type = 'button'; askBtn.className = 'mini-link';
    askBtn.textContent = '用 AI 解读比较结果 →';
    askBtn.onclick = () => bridgeToAgent(`请解读按${KIND_LABEL[kind]}分组的「${a}」与「${b}」两组器物在${axisLabel}上的比较结果。请自主选择最值得展示的共有项和差集，并说明标注覆盖率，引用来源。`, {
      type: 'compare', kind, entityA: a, entityB: b, axis, useOntology: rState.useOntology,
    });
    out.append(askBtn);

    const scene = buildCompareStageScene(res);
    applyStageOverlay({
      type: 'compare',
      banner: `${a} 与 ${b} · ${axisLabel}对比 · 共有 ${shared.length} 项`,
      artifactSet: new Set([...res.artifactIdsA, ...res.artifactIdsB]),
      graphScene: scene,
    }, true);
  }

  function openArtifactPrediction(itemId, targetPredicate) {
    $('rPredTarget').value = targetPredicate;
    $('rPredSearch').value = '';
    setSymbolicLens('predict');
    $('rPredArtifact').value = itemId;
    setReasoningMode('symbolic');
    toggleReasoning(true);
    runPredictLens();
    $('rSymbolicOut').querySelector('button')?.focus();
  }

  function populatePredictArtifacts() {
    const targetPredicate = $('rPredTarget').value;
    const field = PREDICTION_DIMENSIONS[targetPredicate]?.field;
    const query = $('rPredSearch').value.trim().toLowerCase();
    const items = field ? G.items.filter(item => !item[field].length && item.title.toLowerCase().includes(query)) : [];

    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = items.length ? `选择器物（${items.length} 件）` : '没有符合条件的器物';
    const select = $('rPredArtifact');
    select.replaceChildren(placeholder, ...items.map(item => {
      const option = document.createElement('option');
      option.value = item.id;
      option.textContent = item.title;
      return option;
    }));
    select.value = '';
    select.disabled = !items.length;
    resetPredictResult();
  }

  function resetPredictResult() {
    $('rRunPredict').disabled = !$('rPredArtifact').value;
    $('rSymbolicOut').replaceChildren();
    rState.lastSymbolic = null;
    if (stageOverlay) clearStageOverlay();
  }

  function runPredictLens() {
    const artifact = G.itemById.get($('rPredArtifact').value);
    if (!artifact) return;
    const targetPredicate = $('rPredTarget').value;
    const res = R.predictMissing({ artifactId: artifact.id, targetPredicate, useOntology: rState.useOntology, limit: 1 });
    rState.lastSymbolic = res;

    const out = $('rSymbolicOut');
    out.replaceChildren();
    const card = document.createElement('div');
    card.className = 'r-card';
    const head = document.createElement('div');
    head.className = 'r-card-head';
    const title = document.createElement('button');
    title.type = 'button';
    title.className = 'r-card-title mini-link';
    title.textContent = artifact.title;
    title.onclick = () => openDrawer(artifact.id);
    head.append(title);
    card.append(head);
    out.append(card);

    const [p] = res.predictions;
    if (!p) {
      card.insertAdjacentHTML('beforeend', '<div class="proof-line">当前未得到补全候选</div>');
      clearStageOverlay();
      return;
    }

    const pct = Math.round(p.confidence * 100);
    head.insertAdjacentHTML('beforeend', `<span class="r-badge ont">${esc(p.predictedValue)} · ${pct}%</span>`);
    card.insertAdjacentHTML('beforeend', `
      <div class="conf-bar"><div class="conf-fill" style="width:${pct}%"></div></div>
      <div class="proof-line"><code>${esc(p.ruleFormula)} · Lift ${p.lift}×</code></div>
    `);
    const supporters = document.createElement('div');
    supporters.className = 'r-presets';
    for (const s of p.supporters.slice(0, 2)) {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'r-preset';
      button.textContent = `支撑：${s.title.slice(0, 10)}`;
      button.onclick = () => openDrawer(s.artifactId);
      supporters.append(button);
    }
    card.append(supporters);

    applyStageOverlay({
      type: 'predict',
      banner: `补全信息 · ${PREDICATE_LABELS[targetPredicate]}候选`,
      artifactSet: new Set([artifact.id]),
      graphScene: buildPredictStageScene(res),
    }, true);
  }

  function bridgeToAgent(question, intent) {
    setReasoningMode('agent');
    sendAgentMessage(question, intent);
  }

  const AGENT_TOOL_NAMES = {
    inspect_selected_path: '核验所选路径', find_paths: '查找关联', query_graph: '检索图谱',
    compare_entities: '比较异同', predict_missing: '补全信息', run_sparql: '查询图谱',
    inspect_evidence: '核对器物出处', show_comparison: '选择星图展示项',
  };

  function renderTraceStep(step, open) {
    const detail = document.createElement('details');
    detail.className = 'trace-step';
    detail.open = open;
    const summary = document.createElement('summary');
    const status = step.error ? '调用未完成' : step.count === undefined ? '运行中' : `返回 ${step.count} 项`;
    summary.textContent = [AGENT_TOOL_NAMES[step.tool] || step.tool, step.summary, status].filter(Boolean).join(' · ');
    detail.append(summary);
    const sections = [];
    if (step.args && Object.keys(step.args).length) sections.push(`参数\n${JSON.stringify(step.args, null, 2)}`);
    if (step.sparql) sections.push(`查询\n${step.sparql}`);
    if (step.error || step.preview) sections.push(`结果\n${step.error || step.preview}`);
    if (sections.length) {
      const content = document.createElement('pre');
      content.textContent = sections.join('\n\n');
      detail.append(content);
    }
    return detail;
  }

  function renderAgentTrace(steps, thinking, open = false, elapsedMs = 0, status = '') {
    const details = document.createElement('details');
    details.className = 'trace-details';
    details.open = open;
    const summary = document.createElement('summary');
    const elapsed = elapsedMs ? ` · ${(elapsedMs / 1000).toFixed(1)} 秒` : '';
    summary.textContent = `思维过程${steps.length ? ` · ${steps.length} 次工具调用` : ''}${elapsed} ▾`;
    const reasoning = document.createElement('div');
    reasoning.className = 'trace-thinking';
    reasoning.textContent = thinking || '';
    const progress = document.createElement('p');
    progress.className = 'trace-status';
    progress.textContent = status;
    const list = document.createElement('div');
    list.className = 'trace-list';
    list.append(...steps.map(step => renderTraceStep(step, open)));
    details.append(summary, reasoning, list, progress);
    return details;
  }

  function renderAgentFeed() {
    const feed = $('agentFeed');
    feed.replaceChildren();

    if (!rState.agentMessages.length) {
      const empty = document.createElement('div');
      empty.className = 'agent-empty';
      empty.innerHTML = `
        <h3>AI对话</h3>
        <p>${rState.deepseekReady ? '从器物出发，探究纹样背后的工艺、用途与历史。' : 'AI对话尚未连接。服务端配置 OpenRouter 或 DeepSeek 后即可启用。'}</p>
      `;
      for (const s of (rState.summary?.suggestions || [])) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'agent-prompt-btn';
        b.textContent = s.question;
        b.onclick = () => sendAgentMessage(s.question);
        empty.append(b);
      }
      feed.append(empty);
      return;
    }

    for (const msg of rState.agentMessages) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + msg.role;

      if (msg.role === 'assistant' && (msg.thinking || msg.trace?.length)) {
        wrap.append(renderAgentTrace(msg.trace || [], msg.thinking, false, msg.elapsedMs));
      }

      const bub = document.createElement('div');
      bub.className = 'msg-bubble';
      if (msg.role === 'assistant') {
        if (msg.responseMode === 'tool_summary') {
          const note = document.createElement('p');
          note.textContent = '模型未完成结论生成，以下展示已计算的符号工具结果。';
          bub.append(note);
        }
        renderCitedContent(bub, msg.content, msg.citations || [], msg.inferences || []);
      } else {
        bub.textContent = msg.content;
      }
      wrap.append(bub);

      for (const result of msg.stageAction?.searchResults || []) {
        if (!result.pathCount) continue;
        const show = document.createElement('button');
        show.type = 'button'; show.className = 'mini-link';
        show.textContent = `查看 ${result.pathCount} 条路径（本体${result.useOntology ? '开启' : '关闭'}） →`;
        show.onclick = () => {
          $('rPathSrc').value = result.source.label;
          $('rPathDst').value = result.target.label;
          $('rPathMaxHops').value = result.search.maxHops;
          $('rPathMaxPaths').value = result.search.maxPaths;
          rState.useOntology = result.useOntology;
          $('rOntToggle').setAttribute('aria-pressed', String(rState.useOntology));
          setReasoningMode('symbolic');
          setSymbolicLens('path');
        };
        wrap.append(show);
      }

      if (msg.role === 'assistant' && msg.stageAction) {
        const sync = document.createElement('button');
        sync.type = 'button'; sync.className = 'mini-link';
        sync.textContent = '✦ 重播此轮推演画布视角 ↗';
        sync.onclick = () => applyAgentStageAction(msg.stageAction);
        wrap.append(sync);
      }
      feed.append(wrap);
    }

    if (rState.agentPending) {
      const loading = document.createElement('div');
      loading.className = 'msg assistant';
      loading.innerHTML = '<div class="agent-thinking" role="status">正在思考</div>';
      const pending = rState.agentPending;
      loading.append(renderAgentTrace(pending.steps, pending.thinking, true, 0, pending.status));
      pending.loading = loading;
      feed.append(loading);
    }
    feed.scrollTop = feed.scrollHeight;
  }

  function renderCitedContent(container, text, citations, inferences) {
    const evMap = new Map(citations.map(c => [c.ref, c]));
    const infMap = new Map(inferences.map(r => [r.ref, r]));

    const appendInline = (el, line) => {
      const tokens = String(line || '').split(/(\[(?:E|R)\d+\]|\*\*[^*]+\*\*|`[^`]+`)/g);
      for (const tok of tokens) {
        if (!tok) continue;
        const m = tok.match(/^\[(E|R)(\d+)\]$/);
        if (m) {
          const ref = m[1] + m[2];
          if (m[1] === 'E' && evMap.has(ref)) {
            const ev = evMap.get(ref);
            const btn = document.createElement('button');
            btn.type = 'button'; btn.className = 'cite-pill ev';
            btn.textContent = `实证 ${ref}`;
            btn.title = `${ev.subject} · ${ev.predicate} · ${ev.object}（${sourcePageLabel(ev)}）`;
            btn.onclick = () => {
              const interpretation = ev.interpretationId && G.interpretations.find(record => record.id === ev.interpretationId);
              if (interpretation) showInterpretationGraph(interpretation);
              else if (ev.artifactId) openDrawer(ev.artifactId, ev.sourceRecordId);
            };
            el.append(btn);
            continue;
          }
          if (m[1] === 'R' && infMap.has(ref)) {
            const inf = infMap.get(ref);
            const btn = document.createElement('button');
            btn.type = 'button'; btn.className = 'cite-pill inf';
            btn.textContent = `${inf.type === 'path_search' ? '计算' : '推论'} ${ref}`;
            btn.title = inf.summary || inf.title;
            btn.onclick = () => {
              if (inf.type === 'prediction' && inf.artifactId) openDrawer(inf.artifactId);
              else if (inf.type === 'path_search') {
                applyAgentStageAction({ ...inf, overlay: 'path', searchResults: [{ ...inf, pathCount: inf.paths.length }] });
              }
              else if (inf.type === 'path' && inf.steps?.length) {
                const fakeRes = { source: { label: inf.steps[0].fromLabel }, target: { label: inf.steps[inf.steps.length - 1].toLabel }, paths: [{ steps: inf.steps, artifactIds: inf.artifactIds || [] }] };
                applyStageOverlay({ type: 'path', banner: `推论 ${ref}：${inf.title}`, artifactSet: new Set(inf.artifactIds || []), graphScene: buildPathStageScene(fakeRes, 0) }, true);
              } else if (inf.type === 'compare' && R) {
                const cmp = R.compareEntities(inf.kind, inf.entityA, inf.entityB, { axis: inf.axis, useOntology: inf.useOntology });
                if (cmp.ok) applyStageOverlay({ type: 'compare', banner: `推论 ${ref}：${inf.title}`, artifactSet: new Set([...cmp.artifactIdsA, ...cmp.artifactIdsB]), graphScene: buildCompareStageScene(cmp) }, true);
              }
            };
            el.append(btn);
            continue;
          }
        }
        if (tok.startsWith('**') && tok.endsWith('**') && tok.length > 4) {
          const s = document.createElement('strong');
          appendInline(s, tok.slice(2, -2));
          el.append(s);
          continue;
        }
        if (tok.startsWith('`') && tok.endsWith('`') && tok.length > 2) {
          const c = document.createElement('code');
          c.textContent = tok.slice(1, -1);
          el.append(c);
          continue;
        }
        el.append(document.createTextNode(tok));
      }
    };

    const lines = String(text || '').split(/\r?\n/);
    let listEl = null, tableRows = [];
    const flushList = () => { if (listEl) { container.append(listEl); listEl = null; } };
    const flushTable = () => {
      if (!tableRows.length) return;
      const tbl = document.createElement('table');
      tableRows.forEach((cells, rIdx) => {
        if (rIdx === 1 && cells.every(c => /^:?-{2,}:?$/.test(c))) return;
        const tr = document.createElement('tr');
        for (const c of cells) {
          const cell = document.createElement(rIdx === 0 ? 'th' : 'td');
          appendInline(cell, c);
          tr.append(cell);
        }
        tbl.append(tr);
      });
      container.append(tbl);
      tableRows = [];
    };

    for (const raw of lines) {
      const line = raw.trim();
      if (!line) { flushList(); flushTable(); continue; }
      if (line.startsWith('|') && line.endsWith('|')) {
        flushList();
        tableRows.push(line.slice(1, -1).split('|').map(s => s.trim()));
        continue;
      }
      flushTable();
      if (/^---+$/.test(line)) { flushList(); container.append(document.createElement('hr')); continue; }
      const hm = line.match(/^#{1,4}\s+(.+)$/);
      if (hm) {
        flushList();
        const h = document.createElement('h4');
        appendInline(h, hm[1]);
        container.append(h);
        continue;
      }
      const ulm = line.match(/^[-*•]\s+(.+)$/);
      if (ulm) {
        if (!listEl || listEl.tagName !== 'UL') { flushList(); listEl = document.createElement('ul'); }
        const li = document.createElement('li');
        appendInline(li, ulm[1]);
        listEl.append(li);
        continue;
      }
      const olm = line.match(/^\d+[.、]\s+(.+)$/);
      if (olm) {
        if (!listEl || listEl.tagName !== 'OL') { flushList(); listEl = document.createElement('ol'); }
        const li = document.createElement('li');
        appendInline(li, olm[1]);
        listEl.append(li);
        continue;
      }
      flushList();
      const p = document.createElement('p');
      appendInline(p, line);
      container.append(p);
    }
    flushList();
    flushTable();
  }

  function applyAgentStageAction(action) {
    if (!action) return;
    if (action.overlay === 'path') {
      const scene = buildPathStageScene(action, null);
      const chains = (action.paths || []).map(p => p.artifactIds || []).filter(c => c.length >= 2);
      applyStageOverlay({
        type: 'path',
        banner: action.pathLabel
          ? `AI 解读 · ${action.pathLabel} · ${action.paths[0].hops} 跳`
          : `路径搜索 ${action.source?.label || ''} → ${action.target?.label || ''}${action.paths?.length ? ` · 全部 ${action.paths.length} 条路径` : ' · 本次未找到路径'}（本体${action.useOntology ? '开启' : '关闭'}）`,
        artifactSet: new Set(action.artifactIds || []),
        pathChains: chains,
        graphScene: scene,
      }, true);
    } else if (action.overlay === 'compare' && action.comparison) {
      const { comparison, displayLabels } = action;
      const axisLabel = KIND_LABEL[comparison.primary.axis];
      applyStageOverlay({
        type: 'compare',
        banner: `${comparison.entityA} 与 ${comparison.entityB} · ${axisLabel}对比${displayLabels?.length ? ' · AI 精选' : ''}`,
        artifactSet: new Set(action.artifactIds || []),
        graphScene: buildCompareStageScene(comparison, displayLabels),
      }, true);
    } else if (action.overlay === 'predict' && action.predictions?.length) {
      applyStageOverlay({
        type: 'predict',
        banner: `DeepSeek 缺失补全：${PREDICATE_LABELS[action.targetPredicate] || ''}（${action.predictions.length} 项）`,
        artifactSet: new Set(action.artifactIds || []),
        graphScene: buildPredictStageScene(action),
      }, true);
    } else if (action.overlay === 'highlight' && action.artifactIds?.length) {
      if (action.focusKind && action.focusId) openGraph(action.focusKind, action.focusId);
      applyStageOverlay({
        type: 'highlight',
        banner: `DeepSeek 命中：${action.label || ''}（${action.artifactIds.length} 条）`,
        artifactSet: new Set(action.artifactIds),
        graphScene: null,
      }, false);
    }
  }

  async function readAgentReply(response, onProgress) {
    if (!response.ok || !response.headers.get('content-type')?.includes('application/x-ndjson')) {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `请求失败（HTTP ${response.status}）`);
      return data;
    }
    const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = '';
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          const event = JSON.parse(line);
          if (event.type === 'done') return event.result;
          if (event.type === 'error') throw new Error(event.error);
          onProgress(event);
        }
      }
      throw new Error('连接已中断，未收到完整回复。');
    } finally {
      await reader.cancel().catch(() => {});
      reader.releaseLock();
    }
  }

  async function sendAgentMessage(question, intent = null) {
    if (rState.agentPending) return;
    const pending = { controller: new AbortController(), steps: [], thinking: '', status: '正在连接模型…' };
    rState.agentPending = pending;
    rState.agentMessages.push({ role: 'user', content: question });
    $('agentInput').value = '';
    $('agentSend').disabled = true;
    renderAgentFeed();

    try {
      const history = rState.agentMessages
        .filter(m => m.role === 'user' || (m.role === 'assistant' && !m.isError))
        .slice(-8)
        .map(m => ({ role: m.role, content: m.content }));
      const resp = await fetch('/api/kg/agent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/x-ndjson' },
        body: JSON.stringify({ messages: history, intent }),
        signal: pending.controller.signal,
      });
      const data = await readAgentReply(resp, event => {
        if (rState.agentPending !== pending) return;
        const feed = $('agentFeed');
        const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 48;
        const detail = pending.loading.lastElementChild;
        const [summary, reasoning, list, progress] = detail.children;
        if (event.type === 'model_wait') {
          pending.status = '等待模型输出…';
        } else if (event.type === 'thinking') {
          pending.status = '';
          pending.thinking += event.delta;
          const readingLatest = reasoning.scrollHeight - reasoning.scrollTop - reasoning.clientHeight < 32;
          reasoning.textContent = pending.thinking;
          if (readingLatest) reasoning.scrollTop = reasoning.scrollHeight;
        } else if (event.type === 'tool_pending') {
          pending.status = `正在准备调用「${AGENT_TOOL_NAMES[event.tool] || event.tool}」…`;
        } else if (event.type === 'tool_start' || event.type === 'tool_result') {
          pending.status = '';
          const finished = event.type === 'tool_result';
          const replace = finished && pending.steps.at(-1)?.type === 'tool_start';
          const step = finished ? event.step : event;
          if (replace) pending.steps.pop();
          pending.steps.push(step);
          const row = renderTraceStep(step, !replace || list.lastElementChild.open);
          if (replace) list.lastElementChild.replaceWith(row);
          else list.append(row);
          summary.textContent = `思维过程 · ${pending.steps.length} 次工具调用 ▾`;
        } else {
          return;
        }
        progress.textContent = pending.status;
        if (nearBottom) feed.scrollTop = feed.scrollHeight;
      });
      if (rState.agentPending !== pending) return;

      rState.agentMessages.push({
        role: 'assistant',
        content: data.answer,
        responseMode: data.responseMode,
        model: data.model,
        thinking: data.thinking || pending.thinking,
        trace: data.trace || pending.steps,
        citations: data.citations || [],
        inferences: data.inferences || [],
        stageAction: data.stageAction || null,
        elapsedMs: data.elapsedMs,
      });
      if (data.stageAction && rState.mode === 'agent') applyAgentStageAction(data.stageAction);
    } catch (err) {
      if (rState.agentPending !== pending) return;
      rState.agentMessages.push({
        role: 'assistant',
        isError: true,
        thinking: pending.thinking,
        trace: pending.steps.filter(step => step.type !== 'tool_start'),
        content: `AI对话暂不可用：${err?.message || err}\n提示：请通过统一服务启动（node server/atlas-server.ts），或在上方切换到「符号推演」离线模式继续推理。`,
      });
    } finally {
      if (rState.agentPending === pending) {
        rState.agentPending = null;
        $('agentSend').disabled = false;
        renderAgentFeed();
      }
    }
  }

  async function boot() {
    let savedTheme = 'dark';
    try { savedTheme = localStorage.getItem('atlas-theme') || 'dark'; } catch {}
    setTheme(savedTheme);

    const { manifest, manifestURL } = await loadManifest();
    G = buildGraphModel(manifest, manifestURL);

    // Dynamic generic book title & minimal header metadata
    const shortTitle = G.title.split('·')[0].trim() || '纹样星图';
    document.title = `${shortTitle} · 纹样星图`;
    $('brandTitle').textContent = shortTitle;
    $('brandSub').textContent = `${G.volumes.length ? G.volumes.length + ' 册 · ' : ''}${G.pages.length} 页 · ${G.items.length} 器物 · ${G.sourceItems.length} 图录 · ${G.motifs.length} 纹样 · ${G.artifactTypes.length} 器类`;
    $('pageVolume').replaceChildren(...[...G.pagesByVolume.keys()].map(volume => {
      const option = document.createElement('option'); option.value = volume; option.textContent = volume || '当前语料';
      return option;
    }));
    $('pageVolume').hidden = G.volumes.length < 2;
    $('riverHeading').textContent = shortTitle;
    $('riverSub').textContent = '循时代溯源 · 按器类筛选 · 悬停观跨代脉络';

    bindGlobalUI();
    initRiver();
    initGraph();
    initReasoningStudio(manifest);
    applyHash();
    requestAnimationFrame(tick);
  }

  boot().catch(err => {
    document.body.innerHTML = `<div style="padding:48px;font-family:sans-serif;color:#c96a62">加载图谱失败：${esc(err?.message || err)}</div>`;
  });
})();
</script>
