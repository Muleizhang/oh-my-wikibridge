<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>纹样星图</title>
<style>
:root {
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html[data-theme="dark"] {
  --bg: #0e0c0a;
  --bg-elev: rgba(23, 19, 15, 0.88);
  --bg-solid: #181410;
  --bg-card: rgba(30, 25, 20, 0.78);
  --bg-hover: rgba(232, 209, 168, 0.08);
  --ink: #f0e8d8;
  --ink-2: #b8ac98;
  --ink-3: #837868;
  --line: rgba(230, 212, 180, 0.14);
  --line-strong: rgba(230, 212, 180, 0.28);
  --accent: #d8a552;
  --accent-soft: rgba(216, 165, 82, 0.17);
  --accent-ink: #14100b;
  --era-color: #d8a552;
  --mat-color: #63a488;
  --motif-color: #cf6854;
  --shadow: 0 20px 52px rgba(0, 0, 0, 0.64);
  --canvas-bg: #0e0c0a;
  --canvas-glow: #1d1712;
}

html[data-theme="light"] {
  --bg: #f4eee1;
  --bg-elev: rgba(249, 244, 233, 0.90);
  --bg-solid: #faf6ec;
  --bg-card: rgba(252, 248, 239, 0.92);
  --bg-hover: rgba(48, 36, 24, 0.06);
  --ink: #221b14;
  --ink-2: #5b4f41;
  --ink-3: #8a7c6b;
  --line: rgba(54, 41, 28, 0.13);
  --line-strong: rgba(54, 41, 28, 0.26);
  --accent: #8f3a22;
  --accent-soft: rgba(143, 58, 34, 0.12);
  --accent-ink: #faf6ec;
  --era-color: #8f601a;
  --mat-color: #24624a;
  --motif-color: #943222;
  --shadow: 0 18px 46px rgba(38, 28, 18, 0.14);
  --canvas-bg: #f4eee1;
  --canvas-glow: #e8dec9;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background 0.35s var(--ease), color 0.35s var(--ease);
}

button, input, select {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  outline: none;
}

button { cursor: pointer; }
button:focus-visible, input:focus-visible, .r-form select:focus-visible {
  outline: 1.5px solid var(--accent);
  outline-offset: 2px;
}

/* ── Top Floating Navigation ── */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  z-index: 40;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 22px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px) saturate(135%);
  -webkit-backdrop-filter: blur(18px) saturate(135%);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  justify-self: start;
  padding: 4px 6px;
  border-radius: 8px;
  transition: opacity 0.2s;
}
.brand:hover { opacity: 0.8; }
.brand-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}
.brand-name {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.12em;
  white-space: nowrap;
}
.brand-sub {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 240px;
}

.nav-tabs {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
}
.nav-tabs button {
  padding: 5px 15px;
  border-radius: 999px;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--ink-2);
  transition: all 0.22s var(--ease);
}
.nav-tabs button:hover { color: var(--ink); }
.nav-tabs button[aria-current="page"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 500;
}

.top-actions {
  justify-self: end;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.icon-pill {
  height: 32px;
  padding: 0 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  transition: all 0.2s var(--ease);
}
.icon-pill:hover {
  border-color: var(--line-strong);
  color: var(--ink);
  background: var(--bg-hover);
}
.icon-pill kbd {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  padding: 1px 4px;
  border-radius: 4px;
  border: 1px solid var(--line);
}
.icon-pill svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── Main Stage Container ── */
.stage-view {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.canvas-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  user-select: none;
  cursor: grab;
}
.canvas-layer:active { cursor: grabbing; }
.canvas-layer.pointer { cursor: pointer; }
.river-flow-layer { pointer-events: none; cursor: default; }
#riverWaterway {
  background: radial-gradient(ellipse 92% 78% at 50% 48%, #1d1813 0%, #120f0c 56%, #090806 100%);
  pointer-events: none;
}
[data-theme="light"] #riverWaterway {
  background: radial-gradient(ellipse 92% 78% at 50% 48%, #f8f3e7 0%, #eee6d5 62%, #e1d6c1 100%);
}
#riverStars { fill: #dec89c; }
[data-theme="light"] #riverStars { fill: #735c3e; opacity: .34; }

/* ── River Homepage Overlay ── */
.river-hero {
  position: fixed;
  top: 68px;
  left: 28px;
  z-index: 20;
  pointer-events: none;
  transition: opacity 0.4s var(--ease);
}
.river-hero h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(22px, 2.5vw, 31px);
  font-weight: 600;
  letter-spacing: 0.16em;
  line-height: 1.2;
}
.river-hero p {
  margin: 5px 0 0;
  font-size: 11.5px;
  color: var(--ink-2);
  letter-spacing: 0.12em;
  max-width: calc(100vw - 320px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.river-tools {
  position: fixed;
  top: 70px;
  right: 24px;
  z-index: 26;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(16px) saturate(135%);
  -webkit-backdrop-filter: blur(16px) saturate(135%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  transition: right 0.3s var(--ease);
}
.river-status { color: var(--ink-3); font-size: 11px; font-family: var(--mono); padding: 0 6px 0 4px; white-space: nowrap; }
.river-group { position: fixed; right: 22px; top: 120px; z-index: 42; width: min(360px, calc(100vw - 32px));
  max-height: calc(100vh - 240px); display: flex; flex-direction: column; border: 1px solid var(--line-strong);
  border-radius: 16px; background: var(--bg-solid); box-shadow: var(--shadow); overflow: hidden; }
.river-group-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.river-group-head strong { flex: 1; font-size: 13px; }
.river-group-list { overflow: auto; min-height: 0; padding: 6px; }
.river-group-item { display: block; text-align: left; width: 100%; padding: 10px; border-radius: 10px; }
.river-group-item:hover { background: var(--bg-hover); }
.river-group-item span { display: block; font-size: 12px; }
.river-group-item small { display: block; color: var(--ink-3); margin-top: 4px; font-size: 10px; }
.river-group-foot { display: flex; gap: 8px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 11px; }

.river-dock {
  position: fixed;
  left: 20px;
  right: 20px;
  bottom: 18px;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 9px 16px;
  border-radius: 16px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}
.dock-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  min-width: 0;
}
.dock-label {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  margin-right: 4px;
  white-space: nowrap;
}
.dock-sep {
  width: 1px;
  height: 18px;
  background: var(--line);
  margin: 0 4px;
}
.type-filter {
  max-width: 190px;
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink-2);
  background: var(--bg-elev);
  font: inherit;
  font-size: 12px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  font-size: 12px;
  color: var(--ink-2);
  white-space: nowrap;
  transition: all 0.2s var(--ease);
}
.chip:hover {
  color: var(--ink);
  border-color: var(--line-strong);
  background: var(--bg-hover);
  transform: translateY(-1px);
}
.chip[aria-pressed="true"], .chip.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.chip .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
}
.chip .num {
  font-family: var(--mono);
  font-size: 10px;
  opacity: 0.65;
}

/* ── Graph HUD Overlay ── */
.graph-hud-top {
  position: fixed;
  top: 66px;
  left: 22px;
  right: 22px;
  z-index: 25;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  pointer-events: none;
  flex-wrap: wrap;
}
.graph-hud-top > * { pointer-events: auto; }

.graph-left-stack {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  max-width: min(640px, calc(100vw - 44px));
  min-width: 0;
}

.focus-bar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px 5px 6px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px) saturate(145%);
  -webkit-backdrop-filter: blur(18px) saturate(145%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  position: relative;
}
.back-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--ink-2);
  transition: all 0.18s;
}
.back-btn:hover { background: var(--bg-hover); color: var(--ink); }
.back-btn:disabled { opacity: 0.3; cursor: default; }

.focus-kind {
  font-size: 11px;
  padding: 2px 9px;
  border-radius: 999px;
  letter-spacing: 0.06em;
  font-weight: 600;
}
.focus-kind.era { background: rgba(240, 182, 91, 0.22); color: var(--era-color); }
.focus-kind.material { background: rgba(84, 212, 170, 0.20); color: var(--mat-color); }
.focus-kind.motif { background: rgba(240, 126, 108, 0.22); color: var(--motif-color); }
.focus-kind.artifact_type { background: rgba(158, 148, 198, 0.18); color: #9e94c6; }

.focus-picker-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 2px 10px 2px 4px;
  border-radius: 999px;
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.06em;
  transition: background 0.18s;
}
.focus-picker-btn:hover { background: var(--bg-hover); }
.focus-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-2);
  padding-right: 4px;
  white-space: nowrap;
}

/* ── Top-Left Associated Tag Filter Bar ── */
.graph-filter-bar {
  width: min(620px, calc(100vw - 44px));
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 8px 10px;
  border-radius: 16px;
  background: var(--bg-elev);
  backdrop-filter: blur(20px) saturate(145%);
  -webkit-backdrop-filter: blur(20px) saturate(145%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  transition: border-color 0.2s var(--ease);
}
.graph-filter-bar.has-active {
  border-color: rgba(240, 190, 103, 0.45);
}
.filter-head-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-kind-tabs {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  max-width: 100%;
  gap: 2px;
  padding: 2px;
  border-radius: 999px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  flex: none;
}
.filter-kind-tabs button {
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  transition: all 0.18s var(--ease);
}
.filter-kind-tabs button:hover { color: var(--ink); }
.filter-kind-tabs button[aria-selected="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}
.filter-kind-tabs button .f-badge {
  font-family: var(--mono);
  font-size: 9.5px;
  padding: 0 5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
}
.filter-search-wrap {
  flex: 1;
  min-width: 110px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  transition: border-color 0.18s;
}
.filter-search-wrap:focus-within { border-color: var(--accent); }
.filter-search-wrap svg {
  width: 12px;
  height: 12px;
  stroke: var(--ink-3);
  fill: none;
  stroke-width: 1.9;
  flex: none;
}
.filter-search-wrap input {
  width: 100%;
  min-width: 0;
  font-size: 12px;
  color: var(--ink);
  padding: 1px 0;
}
.filter-search-wrap input::placeholder { color: var(--ink-3); }
.filter-action-btn {
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  font-size: 11px;
  color: var(--ink-2);
  white-space: nowrap;
  transition: all 0.18s;
}
.filter-action-btn:hover { color: var(--ink); border-color: var(--line-strong); }
.filter-action-btn.clear {
  border-color: rgba(240, 126, 108, 0.45);
  color: var(--motif-color);
  background: rgba(240, 126, 108, 0.12);
}
.filter-action-btn.clear:hover {
  background: rgba(240, 126, 108, 0.22);
}
.filter-chips-row {
  display: flex;
  align-items: center;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 1px 0;
}
.filter-chips-row::-webkit-scrollbar { display: none; }
.graph-filter-bar.expanded .filter-chips-row {
  flex-wrap: wrap;
  overflow-x: visible;
  overflow-y: auto;
  max-height: 210px;
  padding-right: 4px;
}
.filter-tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  font-size: 11.5px;
  color: var(--ink-2);
  white-space: nowrap;
  flex: none;
  transition: all 0.16s var(--ease);
}
.filter-tag-chip:hover {
  color: var(--ink);
  border-color: var(--line-strong);
  transform: translateY(-1px);
}
.filter-tag-chip[aria-pressed="true"] {
  background: var(--chip-bg, var(--accent-soft));
  border-color: var(--chip-col, var(--accent));
  color: var(--ink);
  font-weight: 500;
}
.filter-tag-chip .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
}
.filter-tag-chip .kind-mini {
  font-size: 9.5px;
  opacity: 0.72;
}
.filter-tag-chip .num {
  font-family: var(--mono);
  font-size: 10px;
  opacity: 0.65;
}
.filter-tag-chip .x-mark {
  font-size: 11px;
  opacity: 0.75;
  margin-left: 1px;
}
.filter-empty-note {
  font-size: 11.5px;
  color: var(--ink-3);
  padding: 2px 6px;
}

.graph-controls {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.seg {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.seg button {
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  color: var(--ink-2);
  transition: all 0.2s var(--ease);
  white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 500;
}

.graph-hud-bottom {
  position: fixed;
  left: 22px;
  bottom: 18px;
  z-index: 24;
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}
.graph-hud-bottom > * { pointer-events: auto; }
.cluster-strip {
  display: flex;
  align-items: center;
  gap: 5px;
  max-width: calc(100vw - 220px);
  overflow-x: auto;
  scrollbar-width: none;
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
}
.cluster-strip::-webkit-scrollbar { display: none; }

.zoom-pad {
  position: fixed;
  right: 22px;
  bottom: 18px;
  z-index: 24;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
}
.zoom-pad button {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 13px;
  color: var(--ink-2);
}
.zoom-pad button:hover { background: var(--bg-hover); color: var(--ink); }
.zoom-pad .reset-btn { width: auto; padding: 0 10px; border-radius: 999px; font-size: 11px; }

/* ── Entity Switcher Popover ── */
.switcher-pop {
  position: fixed;
  top: 120px;
  left: 22px;
  width: min(390px, calc(100vw - 44px));
  max-height: min(62vh, 500px);
  z-index: 45;
  border-radius: 16px;
  background: var(--bg-solid);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.switcher-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--line);
  padding: 6px;
  gap: 4px;
}
.switcher-tabs button {
  padding: 6px 8px;
  border-radius: 10px;
  font-size: 12px;
  color: var(--ink-2);
}
.switcher-tabs button[aria-selected="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}
.switcher-search {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  width: 100%;
}
.switcher-list {
  padding: 8px;
  overflow-y: auto;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-content: start;
}

/* ── Floating Tooltip on Canvas ── */
.canvas-tip {
  position: fixed;
  z-index: 35;
  pointer-events: none;
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--bg-elev);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  max-width: 260px;
  transform: translate(14px, -50%);
  transition: opacity 0.14s ease;
}
.canvas-tip strong {
  display: block;
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
}
.canvas-tip .tip-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 5px;
}
.canvas-tip .tip-tag {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ink-2);
}
.canvas-tip .tip-hint {
  margin-top: 5px;
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 0.04em;
}

/* ── Minimal Specimen & Evidence Slide-Over Drawer ── */
body { --drawer-width: min(560px, calc(100vw - 36px)); }
.drawer {
  position: fixed;
  top: 66px;
  right: 18px;
  bottom: 18px;
  width: var(--drawer-width);
  z-index: 42;
  border-radius: 18px;
  background: var(--bg-elev);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateX(0);
  transition: transform 0.3s var(--ease), opacity 0.25s var(--ease);
}
.drawer.closed {
  transform: translateX(calc(100% + 28px));
  opacity: 0;
  pointer-events: none;
}
.drawer-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
}
.drawer-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.35;
}
.drawer-loc {
  margin-top: 3px;
  font-size: 11px;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 8px;
}
.drawer-close {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  flex: none;
  display: grid;
  place-items: center;
  color: var(--ink-2);
}
.drawer-close:hover { background: var(--bg-hover); color: var(--ink); }

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.drawer-identity { font-size: 11px; line-height: 1.5; color: var(--ink-3); }
.drawer-source { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.drawer-source[hidden] { display: none; }
.drawer-source select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 7px;
  color: var(--ink); background: var(--bg-elev); font: inherit; font-size: 12px; }
.drawer-figure {
  position: relative;
  flex-shrink: 0;
  border-radius: 12px;
  overflow: hidden;
  background: rgba(128, 128, 128, 0.08);
  border: 1px solid var(--line);
  aspect-ratio: 4 / 3;
  max-height: 42dvh;
  display: grid;
  place-items: center;
  cursor: zoom-in;
}
.drawer-figure img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
html[data-theme="dark"] .drawer-figure.mono img {
  filter: invert(0.92) sepia(0.24) saturate(1.1) brightness(0.96) contrast(1.1);
}
html[data-theme="light"] .drawer-figure.mono img {
  mix-blend-mode: multiply;
  filter: contrast(1.12);
}
.drawer-fig-badge {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  color: var(--ink-2);
}
.drawer-gallery {
  display: flex;
  flex-shrink: 0;
  gap: 7px;
  overflow-x: auto;
  padding: 2px 1px 6px;
}
.drawer-gallery[hidden] { display: none; }
.drawer-gallery button {
  flex: 0 0 64px;
  height: 54px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--bg-elev);
  cursor: pointer;
}
.drawer-gallery button[aria-pressed="true"] { border: 2px solid var(--ink-2); }
.drawer-gallery button:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 2px; }
.drawer-gallery img { width: 100%; height: 100%; object-fit: contain; display: block; }

.rel-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rel-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.rel-label {
  font-size: 11px;
  color: var(--ink-3);
  width: 34px;
  flex: none;
}
.rel-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.rel-chips .mini-link {
  text-decoration: underline;
  text-underline-offset: 3px;
}
.jump-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  transition: all 0.18s var(--ease);
}
.jump-pill:hover {
  transform: translateY(-1px);
  border-color: var(--accent);
  color: var(--accent);
}
.jump-pill.era { border-color: rgba(212, 166, 106, 0.35); color: var(--era-color); }
.jump-pill.material { border-color: rgba(124, 168, 150, 0.35); color: var(--mat-color); }
.jump-pill.motif { border-color: rgba(206, 130, 100, 0.35); color: var(--motif-color); }
.jump-pill.artifact_type { border-color: rgba(158, 148, 198, 0.35); color: #9e94c6; }
.interpretation-card { padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg-card); }
.interpretation-card h3 { font-family: var(--serif); font-size: 19px; margin: 0 0 12px; }
.interpretation-card p { font-size: 12px; line-height: 1.7; color: var(--ink-2); white-space: pre-wrap; }
.interpretation-card .source-label { color: var(--ink-3); font-size: 11px; }
.interpretation-card details { margin: 12px 0; font-size: 12px; }
.interpretation-card .dock-group { margin-top: 14px; }
body.interpretation-view .focus-bar, body.interpretation-view #clusterSwitch,
body.interpretation-view .graph-hud-bottom { display: none; }
.graph-attributes { flex: 0 0 100%; pointer-events: none !important; }
.graph-attributes[hidden] { display: none; }
.graph-attribute-card { width: min(390px, 100%); padding: 13px 16px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--bg-elev); backdrop-filter: blur(18px); box-shadow: var(--shadow); pointer-events: auto; }
.graph-attribute-card > summary { cursor: pointer; font: 600 14px var(--serif); color: var(--ink); }
.graph-attribute-rows { display: grid; gap: 10px; margin-top: 13px; }
.pattern-attribute-row { display: grid; grid-template-columns: 64px 1fr; align-items: start; gap: 9px; font-size: 12px; }
.pattern-attribute-label { padding-top: 5px; color: var(--ink-3); }
.pattern-attribute-values { display: flex; flex-wrap: wrap; gap: 6px; }
.pattern-attribute { border: 1px solid rgba(214,178,112,.4); border-radius: 999px; padding: 4px 10px;
  font-size: 12px; color: #d6b270; background: rgba(214,178,112,.08); }
.pattern-attribute.belief { color: #b0a0d9; border-color: rgba(176,160,217,.4); background: rgba(176,160,217,.08); }
.pattern-attribute:hover, .pattern-attribute[aria-pressed="true"] { background: var(--bg-hover); border-color: currentColor; }
[data-theme="light"] .pattern-attribute { color: #92652d; }
[data-theme="light"] .pattern-attribute.belief { color: #75529c; }
.graph-attribute-evidence { border-top: 1px solid var(--line); margin-top: 13px; padding-top: 11px; max-height: min(42vh, 380px); overflow-y: auto; }
.graph-attribute-evidence[hidden] { display: none; }
.graph-attribute-evidence header { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; }
.graph-attribute-evidence article { margin-top: 12px; }
.graph-attribute-evidence .source-label { font-size: 11px; color: var(--ink-3); }
.graph-attribute-evidence blockquote { margin: 7px 0; font-size: 12px; line-height: 1.7; color: var(--ink-2); white-space: pre-wrap; }
.pattern-attribute-caption { font-size: 11px; color: var(--ink-3); margin: 12px 0 7px; }
body.attribute-view .focus-bar, body.attribute-view #clusterSwitch,
body.attribute-view .graph-hud-bottom { display: none; }
.jump-pill::after {
  content: "↗";
  font-size: 10px;
  opacity: 0.6;
}

.proof-box {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.proof-quote {
  margin: 0;
  padding-left: 10px;
  border-left: 2px solid var(--accent);
  font-size: 12px;
  color: var(--ink-2);
  white-space: pre-line;
}
.proof-caption-img {
  max-width: 100%;
  max-height: 76px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: #fff;
}
html[data-theme="dark"] .proof-caption-img {
  filter: invert(0.92) sepia(0.12) contrast(1.1);
}
.proof-page-wrap {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--line);
  cursor: pointer;
}
.proof-page-wrap img { display: block; width: 100%; }
.bbox {
  position: absolute;
  border: 1.5px solid #e05a3f;
  background: rgba(224, 90, 63, 0.14);
  pointer-events: none;
}
.mini-link {
  font-size: 12px;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 0;
}
.mini-link:hover { text-decoration: underline; }

/* ── View 3: Catalog (MUSEO Morandi Grid) ── */
.scroll-view {
  position: fixed;
  inset: 54px 0 0 0;
  overflow-y: auto;
  padding: 28px clamp(18px, 4vw, 52px) 64px;
  background: var(--bg);
}
.view-inner {
  max-width: 1320px;
  margin: 0 auto;
}
.catalog-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.catalog-bar h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.08em;
}
#catalogTabs { max-width: 100%; flex-wrap: wrap; border-radius: 18px; }

.entity-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
}
.entity-card {
  position: relative;
  text-align: left;
  padding: 16px;
  border-radius: 16px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: all 0.24s var(--ease);
  overflow: hidden;
}
.entity-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--card-tint, var(--accent));
  opacity: 0.65;
}
.entity-card:hover {
  transform: translateY(-3px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow);
}
.entity-card-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.entity-card h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.entity-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
}
.entity-thumbs {
  display: flex;
  align-items: center;
  gap: 0;
  min-height: 44px;
}
.entity-thumbs img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--bg-solid);
  margin-left: -8px;
  background: var(--bg-solid);
}
.entity-thumbs img:first-child { margin-left: 0; }
.entity-subchips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.entity-subchips span {
  font-size: 11px;
  color: var(--ink-2);
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--bg-hover);
}
.entity-cta {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-3);
  padding-top: 6px;
  border-top: 1px solid var(--line);
}
.entity-card:hover .entity-cta { color: var(--accent); }

.specimen-section {
  margin-top: 34px;
}
.specimen-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.specimen-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 16px;
  color: var(--ink-2);
  font-weight: 500;
}
.specimen-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 12px;
}
.spec-card {
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: all 0.2s var(--ease);
}
.spec-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-2px);
}
.spec-img-wrap {
  aspect-ratio: 1 / 1;
  background: rgba(128, 128, 128, 0.06);
  display: grid;
  place-items: center;
  padding: 10px;
  cursor: pointer;
  overflow: hidden;
}
.spec-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 8px;
}
.spec-body {
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.spec-title {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
  cursor: pointer;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.spec-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.spec-tags button {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ink-2);
  transition: all 0.16s;
}
.spec-tags button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ── View 4: Original PDF Pages ── */
.pages-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: 28px;
  align-items: start;
}
.page-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.page-toolbar h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
}
.page-nav {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.page-nav input, .page-nav select {
  width: 62px;
  text-align: center;
  padding: 4px 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  font-family: var(--mono);
  font-size: 12px;
}
.scan-frame {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #fff;
  box-shadow: var(--shadow);
}
.scan-frame img { display: block; width: 100%; }
.page-items {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.page-item-card {
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: all 0.18s;
}
.page-item-card:hover, .page-item-card.active {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.page-item-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.page-item-title strong {
  font-family: var(--serif);
  font-size: 15px;
}
.page-item-title small {
  font-size: 11px;
  color: var(--ink-3);
  white-space: nowrap;
}

/* ── Command Palette (⌘K Search) ── */
.palette-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(5, 7, 11, 0.56);
  backdrop-filter: blur(8px);
  display: grid;
  place-items: start center;
  padding-top: min(14vh, 110px);
}
.palette {
  width: min(560px, calc(100vw - 32px));
  max-height: 70vh;
  border-radius: 18px;
  background: var(--bg-solid);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.palette input {
  padding: 15px 18px;
  font-size: 15px;
  border-bottom: 1px solid var(--line);
  width: 100%;
}
.palette-results {
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.palette-group {
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.1em;
  padding: 8px 10px 4px;
}
.palette-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 10px;
  text-align: left;
  transition: background 0.15s;
}
.palette-item:hover, .palette-item.selected {
  background: var(--accent-soft);
  color: var(--accent);
}
.palette-item small {
  font-size: 11px;
  color: var(--ink-3);
}

/* ── Lightbox Modal ── */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: rgba(6, 7, 10, 0.88);
  backdrop-filter: blur(12px);
  display: grid;
  place-items: center;
  padding: 24px;
  cursor: zoom-out;
}
.lightbox-inner {
  max-width: min(94vw, 1080px);
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  cursor: default;
}
.lightbox img {
  max-width: 100%;
  max-height: 80vh;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
}
.lightbox-cap {
  color: #e8e4dc;
  font-family: var(--serif);
  font-size: 14px;
  letter-spacing: 0.05em;
}

@media (max-width: 820px) {
  .topbar { grid-template-columns: auto 1fr auto; padding: 0 12px; }
  .brand-sub, .icon-pill kbd { display: none; }
  .nav-tabs button { padding: 5px 10px; font-size: 12px; }
  .river-hero { top: 64px; left: 16px; }
  .river-tools { top: auto; bottom: 72px; right: 12px; }
  .river-dock { left: 10px; right: 10px; bottom: 10px; padding: 8px 10px; gap: 8px; }
  .graph-hud-top { left: 10px; right: 10px; top: 62px; }
  .graph-left-stack, .graph-filter-bar { width: calc(100vw - 20px); max-width: calc(100vw - 20px); }
  .cluster-strip { max-width: calc(100vw - 140px); }
  .pages-layout { grid-template-columns: 1fr; }
}

/* ── Dual-Mode Knowledge Reasoning Studio ── */
.icon-pill.accent-pill {
  border-color: rgba(216, 179, 119, 0.42);
  color: var(--accent);
}
.icon-pill.accent-pill[aria-expanded="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.icon-pill.accent-pill[aria-expanded="true"] kbd {
  color: var(--accent-ink);
  border-color: rgba(0, 0, 0, 0.2);
}

.overlay-banner {
  position: fixed;
  top: 122px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 6px 14px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--accent);
  box-shadow: var(--shadow);
  font-size: 12px;
  max-width: min(560px, calc(100vw - 44px));
}
.overlay-banner .ob-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  flex: none;
}
.overlay-banner .ob-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--ink);
}
.overlay-banner .ob-clear {
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--bg-hover);
  color: var(--ink-2);
  font-size: 11px;
  flex: none;
}
.overlay-banner .ob-clear:hover { color: var(--ink); background: var(--accent-soft); }

}
.r-toolbar {

}
.r-lenses button:hover { color: var(--ink); background: var(--bg-hover); }

}

.ont-toggle {

}

.r-scroll {

.r-form {

}
.r-row {
  display: flex;

}

}
.r-input, .r-select {

  padding: 7px 10px;

}
.r-select option {
  background: var(--bg-solid);

}
.r-btn {

  border-radius: 10px;

}
.r-btn:hover { opacity: 0.9; }
.r-btn:disabled { opacity: 0.45; cursor: default; }
.r-btn.ghost {

}

.r-presets {
  display: flex;

}
.r-preset {
  font-size: 11px;
  padding: 3px 9px;

  color: var(--ink-2);
  background: var(--bg-card);

}
.r-preset:hover { border-color: var(--accent); color: var(--accent); }

.r-card {
  padding: 11px 12px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--bg-card);

  flex-direction: column;
  gap: 8px;

}
.r-card:hover, .r-card.active {
  border-color: var(--accent);
}
.r-path-card { cursor: pointer; }
.r-path-card:focus-visible {

}
.r-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.r-card-head .r-path-ask {

}
.r-card-title {

}
.r-card-title.mini-link {

}
.r-badge {

}
.r-badge.ont {

.chain-steps {
  display: flex;

}
.chain-node {

}
.chain-node:hover { border-color: var(--accent); color: var(--accent); }
.chain-node.ont {
  border-style: dashed;
  border-color: rgba(124, 168, 150, 0.6);
  color: var(--mat-color);
}
.chain-edge {
  font-size: 10px;
  color: var(--ink-3);

}

.proof-line {
  font-size: 11px;
  color: var(--ink-2);
  padding: 6px 8px;
  border-radius: 8px;
  background: var(--bg-hover);
  border-left: 2px solid var(--accent);
}
.proof-line code {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--accent);

  margin-bottom: 2px;

}

.conf-bar {
  height: 4px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
.conf-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--mat-color), var(--accent));
}

.cmp-label { flex: 0 0 54px; }
.cmp-label, .cmp-note { color: var(--ink-2); font-size: 12px; }
.cmp-note { margin: 0; }
.cmp-more summary { color: var(--accent); cursor: pointer; font-size: 12px; }
.cmp-more .r-presets { margin-top: 8px; }

/* ── DeepSeek Agent Chat UI ── */
.agent-feed {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.agent-empty {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 4px;
}
.agent-empty h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
}
.agent-empty p {
  margin: 0;
  font-size: 12px;
  color: var(--ink-2);
}
.agent-prompt-btn {
  text-align: left;
  padding: 9px 11px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink);
  transition: all 0.18s;
}
.agent-prompt-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

.msg {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.msg.user { align-items: flex-end; }
.msg.user .msg-bubble {
  background: var(--accent-soft);
  border: 1px solid rgba(216, 179, 119, 0.35);

  border-radius: 14px 14px 4px 14px;
  padding: 8px 12px;

}

  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px 14px 14px 4px;
  padding: 11px 13px;
  font-size: 12.8px;
  line-height: 1.65;
  word-break: break-word;
}
.msg-bubble h4 {
  margin: 10px 0 4px;
  font-family: var(--serif);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--accent);
}
.msg-bubble h4:first-child { margin-top: 0; }
.msg-bubble p { margin: 4px 0; }
.msg-bubble ul, .msg-bubble ol { margin: 4px 0 6px; padding-left: 18px; }
.msg-bubble li { margin: 3px 0; }
.msg-bubble hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
.msg-bubble strong { font-weight: 600; color: var(--ink); }
.msg-bubble code {
  font-family: var(--mono);
  font-size: 11px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--bg-hover);
}
.msg-bubble table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  margin: 6px 0;
}
.msg-bubble th, .msg-bubble td {
  padding: 4px 6px;
  border-bottom: 1px solid var(--line);

}
.msg-bubble th { color: var(--ink-3); font-weight: 500; }

@media (min-width: 960px) {

.trace-details {
  font-size: 11px;

}
.trace-details summary {
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);

}

.trace-list {

.cite-pill {

}

<body>

<header class="topbar">
  <button type="button" class="brand" id="brandHome" title="返回历史长河">
    <span class="brand-dot"></span>
    <span class="brand-name" id="brandTitle">纹样星图</span>
    <span class="brand-sub" id="brandSub"></span>
  </button>

  <nav class="nav-tabs" aria-label="主视图">
    <button type="button" data-view="river">历史长河</button>
    <button type="button" data-view="graph">聚类图谱</button>
    <button type="button" data-view="catalog">图录</button>
    <button type="button" data-view="pages">原页</button>
  </nav>

  <div class="top-actions">
    <button type="button" class="icon-pill accent-pill" id="openReasoning" aria-expanded="false" aria-label="打开知识推理工作台">
      <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.3L19 10l-5.1 1.7L12 17l-1.9-5.3L5 10l5.1-1.7L12 3z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/></svg>
      <span>推理</span>
      <kbd>R</kbd>
    </button>
    <button type="button" class="icon-pill" id="openSearch" aria-label="快速跳转">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <span>跳转</span>
      <kbd>/</kbd>
    </button>
    <button type="button" class="icon-pill" id="themeToggle" aria-label="切换明暗主题">
      <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span id="themeLabel">深空</span>
    </button>
  </div>
</header>

<!-- View 1: Full-Bleed Historical River Homepage -->
<section class="stage-view" id="view-river">
  <svg class="canvas-layer" id="riverWaterway" aria-hidden="true">
    <defs id="riverDefs"></defs>
    <g id="riverStars"></g>
    <g id="riverCurrent" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
    <g id="riverMotifLinks" fill="none" stroke-linecap="round"></g>
  </svg>
  <canvas class="canvas-layer" id="riverCanvas"></canvas>
  <canvas class="canvas-layer river-flow-layer" id="riverFlowCanvas" aria-hidden="true"></canvas>
  <div class="river-hero" id="riverHero">
    <h1 id="riverHeading">纹样长河</h1>
    <p id="riverSub">时代 · 材质 · 纹样 · 器类</p>
  </div>
  <div class="river-tools">
    <button type="button" class="chip" id="riverZoomOut" aria-label="缩小长河">−</button>
    <button type="button" class="chip" id="riverReset">总览</button>
    <button type="button" class="chip" id="riverZoomIn" aria-label="放大长河">＋</button>
    <button type="button" class="chip" id="riverUndated" hidden></button>
    <span class="river-status" id="riverDisplayStatus"></span>
  </div>
  <aside class="river-group" id="riverGroup" aria-label="聚合图录" hidden>
    <div class="river-group-head"><strong id="riverGroupTitle"></strong><button class="chip" type="button" id="riverGroupZoom">放大定位</button><button class="chip" type="button" id="riverGroupClose" aria-label="关闭图录列表">×</button></div>
    <div class="river-group-list" id="riverGroupList"></div>
    <div class="river-group-foot" id="riverGroupFoot"></div>
  </aside>
  <div class="river-dock">
    <div class="dock-group" id="riverEras"></div>
    <span class="dock-sep"></span>
    <div class="dock-group" id="riverMats"></div>
    <div class="dock-group" style="margin-left:auto">
      <label class="dock-label" for="riverTypeFilter">器类</label>
      <select class="type-filter" id="riverTypeFilter" aria-label="长河器类筛选"></select>
      <button type="button" class="chip" id="riverDatedToggle" aria-pressed="false" title="仅显示带有明确时代标注的条目">仅已定代</button>
    </div>
  </div>
</section>

<!-- View 2: Clustered 2D / 3D Knowledge Graph -->
<section class="stage-view" id="view-graph" hidden>
  <canvas class="canvas-layer" id="graphCanvas"></canvas>

  <div class="graph-hud-top">
    <div class="graph-left-stack">
      <div class="focus-bar">
        <button type="button" class="back-btn" id="graphBack" title="返回上一主图谱" aria-label="返回" hidden>←</button>
        <span class="focus-kind" id="focusKind">时代</span>
        <button type="button" class="focus-picker-btn" id="openSwitcher">
          <span id="focusLabel"></span>
          <span style="font-size:11px;opacity:.55">▾</span>
        </button>
        <span class="focus-meta" id="focusMeta"></span>
      </div>

      <div class="graph-filter-bar" id="graphFilterBar" aria-label="当前主图谱关联标签筛选">

          <div class="filter-kind-tabs" id="graphFilterTabs" role="tablist" aria-label="标签种类"></div>
          <label class="filter-search-wrap">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
            <input type="search" id="graphFilterSearch" placeholder="筛选关联标签…" autocomplete="off">
          </label>
          <button type="button" class="filter-action-btn" id="graphFilterExpand" aria-expanded="false">展开 ▾</button>
          <button type="button" class="filter-action-btn clear" id="graphFilterClear" hidden>清空</button>
        </div>
        <div class="filter-chips-row" id="graphFilterChips"></div>
      </div>
    </div>

    <div class="graph-controls">
      <div class="seg" id="clusterSwitch" aria-label="聚类维度"></div>
      <div class="seg" id="dimSwitch" aria-label="维度模式">
        <button type="button" data-dim="2d">2D 星图</button>
        <button type="button" data-dim="3d">3D 星轨</button>
      </div>
      <button type="button" class="icon-pill" id="toggleUnlabeled" aria-pressed="true" title="显示或隐藏未标注聚类项">含待补项</button>
    </div>
    <aside class="graph-attributes" id="graphAttributes" aria-label="纹样属性" hidden>
      <details class="graph-attribute-card" open>
        <summary id="graphAttributeTitle"></summary>
        <div class="graph-attribute-rows" id="graphAttributeRows"></div>
        <div class="graph-attribute-evidence" id="graphDocumentRecords" hidden></div>
        <div class="graph-attribute-evidence" id="graphAttributeEvidence" hidden></div>
      </details>
    </aside>
  </div>

  <div class="graph-hud-bottom">
    <div class="cluster-strip" id="clusterStrip"></div>
