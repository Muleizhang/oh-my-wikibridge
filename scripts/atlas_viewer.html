  // Build 2D/3D Reasoning Stage Scene for Multi-Hop Paths
  function buildPathStageScene(pathRes, focusIndex = null) {
    const chosen = focusIndex !== null && pathRes.paths[focusIndex]
      ? [pathRes.paths[focusIndex]]
      : pathRes.paths.slice(0, 3);
    if (!chosen.length) return null;

    const nodeMap = new Map();
    const edges = [];
    const maxCols = Math.max(...chosen.map(p => p.steps.length + 1));
    const colSpacing = Math.min(180, Math.max(120, 620 / Math.max(2, maxCols - 1)));
    const rowSpacing = chosen.length === 1 ? 0 : 128;

    chosen.forEach((p, rIdx) => {
      const yBase = (rIdx - (chosen.length - 1) * 0.5) * rowSpacing;
      const zBase = (rIdx - (chosen.length - 1) * 0.5) * 65;
      const seq = [
        { key: p.steps[0].fromKey, label: p.steps[0].fromLabel, kind: p.steps[0].fromKind, isOnt: p.steps[0].fromIsOntology },
        ...p.steps.map(s => ({ key: s.toKey, label: s.toLabel, kind: s.toKind, isOnt: s.toIsOntology })),
      ];
      seq.forEach((nd, cIdx) => {
        const isEnd = cIdx === 0 || cIdx === seq.length - 1;
        const x = (cIdx - (seq.length - 1) * 0.5) * colSpacing;
        const y = isEnd ? 0 : yBase + Math.sin(cIdx * 1.1) * 18;
        const z = isEnd ? 25 : zBase + Math.cos(cIdx * 1.2) * 38;
        if (!nodeMap.has(nd.key)) {
          const aid = nd.key.startsWith('artifact:') ? nd.key.slice(9) : null;
          const artItem = aid ? G.itemById.get(aid) : null;
          if (artItem?.thumbUrl) getSprite(artItem.thumbUrl);
          nodeMap.set(nd.key, {
            key: nd.key,
            label: nd.label,
            kind: nd.kind,
            isOntology: nd.isOnt,
            artifactId: aid,
            thumbUrl: artItem?.thumbUrl || '',
            roleTag: isEnd ? (cIdx === 0 ? '推演起点' : '推演终点') : (nd.isOnt ? 'RDFS 本体类' : (aid ? '原书实证器物' : '语义桥接概念')),
            sub: artItem ? artItem.locator : '',
            x: x * 0.25, y: y * 0.25, z: 0,
            tx: x, ty: y, tz: z,
            baseR: isEnd ? 34 : (aid ? 23 : (nd.isOnt ? 22 : 25)),
            color: nd.isOnt ? '#77b29c' : (isEnd ? '#e2ba74' : colorFor(nd.kind === 'artifact' ? 'motif' : nd.kind, nd.label)),
            sx: 0, sy: 0, sz: 0, sr: 22,
          });
        }
      });

      p.steps.forEach((s, sIdx) => {
        edges.push({
          from: nodeMap.get(s.fromKey),
          to: nodeMap.get(s.toKey),
          label: s.isInferred ? (s.axiom || '⊑ 本体') : s.predicateLabel,
          dashed: Boolean(s.isInferred),
          color: s.isInferred ? '#77b29c' : '#e2ba74',
          phase: sIdx * 0.23 + rIdx * 0.37,
        });
      });
    });

    const nodes = [...nodeMap.values()];
    const extent = Math.max(300, ...nodes.map(n => Math.hypot(n.tx, n.ty) + 60));
    return { kind: 'path', nodes, edges, extent };
  }

  // Build 2D/3D Dual-Focal Contrast Constellation (Intersection vs NOT EXISTS Wings)
  function buildCompareStageScene(cmpRes) {
    const nodes = [];
    const edges = [];
    const colA = '#d48263';
    const colB = '#74ad99';
    const colShared = '#e2bb74';

    const nA = {
      key: 'cmp:A', label: cmpRes.entityA, kind: cmpRes.kind, isOntology: false,
      roleTag: `实体 A · ${cmpRes.countA} 条`, sub: `独有 ${cmpRes.primary.onlyA.length}`,
      x: -60, y: 0, z: 0, tx: -250, ty: 0, tz: 20, baseR: 38, color: colA, sx: 0, sy: 0, sz: 0, sr: 38,
    };
    const nB = {
      key: 'cmp:B', label: cmpRes.entityB, kind: cmpRes.kind, isOntology: false,
      roleTag: `实体 B · ${cmpRes.countB} 条`, sub: `独有 ${cmpRes.primary.onlyB.length}`,
      x: 60, y: 0, z: 0, tx: 250, ty: 0, tz: 20, baseR: 38, color: colB, sx: 0, sy: 0, sz: 0, sr: 38,
    };
    nodes.push(nA, nB);

    const shared = cmpRes.primary.shared.slice(0, 8);
    shared.forEach((item, i) => {
      const spread = Math.max(150, (shared.length - 1) * 82);
      const y = shared.length === 1 ? 0 : ((i / (shared.length - 1)) - 0.5) * spread;
      const z = Math.cos((i + 1) * 1.3) * 55;
      const nd = {
        key: `sh:${item.label}`, label: item.label, kind: item.kind,
        roleTag: '共有交集 (A ∩ B)', sub: `${cmpRes.entityA} ${item.countA} · ${cmpRes.entityB} ${item.countB}`,
        x: 0, y: 0, z: 0, tx: 0, ty: y, tz: z, baseR: 20, color: colShared, sx: 0, sy: 0, sz: 0, sr: 20,
      };
      nodes.push(nd);
      edges.push({ from: nA, to: nd, label: '', dashed: false, color: colShared, phase: i * 0.14 });
      edges.push({ from: nd, to: nB, label: '', dashed: false, color: colShared, phase: i * 0.14 + 0.5 });
    });

    const fanWing = (list, anchor, dir, col, tag) => {
      const items = list.slice(0, 10);
      items.forEach((item, i) => {
        const frac = items.length === 1 ? 0.5 : i / (items.length - 1);
        const ang = (dir < 0 ? Math.PI : 0) + (frac - 0.5) * 2.15 * (dir < 0 ? -1 : 1);
        const rad = 165 + (i % 2) * 48;
        const tx = anchor.tx + Math.cos(ang) * rad;
        const ty = anchor.ty + Math.sin(ang) * rad;
        const tz = Math.sin(frac * Math.PI * 2) * 45;
        const nd = {
          key: `wing:${dir}:${item.label}`, label: item.label, kind: item.kind,
          roleTag: tag, sub: `${item.count} 条`,
          x: anchor.tx, y: 0, z: 0, tx, ty, tz, baseR: 16.5, color: col, sx: 0, sy: 0, sz: 0, sr: 16.5,
        };
        nodes.push(nd);
        edges.push({ from: anchor, to: nd, label: '', dashed: true, color: col, phase: i * 0.2 });
      });
    };
    fanWing(cmpRes.primary.onlyA, nA, -1, colA, `仅 ${cmpRes.entityA} 独有 (NOT EXISTS)`);
    fanWing(cmpRes.primary.onlyB, nB, 1, colB, `仅 ${cmpRes.entityB} 独有 (NOT EXISTS)`);

    return { kind: 'compare', nodes, edges, extent: 490 };
  }

  // Build 2D/3D Abductive Prediction Constellation (Glowing Dashed Edges + Confidence Badges)
  function buildPredictStageScene(predRes) {
    const preds = predRes.predictions.slice(0, 12);
    if (!preds.length) return null;
    const targetGroups = new Map();
    for (const p of preds) {
      if (!targetGroups.has(p.predictedValue)) targetGroups.set(p.predictedValue, []);
      targetGroups.get(p.predictedValue).push(p);
    }

    const nodes = [];
    const edges = [];
    const groups = [...targetGroups.entries()];
    const gRad = groups.length === 1 ? 0 : Math.min(260, 150 + groups.length * 30);

    groups.forEach(([tVal, list], gi) => {
      const ga = (gi / Math.max(1, groups.length)) * Math.PI * 2 - Math.PI * 0.5;
      const gx = Math.cos(ga) * gRad;
      const gy = Math.sin(ga) * gRad;
      const gz = Math.sin(ga * 2) * 40;
      const col = colorFor(list[0].predictedKind, tVal);
      const hub = {
        key: `ptarget:${tVal}`, label: tVal, kind: list[0].predictedKind,
        roleTag: `推导目标 · ${list.length} 项候选`, sub: '点击进入聚类图谱',
        x: 0, y: 0, z: 0, tx: gx, ty: gy, tz: gz, baseR: 34, color: col, sx: 0, sy: 0, sz: 0, sr: 34,
      };
      nodes.push(hub);

      list.forEach((p, pi) => {
        const a = groups.length === 1
          ? (pi / Math.max(1, list.length)) * Math.PI * 2 - Math.PI * 0.5
          : ga + ((pi / Math.max(1, list.length)) - 0.5) * 2.2;
        const dist = 192 + (pi % 2) * 56;
        const art = G.itemById.get(p.artifactId);
        if (art?.thumbUrl) getSprite(art.thumbUrl);
        const nd = {
          key: `part:${p.artifactId}:${tVal}`,
          label: p.artifactTitle,
          kind: 'artifact',
          artifactId: p.artifactId,
          thumbUrl: art?.thumbUrl || '',
          roleTag: `推理置信度 ${Math.round(p.confidence * 100)}% · Lift ${p.lift}×`,
          sub: p.ruleFormula,
          x: gx, y: gy, z: gz,
          tx: gx + Math.cos(a) * dist,
          ty: gy + Math.sin(a) * dist,
          tz: gz + Math.cos(pi * 1.4) * 52,
          baseR: 19, color: col, sx: 0, sy: 0, sz: 0, sr: 19,
        };
        nodes.push(nd);
        edges.push({
          from: nd, to: hub,
          label: `${Math.round(p.confidence * 100)}%`,
          dashed: true,
          color: col,
          phase: pi * 0.19 + gi * 0.3,
        });
      });
    });

    const extent = Math.max(330, ...nodes.map(n => Math.hypot(n.tx, n.ty) + 70));
    return { kind: 'predict', nodes, edges, extent };
  }

  function drawReasoningStage(ctx, scene, dark, timeSec) {
    // Spring-interpolate reasoning nodes smoothly
    for (const n of scene.nodes) {
      n.x += (n.tx - n.x) * 0.15;
      n.y += (n.ty - n.y) * 0.15;
      n.z += (n.tz - n.z) * 0.15;
      const p = projectPoint(n.x, n.y, n.z);
      n.sx = p.x; n.sy = p.y; n.sz = p.z; n.sk = p.k;
      n.sr = Math.max(9, n.baseR * p.k);
    }

    // Subtle 3D celestial reference ring
    ctx.beginPath();
    for (let i = 0; i <= 72; i++) {
      const a = (i / 72) * Math.PI * 2;
      const p = projectPoint(Math.cos(a) * (scene.extent * 0.72), Math.sin(a) * (scene.extent * 0.72), 0);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = dark ? 'rgba(216,179,119,0.08)' : 'rgba(130,90,52,0.09)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw curved edges + animated traveling light pulses
    for (const e of scene.edges) {
      const a = e.from, b = e.to;
      if (!a || !b) continue;
      const dx = b.sx - a.sx, dy = b.sy - a.sy;
      const mx = (a.sx + b.sx) * 0.5 - dy * 0.08;
      const my = (a.sy + b.sy) * 0.5 + dx * 0.08;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(a.sx, a.sy);
      ctx.quadraticCurveTo(mx, my, b.sx, b.sy);
      ctx.strokeStyle = hexAlpha(e.color, dark ? (e.dashed ? 0.65 : 0.72) : (e.dashed ? 0.58 : 0.65));
      ctx.lineWidth = e.dashed ? 1.55 : 2.1;
      if (e.dashed) ctx.setLineDash([5, 5]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Animated traveling energy bead
      const tp = (timeSec * 0.48 + (e.phase || 0)) % 1;
      const u = 1 - tp;
      const px = u * u * a.sx + 2 * u * tp * mx + tp * tp * b.sx;
      const py = u * u * a.sy + 2 * u * tp * my + tp * tp * b.sy;
      ctx.fillStyle = dark ? '#fff4d4' : e.color;
      ctx.beginPath();
      ctx.arc(px, py, e.dashed ? 2.6 : 3.4, 0, Math.PI * 2);
      ctx.fill();

      // Concise edge predicate / confidence pill
      if (e.label) {
        ctx.font = `500 10.5px ${getComputedStyle(document.body).fontFamily}`;
        const tw = ctx.measureText(e.label).width;
        const bx = mx - tw * 0.5 - 6, by = my - 9;
        ctx.fillStyle = dark ? 'rgba(11,14,22,0.85)' : 'rgba(252,250,245,0.92)';
        roundRect(ctx, bx, by, tw + 12, 18, 9);
        ctx.fill();
        ctx.strokeStyle = hexAlpha(e.color, 0.45);
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.fillStyle = e.color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.label, mx, my);
        ctx.textBaseline = 'alphabetic';
      }
      ctx.restore();
    }

    // Depth-sorted nodes
    const sorted = [...scene.nodes].sort((a, b) => a.sz - b.sz);
    const hov = stageOverlay?.hoveredNode || null;
    for (const n of sorted) {
      const isHov = hov === n || (n.artifactId && n.artifactId === state.drawerItemId);
      const r = n.sr * (isHov ? 1.16 : 1);
      const depthFade = state.dim === '3d' ? Math.max(0.36, Math.min(1, (n.sz + 520) / 700)) : 1;

      ctx.save();
      ctx.globalAlpha = depthFade;

      // Halo glow
      const glow = ctx.createRadialGradient(n.sx, n.sy, r * 0.5, n.sx, n.sy, r * (isHov ? 2.4 : 1.7));
      glow.addColorStop(0, hexAlpha(n.color, isHov ? 0.46 : (dark ? 0.24 : 0.14)));
      glow.addColorStop(1, hexAlpha(n.color, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r * (isHov ? 2.4 : 1.7), 0, Math.PI * 2);
      ctx.fill();

      const sp = n.thumbUrl ? getSprite(n.thumbUrl) : null;
      const bmp = sp?.status === 'ready' ? (dark ? sp.dark : sp.light) : null;
      if (bmp && n.artifactId) {
        ctx.drawImage(bmp, n.sx - r, n.sy - r, r * 2, r * 2);
      } else {
        const dg = ctx.createRadialGradient(n.sx - r * 0.25, n.sy - r * 0.25, 2, n.sx, n.sy, r);
        if (dark) {
          dg.addColorStop(0, hexAlpha(n.color, 0.34));
          dg.addColorStop(1, '#121622');
        } else {
          dg.addColorStop(0, '#ffffff');
          dg.addColorStop(1, hexAlpha(n.color, 0.18));
        }
        ctx.fillStyle = dg;
        ctx.beginPath();
        ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
      ctx.strokeStyle = isHov ? (dark ? '#fff3d1' : '#8f4e32') : n.color;
      ctx.lineWidth = isHov ? 2.4 : 1.7;
      if (n.isOntology) ctx.setLineDash([4, 3]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Node text label
      const shortLbl = n.label.length > 10 ? n.label.slice(0, 9) + '…' : n.label;
      ctx.textAlign = 'center';
      if (!n.artifactId && r >= 24) {
        ctx.textBaseline = 'middle';
        ctx.font = `600 ${Math.max(11, Math.min(14, r * 0.37))}px "Noto Serif SC","Songti SC",serif`;
        ctx.fillStyle = dark ? '#faf5ea' : '#1e1c19';
        ctx.fillText(shortLbl, n.sx, n.sy);
        ctx.textBaseline = 'alphabetic';
      } else {
        ctx.font = `600 11.5px "Noto Serif SC","Songti SC",serif`;
        ctx.fillStyle = dark ? 'rgba(244,240,232,0.95)' : 'rgba(30,28,25,0.92)';
        ctx.fillText(shortLbl, n.sx, n.sy + r + 15);
      }
      ctx.restore();
    }
  }

  function initReasoningStudio(manifest) {
    if (typeof createKGReasoner === 'function') {
      R = createKGReasoner(manifest);
      rState.summary = R.getCatalogSummary();
    }
    if (!R) return;

    // Populate universal entity autocomplete datalist
    const dl = $('kgEntityDatalist');
    dl.replaceChildren();
    const addOpt = v => { const o = document.createElement('option'); o.value = v; dl.append(o); };
    rState.summary.eras.forEach(e => addOpt(e.name));
    rState.summary.materials.forEach(m => addOpt(m.name));
    rState.summary.motifs.forEach(mo => addOpt(mo.name));

    // Default dynamic path & compare selections from whatever KG is loaded
    const eras = rState.summary.eras;
    const mats = rState.summary.materials;
    if (eras.length >= 2) {
      $('rPathSrc').value = eras[0].name;
      $('rPathDst').value = eras[1].name;
    } else if (mats.length >= 2) {
      $('rPathSrc').value = mats[0].name;
      $('rPathDst').value = mats[1].name;
    }

    // Dynamic path presets
    const pathPresets = $('rPathPresets');
    pathPresets.replaceChildren();
    const dynPairs = [];
    if (eras.length >= 2) dynPairs.push([eras[0].name, eras[1].name]);
    if (eras.length >= 3) dynPairs.push([eras[1].name, eras[eras.length - 1].name]);
    if (mats.length >= 2) dynPairs.push([mats[0].name, mats[1].name]);
    const cleanMotifs = rState.summary.motifs.filter(m => !/连续|边缘/.test(m.name));
    if (cleanMotifs.length >= 2) dynPairs.push([cleanMotifs[0].name, cleanMotifs[1].name]);
    for (const [a, b] of dynPairs.slice(0, 4)) {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'r-preset';
      btn.textContent = `${a} → ${b}`;
      btn.onclick = () => { $('rPathSrc').value = a; $('rPathDst').value = b; runPathLens(); };
      pathPresets.append(btn);
    }

    populateCompareSelects();

    // Wire Reasoning Studio UI events
    $('openReasoning').onclick = () => toggleReasoning();
    $('rClose').onclick = () => toggleReasoning(false);
    $('overlayClear').onclick = clearStageOverlay;

    $('rModeSeg').querySelectorAll('button').forEach(b => {
      b.onclick = () => setReasoningMode(b.dataset.rmode);
    });
    $('rLensSeg').querySelectorAll('button').forEach(b => {
      b.onclick = () => setSymbolicLens(b.dataset.lens);
    });
    $('rOntToggle').onclick = () => {
      rState.useOntology = !rState.useOntology;
      $('rOntToggle').setAttribute('aria-pressed', String(rState.useOntology));
      runActiveSymbolicLens();
    };
    $('rRunPath').onclick = runPathLens;
    $('rPathSrc').onkeydown = $('rPathDst').onkeydown = e => { if (e.key === 'Enter') runPathLens(); };
    $('rCmpKind').onchange = () => { populateCompareSelects(); runCompareLens(); };
    $('rRunCompare').onclick = runCompareLens;
    $('rRunPredict').onclick = runPredictLens;
    $('rPredTarget').onchange = runPredictLens;
    $('rRunSparql').onclick = runSparqlFromEditor;

    $('agentForm').onsubmit = e => {
      e.preventDefault();
      const q = $('agentInput').value.trim();
      if (q && !rState.agentBusy) sendAgentMessage(q);
    };
    $('agentClear').onclick = () => {
      rState.agentMessages = [];
      clearStageOverlay();
      renderAgentFeed();
    };

    renderAgentFeed();

    // Probe unified backend silently to check DeepSeek readiness
    fetch('/api/kg/status').then(r => r.ok ? r.json() : null).then(info => {
      if (info && info.deepseekReady) {
        rState.deepseekReady = true;
        rState.model = info.model || 'deepseek-chat';
        $('rStatusDot').classList.remove('off');
        $('rStatusText').textContent = 'DeepSeek 就绪';
        if (!rState.agentMessages.length) renderAgentFeed();
      }
    }).catch(() => {});
  }

  function populateCompareSelects() {
    const kind = $('rCmpKind').value;
    const list = kind === 'era' ? rState.summary.eras : (kind === 'material' ? rState.summary.materials : rState.summary.motifs);
    const fill = (sel, idx) => {
      sel.replaceChildren();
      for (const item of list) {
        const o = document.createElement('option');
        o.value = item.name; o.textContent = `${item.name} (${item.count})`;
        sel.append(o);
      }
      if (list[idx]) sel.value = list[idx].name;
    };
    fill($('rCmpA'), 0);
    fill($('rCmpB'), Math.min(1, list.length - 1));
    const pre = $('rCmpPresets');
    pre.replaceChildren();
    if (list.length >= 2) {
      const pairs = [[list[0].name, list[list.length - 1].name]];
      if (list.length >= 3) pairs.unshift([list[1].name, list[list.length - 1].name]);
      for (const [a, b] of pairs) {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'r-preset';
        btn.textContent = `${a} vs ${b}`;
        btn.onclick = () => { $('rCmpA').value = a; $('rCmpB').value = b; runCompareLens(); };
        pre.append(btn);
      }
    }
  }

  function setReasoningMode(mode) {
    rState.mode = mode;
    $('rModeSeg').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-selected', String(b.dataset.rmode === mode));
    });
    $('rPaneSymbolic').hidden = mode !== 'symbolic';
    $('rPaneAgent').hidden = mode !== 'agent';
    if (mode === 'symbolic' && !rState.lastSymbolic) runActiveSymbolicLens();
  }

  function setSymbolicLens(lens) {
    rState.lens = lens;
    $('rLensSeg').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.lens === lens));
    });
    $('rFormPath').hidden = lens !== 'path';
    $('rFormCompare').hidden = lens !== 'compare';
    $('rFormPredict').hidden = lens !== 'predict';
    runActiveSymbolicLens();
  }

  function runActiveSymbolicLens() {
    if (rState.lens === 'path') runPathLens();
    else if (rState.lens === 'compare') runCompareLens();
    else runPredictLens();
  }

  function runPathLens() {
    const src = $('rPathSrc').value.trim();
    const dst = $('rPathDst').value.trim();
    if (!src || !dst) return;
    const res = R.findPaths(src, dst, { useOntology: rState.useOntology, maxHops: 6, maxPaths: 4 });
    rState.lastSymbolic = res;
    $('rSparqlInput').value = res.sparql || '';
    $('rSparqlPlan').textContent = res.ok ? `找到 ${res.paths.length} 条语义路径 · 本体${res.useOntology ? '开启' : '关闭'}` : '';
    $('rSparqlTableWrap').replaceChildren();

    const out = $('rSymbolicOut');
    out.replaceChildren();
    if (!res.ok) {
      out.innerHTML = `<div class="r-card"><div class="r-card-title">${esc(res.error)}</div></div>`;
      return;
    }

    if (res.ontologyUnlocked) {
      const tip = document.createElement('div');
      tip.className = 'proof-line';
      tip.innerHTML = `<code>✦ RDFS 本体闭包解锁连通性</code>字面严格模式下无连通路径，开启本体泛化后成功推导出 ${res.paths.length} 条演化链路。`;
      out.append(tip);
    }

    if (!res.paths.length) {
      out.innerHTML = `<div class="r-card"><div class="r-card-title">当前约束下未找到连通路径</div><div style="font-size:12px;color:var(--ink-2)">尝试开启「本体泛化」或更换一对实体节点。</div></div>`;
      clearStageOverlay();
      return;
    }

    const projectPathToCanvas = idx => {
      const scene = buildPathStageScene(res, idx);
      const selPaths = idx !== null ? [res.paths[idx]] : res.paths;
      const artSet = new Set(selPaths.flatMap(p => p.artifactIds));
      const chains = selPaths.map(p => p.artifactIds).filter(c => c.length >= 2);
      applyStageOverlay({
        type: 'path',
        banner: `路径推演：${res.source.label} → ${res.target.label}（${selPaths[0].hops} 跳${res.useOntology ? ' · 含本体闭包' : ' · 字面严格'}）`,
        artifactSet: artSet,
        pathChains: chains,
        graphScene: scene,
      }, state.view !== 'river');
    };

    res.paths.forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = 'r-card' + (idx === 0 ? ' active' : '');

      const head = document.createElement('div');
      head.className = 'r-card-head';
      head.innerHTML = `<span class="r-card-title">路径 ${p.id} · ${p.hops} 跳</span>
        <span class="r-badge ${p.usesOntology ? 'ont' : ''}">${p.usesOntology ? '本体闭包' : '原文实证'}</span>`;
      card.append(head);

      const chain = document.createElement('div');
      chain.className = 'chain-steps';
      p.steps.forEach((s, si) => {
        if (si === 0) chain.append(makeChainNode(s.fromKey, s.fromLabel, s.fromKind, s.fromIsOntology));
        const edge = document.createElement('span');
        edge.className = 'chain-edge' + (s.isInferred ? ' ont' : '');
        edge.textContent = s.isInferred ? '─⊑→' : `─${s.predicateLabel}→`;
        chain.append(edge, makeChainNode(s.toKey, s.toLabel, s.toKind, s.toIsOntology));
      });
      card.append(chain);

      for (const rule of p.rulesTriggered) {
        const pl = document.createElement('div');
        pl.className = 'proof-line';
        pl.innerHTML = `<code>${esc(rule.name)} · ${esc(rule.formula)}</code>${esc(rule.detail)}`;
        card.append(pl);
      }

      const actions = document.createElement('div');
      actions.className = 'r-row';
      actions.style.justifyContent = 'space-between';
      const showBtn = document.createElement('button');
      showBtn.type = 'button'; showBtn.className = 'mini-link';
      showBtn.textContent = '在 2D/3D 星图高亮此路径 ↗';
      showBtn.onclick = () => {
        out.querySelectorAll('.r-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        projectPathToCanvas(idx);
      };
      const askBtn = document.createElement('button');
      askBtn.type = 'button'; askBtn.className = 'mini-link';
      askBtn.textContent = '交由 DeepSeek 深度解构 →';
      askBtn.onclick = () => bridgeToAgent(`请深度解读「${res.source.label}」到「${res.target.label}」之间的演化与迁移路径，并核验涉及的原书证据。`);
      actions.append(showBtn, askBtn);
      card.append(actions);
      out.append(card);
    });

    projectPathToCanvas(null);
  }

  function makeChainNode(key, label, kind, isOnt) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chain-node' + (isOnt ? ' ont' : '');
    b.textContent = label.length > 14 ? label.slice(0, 13) + '…' : label;
    b.title = label;
    b.onclick = () => {
      if (key.startsWith('artifact:')) openDrawer(key.slice(9));
      else if (!isOnt && ['era', 'material', 'motif'].includes(kind)) { clearStageOverlay(); openGraph(kind, label); }
    };
    return b;
  }

  function runCompareLens() {
    const kind = $('rCmpKind').value;
    const a = $('rCmpA').value, b = $('rCmpB').value;
    if (!a || !b) return;
    const res = R.compareEntities(kind, a, b, { useOntology: rState.useOntology });
    rState.lastSymbolic = res;
    $('rSparqlInput').value = res.sparql || '';
    $('rSparqlPlan').textContent = res.ok ? `Jaccard = ${res.primary.jaccard} · 支持 FILTER NOT EXISTS` : '';
    $('rSparqlTableWrap').replaceChildren();

    const out = $('rSymbolicOut');
    out.replaceChildren();
    if (!res.ok) {
      out.innerHTML = `<div class="r-card"><div class="r-card-title">${esc(res.error)}</div></div>`;
      return;
    }

    const metrics = document.createElement('div');
    metrics.className = 'cmp-metrics';
    metrics.innerHTML = `
      <div class="cmp-stat shared"><strong>${res.primary.shared.length}</strong><span>共有交集 A∩B</span></div>
      <div class="cmp-stat onlyA"><strong>${res.primary.onlyA.length}</strong><span>仅 ${esc(a)} 独有</span></div>
      <div class="cmp-stat onlyB"><strong>${res.primary.onlyB.length}</strong><span>仅 ${esc(b)} 独有</span></div>
    `;
    out.append(metrics);

    const addBucket = (title, items, tintClass) => {
      const card = document.createElement('div');
      card.className = 'r-card';
      card.innerHTML = `<div class="r-card-head"><span class="r-card-title">${esc(title)}</span><span class="r-badge">${items.length}</span></div>`;
      const chips = document.createElement('div');
      chips.className = 'r-presets';
      for (const it of items.slice(0, 14)) {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'r-preset';
        btn.textContent = it.countA !== undefined ? `${it.label} (${it.countA}/${it.countB})` : `${it.label} (${it.count})`;
        btn.onclick = () => { clearStageOverlay(); openGraph(it.kind, it.label); };
        chips.append(btn);
      }
      if (!items.length) chips.innerHTML = '<span style="font-size:11.5px;color:var(--ink-3)">无</span>';
      card.append(chips);
      out.append(card);
    };

    const axisLbl = KIND_LABEL[res.primary.axis] || '属性';
    addBucket(`共有延续${axisLbl}（Jaccard ${res.primary.jaccard}）`, res.primary.shared, 'shared');
    addBucket(`仅「${a}」独有（FILTER NOT EXISTS ${b}）`, res.primary.onlyA, 'onlyA');
    addBucket(`仅「${b}」独有（FILTER NOT EXISTS ${a}）`, res.primary.onlyB, 'onlyB');

    const askBtn = document.createElement('button');
    askBtn.type = 'button'; askBtn.className = 'mini-link';
    askBtn.textContent = '交由 DeepSeek 综合比较演变意义 →';
    askBtn.onclick = () => bridgeToAgent(`请深度对比「${a}」与「${b}」在当前图谱中的纹样与材质体系差异（共有延续 vs 各自独有），并引用原书实证。`);
    out.append(askBtn);

    const scene = buildCompareStageScene(res);
    applyStageOverlay({
      type: 'compare',
      banner: `集合对比：${a} vs ${b} · 共有 ${res.primary.shared.length} · 差集 ${res.primary.onlyA.length}/${res.primary.onlyB.length}`,
      artifactSet: new Set([...res.artifactIdsA, ...res.artifactIdsB]),
      graphScene: scene,
    }, true);
  }

  function runPredictLens() {
    const targetPredicate = $('rPredTarget').value;
    const res = R.predictMissing({ targetPredicate, useOntology: rState.useOntology, limit: 14 });
    rState.lastSymbolic = res;
    $('rSparqlInput').value = res.sparql || '';
    $('rSparqlPlan').textContent = `待补全 ${res.totalMissing} 条 · 高置信推导 ${res.predictions.length} 条`;
    $('rSparqlTableWrap').replaceChildren();

    const out = $('rSymbolicOut');
    out.replaceChildren();
    if (!res.predictions.length) {
      out.innerHTML = `<div class="r-card"><div class="r-card-title">当前条件下暂无高置信补全候选</div></div>`;
      clearStageOverlay();
      return;
    }

    for (const p of res.predictions) {
      const pct = Math.round(p.confidence * 100);
      const card = document.createElement('div');
      card.className = 'r-card';
      card.innerHTML = `
        <div class="r-card-head">
          <span class="r-card-title">${esc(p.artifactTitle)}</span>
          <span class="r-badge ont">${esc(p.predictedValue)} · ${pct}%</span>
        </div>
        <div class="conf-bar"><div class="conf-fill" style="width:${pct}%"></div></div>
        <div class="proof-line"><code>${esc(p.ruleFormula)} · Lift ${p.lift}×</code>${esc(p.explanation)}</div>
      `;
      const row = document.createElement('div');
      row.className = 'r-row';
      row.style.flexWrap = 'wrap';
      const openArt = document.createElement('button');
      openArt.type = 'button'; openArt.className = 'mini-link';
      openArt.textContent = `查看条目 P.${p.page} ↗`;
      openArt.onclick = () => openDrawer(p.artifactId);
      row.append(openArt);
      for (const s of p.supporters.slice(0, 2)) {
        const sb = document.createElement('button');
        sb.type = 'button'; sb.className = 'r-preset';
        sb.textContent = `支撑：${s.title.slice(0, 10)}`;
        sb.onclick = () => openDrawer(s.artifactId);
        row.append(sb);
      }
      card.append(row);
      out.append(card);
    }

    const scene = buildPredictStageScene(res);
    applyStageOverlay({
      type: 'predict',
      banner: `推理补全：${PREDICATE_LABELS[targetPredicate]} · ${res.predictions.length} 条虚线预测边（关联规则 + PathSim）`,
      artifactSet: new Set(res.predictions.map(p => p.artifactId)),
      graphScene: scene,
    }, true);
  }

  function runSparqlFromEditor() {
    const q = $('rSparqlInput').value.trim();
    const res = R.runSparql(q, { useOntology: rState.useOntology });
    const wrap = $('rSparqlTableWrap');
    wrap.replaceChildren();
    if (!res.ok) {
      $('rSparqlPlan').textContent = res.error;
      return;
    }
    $('rSparqlPlan').textContent = `${res.rows.length} 行 · ${res.elapsedMs}ms · ${res.plan.join(' → ')}`;
    if (res.rows.length) {
      const tbl = document.createElement('table');
      tbl.className = 'sparql-table';
      tbl.innerHTML = `<thead><tr>${res.variables.map(v => `<th>${esc(v)}</th>`).join('')}</tr></thead>
        <tbody>${res.rows.slice(0, 25).map(r => `<tr>${res.variables.map(v => `<td>${esc(r[v])}</td>`).join('')}</tr>`).join('')}</tbody>`;
      wrap.append(tbl);
    }
    if (res.matchedArtifactIds.length) {
      applyStageOverlay({
        type: 'highlight',
        banner: `SPARQL 命中 ${res.matchedArtifactIds.length} 件器物（${res.rows.length} 条绑定）`,
        artifactSet: new Set(res.matchedArtifactIds),
        graphScene: null,
      }, false);
    }
  }

  function bridgeToAgent(question) {
    setReasoningMode('agent');
    sendAgentMessage(question);
  }

  function renderAgentFeed() {
    const feed = $('agentFeed');
    feed.replaceChildren();

    if (!rState.agentMessages.length) {
      const empty = document.createElement('div');
      empty.className = 'agent-empty';
      empty.innerHTML = `
        <h3>DeepSeek 神经-符号推演智能体</h3>
        <p>${rState.deepseekReady ? `已连接 ${esc(rState.model)} · 自动调用本体路径、差集 SPARQL 与链接预测，实时驾驶 2D/3D 星图。` : '当前为离线静态模式（启动 unified server 并配置 DEEPSEEK_API_KEY 即可启用实时对话）。'}</p>
      `;
      for (const s of (rState.summary?.suggestions || [])) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'agent-prompt-btn';
        b.textContent = s.question;
        b.onclick = () => sendAgentMessage(s.question);
        empty.append(b);
      }
      feed.append(empty);
      return;
    }

    for (const msg of rState.agentMessages) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + msg.role;

      if (msg.role === 'assistant' && msg.trace?.length) {
        const det = document.createElement('details');
        det.className = 'trace-details';
        const sec = msg.elapsedMs ? `${(msg.elapsedMs / 1000).toFixed(1)}s` : '';
        det.innerHTML = `<summary>✦ ${esc(msg.model || 'DeepSeek')} · ${msg.trace.length} 步推演 · ${(msg.citations || []).length} 实证 · ${(msg.inferences || []).length} 推论 ${sec ? '· ' + sec : ''} ▾</summary>`;
        const list = document.createElement('div');
        list.className = 'trace-list';
        for (const st of msg.trace) {
          const row = document.createElement('div');
          row.textContent = `→ ${st.tool}(${st.summary || ''}) ⇒ ${st.count}`;
          list.append(row);
        }
        det.append(list);
        wrap.append(det);
      }

      const bub = document.createElement('div');
      bub.className = 'msg-bubble';
      if (msg.role === 'assistant') {
        renderCitedContent(bub, msg.content, msg.citations || [], msg.inferences || []);
      } else {
        bub.textContent = msg.content;
      }
      wrap.append(bub);

      if (msg.role === 'assistant' && msg.stageAction) {
        const sync = document.createElement('button');
        sync.type = 'button'; sync.className = 'mini-link';
        sync.textContent = '✦ 重播此轮推演画布视角 ↗';
        sync.onclick = () => applyAgentStageAction(msg.stageAction);
        wrap.append(sync);
      }
      feed.append(wrap);
    }

    if (rState.agentBusy) {
      const loading = document.createElement('div');
      loading.className = 'msg assistant';
      loading.innerHTML = `<div class="msg-bubble" style="display:flex;align-items:center;gap:8px;color:var(--ink-2)"><span class="r-pulse"></span>DeepSeek 正在调用符号图谱引擎多步推演…</div>`;
      feed.append(loading);
    }
    feed.scrollTop = feed.scrollHeight;
  }

  function renderCitedContent(container, text, citations, inferences) {
    const evMap = new Map(citations.map(c => [c.ref, c]));
    const infMap = new Map(inferences.map(r => [r.ref, r]));

    const appendInline = (el, line) => {
      const tokens = String(line || '').split(/(\[(?:E|R)\d+\]|\*\*[^*]+\*\*|`[^`]+`)/g);
      for (const tok of tokens) {
        if (!tok) continue;
        const m = tok.match(/^\[(E|R)(\d+)\]$/);
        if (m) {
          const ref = m[1] + m[2];
          if (m[1] === 'E' && evMap.has(ref)) {
            const ev = evMap.get(ref);
            const btn = document.createElement('button');
            btn.type = 'button'; btn.className = 'cite-pill ev';
            btn.textContent = `实证 ${ref}`;
            btn.title = `${ev.subject} · ${ev.predicate} · ${ev.object} (P.${ev.page})`;
            btn.onclick = () => { if (ev.artifactId) openDrawer(ev.artifactId); };
            el.append(btn);
            continue;
          }
          if (m[1] === 'R' && infMap.has(ref)) {
            const inf = infMap.get(ref);
            const btn = document.createElement('button');
            btn.type = 'button'; btn.className = 'cite-pill inf';
            btn.textContent = `推论 ${ref}`;
            btn.title = inf.summary || inf.title;
            btn.onclick = () => {
              if (inf.type === 'prediction' && inf.artifactId) openDrawer(inf.artifactId);
              else if (inf.type === 'path' && inf.steps?.length) {
                const fakeRes = { source: { label: inf.steps[0].fromLabel }, target: { label: inf.steps[inf.steps.length - 1].toLabel }, paths: [{ steps: inf.steps, artifactIds: inf.artifactIds || [] }] };
                applyStageOverlay({ type: 'path', banner: `推论 ${ref}：${inf.title}`, artifactSet: new Set(inf.artifactIds || []), graphScene: buildPathStageScene(fakeRes, 0) }, true);
              } else if (inf.type === 'compare' && R) {
                const cmp = R.compareEntities(inf.kind, inf.entityA, inf.entityB, { useOntology: true });
                if (cmp.ok) applyStageOverlay({ type: 'compare', banner: `推论 ${ref}：${inf.title}`, artifactSet: new Set([...cmp.artifactIdsA, ...cmp.artifactIdsB]), graphScene: buildCompareStageScene(cmp) }, true);
              }
            };
            el.append(btn);
            continue;
          }
        }
        if (tok.startsWith('**') && tok.endsWith('**') && tok.length > 4) {
          const s = document.createElement('strong');
          appendInline(s, tok.slice(2, -2));
          el.append(s);
          continue;
        }
        if (tok.startsWith('`') && tok.endsWith('`') && tok.length > 2) {
          const c = document.createElement('code');
          c.textContent = tok.slice(1, -1);
          el.append(c);
          continue;
        }
        el.append(document.createTextNode(tok));
      }
    };

    const lines = String(text || '').split(/\r?\n/);
    let listEl = null, tableRows = [];
    const flushList = () => { if (listEl) { container.append(listEl); listEl = null; } };
    const flushTable = () => {
      if (!tableRows.length) return;
      const tbl = document.createElement('table');
      tableRows.forEach((cells, rIdx) => {
        if (rIdx === 1 && cells.every(c => /^:?-{2,}:?$/.test(c))) return;
        const tr = document.createElement('tr');
        for (const c of cells) {
          const cell = document.createElement(rIdx === 0 ? 'th' : 'td');
          appendInline(cell, c);
          tr.append(cell);
        }
        tbl.append(tr);
      });
      container.append(tbl);
      tableRows = [];
    };

    for (const raw of lines) {
      const line = raw.trim();
      if (!line) { flushList(); flushTable(); continue; }
      if (line.startsWith('|') && line.endsWith('|')) {
        flushList();
        tableRows.push(line.slice(1, -1).split('|').map(s => s.trim()));
        continue;
      }
      flushTable();
      if (/^---+$/.test(line)) { flushList(); container.append(document.createElement('hr')); continue; }
      const hm = line.match(/^#{1,4}\s+(.+)$/);
      if (hm) {
        flushList();
        const h = document.createElement('h4');
        appendInline(h, hm[1]);
        container.append(h);
        continue;
      }
      const ulm = line.match(/^[-*•]\s+(.+)$/);
      if (ulm) {
        if (!listEl || listEl.tagName !== 'UL') { flushList(); listEl = document.createElement('ul'); }
        const li = document.createElement('li');
        appendInline(li, ulm[1]);
        listEl.append(li);
        continue;
      }
      const olm = line.match(/^\d+[.、]\s+(.+)$/);
      if (olm) {
        if (!listEl || listEl.tagName !== 'OL') { flushList(); listEl = document.createElement('ol'); }
        const li = document.createElement('li');
        appendInline(li, olm[1]);
        listEl.append(li);
        continue;
      }
      flushList();
      const p = document.createElement('p');
      appendInline(p, line);
      container.append(p);
    }
    flushList();
    flushTable();
  }

  function applyAgentStageAction(action) {
    if (!action) return;
    if (action.overlay === 'path' && action.paths?.length) {
      const scene = buildPathStageScene(action, null);
      const chains = action.paths.map(p => p.artifactIds || []).filter(c => c.length >= 2);
      applyStageOverlay({
        type: 'path',
        banner: `DeepSeek 推演光轨：${action.source?.label || ''} → ${action.target?.label || ''}`,
        artifactSet: new Set(action.artifactIds || []),
        pathChains: chains,
        graphScene: scene,
      }, true);
    } else if (action.overlay === 'compare' && action.comparison) {
      applyStageOverlay({
        type: 'compare',
        banner: `DeepSeek 集合对比：${action.comparison.entityA} vs ${action.comparison.entityB}`,
        artifactSet: new Set(action.artifactIds || []),
        graphScene: buildCompareStageScene(action.comparison),
      }, true);
    } else if (action.overlay === 'predict' && action.predictions?.length) {
      applyStageOverlay({
        type: 'predict',
        banner: `DeepSeek 缺失补全：${PREDICATE_LABELS[action.targetPredicate] || ''}（${action.predictions.length} 项）`,
        artifactSet: new Set(action.artifactIds || []),
        graphScene: buildPredictStageScene(action),
      }, true);
    } else if (action.overlay === 'highlight' && action.artifactIds?.length) {
      if (action.focusKind && action.focusId) openGraph(action.focusKind, action.focusId);
      applyStageOverlay({
        type: 'highlight',
        banner: `DeepSeek 命中：${action.label || ''}（${action.artifactIds.length} 条）`,
        artifactSet: new Set(action.artifactIds),
        graphScene: null,
      }, false);
    }
  }

  async function sendAgentMessage(question) {
    rState.agentMessages.push({ role: 'user', content: question });
    $('agentInput').value = '';
    rState.agentBusy = true;
    $('agentSend').disabled = true;
    renderAgentFeed();

    try {
      const history = rState.agentMessages
        .filter(m => m.role === 'user' || (m.role === 'assistant' && !m.isError))
        .slice(-8)
        .map(m => ({ role: m.role, content: m.content }));
      const resp = await fetch('/api/kg/agent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || `请求失败（HTTP ${resp.status}）`);

      rState.agentMessages.push({
        role: 'assistant',
        content: data.answer,
        model: data.model,
        trace: data.trace || [],
        citations: data.citations || [],
        inferences: data.inferences || [],
        stageAction: data.stageAction || null,
        elapsedMs: data.elapsedMs,
      });
      if (data.stageAction) applyAgentStageAction(data.stageAction);
    } catch (err) {
      rState.agentMessages.push({
        role: 'assistant',
        isError: true,
        content: `DeepSeek Agent 暂不可用：${err?.message || err}\n提示：请通过统一服务启动（node server/atlas-server.ts），或在上方切换到「符号推演」离线模式继续推理。`,
      });
    } finally {
      rState.agentBusy = false;
      $('agentSend').disabled = false;
      renderAgentFeed();
    }
  }

  async function boot() {
    let savedTheme = 'dark';
    try { savedTheme = localStorage.getItem('atlas-theme') || 'dark'; } catch {}
    setTheme(savedTheme);

    const manifest = await loadManifest();
    G = buildGraphModel(manifest);

    // Dynamic generic book title & minimal header metadata
    const shortTitle = G.title.split('·')[0].trim() || '纹样星图';
    document.title = `${shortTitle} · 纹样星图`;
    $('brandTitle').textContent = shortTitle;
    $('brandSub').textContent = `${G.pages.length} 页 · ${G.items.length} 条 · ${G.motifs.length} 纹样`;
    $('riverHeading').textContent = shortTitle;
    $('riverSub').textContent = `${G.eras.map(e => e.name).join(' · ') || '历史长河'}`;

    bindGlobalUI();
    initRiver();
    initGraph();
    initReasoningStudio(manifest);
    applyHash();
    requestAnimationFrame(tick);
  }

  boot().catch(err => {
    document.body.innerHTML = `<div style="padding:48px;font-family:sans-serif;color:#c96a62">加载图谱失败：${esc(err?.message || err)}</div>`;
  });
})();
</script>
