          lz = Math.sin(phi * 1.5) * Math.min(48, c.haloR * 0.45);
        }
        const tx = c.tx + lx, ty = c.ty + ly, tz = c.tz + lz;
        const prev = prevNodePos.get(it.id + '|' + c.id);
        nodes.push({
          item: it,
          cluster: c,
          tx, ty, tz,
          x: prev ? prev[0] : c.tx * 0.35,
          y: prev ? prev[1] : c.ty * 0.35,
          z: prev ? prev[2] : c.tz * 0.35,
          baseR: nodeR,
          sx: 0, sy: 0, sz: 0, sr: nodeR,
        });
      });
    }

    graph.clusters = clusters;
    graph.nodes = nodes;

    if (resetCamera) {
      fitGraphCamera(prevRingOuter + 40);
    }
  }

  function fitGraphCamera(extentRadius) {
    const availW = Math.max(360, graph.w - 80);
    const availH = Math.max(320, graph.h - 170);
    const span = Math.max(240, extentRadius * 2);
    const z = Math.max(0.36, Math.min(1.18, Math.min(availW / span, availH / span)));
    graph.targetPanX = 0;
    graph.targetPanY = 10;
    graph.targetZoom = z;
    if (state.dim === '3d') {
      graph.targetYaw = -0.32;
      graph.targetPitch = 0.24;
    }
  }

  function renderGraphHud() {
    renderGraphPatternAttributes();
    const kindEl = $('focusKind');
    kindEl.textContent = KIND_LABEL[state.focusKind];
    kindEl.className = 'focus-kind ' + state.focusKind;
    $('focusLabel').textContent = state.focusId;
    const totalItems = getFocalItems(state.focusKind, state.focusId).length;
    $('focusMeta').textContent = `${totalItems} 条 · ${graph.clusters.length} 簇`;
    $('graphBack').disabled = state.history.length === 0;

    // Breadcrumb trail (last 3 steps)
    const trailEl = $('graphTrail');
    trailEl.replaceChildren();
    const recent = state.history.slice(-3);
    recent.forEach((step, idx) => {
      const sep = document.createElement('span');
      sep.textContent = '›';
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = step.id;
      b.onclick = () => {
        const cut = state.history.length - recent.length + idx;
        state.history = state.history.slice(0, cut);
        openGraph(step.kind, step.id, { clusterBy: step.clusterBy, pushHistory: false });
      };
      trailEl.append(sep, b);
    });

    // ClusterBy toggle buttons
    const cs = $('clusterSwitch');
    cs.replaceChildren();
    const clusterOptions = clusterOptionsFor(state.focusKind);
    for (const [val, lbl] of clusterOptions.filter(([kind]) => !Object.hasOwn(EXTRA_DIMENSIONS, kind))) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = lbl;
      b.setAttribute('aria-pressed', String(state.clusterBy === val));
      b.onclick = () => {
        if (state.clusterBy === val) return;
        state.clusterBy = val;
        rebuildGraphScene(true);
        renderGraphHud();
        syncHash();
      };
      cs.append(b);
    }
    const extraOptions = clusterOptions.filter(([kind]) => Object.hasOwn(EXTRA_DIMENSIONS, kind));
    if (extraOptions.length) {
      const select = document.createElement('select'); select.id = 'clusterExtraDimension';
      select.className = 'type-filter'; select.setAttribute('aria-label', '其他聚类维度');
      const placeholder = document.createElement('option'); placeholder.value = ''; placeholder.textContent = '更多聚类';
      select.append(placeholder);
      for (const [kind, label] of extraOptions) {
        const option = document.createElement('option'); option.value = kind; option.textContent = label; select.append(option);
      }
      select.value = Object.hasOwn(EXTRA_DIMENSIONS, state.clusterBy) ? state.clusterBy : '';
      select.onchange = () => {
        if (!select.value) return;
        state.clusterBy = select.value; rebuildGraphScene(true); renderGraphHud(); syncHash();
      };
      cs.append(select);
    }

    // 2D / 3D toggle
    $('dimSwitch').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.dim === state.dim));
    });

    $('toggleUnlabeled').setAttribute('aria-pressed', String(state.showUnlabeled));

    // Bottom quick cluster chips (click to pivot directly into that cluster's graph!)
    const strip = $('clusterStrip');
    strip.replaceChildren();
    const stripLbl = document.createElement('span');
    stripLbl.className = 'dock-label';
    stripLbl.textContent = KIND_LABEL[state.clusterBy] + '簇';
    strip.append(stripLbl);

    for (const c of graph.clusters) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      const col = colorFor(c.kind, c.name);
      b.innerHTML = `<span class="dot" style="background:${col}"></span><span>${esc(c.name)}</span><span class="num">${c.items.length}</span>`;
      b.onmouseenter = () => { graph.hoveredCluster = c; };
      b.onmouseleave = () => { if (graph.hoveredCluster === c) graph.hoveredCluster = null; };
      b.onclick = () => {
        if (!c.isUnlabeled) openGraph(c.kind, c.id);
      };
      if (c.isUnlabeled) b.style.opacity = '0.62';
      strip.append(b);
    }
  }

  function projectPoint(x, y, z) {
    const cx = graph.w * 0.5 + graph.panX;
    const cy = graph.h * 0.52 + graph.panY;
    if (state.dim === '2d') {
      return { x: cx + x * graph.zoom, y: cy + y * graph.zoom, z: 0, k: graph.zoom };
    }
    const cyaw = Math.cos(graph.yaw), syaw = Math.sin(graph.yaw);
    const cp = Math.cos(graph.pitch), sp = Math.sin(graph.pitch);
    const rx = x * cyaw + z * syaw;
    const rz1 = z * cyaw - x * syaw;
    const ry = y * cp - rz1 * sp;
    const depth = y * sp + rz1 * cp;
    const camD = 980;
    const persp = camD / Math.max(180, camD - depth);
    const k = graph.zoom * persp;
    return { x: cx + rx * k, y: cy + ry * k, z: depth, k };
  }

  function bindGraphEvents() {
    const c = graph.canvas;
    c.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      graph.dragging = true;
      graph.dragMoved = false;
      graph.dragSX = e.clientX;
      graph.dragSY = e.clientY;
      graph.velYaw = 0; graph.velPitch = 0;
      c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', e => {
      if (graph.dragging) {
        const dx = e.clientX - graph.dragSX;
        const dy = e.clientY - graph.dragSY;
        if (Math.hypot(dx, dy) > 4) graph.dragMoved = true;
        if (state.dim === '3d') {
          graph.targetYaw += dx * 0.0065;
          graph.targetPitch = Math.max(-1.15, Math.min(1.15, graph.targetPitch - dy * 0.006));
          graph.velYaw = dx * 0.002;
          graph.velPitch = -dy * 0.0018;
        } else {
          graph.targetPanX += dx;
          graph.targetPanY += dy;
        }
        graph.dragSX = e.clientX;
        graph.dragSY = e.clientY;
        hideTip();
        return;
      }
      graph.pendingPointer = { x: e.clientX, y: e.clientY };
    });
    c.addEventListener('pointerup', e => {
      if (!graph.dragging) return;
      graph.dragging = false;
      if (!graph.dragMoved) {
        graph.pendingPointer = null;
        hitTestGraph(e.clientX, e.clientY);
        if (stageOverlay?.graphScene) {
          const hit = stageOverlay.hoveredNode;
          if (hit) {
            if (hit.onActivate) hit.onActivate();
            else if (hit.artifactId) openDrawer(hit.artifactId);
            else if (Object.hasOwn(DIMENSIONS, hit.kind) && !hit.isOntology) {
              clearStageOverlay();
              openGraph(hit.kind, hit.label);
            }
          } else {
            closeDrawer();
          }
          return;
        }
        if (graph.hoveredNode) {
          openDrawer(graph.hoveredNode.item.id);
        } else if (graph.hoveredCluster && !graph.hoveredCluster.isUnlabeled) {
          // One-click pivot from any cluster hub into its own clustered 2D/3D graph!
          openGraph(graph.hoveredCluster.kind, graph.hoveredCluster.id);
        } else {
          closeDrawer();
        }
      }
    });
    c.addEventListener('pointerleave', () => {
      graph.pendingPointer = null;
      graph.hoveredNode = null;
      graph.hoveredCluster = null;
      if (stageOverlay) stageOverlay.hoveredNode = null;
      hideTip();
    });
    c.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      graph.targetZoom = Math.max(0.28, Math.min(3.2, graph.targetZoom * factor));
    }, { passive: false });
    c.addEventListener('dblclick', () => {
      if (!graph.hoveredNode && !graph.hoveredCluster) {
        const maxR = stageOverlay?.graphScene
          ? (stageOverlay.graphScene.extent || 360)
          : Math.max(240, ...graph.clusters.map(cl => (cl.orbitR || 200) + cl.haloR));
        fitGraphCamera(maxR + 30);
      }
    });
  }

  function hitTestGraph(mx, my) {
    // Dedicated Reasoning Overlay Stage hit-testing (works in both 2D & 3D!)
    if (stageOverlay?.graphScene) {
      let best = null, bestZ = -Infinity;
      for (const n of stageOverlay.graphScene.nodes) {
        const d = Math.hypot(mx - n.sx, my - n.sy);
        if (d <= n.sr + 6 && n.sz >= bestZ) { best = n; bestZ = n.sz; }
      }
      stageOverlay.hoveredNode = best;
      graph.canvas.classList.toggle('pointer', Boolean(best));
      if (best) {
        const tags = [];
        if (best.roleTag) tags.push(`<span class="tip-tag">${esc(best.roleTag)}</span>`);
        if (best.sub) tags.push(`<span class="tip-tag">${esc(best.sub)}</span>`);
        const hint = best.hint || (best.artifactId ? '点击查看原书扫描图与红框证据' : (best.isOntology ? 'RDFS 本体抽象类节点' : '点击进入该实体的聚类图谱 →'));
        showTip(mx, my, `<strong>${esc(best.label)}</strong>${tags.length ? `<div class="tip-tags">${tags.join('')}</div>` : ''}<div class="tip-hint">${hint}</div>`);
      } else {
        hideTip();
      }
      return;
    }

    // 1) Check specimen nodes front-to-back (highest z first)
    let hitNode = null, bestZ = -Infinity;
    for (const n of graph.nodes) {
      if (!n.visible) continue;
      const d = Math.hypot(mx - n.sx, my - n.sy);
      if (d <= n.sr + 4 && n.sz >= bestZ) { hitNode = n; bestZ = n.sz; }
    }
    graph.hoveredNode = hitNode;

    // 2) Check cluster hubs & clickable cluster label pills
    let hitCluster = null;
    if (!hitNode) {
      let bestCZ = -Infinity;
      for (const c of graph.clusters) {
        if (!c.visible) continue;
        const dHub = Math.hypot(mx - c.sx, my - c.sy);
        const inPill = c._labelBox && mx >= c._labelBox[0] && mx <= c._labelBox[2] && my >= c._labelBox[1] && my <= c._labelBox[3];
        if ((dHub <= c.sr + 6 || inPill) && c.sz >= bestCZ) {
          hitCluster = c; bestCZ = c.sz;
        }
      }
    }
    graph.hoveredCluster = hitCluster;
    graph.canvas.classList.toggle('pointer', Boolean(hitNode || (hitCluster && !hitCluster.isUnlabeled)));

    if (hitNode) {
      const it = hitNode.item;
      const tags = [
        ...it.periods.map(p => `<span class="tip-tag">${esc(p)}</span>`),
        ...it.materials.map(m => `<span class="tip-tag">${esc(m)}</span>`),
        ...it.motifs.slice(0, 3).map(m => `<span class="tip-tag">${esc(m)}</span>`),
      ];
      showTip(mx, my, `<strong>${esc(it.title)}</strong><div class="tip-tags">${tags.join('')}</div><div class="tip-hint">点击查看详情、原页证据与快捷跳转</div>`);
    } else if (hitCluster) {
      const nextDefault = defaultClusterFor(hitCluster.kind);
      const hint = hitCluster.isUnlabeled
        ? '该条目在原数据中尚未标注此属性'
        : `点击进入「${esc(hitCluster.name)}」图谱（默认按${KIND_LABEL[nextDefault]}聚类）→`;
      const properties = hitCluster.kind === 'motif' ? getPatternAttributes(hitCluster.name) : [];
      const propertyTags = properties.map(p => `<span class="tip-tag">${p.label} · ${esc(p.value)}</span>`).join('');
      showTip(mx, my, `<strong>${esc(hitCluster.name)}</strong><div class="tip-tags"><span class="tip-tag">${KIND_LABEL[hitCluster.kind]}聚类</span><span class="tip-tag">${hitCluster.items.length} 条</span>${propertyTags}</div><div class="tip-hint">${hint}</div>`);
    } else {
      hideTip();
    }
  }

  function drawGraph(timeSec) {
    const { ctx, w, h, dpr } = graph;
    if (!w || !h || !graph.core) return;

    // Smooth camera & inertia
    graph.panX += (graph.targetPanX - graph.panX) * 0.14;
    graph.panY += (graph.targetPanY - graph.panY) * 0.14;
    graph.zoom += (graph.targetZoom - graph.zoom) * 0.14;
    if (state.dim === '3d') {
      if (!graph.dragging) {
        graph.targetYaw += graph.velYaw;
        graph.targetPitch = Math.max(-1.15, Math.min(1.15, graph.targetPitch + graph.velPitch));
        graph.velYaw *= 0.92;
        graph.velPitch *= 0.92;
      }
      graph.yaw += (graph.targetYaw - graph.yaw) * 0.14;
      graph.pitch += (graph.targetPitch - graph.pitch) * 0.14;
    }

    // Spring-morph cluster and node coordinates
    if (!stageOverlay?.graphScene) {
      for (const c of graph.clusters) {
        c.x += (c.tx - c.x) * 0.15;
        c.y += (c.ty - c.y) * 0.15;
        c.z += (c.tz - c.z) * 0.15;
      }
      for (const n of graph.nodes) {
        n.x += (n.tx - n.x) * 0.15;
        n.y += (n.ty - n.y) * 0.15;
        n.z += (n.tz - n.z) * 0.15;
      }
    }

    const dark = currentTheme() === 'dark';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    paintBackdrop(ctx, graph, dark, 'graph');

    // If a dedicated Reasoning Overlay Scene (path / compare / predict) is active, render it in full 2D/3D!
    if (stageOverlay?.graphScene) {
      drawReasoningStage(ctx, stageOverlay.graphScene, dark, timeSec);
      return;
    }

    // 2) Project core, clusters, and nodes
    const coreP = projectPoint(0, 0, 0);
    graph.core.sx = coreP.x; graph.core.sy = coreP.y; graph.core.sr = graph.core.r * coreP.k;

    const ringRadii = [...new Set(graph.clusters.map(c => Math.round(c.orbitR || 0)))].filter(Boolean);

    // 3) Subtle Celestial Orbital Guide Rings
    for (const rr of ringRadii) {
      ctx.beginPath();
      const segs = 90;
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        const p = projectPoint(Math.cos(a) * rr, Math.sin(a) * rr, 0);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = dark ? 'rgba(239,236,228,0.065)' : 'rgba(30,28,25,0.075)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 7]);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    const activeCluster = graph.hoveredCluster || graph.hoveredNode?.cluster || null;
    const selectedItemId = graph.hoveredNode?.item.id || state.drawerItemId;
    const coreCol = colorFor(graph.core.kind, graph.core.name);

    for (const c of graph.clusters) {
      const p = projectPoint(c.x, c.y, c.z);
      c.sx = p.x; c.sy = p.y; c.sz = p.z; c.sk = p.k;
      c.sr = c.hubR * p.k;
      c.haloSr = c.haloR * p.k;
      c.visible = inViewport(c.sx, c.sy, c.haloSr + 40, w, h);
    }

    // Paint only halos intersecting the viewport; retain every cluster in the model.
    const sortedClusters = graph.clusters.filter(c => c.visible);
    if (state.dim === '3d') sortedClusters.sort((a, b) => a.sz - b.sz);
    for (const c of sortedClusters) {
      const col = colorFor(c.kind, c.name);
      const isAct = activeCluster === c;
      const dimAlpha = activeCluster && !isAct ? 0.30 : 1;
      const depthFade = state.dim === '3d' ? Math.max(0.32, Math.min(1, (c.sz + 520) / 720)) : 1;
      const alpha = dimAlpha * depthFade;
      const hg = ctx.createRadialGradient(c.sx, c.sy, c.sr * .5, c.sx, c.sy, c.haloSr);
      hg.addColorStop(0, hexAlpha(col, (dark ? .14 : .09) * alpha * (isAct ? 1.55 : 1)));
      hg.addColorStop(.75, hexAlpha(col, (dark ? .045 : .03) * alpha));
      hg.addColorStop(1, hexAlpha(col, 0));
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(c.sx, c.sy, c.haloSr, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(c.sx, c.sy, c.haloSr, 0, Math.PI * 2);
      ctx.strokeStyle = hexAlpha(col, (isAct ? .55 : .22) * alpha);
      ctx.lineWidth = isAct ? 1.3 : .85;
      ctx.setLineDash(c.isUnlabeled ? [2, 5] : [4, 5]); ctx.stroke(); ctx.setLineDash([]);
    }

    // Batch filaments by paint style, including visible portions of offscreen spokes.
    const filaments = new Map();
    const filament = (col, alpha, width) => {
      const key = `${col}:${alpha}:${width}`;
      let batch = filaments.get(key);
      if (!batch) {
        batch = { path: new Path2D(), col, alpha, width };
        filaments.set(key, batch);
      }
      return batch.path;
    };
    for (const c of graph.clusters) {
      // Dense overviews show spokes to visible hubs; panning restores the rest.
      if (graph.clusters.length > 80 && !c.visible) continue;
      if (!lineInViewport(coreP.x, coreP.y, c.sx, c.sy, w, h)) continue;
      const col = colorFor(c.kind, c.name), isAct = activeCluster === c;
      const depth = state.dim === '3d' ? Math.round(Math.max(.32, Math.min(1, (c.sz + 520) / 720)) * 8) / 8 : 1;
      const alpha = (isAct ? .72 : .28) * (activeCluster && !isAct ? .30 : 1) * depth;
      const path = filament(col, alpha, isAct ? 1.65 : 1);
      path.moveTo(coreP.x, coreP.y);
      path.quadraticCurveTo((coreP.x + c.sx) * .5 - (c.sy - coreP.y) * .09,
        (coreP.y + c.sy) * .5 + (c.sx - coreP.x) * .09, c.sx, c.sy);
    }
    for (const n of graph.nodes) {
      const p = projectPoint(n.x, n.y, n.z);
      n.sx = p.x; n.sy = p.y; n.sz = p.z; n.sk = p.k; n.sr = n.baseR * p.k;
      n.visible = inViewport(n.sx, n.sy, Math.max(5, n.sr) * 2.5 + 20, w, h);
      const c = n.cluster;
      if (!lineInViewport(c.sx, c.sy, n.sx, n.sy, w, h)) continue;
      const isAct = activeCluster === c || n.item.id === selectedItemId;
      const depth = state.dim === '3d' ? Math.round(Math.max(.28, Math.min(1, (n.sz + 520) / 720)) * 8) / 8 : 1;
      const alpha = (isAct ? .45 : .18) * (activeCluster && !isAct ? .22 : 1) * depth;
      const path = filament(colorFor(c.kind, c.name), alpha, isAct ? 1.15 : .75);
      path.moveTo(c.sx, c.sy); path.lineTo(n.sx, n.sy);
    }
    for (const batch of filaments.values()) {
      ctx.strokeStyle = hexAlpha(batch.col, batch.alpha); ctx.lineWidth = batch.width;
      ctx.stroke(batch.path);
    }

    // Cache semantic neighbors until the hovered specimen changes.
    if (graph.hoveredNode) {
      const hn = graph.hoveredNode;
      if (graph.linkHover !== hn) {
        const motifs = new Set(hn.item.motifs);
        graph.hoverLinks = graph.nodes.filter(n => n !== hn && n.cluster !== hn.cluster
          && (n.item.id === hn.item.id || n.item.motifs.some(m => motifs.has(m))));
        graph.linkHover = hn;
      }
      ctx.beginPath();
      for (const n of graph.hoverLinks) {
        ctx.moveTo(hn.sx, hn.sy);
        ctx.quadraticCurveTo(coreP.x, coreP.y, n.sx, n.sy);
      }
      ctx.strokeStyle = dark ? 'rgba(216,179,119,0.48)' : 'rgba(143,78,50,0.42)';
      ctx.lineWidth = 1.2; ctx.setLineDash([3, 4]); ctx.stroke(); ctx.setLineDash([]);
    }

    // 6) Depth-sorted paint pass: Core + Cluster Hubs + Specimen Medallions
    const drawables = [];
    drawables.push({ type: 'core', z: coreP.z });
    for (const c of sortedClusters) drawables.push({ type: 'cluster', z: c.sz + 0.5, obj: c });
    for (const n of graph.nodes.filter(n => n.visible)) drawables.push({ type: 'node', z: n.sz + (n.item.id === selectedItemId ? 40 : 0), obj: n });
    drawables.sort((a, b) => a.z - b.z);

    for (const d of drawables) {
      if (d.type === 'core') {
        drawCoreHub(ctx, graph.core, coreCol, dark, timeSec);
      } else if (d.type === 'cluster') {
        drawClusterHub(ctx, d.obj, activeCluster, dark);
      } else {
        drawSpecimenNode(ctx, d.obj, activeCluster, selectedItemId, dark);
      }
    }
  }

  function drawCoreHub(ctx, core, col, dark, timeSec) {
    const r = core.sr;
    const pulse = 1 + 0.04 * Math.sin(timeSec * 1.8);

    // Majestic outer celestial aura
    const glow = ctx.createRadialGradient(core.sx, core.sy, r * 0.6, core.sx, core.sy, r * 2.5 * pulse);
    glow.addColorStop(0, hexAlpha(col, dark ? 0.34 : 0.20));
    glow.addColorStop(0.5, hexAlpha(col, dark ? 0.10 : 0.06));
    glow.addColorStop(1, hexAlpha(col, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(core.sx, core.sy, r * 2.5 * pulse, 0, Math.PI * 2);
    ctx.fill();

    // Decorative outer astronomical ring
    ctx.beginPath();
    ctx.arc(core.sx, core.sy, r + 6, 0, Math.PI * 2);
    ctx.strokeStyle = hexAlpha(col, 0.45);
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Core disc
    const sp = getSprite(core.thumbUrl);
    const bmp = spriteBitmap(sp, dark);
    if (bmp && core.kind === 'motif') {
      paintSprite(ctx, sp, bmp, core.sx, core.sy, r);
      ctx.fillStyle = dark ? 'rgba(9,11,16,0.45)' : 'rgba(250,248,243,0.48)';
      ctx.beginPath();
      ctx.arc(core.sx, core.sy, r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const dg = ctx.createRadialGradient(core.sx - r * 0.25, core.sy - r * 0.25, 2, core.sx, core.sy, r);
      if (dark) {
        dg.addColorStop(0, hexAlpha(col, 0.36));
        dg.addColorStop(1, '#12151f');
      } else {
        dg.addColorStop(0, '#ffffff');
        dg.addColorStop(1, hexAlpha(col, 0.16));
      }
      ctx.fillStyle = dg;
      ctx.beginPath();
      ctx.arc(core.sx, core.sy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(core.sx, core.sy, r, 0, Math.PI * 2);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Core serif label inside disc
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const fs = Math.max(12, Math.min(18, r * 0.38));
    ctx.font = `600 ${fs}px "Noto Serif SC","Songti SC",serif`;
    ctx.fillStyle = dark ? '#faf5ea' : '#1e1c19';
    const shortName = core.name.length > 6 ? core.name.slice(0, 6) + '…' : core.name;
    ctx.fillText(shortName, core.sx, core.sy - 4);
    ctx.font = `500 ${Math.max(9, fs * 0.58)}px ui-monospace,monospace`;
    ctx.fillStyle = col;
    ctx.fillText(`${KIND_LABEL[core.kind]} · ${core.count}`, core.sx, core.sy + fs * 0.72);
    ctx.textBaseline = 'alphabetic';
  }

  function drawClusterHub(ctx, c, activeCluster, dark) {
    const col = colorFor(c.kind, c.name);
    const isAct = activeCluster === c;
    const dimAlpha = activeCluster && !isAct ? 0.32 : 1;
    const depthFade = state.dim === '3d' ? Math.max(0.32, Math.min(1, (c.sz + 520) / 720)) : 1;
    const alpha = dimAlpha * depthFade;
    const r = Math.max(8, c.sr * (isAct ? 1.16 : 1));

    ctx.save();
    ctx.globalAlpha = alpha;

    // Hub glow
    if (isAct || dark) {
      const g = ctx.createRadialGradient(c.sx, c.sy, 2, c.sx, c.sy, r * 2.1);
      g.addColorStop(0, hexAlpha(col, isAct ? 0.45 : 0.22));
      g.addColorStop(1, hexAlpha(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(c.sx, c.sy, r * 2.1, 0, Math.PI * 2);
      ctx.fill();
    }

    // Hub medallion circle
    ctx.fillStyle = dark ? '#131722' : '#fcfaf5';
    ctx.beginPath();
    ctx.arc(c.sx, c.sy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = isAct ? 2.2 : 1.5;
    ctx.stroke();

    // Count inside hub
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `600 ${Math.max(10, Math.min(13, r * 0.62))}px ui-monospace,monospace`;
    ctx.fillStyle = col;
    ctx.fillText(String(c.items.length), c.sx, c.sy + 0.5);

    if (graph.clusters.length > 80 && c.sr < 8 && !isAct) {
      c._labelBox = null;
      ctx.restore();
      return;
    }

    // Clean clickable Cluster Label Pill outside top edge of cluster halo
    const labelText = c.name + (c.hiddenCount > 0 ? ` (+${c.hiddenCount})` : '');
    const ly = c.sy - c.haloSr - 12;
    ctx.font = `600 12.5px "Noto Serif SC","Songti SC",serif`;
    const tw = ctx.measureText(labelText).width;
    const pw = tw + 18, ph = 22;
    const px = c.sx - pw * 0.5, py = ly - ph * 0.5;
    c._labelBox = [px, py, px + pw, py + ph];

    ctx.fillStyle = isAct
      ? hexAlpha(col, dark ? 0.28 : 0.16)
      : (dark ? 'rgba(13,16,24,0.82)' : 'rgba(252,250,245,0.92)');
    roundRect(ctx, px, py, pw, ph, 11);
    ctx.fill();
    ctx.strokeStyle = hexAlpha(col, isAct ? 0.92 : 0.42);
    ctx.lineWidth = isAct ? 1.3 : 0.9;
    ctx.stroke();

    ctx.fillStyle = isAct ? (dark ? '#fff7e8' : col) : (dark ? '#efece4' : '#211e1a');
    ctx.fillText(labelText, c.sx, ly + 0.5);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  function drawSpecimenNode(ctx, n, activeCluster, selectedItemId, dark) {
    const it = n.item;
    const col = colorFor(n.cluster.kind, n.cluster.name);
    const isSel = it.id === selectedItemId || Boolean(stageOverlay?.artifactSet?.has(it.id));
    const isAct = isSel || activeCluster === n.cluster;
    const dimAlpha = (activeCluster || stageOverlay?.artifactSet) && !isAct ? 0.22 : 1;
    const depthFade = state.dim === '3d' ? Math.max(0.28, Math.min(1, (n.sz + 520) / 720)) : 1;
    const r = Math.max(5, n.sr * (isSel ? 1.24 : 1));

    // Small overview nodes stay interactive; thumbnails appear on zoom/focus.
    if (!isSel && !isAct && r < 8) {
      ctx.globalAlpha = dimAlpha * depthFade;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }

    ctx.save();
    ctx.globalAlpha = dimAlpha * depthFade;

    if (isSel) {
      const g = ctx.createRadialGradient(n.sx, n.sy, r * 0.6, n.sx, n.sy, r * 2.1);
      g.addColorStop(0, hexAlpha(col, 0.48));
      g.addColorStop(1, hexAlpha(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r * 2.1, 0, Math.PI * 2);
      ctx.fill();
    }

    const sp = getSprite(it.thumbUrl);
    const bmp = spriteBitmap(sp, dark);
    if (bmp) {
      paintSprite(ctx, sp, bmp, n.sx, n.sy, r);
    } else {
      ctx.fillStyle = dark ? '#1a1f2c' : '#ece7dc';
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
    ctx.strokeStyle = isSel ? (dark ? '#f7e1b5' : '#8f4e32') : hexAlpha(col, isAct ? 0.82 : 0.50);
    ctx.lineWidth = isSel ? 2.2 : 1.15;
    ctx.stroke();

    // Concise label beneath node only when selected, hovered cluster, or zoomed closely
    if (isSel || (activeCluster === n.cluster && r >= 13) || r >= 22) {
      const lbl = (it.motifs[0] && state.clusterBy !== 'motif' && state.focusKind !== 'motif')
        ? it.motifs[0]
        : (it.title.length > 9 ? it.title.slice(0, 8) + '…' : it.title);
      ctx.font = `500 10.5px ${canvasFont()}`;
      ctx.textAlign = 'center';
      ctx.fillStyle = dark ? 'rgba(239,236,228,0.88)' : 'rgba(30,28,25,0.85)';
      ctx.fillText(lbl, n.sx, n.sy + r + 13);
    }
    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ═══════════════════════════════════════════════════════════════
     7. VIEW 3 — MUSEO Morandi Grid Catalog
     ═══════════════════════════════════════════════════════════════ */
  function renderCatalog() {
    const interpretations = state.catalogTab === 'interpretation';
    $('interpretationTools').hidden = !interpretations;
    $('catalogSpecimens').hidden = interpretations;
    $('catalogTabs').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.cat === state.catalogTab));
    });
    $('catalogExtraDimension').value = interpretations ? 'interpretation' : Object.hasOwn(EXTRA_DIMENSIONS, state.catalogTab) ? state.catalogTab : '';
    if (interpretations) { renderInterpretations(); return; }

    const list = dimensionEntries(state.catalogTab);
    const nextClusterLabel = KIND_LABEL[defaultClusterFor(state.catalogTab)];
    $('catalogTitle').textContent = `${KIND_LABEL[state.catalogTab]}图录`;

    const grid = $('catalogGrid');
    grid.replaceChildren();

    for (const ent of list) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'entity-card';
      const col = colorFor(state.catalogTab, ent.name);
      card.style.setProperty('--card-tint', col);

      // Compute top sub-attribute summary chips (e.g. top materials inside an era, top motifs inside a material)
      const subCounts = new Map();
      const subKind = defaultClusterFor(state.catalogTab);
      for (const it of ent.items) {
        const vals = dimensionValues(it, subKind);
        for (const v of vals) subCounts.set(v, (subCounts.get(v) || 0) + 1);
      }
      const topSubs = [...subCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);

      const thumbsHtml = ent.items.slice(0, 4).map(it =>
        `<img src="${esc(it.thumbUrl)}" alt="" loading="lazy">`
      ).join('');

      card.innerHTML = `
        <div class="entity-card-top">
          <h3>${esc(ent.name)}</h3>
          <span class="entity-count">${ent.count}</span>
        </div>
        <div class="entity-thumbs">${thumbsHtml}</div>
        <div class="entity-subchips">${topSubs.map(([k, v]) => `<span>${esc(k)} ${v}</span>`).join('') || '<span>图录条目</span>'}</div>
        <div class="entity-cta">
          <span>按${nextClusterLabel}聚类查看</span>
          <span>2D / 3D ↗</span>
        </div>
      `;
      card.onclick = () => openGraph(state.catalogTab, ent.id);
      grid.append(card);
    }

    populateTypeFilter($('specimenTypeFilter'), state.catalogTypeFilter);
    renderSpecimenGrid();
  }

  function openInterpretations(query = '') {
    closeDrawer();
    state.catalogTab = 'interpretation';
    $('interpretationSearch').value = query;
    $('interpretationKind').value = '';
    switchView('catalog');
  }

  function renderInterpretations() {
    $('catalogTitle').textContent = '文献关系';
    const query = $('interpretationSearch').value.trim().toLowerCase();
    const kind = $('interpretationKind').value;
    const entries = G.interpretations.filter(record => (!kind || record.kind === kind)
      && (!query || [record.subject.label, record.value, record.text].join(' ').toLowerCase().includes(query)));
    $('interpretationCount').textContent = `${entries.length} 条文献解释`;
    const cards = entries.map(record => {
      const card = document.createElement('article'); card.className = 'interpretation-card';
      card.dataset.interpretationId = record.id;
      const title = document.createElement('h3'); title.textContent = `${record.subject.label} → ${record.value}`;
      const source = document.createElement('span'); source.className = 'source-label';
      source.textContent = `${record.relationLabel} · ${record.locator}`;
      if (record.context) {
        const context = record.context;
        const scope = [...(context.cultures || []), ...(context.periods || []), ...(context.usages || [])];
        if (context.certainty === 'hypothesis') scope.push(`推测${context.certaintyMarkers?.length ? '（'+context.certaintyMarkers.join('、')+'）' : ''}`);
        if (scope.length) source.textContent += ` · ${scope.join(' · ')}`;
      }
      const proof = document.createElement('details');
      const summary = document.createElement('summary'); summary.textContent = '原文';
      const quote = document.createElement('p'); quote.textContent = record.text;
      proof.append(summary, quote);
      const actions = document.createElement('div'); actions.className = 'dock-group';
      const original = document.createElement('button'); original.type = 'button'; original.className = 'chip'; original.textContent = '查看原页';
      original.onclick = () => { clearStageOverlay(); state.currentPage = record.page; switchView('pages'); };
      const graphButton = document.createElement('button'); graphButton.type = 'button'; graphButton.className = 'chip'; graphButton.textContent = '查看关系';
      if (['symbolism', 'belief'].includes(record.kind)) graphButton.textContent = '查看属性';
      graphButton.onclick = () => showInterpretationGraph(record);
      actions.append(graphButton, original); card.append(title, source, proof, actions);
      return card;
    });
    if (!cards.length) { const empty = document.createElement('p'); empty.textContent = '暂无匹配的文献解释'; cards.push(empty); }
    $('catalogGrid').replaceChildren(...cards);
  }

  function showInterpretationGraph(record) {
    if (['symbolism', 'belief'].includes(record.kind)) {
      openPatternAttributes(record.subject.label, record.kind + ':' + patternAttributeKey(record.value, false));
      return;
    }
    const makeNode = (key, label, kind, x, color) => ({ key, label, kind, roleTag: record.relationLabel,
      sub: record.locator, x, y: 0, z: 0, tx: x, ty: 0, tz: 0, baseR: 36, color, sx: 0, sy: 0, sz: 0, sr: 36 });
    const subject = makeNode(`${record.subject.kind}:${record.subject.label}`, record.subject.label, record.subject.kind, -170, '#d48263');
    const valueKind = ({ symbolism: 'meaning', belief: 'belief', ritual: 'ritual', technique: 'technique', composition: 'composition' })[record.kind] || 'meaning';
    const meaning = makeNode(`${valueKind}:${record.value}`, record.value, valueKind, 170, '#74ad99');
    subject.hint = '点击浏览该对象的文献解释'; subject.onActivate = () => openInterpretations(record.subject.label);
    meaning.hint = '点击浏览相关文献关系'; meaning.onActivate = () => openInterpretations(record.value);
    applyStageOverlay({ type: 'interpretation', banner: `${record.subject.label} → ${record.value} · ${record.locator}`,
      graphScene: { kind: 'interpretation', nodes: [subject, meaning],
        edges: [{ from: subject, to: meaning, label: record.relationLabel, dashed: false, color: '#e2ba74', phase: 0 }], extent: 320 } }, true);
  }

  function renderSpecimenGrid() {
    const pageSize = 24;
    const filteredItems = G.items.filter(item => matchesArtifactType(item, state.catalogTypeFilter));
    const total = filteredItems.length;
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    state.catalogPage = Math.max(0, Math.min(totalPages - 1, state.catalogPage));
    const slice = filteredItems.slice(state.catalogPage * pageSize, (state.catalogPage + 1) * pageSize);

    const filterLabel = state.catalogTypeFilter === '__untyped__' ? '未标器类' : state.catalogTypeFilter;
    $('specimenHeading').textContent = `${filterLabel || '全部条目'} · ${total}`;
    const pager = $('specimenPager');
    pager.replaceChildren();
    if (totalPages > 1) {
      const prev = document.createElement('button');
      prev.type = 'button'; prev.className = 'chip'; prev.textContent = '‹';
      prev.disabled = state.catalogPage === 0;
      prev.onclick = () => { state.catalogPage--; renderSpecimenGrid(); };
      const info = document.createElement('span');
      info.className = 'dock-label';
      info.textContent = `${state.catalogPage + 1} / ${totalPages}`;
      const next = document.createElement('button');
      next.type = 'button'; next.className = 'chip'; next.textContent = '›';
      next.disabled = state.catalogPage >= totalPages - 1;
      next.onclick = () => { state.catalogPage++; renderSpecimenGrid(); };
      pager.append(prev, info, next);
    }

    const sg = $('specimenGrid');
    sg.replaceChildren();
    for (const it of slice) {
      const card = document.createElement('article');
      card.className = 'spec-card';

      const wrap = document.createElement('div');
      wrap.className = 'spec-img-wrap';
      wrap.onclick = () => openDrawer(it.id);
      const im = document.createElement('img');
      im.src = it.thumbUrl;
      im.alt = it.title;
      im.loading = 'lazy';
      wrap.append(im);

      const body = document.createElement('div');
      body.className = 'spec-body';
      const title = document.createElement('div');
      title.className = 'spec-title';
      title.textContent = it.title;
      title.onclick = () => openDrawer(it.id);

      const tags = document.createElement('div');
      tags.className = 'spec-tags';
      for (const type of it.artifactTypes) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = type;
        b.title = '器类';
        b.onclick = () => openGraph('artifact_type', type);
        tags.append(b);
      }
      for (const e of it.eraGroups.slice(0, 1)) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = e;
        b.onclick = () => openGraph('era', e);
        tags.append(b);
      }
      for (const m of it.materials.slice(0, 1)) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = m;
        b.onclick = () => openGraph('material', m);
        tags.append(b);
      }
      for (const mo of it.motifs.slice(0, 2)) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = mo;
        b.onclick = () => openGraph('motif', mo);
        tags.append(b);
      }
      body.append(title, tags);
      card.append(wrap, body);
      sg.append(card);
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     8. VIEW 4 — Original PDF Pages with BBox & Graph Jumps
     ═══════════════════════════════════════════════════════════════ */
  function renderPage(num, focusItemId = null) {
    const total = G.pages.length;
    state.currentPage = Math.max(1, Math.min(total, Number(num) || 1));
    const pageObj = G.pages[state.currentPage - 1];
    const volumePages = G.pagesByVolume.get(pageObj?.volume || '') || G.pages;
    const localMax = Math.max(...volumePages.map(p => p.volumePage || p.page));
    $('pageTitle').textContent = `原页 · ${sourcePageLabel(pageObj || { page: state.currentPage })}`;
    $('pageVolume').value = pageObj?.volume || '';
    $('pageInput').value = pageObj?.volumePage || state.currentPage;
    $('pageInput').max = localMax;
    $('pageTotal').textContent = `/ ${localMax}`;
    $('prevPage').disabled = state.currentPage <= 1;
    $('nextPage').disabled = state.currentPage >= total;
    $('pageScan').src = pageObj?.previewUrl || '';
    $('pageBbox').hidden = true;

    const list = G.sourceItems.filter(it => it.page === state.currentPage);
    const box = $('pageItems');
    box.replaceChildren();

    if (!list.length) {
      const empty = document.createElement('p');
      empty.style.color = 'var(--ink-3)';
      empty.textContent = '本页暂无提取条目';
      box.append(empty);
      return;
    }

    const selectItem = (it, cardEl) => {
      state.activePageItemId = it.id;
      box.querySelectorAll('.page-item-card').forEach(el => el.classList.toggle('active', el === cardEl));
      if (it.bbox) {
        const [x1, y1, x2, y2] = it.bbox;
        Object.assign($('pageBbox').style, {
          left: (x1 * 100) + '%', top: (y1 * 100) + '%',
          width: ((x2 - x1) * 100) + '%', height: ((y2 - y1) * 100) + '%',
        });
        $('pageBbox').hidden = false;
      } else {
        $('pageBbox').hidden = true;
      }
    };

    list.forEach((it, idx) => {
      const card = document.createElement('div');
      card.className = 'page-item-card';
      card.onclick = () => selectItem(it, card);

      const head = document.createElement('div');
      head.className = 'page-item-title';
      head.innerHTML = `<strong>${esc(it.title)}</strong><small>${esc(it.status || it.locator)}</small>`;
      const details = document.createElement('button');
      details.type = 'button'; details.className = 'mini-link'; details.textContent = '器物详情 ↗';
      details.onclick = event => { event.stopPropagation(); openDrawer(it.canonicalId, it.sourceRecordId); };
      head.append(details);
      card.append(head);

      if (it.quote) {
        const q = document.createElement('blockquote');
        q.className = 'proof-quote';
        q.textContent = it.quote;
        card.append(q);
      }

      const chips = document.createElement('div');
      chips.className = 'rel-chips';
      for (const type of it.artifactTypes) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'jump-pill artifact_type'; b.textContent = type;
        b.onclick = ev => { ev.stopPropagation(); openGraph('artifact_type', type); };
        chips.append(b);
      }
      for (const e of it.eraGroups) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'jump-pill era'; b.textContent = e;
        b.onclick = ev => { ev.stopPropagation(); openGraph('era', e); };
        chips.append(b);
      }
      for (const m of it.materials) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'jump-pill material'; b.textContent = m;
        b.onclick = ev => { ev.stopPropagation(); openGraph('material', m); };
        chips.append(b);
      }
      for (const mo of it.motifs) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'jump-pill motif'; b.textContent = mo;
        b.onclick = ev => { ev.stopPropagation(); openGraph('motif', mo); };
        chips.append(b);
      }
      if (chips.childElementCount) card.append(chips);
      box.append(card);

      if ((focusItemId && it.id === focusItemId) || (!focusItemId && idx === 0)) {
        selectItem(it, card);
      }
    });
  }

  /* ═══════════════════════════════════════════════════════════════
     9. Specimen & Proof Drawer + Entity Switcher + Command Palette
     ═══════════════════════════════════════════════════════════════ */
  function openDrawer(itemId, sourceRecordId = null) {
    const canonical = G.itemById.get(itemId) || G.canonicalBySource.get(itemId);
    if (!canonical) return;
    const requested = sourceRecordId || (!G.itemById.has(itemId) ? itemId : null);
    const it = canonical.sourceRecords.find(source => source.sourceRecordId === requested || source.id === requested)
      || canonical.sourceRecords[0] || canonical;
    state.drawerItemId = canonical.id;
    state.drawerSourceRecordId = it.sourceRecordId;
    const sourceSelect = $('drawerSource');
    sourceSelect.replaceChildren();
    $('drawerSourceWrap').hidden = canonical.sourceRecords.length < 2;
    $('drawerIdentity').textContent = `按规则对齐 · ${canonical.sourceRecords.length} 条源图录 · 实物身份尚未独立核实`;
    for (const source of canonical.sourceRecords) {
      const option = document.createElement('option');
      option.value = source.sourceRecordId;
      option.textContent = `${source.locator || sourcePageLabel(source)} · ${source.title}`;
      sourceSelect.append(option);
    }
    sourceSelect.value = it.sourceRecordId;
    sourceSelect.onchange = () => openDrawer(canonical.id, sourceSelect.value);

    $('drawerTitle').textContent = canonical.title;
    $('drawerLoc').textContent = [it.locator, it.findspot ? it.findspot + '出土' : ''].filter(Boolean).join(' · ');
    $('drawerGotoPage').onclick = () => {
      state.currentPage = it.page;
      closeDrawer();
      switchView('pages');
      renderPage(it.page, it.id);
    };

    const sp = getSprite(it.thumbUrl);
    $('drawerFig').classList.toggle('mono', Boolean(sp?.isMono));
    const imageLabel = it.imageKind === 'artifact_candidate' ? '裁图 · 自动候选'
      : it.imageKind === 'artifact' ? '器物截图' : '原书整页';
    const gallery = $('drawerGallery');
    gallery.replaceChildren();
    gallery.hidden = it.imageCandidates.length < 2;
    const showImage = (url, label) => {
      $('drawerImg').src = url;
      $('drawerImg').alt = `${it.title} · ${imageLabel} · ${label}`;
      $('drawerFigBadge').textContent = `${imageLabel}${label ? ' · ' + label : ''} · 点击放大`;
      $('drawerFig').onclick = () => openLightbox(url, `${it.title} · ${imageLabel} · ${label} · ${it.locator}`);
      gallery.querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.url === url)));
    };
    if (it.imageCandidates.length > 1) {
      const images = [{imageUrl: it.plateUrl, label: `整组 ${it.imageCandidates.length} 图`},
        ...it.imageCandidates.map((image, index) => ({...image, label: `子图 ${index + 1}`}))];
      for (const image of images) {
        const button = document.createElement('button');
        button.type = 'button'; button.dataset.url = image.imageUrl;
        button.title = image.label; button.setAttribute('aria-label', image.label);
        const preview = document.createElement('img');
        preview.src = image.imageUrl; preview.alt = image.label; preview.loading = 'lazy';
        button.append(preview);

        b.className = 'jump-pill ' + kind;
        b.textContent = v;
        b.onclick = () => openGraph(kind, v);
        wrap.append(b);
      }
      row.append(l, wrap);
      rels.append(row);
    };
    addRelRow('时代', 'era', it.periods);
    addRelRow('材质', 'material', it.materials);
    addRelRow('纹样', 'motif', it.motifs);
    for (const motif of it.motifs) {
      if (!getPatternAttributes(motif).length) continue;

    for (const [kind, dim] of Object.entries(EXTRA_DIMENSIONS)) {

    for (const [pred, label] of [['excavated_at', '出土地点'], ['discovered_at', '发现地点'], ['collected_at', '采集地点']]) {
      addRelRow(label, 'place', [...new Set(it.rows.filter(row => row.predicate === pred).map(row => row.object))]);
    }
    for (const r of it.rows.filter(r => ['page_heading_inheritance', 'catalog_section_context', 'same_page_culture_context'].includes(r.origin))) {
      const note = document.createElement('p');
      note.style.cssText = 'font-size:12px;color:var(--ink-3)';

        : `${r.predicate === 'period' ? '时代' : '文化'}候选来自同页标题「${r.object}」（${sourcePageLabel(it)}），尚未人工确认。`;

  /* ═══════════════════════════════════════════════════════════════
     10. Animation Loop & Initialization
     ═══════════════════════════════════════════════════════════════ */
  function shouldPaintView(view, kind, now) {
    const key = [view.w, view.h, view.dpr, currentTheme(), spriteRevision, state.drawerItemId,
      kind === 'river' ? view.hoveredItem?.key : view.hoveredNode?.item.id,
      kind === 'graph' ? view.hoveredNode?.cluster.id : '',
      kind === 'river' ? view.hoveredEra : view.hoveredCluster?.id,
      state.riverHighlightEra, state.riverHighlightMat, state.riverDatedOnly, state.riverTypeFilter,
      state.focusKind, state.focusId, state.clusterBy, state.dim].join('|');
    const cameraMoving = Math.abs(view.panX - view.targetPanX) > .08
      || Math.abs(view.panY - view.targetPanY) > .08 || Math.abs(view.zoom - view.targetZoom) > .0001;
    const graphMoving = kind === 'graph' && ((state.dim === '3d' && (Math.abs(view.yaw - view.targetYaw) > .0001
      || Math.abs(view.pitch - view.targetPitch) > .0001 || Math.abs(view.velYaw) > .00005 || Math.abs(view.velPitch) > .00005))
      || (!stageOverlay?.graphScene && (view.clusters.some(c => Math.abs(c.x-c.tx) + Math.abs(c.y-c.ty) + Math.abs(c.z-c.tz) > .1)
      || view.nodes.some(n => Math.abs(n.x-n.tx) + Math.abs(n.y-n.ty) + Math.abs(n.z-n.tz) > .1))));
    const changed = view.lastRenderKey !== key || view.lastOverlay !== stageOverlay;
    const animatedOverlay = kind === 'graph' && Boolean(stageOverlay?.graphScene);
    if (!changed && !cameraMoving && !graphMoving && !view.dragging && !animatedOverlay) return false;
    // Preserve interaction frame rate; reasoning pulses alone need only 30 frames per second.
    if (!changed && !cameraMoving && !graphMoving && animatedOverlay && now - view.lastDrawAt < 32) return false;
    view.lastRenderKey = key; view.lastOverlay = stageOverlay; view.lastDrawAt = now;
    return true;
  }

  function tick(now) {
    const t = now * 0.001;
    spriteFrameTime = now;
    if (G && !document.hidden) {
      if (state.view === 'river' && river.pendingPointer) {
        const pointer = river.pendingPointer; river.pendingPointer = null;
        hitTestRiver(pointer.x, pointer.y);
      }
      if (state.view === 'graph' && graph.pendingPointer) {
        const pointer = graph.pendingPointer;
        graph.pendingPointer = null;
        hitTestGraph(pointer.x, pointer.y);
      }
      if (state.view === 'river') {
        if (shouldPaintView(river, 'river', now)) drawRiver(t);
        drawRiverFlow(now);
      }
      else if (state.view === 'graph' && shouldPaintView(graph, 'graph', now)) drawGraph(t);
      if (spriteWorkers && spritePriorityIds.size && now-lastSpritePriorityHint > 100) {
        const hint = { kind: 'priority', ids: [...spritePriorityIds], stamp: now };
        for (const worker of spriteWorkers) worker.postMessage(hint);
        spritePriorityIds.clear(); lastSpritePriorityHint = now;
      }
    }
    requestAnimationFrame(tick);
  }

  async function loadManifest() {
    const inline = $('data')?.textContent?.trim();
    if (inline && inline.startsWith('{')) return JSON.parse(inline);
    const res = await fetch('manifest.json');
    if (!res.ok) throw new Error('无法读取 manifest.json');
    return res.json();
  }

      e.preventDefault();

      const pages = G.pagesByVolume.get($('pageVolume').value) || G.pages;
