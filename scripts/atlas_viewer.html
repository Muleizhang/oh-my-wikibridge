<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>纹样星图</title>
<style>
:root {
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html[data-theme="dark"] {
  --bg: #090b10;
  --bg-elev: rgba(16, 19, 27, 0.78);
  --bg-solid: #11141d;
  --bg-card: rgba(20, 24, 34, 0.68);
  --bg-hover: rgba(255, 255, 255, 0.06);
  --ink: #efece4;
  --ink-2: #a8a397;
  --ink-3: #6c685f;
  --line: rgba(239, 236, 228, 0.11);
  --line-strong: rgba(239, 236, 228, 0.22);
  --accent: #d8b377;
  --accent-soft: rgba(216, 179, 119, 0.15);
  --accent-ink: #12100d;
  --era-color: #d4a66a;
  --mat-color: #7ca896;
  --motif-color: #ce8264;
  --shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
  --canvas-bg: #090b10;
  --canvas-glow: #141925;
}

html[data-theme="light"] {
  --bg: #f8f6f1;
  --bg-elev: rgba(252, 250, 245, 0.84);
  --bg-solid: #fcfaf5;
  --bg-card: rgba(255, 254, 250, 0.88);
  --bg-hover: rgba(28, 26, 23, 0.05);
  --ink: #1e1c19;
  --ink-2: #625c53;
  --ink-3: #968f84;
  --line: rgba(30, 28, 25, 0.10);
  --line-strong: rgba(30, 28, 25, 0.22);
  --accent: #8f4e32;
  --accent-soft: rgba(143, 78, 50, 0.10);
  --accent-ink: #fcfaf5;
  --era-color: #8b6830;
  --mat-color: #3f6f5c;
  --motif-color: #9b4b32;
  --shadow: 0 18px 46px rgba(30, 26, 20, 0.12);
  --canvas-bg: #f8f6f1;
  --canvas-glow: #efeae0;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background 0.35s var(--ease), color 0.35s var(--ease);
}

button, input, select {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  outline: none;
}

button { cursor: pointer; }
button:focus-visible, input:focus-visible {
  outline: 1.5px solid var(--accent);
  outline-offset: 2px;
}

/* ── Top Floating Navigation ── */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  z-index: 40;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 22px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px) saturate(135%);
  -webkit-backdrop-filter: blur(18px) saturate(135%);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  justify-self: start;
  padding: 4px 6px;
  border-radius: 8px;
  transition: opacity 0.2s;
}
.brand:hover { opacity: 0.8; }
.brand-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}
.brand-name {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.12em;
  white-space: nowrap;
}
.brand-sub {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 240px;
}

.nav-tabs {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
}
.nav-tabs button {
  padding: 5px 15px;
  border-radius: 999px;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--ink-2);
  transition: all 0.22s var(--ease);
}
.nav-tabs button:hover { color: var(--ink); }
.nav-tabs button[aria-current="page"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 500;
}

.top-actions {
  justify-self: end;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.icon-pill {
  height: 32px;
  padding: 0 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  transition: all 0.2s var(--ease);
}
.icon-pill:hover {
  border-color: var(--line-strong);
  color: var(--ink);
  background: var(--bg-hover);
}
.icon-pill kbd {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  padding: 1px 4px;
  border-radius: 4px;
  border: 1px solid var(--line);
}
.icon-pill svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── Main Stage Container ── */
.stage-view {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.canvas-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  user-select: none;
  cursor: grab;
}
.canvas-layer:active { cursor: grabbing; }
.canvas-layer.pointer { cursor: pointer; }
.river-flow-layer { pointer-events: none; cursor: default; }

/* ── River Homepage Overlay ── */
.river-hero {
  position: fixed;
  top: 72px;
  left: 28px;
  z-index: 20;
  pointer-events: none;
  transition: opacity 0.4s var(--ease);
}
.river-hero h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(24px, 3vw, 36px);
  font-weight: 600;
  letter-spacing: 0.14em;
  line-height: 1.2;
}
.river-hero p {
  margin: 6px 0 0;
  font-size: 12px;
  color: var(--ink-2);
  letter-spacing: 0.18em;
  max-width: calc(100vw - 56px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.river-tools { position: fixed; top: 148px; left: 28px; z-index: 26; display: flex; gap: 6px; flex-wrap: wrap; }
.river-status { color: var(--ink-3); font-size: 11px; align-self: center; margin-left: 4px; }
.river-group { position: fixed; right: 22px; top: 130px; z-index: 42; width: min(360px, calc(100vw - 32px));
  max-height: calc(100vh - 260px); display: flex; flex-direction: column; border: 1px solid var(--line-strong);
  border-radius: 16px; background: var(--bg-solid); box-shadow: var(--shadow); overflow: hidden; }
.river-group-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.river-group-head strong { flex: 1; font-size: 13px; }
.river-group-list { overflow: auto; min-height: 0; padding: 6px; }
.river-group-item { display: block; text-align: left; width: 100%; padding: 10px; border-radius: 10px; }
.river-group-item:hover { background: var(--bg-hover); }
.river-group-item span { display: block; font-size: 12px; }
.river-group-item small { display: block; color: var(--ink-3); margin-top: 4px; font-size: 10px; }
.river-group-foot { display: flex; gap: 8px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 11px; }

.river-dock {
  position: fixed;
  left: 20px;
  right: 20px;
  bottom: 18px;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 9px 16px;
  border-radius: 16px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}
.dock-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  min-width: 0;
}
.dock-label {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  margin-right: 4px;
  white-space: nowrap;
}
.dock-sep {
  width: 1px;
  height: 18px;
  background: var(--line);
  margin: 0 4px;
}
.type-filter {
  max-width: 190px;
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink-2);
  background: var(--bg-elev);
  font: inherit;
  font-size: 12px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  font-size: 12px;
  color: var(--ink-2);
  white-space: nowrap;
  transition: all 0.2s var(--ease);
}
.chip:hover {
  color: var(--ink);
  border-color: var(--line-strong);
  background: var(--bg-hover);
  transform: translateY(-1px);
}
.chip[aria-pressed="true"], .chip.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.chip .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
}
.chip .num {
  font-family: var(--mono);
  font-size: 10px;
  opacity: 0.65;
}

/* ── Graph HUD Overlay ── */
.graph-hud-top {
  position: fixed;
  top: 68px;
  left: 22px;
  right: 22px;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  pointer-events: none;
  flex-wrap: wrap;
}
.graph-hud-top > * { pointer-events: auto; }

.focus-bar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px 5px 6px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  position: relative;
}
.back-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--ink-2);
  transition: all 0.18s;
}
.back-btn:hover { background: var(--bg-hover); color: var(--ink); }
.back-btn:disabled { opacity: 0.3; cursor: default; }

.focus-kind {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  letter-spacing: 0.06em;
  font-weight: 500;
}
.focus-kind.era { background: rgba(212, 166, 106, 0.18); color: var(--era-color); }
.focus-kind.material { background: rgba(124, 168, 150, 0.18); color: var(--mat-color); }
.focus-kind.motif { background: rgba(206, 130, 100, 0.18); color: var(--motif-color); }
.focus-kind.artifact_type { background: rgba(158, 148, 198, 0.18); color: #9e94c6; }

.focus-picker-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 2px 10px 2px 4px;
  border-radius: 999px;
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.06em;
  transition: background 0.18s;
}
.focus-picker-btn:hover { background: var(--bg-hover); }
.focus-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  padding-right: 6px;
}

.trail {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 4px;
  max-width: 340px;
  overflow: hidden;
}
.trail button {
  font-size: 12px;
  color: var(--ink-3);
  padding: 2px 6px;
  border-radius: 6px;
  white-space: nowrap;
}
.trail button:hover { color: var(--ink); background: var(--bg-hover); }
.trail span { font-size: 11px; color: var(--ink-3); opacity: 0.5; }

.graph-controls {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.seg {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.seg button {
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  color: var(--ink-2);
  transition: all 0.2s var(--ease);
  white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 500;
}

.graph-hud-bottom {
  position: fixed;
  left: 22px;
  bottom: 18px;
  z-index: 24;
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}
.graph-hud-bottom > * { pointer-events: auto; }
.cluster-strip {
  display: flex;
  align-items: center;
  gap: 5px;
  max-width: calc(100vw - 220px);
  overflow-x: auto;
  scrollbar-width: none;
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
}
.cluster-strip::-webkit-scrollbar { display: none; }

.zoom-pad {
  position: fixed;
  right: 22px;
  bottom: 18px;
  z-index: 24;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
}
.zoom-pad button {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 13px;
  color: var(--ink-2);
}
.zoom-pad button:hover { background: var(--bg-hover); color: var(--ink); }
.zoom-pad .reset-btn { width: auto; padding: 0 10px; border-radius: 999px; font-size: 11px; }

/* ── Entity Switcher Popover ── */
.switcher-pop {
  position: fixed;
  top: 120px;
  left: 22px;
  width: min(390px, calc(100vw - 44px));
  max-height: min(62vh, 500px);
  z-index: 45;
  border-radius: 16px;
  background: var(--bg-solid);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.switcher-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--line);
  padding: 6px;
  gap: 4px;
}
.switcher-tabs button {
  padding: 6px 8px;
  border-radius: 10px;
  font-size: 12px;
  color: var(--ink-2);
}
.switcher-tabs button[aria-selected="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}
.switcher-search {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  width: 100%;
}
.switcher-list {
  padding: 8px;
  overflow-y: auto;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-content: start;
}

/* ── Floating Tooltip on Canvas ── */
.canvas-tip {
  position: fixed;
  z-index: 35;
  pointer-events: none;
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--bg-elev);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  max-width: 260px;
  transform: translate(14px, -50%);
  transition: opacity 0.14s ease;
}
.canvas-tip strong {
  display: block;
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
}
.canvas-tip .tip-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 5px;
}
.canvas-tip .tip-tag {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ink-2);
}
.canvas-tip .tip-hint {
  margin-top: 5px;
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 0.04em;
}

/* ── Minimal Specimen & Evidence Slide-Over Drawer ── */
.drawer {
  position: fixed;
  top: 66px;
  right: 18px;
  bottom: 18px;
  width: min(370px, calc(100vw - 36px));
  z-index: 42;
  border-radius: 18px;
  background: var(--bg-elev);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateX(0);
  transition: transform 0.3s var(--ease), opacity 0.25s var(--ease);
}
.drawer.closed {
  transform: translateX(calc(100% + 28px));
  opacity: 0;
  pointer-events: none;
}
.drawer-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
}
.drawer-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.35;
}
.drawer-loc {
  margin-top: 3px;
  font-size: 11px;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 8px;
}
.drawer-close {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  flex: none;
  display: grid;
  place-items: center;
  color: var(--ink-2);
}
.drawer-close:hover { background: var(--bg-hover); color: var(--ink); }

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.drawer-identity { font-size: 11px; line-height: 1.5; color: var(--ink-3); }
.drawer-source { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.drawer-source[hidden] { display: none; }
.drawer-source select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 7px;
  color: var(--ink); background: var(--bg-elev); font: inherit; font-size: 12px; }
.drawer-figure {
  position: relative;
  flex-shrink: 0;
  border-radius: 12px;
  overflow: hidden;
  background: rgba(128, 128, 128, 0.08);
  border: 1px solid var(--line);
  aspect-ratio: 4 / 3;
  display: grid;
  place-items: center;
  cursor: zoom-in;
}
.drawer-figure img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
html[data-theme="dark"] .drawer-figure.mono img {
  filter: invert(0.92) sepia(0.24) saturate(1.1) brightness(0.96) contrast(1.1);
}
html[data-theme="light"] .drawer-figure.mono img {
  mix-blend-mode: multiply;
  filter: contrast(1.12);
}
.drawer-fig-badge {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  color: var(--ink-2);
}
.drawer-gallery {
  display: flex;
  flex-shrink: 0;
  gap: 7px;
  overflow-x: auto;
  padding: 2px 1px 6px;
}
.drawer-gallery[hidden] { display: none; }
.drawer-gallery button {
  flex: 0 0 64px;
  height: 54px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--bg-elev);
  cursor: pointer;
}
.drawer-gallery button[aria-pressed="true"] { border: 2px solid var(--ink-2); }
.drawer-gallery button:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 2px; }
.drawer-gallery img { width: 100%; height: 100%; object-fit: contain; display: block; }

.rel-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rel-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.rel-label {
  font-size: 11px;
  color: var(--ink-3);
  width: 34px;
  flex: none;
}
.rel-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.jump-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  transition: all 0.18s var(--ease);
}
.jump-pill:hover {
  transform: translateY(-1px);
  border-color: var(--accent);
  color: var(--accent);
}
.jump-pill.era { border-color: rgba(212, 166, 106, 0.35); color: var(--era-color); }
.jump-pill.material { border-color: rgba(124, 168, 150, 0.35); color: var(--mat-color); }
.jump-pill.motif { border-color: rgba(206, 130, 100, 0.35); color: var(--motif-color); }
.jump-pill.artifact_type { border-color: rgba(158, 148, 198, 0.35); color: #9e94c6; }
.interpretation-card { padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg-card); }
.interpretation-card h3 { font-family: var(--serif); font-size: 19px; margin: 0 0 12px; }
.interpretation-card p { font-size: 12px; line-height: 1.7; color: var(--ink-2); white-space: pre-wrap; }
.interpretation-card .source-label { color: var(--ink-3); font-size: 11px; }
.interpretation-card details { margin: 12px 0; font-size: 12px; }
.interpretation-card .dock-group { margin-top: 14px; }
body.interpretation-view .focus-bar, body.interpretation-view #clusterSwitch,
body.interpretation-view .graph-hud-bottom { display: none; }
.graph-attributes { flex: 0 0 100%; pointer-events: none !important; }
.graph-attributes[hidden] { display: none; }
.graph-attribute-card { width: min(390px, 100%); padding: 13px 16px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--bg-elev); backdrop-filter: blur(18px); box-shadow: var(--shadow); pointer-events: auto; }
.graph-attribute-card > summary { cursor: pointer; font: 600 14px var(--serif); color: var(--ink); }
.graph-attribute-rows { display: grid; gap: 10px; margin-top: 13px; }
.pattern-attribute-row { display: grid; grid-template-columns: 64px 1fr; align-items: start; gap: 9px; font-size: 12px; }
.pattern-attribute-label { padding-top: 5px; color: var(--ink-3); }
.pattern-attribute-values { display: flex; flex-wrap: wrap; gap: 6px; }
.pattern-attribute { border: 1px solid rgba(214,178,112,.4); border-radius: 999px; padding: 4px 10px;
  font-size: 12px; color: #d6b270; background: rgba(214,178,112,.08); }
.pattern-attribute.belief { color: #b0a0d9; border-color: rgba(176,160,217,.4); background: rgba(176,160,217,.08); }
.pattern-attribute:hover, .pattern-attribute[aria-pressed="true"] { background: var(--bg-hover); border-color: currentColor; }
[data-theme="light"] .pattern-attribute { color: #92652d; }
[data-theme="light"] .pattern-attribute.belief { color: #75529c; }
.graph-attribute-evidence { border-top: 1px solid var(--line); margin-top: 13px; padding-top: 11px; max-height: min(42vh, 380px); overflow-y: auto; }
.graph-attribute-evidence[hidden] { display: none; }
.graph-attribute-evidence header { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; }
.graph-attribute-evidence article { margin-top: 12px; }
.graph-attribute-evidence .source-label { font-size: 11px; color: var(--ink-3); }
.graph-attribute-evidence blockquote { margin: 7px 0; font-size: 12px; line-height: 1.7; color: var(--ink-2); white-space: pre-wrap; }
.pattern-attribute-caption { font-size: 11px; color: var(--ink-3); margin: 12px 0 7px; }
body.attribute-view .focus-bar, body.attribute-view #clusterSwitch,
body.attribute-view .graph-hud-bottom { display: none; }
.jump-pill::after {
  content: "↗";
  font-size: 10px;
  opacity: 0.6;
}

.proof-box {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.proof-quote {
  margin: 0;
  padding-left: 10px;
  border-left: 2px solid var(--accent);
  font-size: 12px;
  color: var(--ink-2);
  white-space: pre-line;
}
.proof-caption-img {
  max-width: 100%;
  max-height: 76px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: #fff;
}
html[data-theme="dark"] .proof-caption-img {
  filter: invert(0.92) sepia(0.12) contrast(1.1);
}
.proof-page-wrap {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--line);
  cursor: pointer;
}
.proof-page-wrap img { display: block; width: 100%; }
.bbox {
  position: absolute;
  border: 1.5px solid #e05a3f;
  background: rgba(224, 90, 63, 0.14);
  pointer-events: none;
}
.mini-link {
  font-size: 12px;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 0;
}
.mini-link:hover { text-decoration: underline; }

/* ── View 3: Catalog (MUSEO Morandi Grid) ── */
.scroll-view {
  position: fixed;
  inset: 54px 0 0 0;
  overflow-y: auto;
  padding: 28px clamp(18px, 4vw, 52px) 64px;
  background: var(--bg);
}
.view-inner {
  max-width: 1320px;
  margin: 0 auto;
}
.catalog-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.catalog-bar h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.08em;
}

.entity-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
}
.entity-card {
  position: relative;
  text-align: left;
  padding: 16px;
  border-radius: 16px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: all 0.24s var(--ease);
  overflow: hidden;
}
.entity-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--card-tint, var(--accent));
  opacity: 0.65;
}
.entity-card:hover {
  transform: translateY(-3px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow);
}
.entity-card-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.entity-card h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.entity-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
}
.entity-thumbs {
  display: flex;
  align-items: center;
  gap: 0;
  min-height: 44px;
}
.entity-thumbs img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--bg-solid);
  margin-left: -8px;
  background: var(--bg-solid);
}
.entity-thumbs img:first-child { margin-left: 0; }
.entity-subchips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.entity-subchips span {
  font-size: 11px;
  color: var(--ink-2);
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--bg-hover);
}
.entity-cta {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-3);
  padding-top: 6px;
  border-top: 1px solid var(--line);
}
.entity-card:hover .entity-cta { color: var(--accent); }

.specimen-section {
  margin-top: 34px;
}
.specimen-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.specimen-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 16px;
  color: var(--ink-2);
  font-weight: 500;
}
.specimen-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 12px;
}
.spec-card {
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: all 0.2s var(--ease);
}
.spec-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-2px);
}
.spec-img-wrap {
  aspect-ratio: 1 / 1;
  background: rgba(128, 128, 128, 0.06);
  display: grid;
  place-items: center;
  padding: 10px;
  cursor: pointer;
  overflow: hidden;
}
.spec-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 8px;
}
.spec-body {
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.spec-title {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
  cursor: pointer;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.spec-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.spec-tags button {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ink-2);
  transition: all 0.16s;
}
.spec-tags button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ── View 4: Original PDF Pages ── */
.pages-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: 28px;
  align-items: start;
}
.page-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.page-toolbar h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
}
.page-nav {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.page-nav input, .page-nav select {
  width: 62px;
  text-align: center;
  padding: 4px 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  font-family: var(--mono);
  font-size: 12px;
}
.scan-frame {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #fff;
  box-shadow: var(--shadow);
}
.scan-frame img { display: block; width: 100%; }
.page-items {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.page-item-card {
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: all 0.18s;
}
.page-item-card:hover, .page-item-card.active {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.page-item-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.page-item-title strong {
  font-family: var(--serif);
  font-size: 15px;
}
.page-item-title small {
  font-size: 11px;
  color: var(--ink-3);
  white-space: nowrap;
}

/* ── Command Palette (⌘K Search) ── */
.palette-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(5, 7, 11, 0.56);
  backdrop-filter: blur(8px);
  display: grid;
  place-items: start center;
  padding-top: min(14vh, 110px);
}
.palette {
  width: min(560px, calc(100vw - 32px));
  max-height: 70vh;
  border-radius: 18px;
  background: var(--bg-solid);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.palette input {
  padding: 15px 18px;
  font-size: 15px;
  border-bottom: 1px solid var(--line);
  width: 100%;
}
.palette-results {
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.palette-group {
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.1em;
  padding: 8px 10px 4px;
}
.palette-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 10px;
  text-align: left;
  transition: background 0.15s;
}
.palette-item:hover, .palette-item.selected {
  background: var(--accent-soft);
  color: var(--accent);
}
.palette-item small {
  font-size: 11px;
  color: var(--ink-3);
}

/* ── Lightbox Modal ── */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: rgba(6, 7, 10, 0.88);
  backdrop-filter: blur(12px);
  display: grid;
  place-items: center;
  padding: 24px;
  cursor: zoom-out;
}
.lightbox-inner {
  max-width: min(94vw, 1080px);
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  cursor: default;
}
.lightbox img {
  max-width: 100%;
  max-height: 80vh;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
}
.lightbox-cap {
  color: #e8e4dc;
  font-family: var(--serif);
  font-size: 14px;
  letter-spacing: 0.05em;
}

@media (max-width: 820px) {
  .topbar { grid-template-columns: auto 1fr auto; padding: 0 12px; }
  .brand-sub, .icon-pill kbd, .trail { display: none; }
  .nav-tabs button { padding: 5px 10px; font-size: 12px; }
  .river-hero { top: 64px; left: 16px; }
  .river-dock { left: 10px; right: 10px; bottom: 10px; padding: 8px 10px; gap: 8px; }
  .graph-hud-top { left: 10px; right: 10px; top: 62px; }
  .cluster-strip { max-width: calc(100vw - 140px); }
  .pages-layout { grid-template-columns: 1fr; }
}

/* ── Dual-Mode Knowledge Reasoning Studio ── */
.icon-pill.accent-pill {
  border-color: rgba(216, 179, 119, 0.42);
  color: var(--accent);
}
.icon-pill.accent-pill[aria-expanded="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.icon-pill.accent-pill[aria-expanded="true"] kbd {
  color: var(--accent-ink);
  border-color: rgba(0, 0, 0, 0.2);
}

.overlay-banner {
  position: fixed;
  top: 122px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 6px 14px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--accent);
  box-shadow: var(--shadow);
  font-size: 12px;
  max-width: min(560px, calc(100vw - 44px));
}
.overlay-banner .ob-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  flex: none;
}
.overlay-banner .ob-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--ink);
}
.overlay-banner .ob-clear {
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--bg-hover);
  color: var(--ink-2);
  font-size: 11px;
  flex: none;
}
.overlay-banner .ob-clear:hover { color: var(--ink); background: var(--accent-soft); }

.r-studio {
  position: fixed;
  top: 66px;
  right: 18px;
  bottom: 18px;
  width: min(424px, calc(100vw - 36px));
  z-index: 41;
  border-radius: 18px;
  background: var(--bg-elev);
  backdrop-filter: blur(24px) saturate(145%);
  -webkit-backdrop-filter: blur(24px) saturate(145%);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateX(0);
  transition: transform 0.3s var(--ease), opacity 0.25s var(--ease);
}
.r-studio.closed {
  transform: translateX(calc(100% + 28px));
  opacity: 0;
  pointer-events: none;
}
.r-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
}
.r-mode-seg {
  display: inline-flex;
  padding: 3px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  gap: 2px;
}
.r-mode-seg button {
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  color: var(--ink-2);
  transition: all 0.2s var(--ease);
}
.r-mode-seg button[aria-selected="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 500;
}
.r-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--ink-3);
}
.r-status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #6f9e86;
}
.r-status-dot.off { background: var(--ink-3); }

.r-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.r-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.r-lenses {
  display: inline-flex;
  gap: 4px;
}
.r-lenses button {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  color: var(--ink-2);
  border: 1px solid transparent;
}
.r-lenses button:hover { color: var(--ink); background: var(--bg-hover); }
.r-lenses button[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}

.ont-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--ink-2);
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  cursor: pointer;
  user-select: none;
}
.ont-toggle[aria-pressed="true"] {
  border-color: rgba(124, 168, 150, 0.55);
  background: rgba(124, 168, 150, 0.14);
  color: var(--mat-color);
}
.ont-toggle .sw-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.r-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.r-form {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.r-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.r-input, .r-select {
  flex: 1;
  min-width: 0;
  padding: 7px 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--ink);
  font-size: 12.5px;
}
.r-select option {
  background: var(--bg-solid);
  color: var(--ink);
}
.r-btn {
  padding: 7px 14px;
  border-radius: 10px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  transition: opacity 0.18s;
}
.r-btn:hover { opacity: 0.9; }
.r-btn:disabled { opacity: 0.45; cursor: default; }
.r-btn.ghost {
  background: var(--bg-card);
  color: var(--ink-2);
  border: 1px solid var(--line);
}
.r-btn.ghost:hover { color: var(--ink); border-color: var(--line-strong); }

.r-presets {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.r-preset {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ink-2);
  background: var(--bg-card);
  transition: all 0.16s;
}
.r-preset:hover { border-color: var(--accent); color: var(--accent); }

.r-card {
  padding: 11px 12px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color 0.18s;
}
.r-card:hover, .r-card.active {
  border-color: var(--accent);
}
.r-path-card { cursor: pointer; }
.r-path-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.r-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.r-card-title {
  font-family: var(--serif);
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.35;
}
.r-badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
}
.r-badge.ont {
  background: rgba(124, 168, 150, 0.18);
  color: var(--mat-color);
  border: 1px dashed rgba(124, 168, 150, 0.5);
}

.chain-steps {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
}
.chain-node {
  padding: 2px 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg-hover);
  color: var(--ink);
  cursor: pointer;
}
.chain-node:hover { border-color: var(--accent); color: var(--accent); }
.chain-node.ont {
  border-style: dashed;
  border-color: rgba(124, 168, 150, 0.6);
  color: var(--mat-color);
}
.chain-edge {
  font-size: 10px;
  color: var(--ink-3);
  padding: 0 2px;
}
.chain-edge.ont { color: var(--mat-color); }

.proof-line {
  font-size: 11px;
  color: var(--ink-2);
  padding: 6px 8px;
  border-radius: 8px;
  background: var(--bg-hover);
  border-left: 2px solid var(--accent);
}
.proof-line code {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--accent);
  display: block;
  margin-bottom: 2px;
  word-break: break-all;
}

.conf-bar {
  height: 4px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
.conf-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--mat-color), var(--accent));
}

.cmp-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.cmp-stat {
  padding: 8px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  text-align: center;
}
.cmp-stat strong {
  display: block;
  font-family: var(--mono);
  font-size: 16px;
  line-height: 1.2;
}
.cmp-stat span { font-size: 10.5px; color: var(--ink-3); }
.cmp-stat.shared strong { color: var(--accent); }
.cmp-stat.onlyA strong { color: var(--motif-color); }
.cmp-stat.onlyB strong { color: var(--mat-color); }

.sparql-details {
  border-top: 1px solid var(--line);
  padding: 8px 14px 10px;
  background: var(--bg-card);
}
.sparql-details summary {
  cursor: pointer;
  font-size: 11.5px;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  list-style: none;
}
.sparql-details summary::-webkit-details-marker { display: none; }
.sparql-editor {
  width: 100%;
  min-height: 92px;
  margin-top: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.45;
  resize: vertical;
}
.sparql-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  margin-top: 8px;
}
.sparql-table th, .sparql-table td {
  text-align: left;
  padding: 4px 6px;
  border-bottom: 1px solid var(--line);
}
.sparql-table th { color: var(--ink-3); font-family: var(--mono); font-weight: 500; }

/* ── DeepSeek Agent Chat UI ── */
.agent-feed {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.agent-empty {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 4px;
}
.agent-empty h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
}
.agent-empty p {
  margin: 0;
  font-size: 12px;
  color: var(--ink-2);
}
.agent-prompt-btn {
  text-align: left;
  padding: 9px 11px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink);
  transition: all 0.18s;
}
.agent-prompt-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

.msg {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.msg.user { align-items: flex-end; }
.msg.user .msg-bubble {
  background: var(--accent-soft);
  border: 1px solid rgba(216, 179, 119, 0.35);
  color: var(--ink);
  border-radius: 14px 14px 4px 14px;
  padding: 8px 12px;
  max-width: 88%;
  font-size: 13px;
}
.msg.assistant .msg-bubble {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px 14px 14px 4px;
  padding: 11px 13px;
  font-size: 12.8px;
  line-height: 1.65;
  word-break: break-word;
}
.msg-bubble h4 {
  margin: 10px 0 4px;
  font-family: var(--serif);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--accent);
}
.msg-bubble h4:first-child { margin-top: 0; }
.msg-bubble p { margin: 4px 0; }
.msg-bubble ul, .msg-bubble ol { margin: 4px 0 6px; padding-left: 18px; }
.msg-bubble li { margin: 3px 0; }
.msg-bubble hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
.msg-bubble strong { font-weight: 600; color: var(--ink); }
.msg-bubble code {
  font-family: var(--mono);
  font-size: 11px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--bg-hover);
}
.msg-bubble table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  margin: 6px 0;
}
.msg-bubble th, .msg-bubble td {
  padding: 4px 6px;
  border-bottom: 1px solid var(--line);
  text-align: left;
}
.msg-bubble th { color: var(--ink-3); font-weight: 500; }

@media (min-width: 960px) {
  body.studio-open .graph-hud-top { right: 458px; }

.trace-details {
  font-size: 11px;
  color: var(--ink-2);
}
.trace-details summary {
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);

}
.trace-details summary::-webkit-details-marker { display: none; }
.trace-list {

  flex-direction: column;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
}
.cite-pill {
  display: inline-flex;
  align-items: center;
  padding: 0 5px;
  margin: 0 2px;
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  vertical-align: baseline;
  cursor: pointer;
}
.cite-pill.ev {
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid rgba(216, 179, 119, 0.45);
}
.cite-pill.inf {
  background: rgba(124, 168, 150, 0.16);
  color: var(--mat-color);
  border: 1px dashed rgba(124, 168, 150, 0.65);
}
.cite-pill:hover { filter: brightness(1.18); }

.agent-composer {
  padding: 10px 12px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 6px;
  align-items: center;
}
.agent-composer input {
  flex: 1;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  font-size: 13px;
}
.agent-composer input:focus { border-color: var(--accent); }
.r-pulse {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: rpulse 1.1s infinite ease-in-out;
}
@keyframes rpulse {
  0%, 100% { opacity: 0.25; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); }
}

@media (max-width: 820px) {
  .r-studio { left: 10px; right: 10px; width: auto; top: 60px; bottom: 10px; }
  .overlay-banner { top: 64px; }
}
</style>

  <div class="top-actions">

<!-- View 1: Full-Bleed Historical River Homepage -->
<section class="stage-view" id="view-river">

  <div class="river-hero" id="riverHero">

    <button type="button" class="chip" id="riverZoomIn" aria-label="放大长河">＋</button>
    <button type="button" class="chip" id="riverUndated" hidden></button>
    <span class="river-status" id="riverDisplayStatus"></span>

  <aside class="river-group" id="riverGroup" aria-label="聚合图录" hidden>
    <div class="river-group-head"><strong id="riverGroupTitle"></strong><button class="chip" type="button" id="riverGroupZoom">放大展开</button><button class="chip" type="button" id="riverGroupClose" aria-label="关闭图录列表">×</button></div>

    </div>

</section>

<!-- View 2: Clustered 2D / 3D Knowledge Graph -->
<section class="stage-view" id="view-graph" hidden>
  <canvas class="canvas-layer" id="graphCanvas"></canvas>

  <div class="graph-hud-top">
    <div class="focus-bar">
      <button type="button" class="back-btn" id="graphBack" title="返回上一节点" aria-label="返回">←</button>
      <span class="focus-kind" id="focusKind">时代</span>

        <span id="focusLabel"></span>
        <span style="font-size:11px;opacity:.55">▾</span>

  <div class="zoom-pad">

<!-- Entity Switcher Popover -->

<!-- Floating Dual-Mode Knowledge Reasoning Studio -->
<aside class="r-studio closed" id="reasoningPanel" aria-label="知识推理工作台">

      <button type="button" class="drawer-close" id="rClose" aria-label="关闭推理工作台">✕</button>
    </div>

      <div class="r-lenses" id="rLensSeg">
        <button type="button" data-lens="path" aria-pressed="true">演化路径</button>
        <button type="button" data-lens="compare" aria-pressed="false">对比差集</button>

        <span>本体泛化</span>
      </button>
    </div>

    <div class="r-scroll">
