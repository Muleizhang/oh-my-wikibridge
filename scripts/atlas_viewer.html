    if (interpretations) { renderInterpretations(); return; }

    const list = dimensionEntries(state.catalogTab);
    const nextClusterLabel = KIND_LABEL[defaultClusterFor(state.catalogTab)];
    $('catalogTitle').textContent = `${KIND_LABEL[state.catalogTab]}图录`;

    const grid = $('catalogGrid');
    grid.replaceChildren();

    for (const ent of list) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'entity-card';
      const col = colorFor(state.catalogTab, ent.name);
      card.style.setProperty('--card-tint', col);

      // Compute top sub-attribute summary chips (e.g. top materials inside an era, top motifs inside a material)
      const subCounts = new Map();
      const subKind = defaultClusterFor(state.catalogTab);
      for (const it of ent.items) {
        const vals = dimensionValues(it, subKind);
        for (const v of vals) subCounts.set(v, (subCounts.get(v) || 0) + 1);
      }
      const topSubs = [...subCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);

      const thumbsHtml = ent.items.slice(0, 4).map(it =>
        `<img src="${esc(it.thumbUrl)}" alt="" loading="lazy">`
      ).join('');
      const documentCount = ent.documentRecords?.length || 0;
      const properties = state.catalogTab === 'motif' ? getPatternAttributes(ent.name) : [];
      const propertyChips = properties.slice(0, 4).map(group => `<span>${esc(group.label)} · ${esc(group.value)}</span>`).join('');

      card.innerHTML = `
        <div class="entity-card-top">
          <h3>${esc(ent.name)}</h3>
          <span class="entity-count">${ent.count} 件${documentCount ? ` · ${documentCount} 处文献` : ''}</span>
        </div>
        <div class="entity-thumbs">${thumbsHtml}</div>
        <div class="entity-subchips">${topSubs.map(([k, v]) => `<span>${esc(k)} ${v}</span>`).join('')}${propertyChips}${documentCount ? '<span>保留正文对象与出处</span>' : ''}</div>
        <div class="entity-cta">
          <span>${ent.count ? `按${nextClusterLabel}聚类查看` : '查看文献记载与出处'}</span>
          <span>2D / 3D ↗</span>
        </div>
      `;
      card.onclick = () => openGraph(state.catalogTab, ent.id);
      grid.append(card);
    }

    populateTypeFilter($('specimenTypeFilter'), state.catalogTypeFilter);
    renderSpecimenGrid();
  }

  function openInterpretations(query = '') {
    closeDrawer();
    state.catalogTab = 'interpretation';
    $('interpretationSearch').value = query;
    $('interpretationKind').value = '';
    switchView('catalog');
  }

  function renderInterpretations() {
    $('catalogTitle').textContent = INTERPRETATION_CATALOGS[state.catalogTab] || '文献关系';
    const query = $('interpretationSearch').value.trim().toLowerCase();
    const kind = state.catalogTab === 'interpretation' ? $('interpretationKind').value : state.catalogTab;
    $('interpretationKind').value = kind;
    const entries = G.interpretations.filter(record => (!kind || record.kind === kind)
      && (!query || [record.subject.label, record.value, record.text].join(' ').toLowerCase().includes(query)));
    $('interpretationCount').textContent = `${entries.length} 条文献解释`;
    const cards = entries.map(record => {
      const card = document.createElement('article'); card.className = 'interpretation-card';
      card.dataset.interpretationId = record.id;
      const title = document.createElement('h3'); title.textContent = `${record.subject.label} → ${record.value}`;
      const source = document.createElement('span'); source.className = 'source-label';
      source.textContent = `${record.relationLabel} · ${record.locator}`;
      if (record.context) {
        const context = record.context;
        const scope = [...(context.cultures || []), ...(context.periods || []), ...(context.usages || [])];
        if (context.certainty === 'hypothesis') scope.push(`推测${context.certaintyMarkers?.length ? '（'+context.certaintyMarkers.join('、')+'）' : ''}`);
        if (scope.length) source.textContent += ` · ${scope.join(' · ')}`;
      }
      const proof = document.createElement('details');
      const summary = document.createElement('summary'); summary.textContent = '原文';
      const quote = document.createElement('p'); quote.textContent = record.text;
      proof.append(summary, quote);
      const actions = document.createElement('div'); actions.className = 'dock-group';
      const original = document.createElement('button'); original.type = 'button'; original.className = 'chip'; original.textContent = '查看原页';
      original.onclick = () => { clearStageOverlay(); state.currentPage = record.page; switchView('pages'); };
      const graphButton = document.createElement('button'); graphButton.type = 'button'; graphButton.className = 'chip'; graphButton.textContent = '查看关系';
      if (['symbolism', 'belief'].includes(record.kind)) graphButton.textContent = '查看属性';
      graphButton.onclick = () => showInterpretationGraph(record);
      actions.append(graphButton, original); card.append(title, source, proof, actions);
      return card;
    });
    if (!cards.length) { const empty = document.createElement('p'); empty.textContent = '暂无匹配的文献解释'; cards.push(empty); }
    $('catalogGrid').replaceChildren(...cards);
  }

  function showInterpretationGraph(record) {
    if (['symbolism', 'belief'].includes(record.kind)) {
      openPatternAttributes(record.subject.label, record.kind + ':' + patternAttributeKey(record.value, false));
      return;
    }
    const makeNode = (key, label, kind, x, color) => ({ key, label, kind, roleTag: record.relationLabel,
      sub: record.locator, x, y: 0, z: 0, tx: x, ty: 0, tz: 0, baseR: 36, color, sx: 0, sy: 0, sz: 0, sr: 36 });
    const subject = makeNode(`${record.subject.kind}:${record.subject.label}`, record.subject.label, record.subject.kind, -170, '#d48263');
    const valueKind = ({ symbolism: 'meaning', belief: 'belief', ritual: 'ritual', technique: 'technique', composition: 'composition' })[record.kind] || 'meaning';
    const meaning = makeNode(`${valueKind}:${record.value}`, record.value, valueKind, 170, '#74ad99');
    subject.hint = '点击浏览该对象的文献解释'; subject.onActivate = () => openInterpretations(record.subject.label);
    meaning.hint = '点击浏览相关文献关系'; meaning.onActivate = () => openInterpretations(record.value);
    applyStageOverlay({ type: 'interpretation', banner: `${record.subject.label} → ${record.value} · ${record.locator}`,
      graphScene: { kind: 'interpretation', nodes: [subject, meaning],
        edges: [{ from: subject, to: meaning, label: record.relationLabel, dashed: false, color: '#e2ba74', phase: 0 }], extent: 320 } }, true);
  }

  function renderSpecimenGrid() {
    const pageSize = 24;
    const filteredItems = G.items.filter(item => matchesArtifactType(item, state.catalogTypeFilter));
    const total = filteredItems.length;
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    state.catalogPage = Math.max(0, Math.min(totalPages - 1, state.catalogPage));
    const slice = filteredItems.slice(state.catalogPage * pageSize, (state.catalogPage + 1) * pageSize);

    const filterLabel = state.catalogTypeFilter === '__untyped__' ? '未标器类' : state.catalogTypeFilter;
    $('specimenHeading').textContent = `${filterLabel || '全部条目'} · ${total}`;
    const pager = $('specimenPager');
    pager.replaceChildren();
    if (totalPages > 1) {
      const prev = document.createElement('button');
      prev.type = 'button'; prev.className = 'chip'; prev.textContent = '‹';
      prev.disabled = state.catalogPage === 0;
      prev.onclick = () => { state.catalogPage--; renderSpecimenGrid(); };
      const info = document.createElement('span');
      info.className = 'dock-label';
      info.textContent = `${state.catalogPage + 1} / ${totalPages}`;
      const next = document.createElement('button');
      next.type = 'button'; next.className = 'chip'; next.textContent = '›';
      next.disabled = state.catalogPage >= totalPages - 1;
      next.onclick = () => { state.catalogPage++; renderSpecimenGrid(); };
      pager.append(prev, info, next);
    }

    const sg = $('specimenGrid');
    sg.replaceChildren();
    for (const it of slice) {
      const card = document.createElement('article');
      card.className = 'spec-card';

      const wrap = document.createElement('div');
      wrap.className = 'spec-img-wrap';
      wrap.onclick = () => openDrawer(it.id);
      const im = document.createElement('img');
      im.src = it.thumbUrl;
      im.alt = it.title;
      im.loading = 'lazy';
      wrap.append(im);

      const body = document.createElement('div');
      body.className = 'spec-body';
      const title = document.createElement('div');
      title.className = 'spec-title';
      title.textContent = it.title;
      title.onclick = () => openDrawer(it.id);

      const tags = document.createElement('div');
      tags.className = 'spec-tags';
      for (const type of it.artifactTypes) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = type;
        b.title = '器类';
        b.onclick = () => openGraph('artifact_type', type);
        tags.append(b);
      }
      for (const e of it.eraGroups.slice(0, 1)) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = e;
        b.onclick = () => openGraph('era', e);
        tags.append(b);
      }
      for (const m of it.materials.slice(0, 1)) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = m;
        b.onclick = () => openGraph('material', m);
        tags.append(b);
      }
      for (const mo of it.motifs.slice(0, 2)) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = mo;
        b.onclick = () => openGraph('motif', mo);
        tags.append(b);
      }
      body.append(title, tags);
      card.append(wrap, body);
      sg.append(card);
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     8. VIEW 4 — Original PDF Pages with BBox & Graph Jumps
     ═══════════════════════════════════════════════════════════════ */
  function renderPage(num, focusItemId = null) {
    const total = G.pages.length;
    state.currentPage = Math.max(1, Math.min(total, Number(num) || 1));
    const pageObj = G.pages[state.currentPage - 1];
    const volumePages = G.pagesByVolume.get(pageObj?.volume || '') || G.pages;
    const localMax = Math.max(...volumePages.map(p => p.volumePage || p.page));
    $('pageTitle').textContent = `原页 · ${sourcePageLabel(pageObj || { page: state.currentPage })}`;
    $('pageVolume').value = pageObj?.volume || '';
    $('pageInput').value = pageObj?.volumePage || state.currentPage;
    $('pageInput').max = localMax;
    $('pageTotal').textContent = `/ ${localMax}`;
    $('prevPage').disabled = state.currentPage <= 1;
    $('nextPage').disabled = state.currentPage >= total;
    $('pageScan').src = pageObj?.previewUrl || '';
    $('pageBbox').hidden = true;

    const list = G.sourceItems.filter(it => it.page === state.currentPage);
    const box = $('pageItems');
    box.replaceChildren();

    if (!list.length) {
      const empty = document.createElement('p');
      empty.style.color = 'var(--ink-3)';
      empty.textContent = '本页暂无提取条目';
      box.append(empty);
      return;
    }

    const selectItem = (it, cardEl) => {
      state.activePageItemId = it.id;
      box.querySelectorAll('.page-item-card').forEach(el => el.classList.toggle('active', el === cardEl));
      if (it.bbox) {
        const [x1, y1, x2, y2] = it.bbox;
        Object.assign($('pageBbox').style, {
          left: (x1 * 100) + '%', top: (y1 * 100) + '%',
          width: ((x2 - x1) * 100) + '%', height: ((y2 - y1) * 100) + '%',
        });
        $('pageBbox').hidden = false;
      } else {
        $('pageBbox').hidden = true;
      }
    };

    list.forEach((it, idx) => {
      const card = document.createElement('div');
      card.className = 'page-item-card';
      card.onclick = () => selectItem(it, card);

      const head = document.createElement('div');
      head.className = 'page-item-title';
      head.innerHTML = `<strong>${esc(it.title)}</strong><small>${esc(it.status || it.locator)}</small>`;
      const details = document.createElement('button');
      details.type = 'button'; details.className = 'mini-link'; details.textContent = '器物详情 ↗';
      details.onclick = event => { event.stopPropagation(); openDrawer(it.canonicalId, it.sourceRecordId); };
      head.append(details);
      card.append(head);

      if (it.quote) {
        const q = document.createElement('blockquote');
        q.className = 'proof-quote';
        q.textContent = it.quote;
        card.append(q);
      }

      const chips = document.createElement('div');
      chips.className = 'rel-chips';
      for (const type of it.artifactTypes) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'jump-pill artifact_type'; b.textContent = type;
        b.onclick = ev => { ev.stopPropagation(); openGraph('artifact_type', type); };
        chips.append(b);
      }
      for (const e of it.eraGroups) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'jump-pill era'; b.textContent = e;
        b.onclick = ev => { ev.stopPropagation(); openGraph('era', e); };
        chips.append(b);
      }
      for (const m of it.materials) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'jump-pill material'; b.textContent = m;
        b.onclick = ev => { ev.stopPropagation(); openGraph('material', m); };
        chips.append(b);
      }
      for (const mo of it.motifs) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'jump-pill motif'; b.textContent = mo;
        b.onclick = ev => { ev.stopPropagation(); openGraph('motif', mo); };
        chips.append(b);
      }
      if (chips.childElementCount) card.append(chips);
      box.append(card);

      if ((focusItemId && it.id === focusItemId) || (!focusItemId && idx === 0)) {
        selectItem(it, card);
      }
    });
  }

  /* ═══════════════════════════════════════════════════════════════
     9. Specimen & Proof Drawer + Entity Switcher + Command Palette
     ═══════════════════════════════════════════════════════════════ */
  function openDrawer(itemId, sourceRecordId = null) {
    const canonical = G.itemById.get(itemId) || G.canonicalBySource.get(itemId);
    if (!canonical) return;
    const requested = sourceRecordId || (!G.itemById.has(itemId) ? itemId : null);
    const it = canonical.sourceRecords.find(source => source.sourceRecordId === requested || source.sourceEntityId === requested || source.id === requested)
      || canonical.sourceRecords[0] || canonical;
    state.drawerItemId = canonical.id;
    state.drawerSourceRecordId = it.sourceRecordId;
    const sourceSelect = $('drawerSource');
    sourceSelect.replaceChildren();
    $('drawerSourceWrap').hidden = canonical.sourceRecords.length < 2;
    $('drawerIdentity').textContent = `按规则对齐 · ${canonical.sourceRecords.length} 条源图录 · 实物身份尚未独立核实`;
    for (const source of canonical.sourceRecords) {
      const option = document.createElement('option');
      option.value = source.sourceRecordId;
      option.textContent = `${source.locator || sourcePageLabel(source)} · ${source.title}`;
      sourceSelect.append(option);
    }
    sourceSelect.value = it.sourceRecordId;
    sourceSelect.onchange = () => openDrawer(canonical.id, sourceSelect.value);

    $('drawerTitle').textContent = canonical.title;
    $('drawerLoc').textContent = [it.locator, it.findspot ? it.findspot + '出土' : ''].filter(Boolean).join(' · ');
    $('drawerGotoPage').onclick = () => {
      state.currentPage = it.page;
      closeDrawer();
      switchView('pages');
      renderPage(it.page, it.id);
    };

    const sp = getSprite(it.thumbUrl);
    $('drawerFig').classList.toggle('mono', Boolean(sp?.isMono));
    const imageLabel = it.imageKind === 'artifact_candidate' ? '自动裁图候选'
      : it.imageKind === 'artifact' ? '器物截图' : '原书整页';
    const gallery = $('drawerGallery');
    gallery.replaceChildren();
    gallery.hidden = it.imageCandidates.length < 2;
    const showImage = (url, label, kind = imageLabel) => {
      const image = $('drawerImg');
      image.onerror = it.pageUrl && url !== it.pageUrl ? () => showImage(it.pageUrl, '', '原书整页') : null;
      image.src = url;
      image.alt = [it.title, kind, label].filter(Boolean).join(' · ');
      $('drawerFigBadge').textContent = `${kind}${label ? ' · ' + label : ''} · 点击放大`;
      $('drawerFig').onclick = () => openLightbox(url, [it.title, kind, label, it.locator].filter(Boolean).join(' · '));
      gallery.querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.url === url)));
    };
    if (it.imageCandidates.length > 1) {
      const images = [{imageUrl: it.plateUrl, label: `整组 ${it.imageCandidates.length} 图`},
        ...it.imageCandidates.map((image, index) => ({...image, label: `子图 ${index + 1}`}))];
      for (const image of images) {
        const button = document.createElement('button');
        button.type = 'button'; button.dataset.url = image.imageUrl;
        button.title = image.label; button.setAttribute('aria-label', image.label);
        const preview = document.createElement('img');
        preview.src = image.imageUrl; preview.alt = image.label; preview.loading = 'lazy';
        button.append(preview);
        button.onclick = () => showImage(image.imageUrl, image.label);
        gallery.append(button);
      }
    }
    showImage(it.plateUrl, it.imageCandidates.length > 1 ? `整组 ${it.imageCandidates.length} 图` : '');

    // Clickable relation jump pills (Era -> Material -> Motif)
    const rels = $('drawerRels');
    rels.replaceChildren();
    const addRelRow = (label, kind, predicate, values) => {
      const canPredict = Object.hasOwn(PREDICTION_DIMENSIONS, predicate) && dimensionEntries(kind).length > 0
        && !dimensionValues(canonical, kind).length;
      if (!values.length && !canPredict) return;
      const row = document.createElement('div');
      row.className = 'rel-row';
      const l = document.createElement('span');
      l.className = 'rel-label'; l.textContent = label;
      const wrap = document.createElement('div');
      wrap.className = 'rel-chips';
      if (!values.length) {
        const complete = document.createElement('button');
        complete.type = 'button';
        complete.className = 'mini-link';
        complete.textContent = '补全信息';
        complete.setAttribute('aria-label', `补全${label}信息`);
        complete.onclick = () => openArtifactPrediction(canonical.id, predicate);
        wrap.append(complete);
      }
      for (const v of values) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'jump-pill ' + kind;
        b.textContent = v;
        b.onclick = () => openGraph(kind, v);
        wrap.append(b);
      }
      row.append(l, wrap);
      rels.append(row);
    };
    addRelRow('时代', 'era', 'period', it.periods);
    addRelRow('材质', 'material', 'made_of', it.materials);
    addRelRow('纹样', 'motif', 'decorated_with', it.motifs);
    for (const motif of it.motifs) {
      if (!getPatternAttributes(motif).length) continue;
      const section = document.createElement('details'), summary = document.createElement('summary');
      summary.className = 'pattern-attribute-caption'; summary.textContent = motif + '的文献释义';
      section.open = true; section.append(summary);
      appendPatternAttributeRows(section, motif, group => openPatternAttributes(motif, group.key));
      rels.append(section);
    }
    addRelRow('器类', 'artifact_type', 'artifact_type', it.artifactTypes);
    for (const [kind, dim] of Object.entries(EXTRA_DIMENSIONS)) {
      if (kind === 'place') continue;
      addRelRow(dim.label, kind, dim.predicate, it[dim.field]);
    }
    for (const [pred, label] of [['excavated_at', '出土地点'], ['discovered_at', '发现地点'], ['collected_at', '采集地点']]) {
      addRelRow(label, 'place', null, [...new Set(it.rows.filter(row => row.predicate === pred).map(row => row.object))]);
    }
    for (const r of it.rows.filter(r => ['page_heading_inheritance', 'catalog_section_context', 'same_page_culture_context'].includes(r.origin))) {
      const note = document.createElement('p');
      note.style.cssText = 'font-size:12px;color:var(--ink-3)';
      const scope = r.binding?.scope;
      note.textContent = r.origin === 'catalog_section_context'
        ? `时代候选「${r.object}」来自原书分节标题（第 ${scope?.headingPage || scope?.startPage} 页），范围止于第 ${scope?.endPageExclusive} 页前，尚未人工确认。`
        : `${r.predicate === 'period' ? '时代' : '文化'}候选来自同页标题「${r.object}」（${sourcePageLabel(it)}），尚未人工确认。`;
      rels.append(note);
    }
    if (!rels.childElementCount) {
      const p = document.createElement('div');
      p.style.fontSize = '12px'; p.style.color = 'var(--ink-3)';
      p.textContent = '暂无已标注的时代、材质、纹样或器类关系';
      rels.append(p);
    }

    $('drawerQuote').textContent = it.quote || '';
    $('drawerQuote').hidden = !it.quote;
    $('drawerCapImg').src = it.captionUrl || '';
    $('drawerCapImg').hidden = !it.captionUrl;
    $('drawerPageImg').src = it.pageUrl || '';
    $('drawerPageWrap').hidden = !it.pageUrl;
    if (it.bbox) {
      const [x1, y1, x2, y2] = it.bbox;
      Object.assign($('drawerBbox').style, {
        left: (x1 * 100) + '%', top: (y1 * 100) + '%',
        width: ((x2 - x1) * 100) + '%', height: ((y2 - y1) * 100) + '%',
      });
      $('drawerBbox').hidden = false;
    } else {
      $('drawerBbox').hidden = true;
    }
    $('drawerPageWrap').onclick = () => {
      state.currentPage = it.page;
      closeDrawer();
      switchView('pages');
      renderPage(it.page, it.id);
    };

    $('drawer').classList.remove('closed');
    $('drawer').inert = false;
    document.body.classList.add('drawer-open');
  }

  function closeDrawer() {
    state.drawerItemId = null;
    state.drawerSourceRecordId = null;
    $('drawer').classList.add('closed');
    $('drawer').inert = true;
    document.body.classList.remove('drawer-open');
  }

  // Entity Switcher Popover (inside Graph view)
  let switcherKind = 'era';
  function openSwitcher() {
    const pop = $('switcherPop');
    if (!pop.hidden) { closeSwitcher(); return; }
    switcherKind = state.focusKind;
    $('switcherSearch').value = '';
    pop.hidden = false;
    renderSwitcherList();
    $('switcherSearch').focus();
  }
  function closeSwitcher() { $('switcherPop').hidden = true; }
  function renderSwitcherList() {
    $('switcherExtraDimension').value = Object.hasOwn(EXTRA_DIMENSIONS, switcherKind) ? switcherKind : '';
    $('switcherTabs').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-selected', String(b.dataset.kind === switcherKind));
    });
    const q = $('switcherSearch').value.trim().toLowerCase();
    const list = dimensionEntries(switcherKind);
    const el = $('switcherList');
    el.replaceChildren();
    for (const ent of list) {
      if (q && !ent.name.toLowerCase().includes(q)) continue;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (state.focusKind === switcherKind && state.focusId === ent.id ? ' active' : '');
      const col = colorFor(switcherKind, ent.name);
      b.innerHTML = `<span class="dot" style="background:${col}"></span><span>${esc(ent.name)}</span><span class="num">${ent.count}</span>`;
      b.onclick = () => openGraph(switcherKind, ent.id);
      el.append(b);
    }
  }

  // Quick Jump Command Palette
  let palItems = [], palIndex = 0;
  function openPalette() {
    $('paletteBackdrop').hidden = false;
    $('paletteInput').value = '';
    renderPalette();
    $('paletteInput').focus();
  }
  function closePalette() { $('paletteBackdrop').hidden = true; }
  function renderPalette() {
    const q = $('paletteInput').value.trim().toLowerCase();
    const res = $('paletteResults');
    res.replaceChildren();
    palItems = [];
    palIndex = 0;

    const addGroup = (title, entries) => {
      if (!entries.length) return;
      const g = document.createElement('div');
      g.className = 'palette-group';
      g.textContent = title;
      res.append(g);
      for (const e of entries) {
        const idx = palItems.length;
        palItems.push(e);
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'palette-item' + (idx === 0 ? ' selected' : '');
        b.innerHTML = `<span>${esc(e.label)}</span><small>${esc(e.meta)}</small>`;
        b.onclick = () => { closePalette(); e.action(); };
        res.append(b);
      }
    };

    const pageMatch = q.match(/^(\d+)$/);
    if (pageMatch) {
      const p = Number(pageMatch[1]);
      const targets = G.pages.filter(page => (page.volumePage || page.page) === p);
      addGroup('原页', targets.map(page => ({ label: sourcePageLabel(page), meta: '原页核读',
        action: () => { state.currentPage = page.page; switchView('pages'); } })));
    }

    addGroup('时代 · 按材质聚类', G.eras.filter(e => !q || e.name.toLowerCase().includes(q)).slice(0, 8)
      .map(e => ({ label: e.name, meta: `${e.count} 条`, action: () => openGraph('era', e.id) })));
    addGroup('材质 · 按纹样聚类', G.materials.filter(m => !q || m.name.toLowerCase().includes(q)).slice(0, 8)
      .map(m => ({ label: m.name, meta: `${m.count} 条`, action: () => openGraph('material', m.id) })));
    addGroup('纹样 · 按时代聚类', G.motifs.filter(m => !q || m.name.toLowerCase().includes(q)).slice(0, 12)
      .map(m => ({ label: m.name, meta: `${m.count} 条`, action: () => openGraph('motif', m.id) })));
    addGroup('器类 · 按纹样聚类', G.artifactTypes.filter(type => !q || type.name.toLowerCase().includes(q)).slice(0, 12)
      .map(type => ({ label: type.name, meta: `${type.count} 条`, action: () => openGraph('artifact_type', type.id) })));
    for (const [kind, dim] of Object.entries(EXTRA_DIMENSIONS)) {
      if (!q && kind !== 'technique') continue;
      addGroup(dim.label, dimensionEntries(kind).filter(entry => !q || entry.name.toLowerCase().includes(q)).slice(0, 6)
        .map(entry => ({ label: entry.name, meta: `${entry.count} 条`, action: () => openGraph(kind, entry.id) })));
    }
    if (q) {
      addGroup('文献关系', G.interpretations.filter(record =>
        `${record.subject.label} ${record.value}`.toLowerCase().includes(q)).slice(0, 10)
        .map(record => ({ label: `${record.subject.label} → ${record.value}`, meta: record.locator,
          action: () => openInterpretations(record.subject.label) })));
      addGroup('源图录', G.sourceItems.filter(i => i.title.toLowerCase().includes(q)).slice(0, 20)

  function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function shouldPaintView(view, kind, now) {
    const filterKey = kind === 'graph' ? JSON.stringify(state.graphFilters) : '';
    const key = [view.w, view.h, view.dpr, currentTheme(), spriteRevision, state.drawerItemId,
      kind === 'river' ? view.hoveredItem?.key : view.hoveredNode?.item.id,
      kind === 'graph' ? view.hoveredNode?.cluster.id : '',
      kind === 'river' ? view.hoveredEra : view.hoveredCluster?.id,
      state.riverHighlightEra, state.riverHighlightMat, state.riverDatedOnly, state.riverTypeFilter,
      state.focusKind, state.focusId, state.clusterBy, state.dim, filterKey].join('|');
    const cameraMoving = Math.abs(view.panX - view.targetPanX) > .08
      || Math.abs(view.panY - view.targetPanY) > .08 || Math.abs(view.zoom - view.targetZoom) > .0001;
    const graphMoving = kind === 'graph' && ((state.dim === '3d' && (Math.abs(view.yaw - view.targetYaw) > .0001
      || Math.abs(view.pitch - view.targetPitch) > .0001 || Math.abs(view.velYaw) > .00005 || Math.abs(view.velPitch) > .00005))
      || (!stageOverlay?.graphScene && (view.clusters.some(c => Math.abs(c.x-c.tx) + Math.abs(c.y-c.ty) + Math.abs(c.z-c.tz) > .1)
      || view.nodes.some(n => Math.abs(n.x-n.tx) + Math.abs(n.y-n.ty) + Math.abs(n.z-n.tz) > .1))));
    const changed = view.lastRenderKey !== key || view.lastOverlay !== stageOverlay;
    const graphAnimation = kind === 'graph' && Boolean(stageOverlay?.graphScene || graphAutoRotates() || view.revealing);
    if (!changed && !cameraMoving && !graphMoving && !view.dragging && !graphAnimation) return false;
    if (!changed && !cameraMoving && !graphMoving && graphAnimation && !view.revealing && now - view.lastDrawAt < 32) return false;
    view.lastRenderKey = key; view.lastOverlay = stageOverlay; view.lastDrawAt = now;
    return true;
  }

  function tick(now) {
    const t = now * 0.001;
    spriteFrameTime = now;
    if (G && !document.hidden) {
      if (state.view === 'river' && river.pendingPointer) {
        const pointer = river.pendingPointer; river.pendingPointer = null;
        hitTestRiver(pointer.x, pointer.y);
      }
      if (state.view === 'graph' && graph.pendingPointer) {
        const pointer = graph.pendingPointer;
        graph.pendingPointer = null;
        hitTestGraph(pointer.x, pointer.y);
      }
      if (state.view === 'river') {
        if (shouldPaintView(river, 'river', now)) drawRiver();
        drawRiverFlow(now);
      }
      else if (state.view === 'graph' && shouldPaintView(graph, 'graph', now)) drawGraph(t);
      if (spriteWorkers && spritePriorityIds.size && now-lastSpritePriorityHint > 100) {
        const hint = { kind: 'priority', ids: [...spritePriorityIds], stamp: now };
        for (const worker of spriteWorkers) worker.postMessage(hint);
        spritePriorityIds.clear(); lastSpritePriorityHint = now;
      }
    }
    requestAnimationFrame(tick);
  }

  async function loadManifest() {
    const manifestURL = new URL('manifest.json', document.baseURI);
    const inline = $('data')?.textContent?.trim();
    if (inline && inline.startsWith('{')) return { manifest: JSON.parse(inline), manifestURL };
    const res = await fetch(manifestURL);
    if (!res.ok) throw new Error(`无法读取 manifest.json（HTTP ${res.status}）`);
    return { manifest: await res.json(), manifestURL: res.url || manifestURL };
  }
