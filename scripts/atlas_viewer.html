<script>
(() => {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════
     1. Generic Knowledge Graph Engine (Zero Book-Specific Rules)
     ═══════════════════════════════════════════════════════════════ */

  // Universal Chinese historical chronology table (works across Vol 1, 2, 3 & any future volume)
  const DYNASTY_TABLE = [
    { group: '新石器时代', re: /新石器|原始社会|仰韶|半坡|庙底沟|马家窑|半山|马厂|河姆渡|良渚|龙山|大汶口|红山|裴李岗|磁山|屈家岭|马家浜|大溪/ },
    { group: '夏代', re: /夏代|二里头|夏文化/ },
    { group: '商代', re: /商|殷/ },
    { group: '周代', re: /周代|周朝/ },
    { group: '西周', re: /西周/ },
    { group: '东周', re: /东周/ },
    { group: '春秋', re: /春秋/ },
    { group: '战国', re: /战国/ },
    { group: '秦代', re: /秦/ },
    { group: '汉代', re: /西汉|东汉|两汉|汉/ },
    { group: '三国', re: /三国|曹魏|蜀汉|孙吴/ },
    { group: '魏晋南北朝', re: /魏晋|两晋|西晋|东晋|南北朝|北朝|南朝|十六国|北魏|东魏|西魏|北齐|北周/ },
    { group: '隋代', re: /隋/ },
    { group: '唐代', re: /唐/ },
    { group: '五代', re: /五代|十国/ },
    { group: '宋代', re: /北宋|南宋|宋|辽|金|西夏/ },
    { group: '元代', re: /元/ },
    { group: '明代', re: /明/ },
    { group: '清代', re: /清/ },
    { group: '近现代', re: /民国|近代|现代|当代/ },
  ];

  function eraChronology(label) {
    if (!label) return { order: 999, group: '未标时代', sub: 5 };
    let idx = DYNASTY_TABLE.findIndex(d => d.re.test(label));
    if (idx < 0) return { order: 9990, group: '待核时代', sub: 5 };
    const group = DYNASTY_TABLE[idx].group;
    let sub = 4;
    if (/初|早|前/.test(label)) sub = 1;
    else if (/中/.test(label)) sub = 4;
    else if (/后/.test(label)) sub = 7;
    else if (/晚|末/.test(label)) sub = 9;
    // Place 东周 seamlessly between 西周 and 春秋
    return { order: idx * 10 + sub, group, sub };
  }

  function hashStr(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  // Generic mineral / Morandi color resolver for ANY material, era, or motif name
  const MATERIAL_HUES = [
    { re: /彩陶|红陶/, dark: '#D47F5B', light: '#A64D2C' },
    { re: /白陶|瓷|青瓷/, dark: '#C7C1B2', light: '#6F6A5F' },
    { re: /黑陶|灰陶/, dark: '#9A968F', light: '#524F4A' },
    { re: /陶/, dark: '#C29B74', light: '#825F3E' },
    { re: /青铜|铜/, dark: '#77A894', light: '#356B57' },
    { re: /玉|翠|玛瑙/, dark: '#93B9A3', light: '#47725B' },
    { re: /金/, dark: '#E0BE74', light: '#997428' },
    { re: /银|锡/, dark: '#B6C0CC', light: '#5B6775' },
    { re: /铁/, dark: '#8C94A0', light: '#4A515C' },
    { re: /漆|朱/, dark: '#CD6D64', light: '#973831' },
    { re: /木|竹/, dark: '#B48E65', light: '#785735' },
    { re: /丝|锦|绣|绢|织|布|帛|罗|绫/, dark: '#A894C4', light: '#624E82' },
    { re: /象牙|骨|角|牙|贝|蚌/, dark: '#D6C6A4', light: '#81704C' },
    { re: /石|砖|瓦|壁画/, dark: '#93A3B8', light: '#4E5F75' },
  ];

  const MORANDI_PALETTE_DARK = [
    '#D49B6A', '#7EA897', '#C97B63', '#8E9FC4', '#B79BC2',
    '#CBB679', '#7FA5B5', '#C28A8E', '#97B08A', '#B89B82',
  ];
  const MORANDI_PALETTE_LIGHT = [
    '#9A5C32', '#3B6E5B', '#9E4B35', '#475B82', '#6F507C',
    '#8A7130', '#3E687A', '#8B4D54', '#4F6E44', '#7C6047',
  ];

  const colorCache = new Map();
  function colorFor(kind, name, theme = currentTheme()) {
    const key = `${theme}:${kind}:${name}`;
    if (colorCache.has(key)) return colorCache.get(key);
    const value = resolveColor(kind, name, theme);
    colorCache.set(key, value);
    return value;
  }

  function resolveColor(kind, name, theme) {
    if (!name || name.startsWith('未标')) return theme === 'dark' ? '#6D717C' : '#969189';
    if (kind === 'material') {
      const m = MATERIAL_HUES.find(r => r.re.test(name));
      if (m) return theme === 'dark' ? m.dark : m.light;
    }
    const pal = theme === 'dark' ? MORANDI_PALETTE_DARK : MORANDI_PALETTE_LIGHT;
    const idx = kind === 'era'
      ? Math.max(0, DYNASTY_TABLE.findIndex(d => d.group === eraChronology(name).group))
      : hashStr(kind + ':' + name);
    return pal[idx % pal.length];
  }

  const rgbCache = new Map();
  function hexAlpha(hex, a) {
    let rgb = rgbCache.get(hex);
    if (!rgb) {
      const h = hex.replace('#', '');
      rgb = `${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)}`;
      rgbCache.set(hex, rgb);
    }
    return `rgba(${rgb},${a})`;
  }

  let canvasFontFamily = '';
  function canvasFont() {
    return canvasFontFamily || (canvasFontFamily = getComputedStyle(document.body).fontFamily);
  }

  function inViewport(x, y, radius, width, height) {
    return x + radius >= 0 && y + radius >= 0 && x - radius <= width && y - radius <= height;
  }

  function lineInViewport(ax, ay, bx, by, width, height) {
    return Math.max(ax, bx) >= -4 && Math.max(ay, by) >= -4
      && Math.min(ax, bx) <= width + 4 && Math.min(ay, by) <= height + 4;
  }

  function paintBackdrop(ctx, view, dark, kind) {
    const { w, h, dpr } = view;
    const key = `${w}:${h}:${dpr}:${dark}:${kind}`;
    if (view.backdropKey !== key) {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      const bg = canvas.getContext('2d');
      bg.setTransform(dpr, 0, 0, dpr, 0, 0);
      const isRiver = kind === 'river';
      const grad = bg.createRadialGradient(w * .5, h * (isRiver ? .48 : .52), isRiver ? 40 : 20,
        w * .5, h * (isRiver ? .5 : .52), Math.max(w, h) * (isRiver ? .72 : .68));
      const stops = isRiver
        ? (dark ? [[0, '#131722'], [.55, '#0b0d14'], [1, '#07080c']] : [[0, '#fcfaf5'], [.65, '#f6f3eb'], [1, '#eee9de']])
        : (dark ? [[0, '#141824'], [.6, '#0b0d13'], [1, '#07090d']] : [[0, '#fdfcf9'], [.65, '#f6f4ee'], [1, '#ede8dd']]);
      for (const [offset, color] of stops) grad.addColorStop(offset, color);
      bg.fillStyle = grad; bg.fillRect(0, 0, w, h);
      for (const s of view.stars) {
        bg.fillStyle = dark ? `rgba(232,224,205,${s.a})` : `rgba(50,45,38,${s.a * .45})`;
        bg.beginPath(); bg.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2); bg.fill();
      }
      view.backdrop = canvas; view.backdropKey = key;
    }
    ctx.drawImage(view.backdrop, 0, 0, w, h);
  }

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') || 'dark';
  }

  /* ═══════════════════════════════════════════════════════════════
     2. Build Normalized In-Memory Graph from Pure manifest.json
     ═══════════════════════════════════════════════════════════════ */
  function buildGraphModel(manifest) {
    const evMap = new Map((manifest.evidence || []).map(e => [e.id, e]));
    const rowsByArt = new Map();
    for (const r of (manifest.rows || [])) {
      if (!rowsByArt.has(r.artifactId)) rowsByArt.set(r.artifactId, []);
      rowsByArt.get(r.artifactId).push(r);
    }

    // Build complete artifact list from manifest.items (fallback to unique rows if items absent)
    const rawItems = (manifest.items && manifest.items.length)
      ? manifest.items
      : [...new Map((manifest.rows || []).map(r => [r.artifactId, r])).values()];

    const normalizeItem = (it, idx, sourceRows = null) => {
      const rs = sourceRows || rowsByArt.get(it.artifactId) || [];
      const periods = [...new Set(rs.filter(r => r.predicate === 'period').map(r => r.object))];
      const materials = [...new Set(rs.filter(r => r.predicate === 'made_of').map(r => r.object))];
      const motifs = [...new Set(rs.filter(r => r.predicate === 'decorated_with').map(r => r.object))];
      const techniques = [...new Set(rs.filter(r => r.predicate === 'uses_technique').map(r => r.object))];
      const artifactTypes = [...new Set([...(it.artifactTypes || []), ...rs.filter(r => r.predicate === 'artifact_type').map(r => r.object)])];
      const extraValues = Object.fromEntries(Object.entries(EXTRA_DIMENSIONS).map(([kind, dim]) =>
        [dim.field, [...new Set([...(it[dim.field] || []), ...rs.filter(r => predToKind(r.predicate) === kind).map(r => r.object)])]]));
      const eraGroups = [...new Set(periods.map(p => eraChronology(p).group))];
      const ev = evMap.get(it.evidenceId) || {};
      const thumbUrl = it.detailUrl || it.imageUrl || ev.previewUrl || '';
      const plateUrl = it.imageUrl || it.detailUrl || ev.previewUrl || '';
      const pageUrl = it.pageUrl || ev.previewUrl || '';
      const imageKind = it.imageKind || (it.imageUrl && it.imageUrl !== pageUrl ? 'artifact' : 'page');
      return {
        idx,
        id: it.artifactId,
        title: it.artifact || it.item || it.artifactId,
        page: Number(it.page || ev.ordinal || 1),
        volume: it.volume || '',
        volumePage: it.volumePage || ev.volumePage || it.page || ev.ordinal || 1,
        sourceName: it.sourceName || ev.sourceName || '',
        locator: it.locator || ev.locator || '',
        status: it.status || '',
        findspot: it.findspot || '',
        observation: it.observation || '',
        quote: it.quote || ev.text || '',
        periods,
        eraGroups,
        materials,
        motifs,
        techniques,
        ...extraValues,
        artifactTypes,
        rows: rs,
        thumbUrl,
        plateUrl,
        imageKind,
        imageCandidates: it.imageCandidates || [],
        imageReviewStatus: it.imageReviewStatus || '',
        sourceRecordId: it.sourceRecordId || it.artifactId,
        sourceEntityId: it.sourceEntityId || '',
        canonicalId: it.canonicalArtifactId || it.artifactId,
        identityDecision: it.identityDecision || '',
        captionUrl: it.captionUrl || ev.captionUrl || '',
        pageUrl,
        bbox: ev.bbox || null,
        hasPeriod: periods.length > 0,
        hasRelation: rs.length > 0,
      };
    };
    const items = rawItems.map((item, index) => normalizeItem(item, index));
    const itemById = new Map(items.map(item => [item.id, item]));
    const sourceRowsById = new Map();
    for (const row of (manifest.sourceRows || manifest.rows || [])) {
      if (row.projectionStatus === 'superseded' || row.supersededBy?.length || row.reviewStatus === 'rejected') continue;
      const key = row.sourceRecordId || row.artifactId;
      if (!sourceRowsById.has(key)) sourceRowsById.set(key, []);
      sourceRowsById.get(key).push(row);
    }
    const rawSources = manifest.sourceItems || rawItems.flatMap(item => item.sourceRecords?.length ? item.sourceRecords : [item]);
    const sourceItems = rawSources.map((source, index) => normalizeItem(source, index,
      sourceRowsById.get(source.sourceRecordId || source.artifactId) || []));
    const sourceById = new Map();
    const canonicalBySource = new Map();
    const sourcesByCanonical = new Map();
    for (const source of sourceItems) {
      for (const key of [source.id, source.sourceRecordId, source.sourceEntityId].filter(Boolean)) sourceById.set(key, source);
      const canonical = itemById.get(source.canonicalId) || itemById.get(source.id);
      if (!sourcesByCanonical.has(source.canonicalId)) sourcesByCanonical.set(source.canonicalId, []);
      sourcesByCanonical.get(source.canonicalId).push(source);
      if (canonical) for (const key of [source.id, source.sourceRecordId, source.sourceEntityId].filter(Boolean)) canonicalBySource.set(key, canonical);
    }
    for (const item of items) {
      const raw = rawItems[item.idx];
      item.sourceRecords = sourcesByCanonical.get(item.id) || [];
      if (!item.sourceRecords.length && raw.sourceRecords?.length) item.sourceRecords = raw.sourceRecords.map((source, index) => {
        const normalized = sourceById.get(source.sourceRecordId || source.artifactId) || normalizeItem(source, index);
        canonicalBySource.set(normalized.id, item);
        return normalized;
      });
      if (!item.sourceRecords.length) item.sourceRecords = [sourceById.get(item.id) || item];
    }

    // Aggregate canonical Era entries (grouped cleanly by dynasty family, preserving raw sub-periods)
    const eraMap = new Map();
    for (const it of items) {
      for (const p of it.periods) {
        const ch = eraChronology(p);
        if (!eraMap.has(ch.group)) {
          eraMap.set(ch.group, { id: ch.group, name: ch.group, order: ch.order, subPeriods: new Set(), items: [] });
        }
        const entry = eraMap.get(ch.group);
        entry.subPeriods.add(p);
        if (!entry.itemIds) entry.itemIds = new Set();
        if (!entry.itemIds.has(it.id)) { entry.itemIds.add(it.id); entry.items.push(it); }
        entry.order = Math.min(entry.order, ch.order);
      }
    }
    const eras = [...eraMap.values()]
      .sort((a, b) => a.order - b.order)
      .map(e => ({ ...e, subPeriods: [...e.subPeriods].sort((a, b) => eraChronology(a).order - eraChronology(b).order), count: e.items.length }));

    // Aggregate Materials (exact manifest values)
    const matMap = new Map();
    for (const it of items) {
      for (const m of it.materials) {
        if (!matMap.has(m)) matMap.set(m, { id: m, name: m, items: [] });
        matMap.get(m).items.push(it);
      }
    }
    const materials = [...matMap.values()]
      .sort((a, b) => b.items.length - a.items.length || a.name.localeCompare(b.name, 'zh-Hans'))
      .map(m => ({ ...m, count: m.items.length }));

    // Aggregate Motifs (exact manifest values)
    const motifMap = new Map();
    for (const it of items) {
      for (const mo of it.motifs) {
        if (!motifMap.has(mo)) motifMap.set(mo, { id: mo, name: mo, items: [] });
        motifMap.get(mo).items.push(it);
      }
    }
    const motifs = [...motifMap.values()]
      .sort((a, b) => b.items.length - a.items.length || a.name.localeCompare(b.name, 'zh-Hans'))
      .map(m => ({ ...m, count: m.items.length }));

    const typeMap = new Map();
    for (const it of items) {
      for (const type of it.artifactTypes) {
        if (!typeMap.has(type)) typeMap.set(type, { id: type, name: type, items: [] });
        typeMap.get(type).items.push(it);
      }
    }
    const artifactTypes = [...typeMap.values()]
      .sort((a, b) => b.items.length - a.items.length || a.name.localeCompare(b.name, 'zh-Hans'))
      .map(type => ({ ...type, count: type.items.length }));
    const extraEntries = {};
    for (const [kind, dim] of Object.entries(EXTRA_DIMENSIONS)) {
      const entries = new Map();
      for (const item of items) for (const value of item[dim.field]) {
        if (!entries.has(value)) entries.set(value, { id: value, name: value, items: [] });
        entries.get(value).items.push(item);
      }
      const list = [...entries.values()].map(entry => ({ ...entry, count: entry.items.length }))
        .sort((a, b) => b.count-a.count || a.name.localeCompare(b.name, 'zh-Hans'));
      extraEntries[dim.field] = list;
      extraEntries[kind+'ById'] = new Map(list.map(entry => [entry.id, entry]));
    }

    // The river is an ordered period index, not a duration or popularity scale.
    const eraPos = new Map();
    eras.forEach((e, i) => {
      e.t0 = 0.025 + i / eras.length * 0.95;
      e.t1 = 0.025 + (i + 1) / eras.length * 0.95;
      e.tMid = (e.t0 + e.t1) * 0.5;
      eraPos.set(e.name, [e.t0, e.t1]);
    });
    for (const it of items) {
      const seg = eraPos.get(it.eraGroups[0]);
      const r1 = (hashStr(it.id + ':x') % 10000) / 10000;
      it.riverT = seg ? seg[0] + (seg[1] - seg[0]) * (0.06 + r1 * 0.88) : null;
      it.riverLane = ((hashStr(it.id + ':y') % 10000) / 10000 - 0.5) * 2;
    }

    const pages = (manifest.pages && manifest.pages.length)
      ? manifest.pages
      : [...new Set(items.map(i => i.page))].sort((a, b) => a - b).map(p => ({
          page: p,
          previewUrl: items.find(i => i.page === p)?.pageUrl || '',
          entries: items.filter(i => i.page === p).length,
        }));

    const pagesByVolume = new Map();
    for (const page of pages) {
      const key = page.volume || '';
      if (!pagesByVolume.has(key)) pagesByVolume.set(key, []);
      pagesByVolume.get(key).push(page);
    }

    // Index document-backed pattern properties once; never inherit them onto
    // artifact records or change the graph's nodes, edges or clustering.
    const patternAttributes = new Map();
    for (const record of manifest.interpretations || []) {
      if (!['symbolism', 'belief'].includes(record.kind)) continue;
      const subject = patternAttributeKey(record.subject.label);
      if (!patternAttributes.has(subject)) patternAttributes.set(subject, new Map());
      const groups = patternAttributes.get(subject), key = record.kind + ':' + patternAttributeKey(record.value, false);
      if (!groups.has(key)) groups.set(key, { key, kind: record.kind, value: record.value,
        label: record.kind === 'symbolism' ? '象征意义' : '信仰关联', records: [] });
      groups.get(key).records.push(record);
    }

    return {
      title: manifest.title || '纹样知识图谱',
      interpretations: manifest.interpretations || [],
      patternAttributes,
      volumes: manifest.volumes || [],
      pagesByVolume,
      items,
      itemById,
      sourceItems,
      sourceById,
      canonicalBySource,
      identityVersion: manifest.artifactIdentity?.version || null,
      eras,
      eraById: new Map(eras.map(e => [e.id, e])),
      materials,
      matById: new Map(materials.map(m => [m.id, m])),
      motifs,
      motifById: new Map(motifs.map(m => [m.id, m])),
      artifactTypes,
      typeById: new Map(artifactTypes.map(type => [type.id, type])),
      ...extraEntries,
      pages,
      evMap,
    };
  }

  /* ═══════════════════════════════════════════════════════════════
     3. Smart Generic Circular Sprite Cache (Auto Color vs Ink)
     ═══════════════════════════════════════════════════════════════ */
  const spriteCache = new Map();
  const spriteQueue = [];
  const spriteBakeQueue = [];
  const spriteWorkerBakeQueue = [];
  const spriteWorkerJobs = new Map();
  let activeSpriteJobs = 0;
  let activeSpriteBakes = 0;
  let lastSpriteTrim = 0;
  let spriteFrameTime = 0;
  let spriteWorkers = null;
  let spriteWorkersDisabled = false;
  let nextSpriteJob = 0;
  let spriteBakeScheduled = false;
  const spritePriorityIds = new Set();
  let lastSpritePriorityHint = 0;
  let spriteRevision = 0;
  let onSpriteReady = () => { spriteRevision++; };

  function takeVisibleSpriteJob(queue) {
    let best = 0;
    for (let i = 1; i < queue.length; i++) {
      if (queue[i].rec.lastUsed > queue[best].rec.lastUsed
          || (queue[i].rec.lastUsed === queue[best].rec.lastUsed
            && queue[i].rec.priority > queue[best].rec.priority)) best = i;
    }
    return queue.splice(best, 1)[0];
  }

  function finishSpriteJob() {
    activeSpriteJobs--;
    onSpriteReady();
    pumpSprites();
    const now = performance.now();
    if (spriteCache.size > 256 && now - lastSpriteTrim > 5000) {
      lastSpriteTrim = now;
      for (const [key, rec] of spriteCache) {
        if (rec.status !== 'loading' && !rec.bakePending && now - rec.lastUsed > 15000) {
          if (rec.dark?.close) rec.dark.close();
          if (rec.light !== rec.dark && rec.light?.close) rec.light.close();
          spriteCache.delete(key);
        }
      }
    }
  }

  function releaseSpriteBitmaps(rec) {
    if (rec.dark?.close) rec.dark.close();
    if (rec.light !== rec.dark && rec.light?.close) rec.light.close();
  }

  function disableSpriteWorkers() {
    spriteWorkersDisabled = true;
    for (const worker of spriteWorkers || []) worker.terminate();
    spriteWorkers = null;
    for (const job of spriteWorkerJobs.values()) {
      if (job.kind === 'load') { activeSpriteJobs--; spriteQueue.push(job); }
      else { activeSpriteBakes--; job.rec.bakePending = false; }
    }
    for (const job of spriteWorkerBakeQueue) job.rec.bakePending = false;
    spriteWorkerBakeQueue.length = 0;
    spriteWorkerJobs.clear();
    pumpSprites();
  }

  function pumpWorkerSpriteBakes() {
    if (!spriteWorkers) return;
    while (spriteWorkerBakeQueue.length) {
      const job = takeVisibleSpriteJob(spriteWorkerBakeQueue);
      const id = ++nextSpriteJob;
      activeSpriteBakes++;
      job.rec.workerBakeId = id;
      spriteWorkerJobs.set(id, { ...job, kind: 'bake' });
      spriteWorkers[1 + id % 2].postMessage({ id, kind: 'bake', blob: job.blob });
    }
  }

  function getSpriteWorkers() {
    if (spriteWorkersDisabled || !window.Worker || !window.OffscreenCanvas || !window.createImageBitmap) return null;
    if (spriteWorkers) return spriteWorkers;
    try {
      // Image fetching/decoding has its own worker. Expensive tinting cannot hold
      // up the next thumbnail's first paint, even if the UI thread stays busy.
      const source = bakeMedallionSprites.toString() + `
        const pending = [];
        let active = 0;
        function drain() {
          const limit = pending[0]?.kind === 'load' ? 12 : 1;
          while (pending.length && active < limit) {
            let best = 0;
            for (let i=1; i<pending.length; i++) if ((pending[i].priority||0) > (pending[best].priority||0)) best=i;
            const data = pending.splice(best, 1)[0];
            active++;
            process(data).finally(() => { active--; drain(); });
          }
        }
        self.onmessage = ({ data }) => {
          if (data.kind === 'priority') {
            const ids = new Set(data.ids);
            for (const job of pending) if (ids.has(job.id)) job.priority = data.stamp;
          } else pending.push(data);
          drain();
        };
        async function process(data) {
          let image;
          try {
            let blob = data.blob;
            if (data.kind === 'load') {
              const response = await fetch(data.url);
              if (!response.ok) throw new Error('Thumbnail HTTP ' + response.status);
              blob = await response.blob();
            }
            image = await createImageBitmap(blob);
            if (data.kind === 'load') {
              const side = Math.min(image.width, image.height);
              const preview = await createImageBitmap(image, (image.width-side)/2, (image.height-side)/2, side, side,
                { resizeWidth: 96, resizeHeight: 96, resizeQuality: 'low' });
              self.postMessage({ id: data.id, preview, blob }, [preview]);
            } else {
              const rec = {};
              bakeMedallionSprites(image, rec, 128, () => new OffscreenCanvas(1, 1));
              const dark = rec.dark.transferToImageBitmap();
              const light = rec.light === rec.dark ? dark : rec.light.transferToImageBitmap();
              self.postMessage({ id: data.id, dark, light, isMono: rec.isMono }, dark === light ? [dark] : [dark, light]);
            }
          } catch (error) {
            self.postMessage({ id: data.id, error: String(error) });
          } finally { if (image) image.close(); }
        };`;
      const url = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
      spriteWorkers = [];
      for (let i = 0; i < 3; i++) {
        const worker = new Worker(url);
        spriteWorkers.push(worker);
        worker.onerror = event => { event.preventDefault(); disableSpriteWorkers(); };
        worker.onmessage = ({ data }) => {
          const job = spriteWorkerJobs.get(data.id);
          if (!job) {
            data.preview?.close(); data.dark?.close(); if (data.light !== data.dark) data.light?.close();
            return;
          }
          spriteWorkerJobs.delete(data.id);
          if (job.kind === 'load') {
            job.rec.workerLoadId = null;
            if (data.error) { loadSpriteFallback(job); return; }
            Object.assign(job.rec, { dark: data.preview, light: data.preview, preview: true,
              rawPreview: true, status: 'preview', bakePending: true });
            spriteWorkerBakeQueue.push({ url: job.url, rec: job.rec, blob: data.blob });
            pumpWorkerSpriteBakes();
            finishSpriteJob();
          } else {
            activeSpriteBakes--;
            job.rec.workerBakeId = null;
            job.rec.bakePending = false;
            if (!data.error) {
              releaseSpriteBitmaps(job.rec);
              Object.assign(job.rec, { dark: data.dark, light: data.light, isMono: data.isMono,
                status: 'ready', rawPreview: false, preview: false });
            }
            onSpriteReady();
            pumpWorkerSpriteBakes();
          }
        };
      }
      URL.revokeObjectURL(url);
      return spriteWorkers;
    } catch { disableSpriteWorkers(); return null; }
  }

  function scheduleSpriteBake() {
    if (spriteBakeScheduled || !spriteBakeQueue.length) return;
    spriteBakeScheduled = true;
    // This fallback never holds a network slot while waiting for idle time.
    const run = () => {
      spriteBakeScheduled = false;
      const start = performance.now();
      do {
        const { rec, image } = takeVisibleSpriteJob(spriteBakeQueue);
        try { bakeMedallionSprites(image, rec); rec.status = 'ready'; }
        catch { rec.status = rec.dark ? 'preview' : 'error'; }
        rec.bakePending = false;
        onSpriteReady();
      } while (spriteBakeQueue.length && performance.now() - start < 5);
      scheduleSpriteBake();
    };
    if (window.requestIdleCallback) window.requestIdleCallback(run, { timeout: 50 });
    else setTimeout(run, 0);
  }

  function loadSpriteFallback(job) {
    const { url, rec } = job;
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => {
      try {
        const image = document.createElement('canvas');
        const scale = Math.min(1, 256 / Math.max(img.naturalWidth, img.naturalHeight));
        image.width = Math.max(1, Math.round(img.naturalWidth * scale));
        image.height = Math.max(1, Math.round(img.naturalHeight * scale));
        image.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0, image.width, image.height);
        releaseSpriteBitmaps(rec);
        const preview = document.createElement('canvas');
        preview.width = preview.height = 96;
        const ctx = preview.getContext('2d');
        const side = Math.min(image.width, image.height);
        ctx.beginPath(); ctx.arc(48, 48, 47, 0, Math.PI*2); ctx.clip();
        ctx.drawImage(image, (image.width-side)/2, (image.height-side)/2, side, side, 0, 0, 96, 96);
        rec.dark = rec.light = preview;
        rec.rawPreview = false;
        rec.status = 'preview'; rec.preview = true; rec.bakePending = true;
        spriteBakeQueue.push({ rec, image });
        scheduleSpriteBake();
      } catch { rec.status = 'error'; }
      finishSpriteJob();
    };
    img.onerror = () => { rec.status = 'error'; finishSpriteJob(); };
    img.src = url;
  }

  function pumpSprites() {
    const workers = getSpriteWorkers();
    // Browsers and the loader worker bound actual network concurrency. Dispatch
    // all visible requests now so a busy drawing frame cannot stall the queue.
    while (spriteQueue.length) {
      const job = takeVisibleSpriteJob(spriteQueue);
      activeSpriteJobs++;
      if (workers) {
        const id = ++nextSpriteJob;
        job.rec.workerLoadId = id;
        spriteWorkerJobs.set(id, { ...job, kind: 'load' });
        workers[0].postMessage({ id, kind: 'load', url: new URL(job.url, location.href).href });
      } else loadSpriteFallback(job);
    }
  }

  function getSprite(url, priority = 0) {
    if (!url) return null;
    const stamp = spriteFrameTime || performance.now();
    let rec = spriteCache.get(url);
    if (rec) {
      rec.priority = rec.lastUsed === stamp ? Math.max(rec.priority, priority) : priority;
      rec.lastUsed = stamp;
      if (rec.workerLoadId) spritePriorityIds.add(rec.workerLoadId);
      if (rec.workerBakeId) spritePriorityIds.add(rec.workerBakeId);
      return rec;
    }
    rec = { status: 'loading', isMono: false, dark: null, light: null, lastUsed: stamp, priority };
    spriteCache.set(url, rec);
    spriteQueue.push({ url, rec });
    pumpSprites();
    return rec;
  }

  function spriteBitmap(rec, dark) {
    return rec ? (dark ? rec.dark : rec.light) : null;
  }

  function paintSprite(ctx, rec, bitmap, x, y, radius) {
    if (rec.rawPreview) {
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.clip();
    }
    ctx.drawImage(bitmap, x-radius, y-radius, radius*2, radius*2);
    if (rec.rawPreview) ctx.restore();
  }

  function bakeMedallionSprites(img, rec, sz = 128, makeCanvas = () => document.createElement('canvas')) {
    const sw = img.naturalWidth || img.width;
    const sh = img.naturalHeight || img.height;
    if (!sw || !sh) throw new Error('Empty thumbnail');

    // 1) Fast 64x64 analysis to auto-detect monochrome ink drawing vs color photograph
    const aSize = 64;
    const ac = makeCanvas();
    ac.width = aSize;
    ac.height = aSize;
    const actx = ac.getContext('2d', { willReadFrequently: true });
    actx.drawImage(img, 0, 0, aSize, aSize);
    const data = actx.getImageData(0, 0, aSize, aSize).data;

    let satSum = 0, whiteCount = 0;
    let minX = aSize, minY = aSize, maxX = 0, maxY = 0, inkCount = 0;
    const total = aSize * aSize;

    for (let y = 0; y < aSize; y++) {
      for (let x = 0; x < aSize; x++) {
        const i = (y * aSize + x) * 4;
        const r = data[i], g = data[i + 1], b = data[i + 2];
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        satSum += (mx - mn);
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        if (lum > 218) whiteCount++;
        if (lum < 195 && x > 1 && x < aSize - 2 && y > 1 && y < aSize - 2) {
          inkCount++;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    const avgSat = satSum / total;
    const whiteRatio = whiteCount / total;
    const isMono = avgSat < 18 && whiteRatio > 0.30;
    rec.isMono = isMono;

    // Determine crisp source crop rectangle
    let sx = 0, sy = 0, cw = sw, ch = sh;
    if (isMono && inkCount > 25 && (maxX - minX) >= 8 && (maxY - minY) >= 8) {
      // Tight crop around ink motif with balanced square framing
      const pad = 3;
      const bx1 = Math.max(0, minX - pad) / aSize * sw;
      const by1 = Math.max(0, minY - pad) / aSize * sh;
      const bx2 = Math.min(aSize, maxX + pad + 1) / aSize * sw;
      const by2 = Math.min(aSize, maxY + pad + 1) / aSize * sh;
      sx = bx1; sy = by1; cw = bx2 - bx1; ch = by2 - by1;
    } else {
      // Center square cover for color plates
      const side = Math.min(sw, sh);
      sx = (sw - side) * 0.5;
      sy = (sh - side) * 0.5;
      cw = side;
      ch = side;
    }

    const rad = sz * 0.5;

    if (!isMono) {
      // Rich natural color circular medallion (used in both Dark & Light modes)
      const c = makeCanvas();
      c.width = sz; c.height = sz;
      const ctx = c.getContext('2d');
      ctx.save();
      ctx.beginPath();
      ctx.arc(rad, rad, rad - 1, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, sx, sy, cw, ch, 0, 0, sz, sz);
      // Gentle archival edge vignette
      const vig = ctx.createRadialGradient(rad, rad, rad * 0.55, rad, rad, rad);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.22)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, sz, sz);
      ctx.restore();
      rec.dark = c;
      rec.light = c;
    } else {
      // Render monochrome ink drawing onto clean buffer, then tint into Dark Gold-Ink & Light Sumi-Ink!
      const raw = makeCanvas();
      raw.width = sz; raw.height = sz;
      const rctx = raw.getContext('2d', { willReadFrequently: true });
      rctx.fillStyle = '#ffffff';
      rctx.fillRect(0, 0, sz, sz);
      const scale = Math.min((sz - 20) / cw, (sz - 20) / ch);
      const dw = cw * scale, dh = ch * scale;
      rctx.drawImage(img, sx, sy, cw, ch, (sz - dw) * 0.5, (sz - dh) * 0.5, dw, dh);
      const px = rctx.getImageData(0, 0, sz, sz).data;

      // Dark sprite: obsidian disc (#141822) + glowing warm antique ivory/gold ink (#E7D2AE)
      const dc = makeCanvas();
      dc.width = sz; dc.height = sz;
      const dctx = dc.getContext('2d');
      const dImg = dctx.createImageData(sz, sz);

      // Light sprite: pure cotton paper (#FAF8F3) + crisp sumi charcoal ink (#221E1A)
      const lc = makeCanvas();
      lc.width = sz; lc.height = sz;
      const lctx = lc.getContext('2d');
      const lImg = lctx.createImageData(sz, sz);

      const rr = (rad - 1) * (rad - 1);
      for (let y = 0; y < sz; y++) {
        for (let x = 0; x < sz; x++) {
          const dx = x - rad + 0.5, dy = y - rad + 0.5;
          const dist2 = dx * dx + dy * dy;
          const o = (y * sz + x) * 4;
          if (dist2 > rr) {
            dImg.data[o + 3] = 0;
            lImg.data[o + 3] = 0;
            continue;
          }
          const lum = 0.299 * px[o] + 0.587 * px[o + 1] + 0.114 * px[o + 2];
          // Map ink intensity [0..1], cleanly suppressing paper bleed-through > 212
          const ink = Math.max(0, Math.min(1, (214 - lum) / 168));
          const edgeAlpha = dist2 > (rad - 2.5) * (rad - 2.5)
            ? Math.max(0, Math.min(1, (rad - 1 - Math.sqrt(dist2)) / 1.5)) * 255
            : 255;

          // Dark medallion: interpolate obsidian (20,24,34) -> luminous warm gold-ivory (236,214,174)
          dImg.data[o] = Math.round(20 + ink * 216);
          dImg.data[o + 1] = Math.round(24 + ink * 190);
          dImg.data[o + 2] = Math.round(34 + ink * 140);
          dImg.data[o + 3] = Math.round(edgeAlpha);

          // Light medallion: interpolate paper (250,248,243) -> sumi ink (34,30,26)
          lImg.data[o] = Math.round(250 - ink * 216);
          lImg.data[o + 1] = Math.round(248 - ink * 218);
          lImg.data[o + 2] = Math.round(243 - ink * 217);
          lImg.data[o + 3] = Math.round(edgeAlpha);
        }
      }
      dctx.putImageData(dImg, 0, 0);
      lctx.putImageData(lImg, 0, 0);
      rec.dark = dc;
      rec.light = lc;
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     4. Application State & Router
     ═══════════════════════════════════════════════════════════════ */
  let G = null;

  const state = {
    view: 'river', // 'river' | 'graph' | 'catalog' | 'pages'
    // River state
    riverDatedOnly: false,
    riverHighlightEra: null,
    riverHighlightMat: null,
    riverTypeFilter: '',
    // Graph state
    focusKind: 'era',
    focusId: '',
    clusterBy: 'material',
    dim: '2d',             // '2d' | '3d'
    showUnlabeled: true,
    history: [],           // navigation trail [{kind, id, clusterBy}]
    // Catalog state
    catalogTab: 'era',
    catalogPage: 0,
    catalogTypeFilter: '',
    // Pages state
    currentPage: 1,
    activePageItemId: null,
    // Drawer
    drawerItemId: null,
  };

  function defaultClusterFor(kind) {
    if (kind === 'era') return 'material';   // 查看某时代的纹样 → 默认按材质聚类
    if (kind !== 'motif') return 'motif';
    return 'era';                            // 查看某纹样 → 默认按时代聚类
  }

  function clusterOptionsFor(kind) {
    const first = defaultClusterFor(kind);
    return [first, ...Object.keys(DIMENSIONS).filter(k => k !== kind && k !== first && dimensionEntries(k).length)]
      .map(k => [k, '按' + KIND_LABEL[k]]);
  }

  const DIMENSIONS = {
    era: { label: '时代', list: 'eras', index: 'eraById', values: 'eraGroups' },
    material: { label: '材质', list: 'materials', index: 'matById', values: 'materials' },
    motif: { label: '纹样', list: 'motifs', index: 'motifById', values: 'motifs' },
    artifact_type: { label: '器类', list: 'artifactTypes', index: 'typeById', values: 'artifactTypes' },
    ...Object.fromEntries(Object.entries(EXTRA_DIMENSIONS).map(([kind, dim]) =>
      [kind, { label: dim.label, list: dim.field, index: kind+'ById', values: dim.field }])),
  };
  const KIND_LABEL = Object.fromEntries(Object.entries(DIMENSIONS).map(([kind, dim]) => [kind, dim.label]));
  const dimensionEntries = kind => G[DIMENSIONS[kind]?.list] || [];
  const dimensionIndex = kind => G[DIMENSIONS[kind]?.index];
  const dimensionValues = (item, kind) => item[DIMENSIONS[kind]?.values] || [];

  const $ = id => document.getElementById(id);

  function sourcePageLabel(item) {
    return `${item.volume ? item.volume + ' · ' : ''}PDF 第 ${item.volumePage || item.page} 页`;
  }

  function patternAttributeKey(label, motif = true) {
    const value = String(label || '').normalize('NFKC').replace(/\s+/g, '');
    return motif ? value.replace(/纹(?:样)?$/, '') : value;
  }

  function getPatternAttributes(subject) {
    return [...(G.patternAttributes.get(patternAttributeKey(subject))?.values() || [])];
  }

  function appendPatternAttributeRows(target, subject, select) {
    const groups = getPatternAttributes(subject);
    for (const kind of ['symbolism', 'belief']) {
      const values = groups.filter(group => group.kind === kind);
      if (!values.length) continue;
      const row = document.createElement('div'); row.className = 'pattern-attribute-row';
      const label = document.createElement('span'); label.className = 'pattern-attribute-label'; label.textContent = values[0].label;
      const tags = document.createElement('div'); tags.className = 'pattern-attribute-values';
      for (const group of values) {
        const button = document.createElement('button'); button.type = 'button';
        button.className = 'pattern-attribute ' + kind; button.textContent = group.value;
        button.dataset.attributeKey = group.key; button.setAttribute('aria-pressed', 'false');
        button.title = `查看${group.records.length}处原文`; button.onclick = () => select(group);
        tags.append(button);
      }
      row.append(label, tags); target.append(row);
    }
  }

  function renderGraphPatternAttributes() {
    const panel = $('graphAttributes');
    const subject = stageOverlay?.type === 'attributes' ? stageOverlay.attributeSubject
      : !stageOverlay && state.focusKind === 'motif' ? state.focusId : null;
    const groups = subject ? getPatternAttributes(subject) : [];
    panel.hidden = !groups.length;
    if (!groups.length) { panel.dataset.subject = ''; return; }
    if (panel.dataset.subject === subject) return;
    panel.dataset.subject = subject;
    $('graphAttributeTitle').textContent = `${subject}的属性`;
    $('graphAttributeRows').replaceChildren();
    $('graphAttributeEvidence').hidden = true;
    appendPatternAttributeRows($('graphAttributeRows'), subject, group => showPatternAttributeEvidence(subject, group));
  }

  function showPatternAttributeEvidence(subject, group) {
    const panel = $('graphAttributes'), proof = $('graphAttributeEvidence');
    panel.querySelector('details').open = true;
    panel.querySelectorAll('.pattern-attribute').forEach(button =>
      button.setAttribute('aria-pressed', String(button.dataset.attributeKey === group.key)));
    const header = document.createElement('header'), title = document.createElement('strong');
    title.textContent = `${subject} · ${group.label} · ${group.value}`;
    const close = document.createElement('button'); close.type = 'button'; close.className = 'chip'; close.textContent = '收起原文';
    close.onclick = () => { proof.hidden = true; panel.querySelectorAll('.pattern-attribute').forEach(b => b.setAttribute('aria-pressed', 'false')); };
    header.append(title, close);
    const sources = group.records.map(record => {
      const article = document.createElement('article'), locator = document.createElement('span');
      locator.className = 'source-label'; locator.textContent = record.locator || sourcePageLabel(record);
      const quote = document.createElement('blockquote'); quote.textContent = record.text;
      const original = document.createElement('button'); original.type = 'button'; original.className = 'chip'; original.textContent = '查看原页';
      original.onclick = () => { clearStageOverlay(); closeDrawer(); state.currentPage = record.page; switchView('pages'); };
      article.append(locator, quote, original); return article;
    });
    proof.replaceChildren(header, ...sources); proof.hidden = false;
  }

  function openPatternAttributes(subject, selectedKey = null) {
    closeDrawer();
    const entry = G.motifById.get(subject) || G.motifs.find(m => patternAttributeKey(m.name) === patternAttributeKey(subject));
    if (entry) openGraph('motif', entry.id);
    else {
      const node = { key: 'pattern-property:' + subject, label: subject, kind: 'motif', roleTag: '纹样属性',
        x: 0, y: 0, z: 0, tx: 0, ty: 0, tz: 0, baseR: 48, color: colorFor('motif', subject),
        sx: 0, sy: 0, sz: 0, sr: 48, hint: '在左侧查看该纹样的属性与出处' };
      applyStageOverlay({ type: 'attributes', attributeSubject: subject, banner: subject + ' · 属性与出处',
        graphScene: { kind: 'attributes', nodes: [node], edges: [], extent: 230 } }, true);
      renderGraphPatternAttributes();
      syncHash();
    }
    const group = getPatternAttributes(subject).find(g => g.key === selectedKey);
    if (group) showPatternAttributeEvidence(subject, group);
  }

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('atlas-theme', theme); } catch {}
    $('themeLabel').textContent = theme === 'dark' ? '深空' : '宣纸';
    $('themeIcon').innerHTML = theme === 'dark'
      ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/>';
    if (G) {
      renderRiverDock();
      if (state.view === 'graph') renderGraphHud();
      if (state.view === 'catalog') renderCatalog();
    }
  }

  function openGraph(kind, id, opts = {}) {
    if (!Object.hasOwn(DIMENSIONS, kind)) kind = 'era';
    // Normalize era sub-period to macro-era group if needed
    if (kind === 'era' && !G.eraById.has(id)) {
      const grp = eraChronology(id).group;
      if (G.eraById.has(grp)) id = grp;
    }
    // Validate entity exists, fallback gracefully
    if (!dimensionIndex(kind).has(id)) id = dimensionEntries(kind)[0]?.id || '';
    if (!id) {
      // Fallback to whichever taxonomy has entries
      kind = Object.keys(DIMENSIONS).find(k => dimensionEntries(k).length) || 'era';
      id = dimensionEntries(kind)[0]?.id || '';
    }

    const pushHistory = opts.pushHistory !== false;
    if (pushHistory && state.view === 'graph' && (state.focusKind !== kind || state.focusId !== id)) {
      state.history.push({ kind: state.focusKind, id: state.focusId, clusterBy: state.clusterBy });
      if (state.history.length > 16) state.history.shift();
    }

    state.focusKind = kind;
    state.focusId = id;
    state.clusterBy = clusterOptionsFor(kind).some(([k]) => k === opts.clusterBy) ? opts.clusterBy : defaultClusterFor(kind);
    if (opts.dim) state.dim = opts.dim;
    if (!opts.keepOverlay && typeof clearStageOverlay === 'function') clearStageOverlay();
    closeSwitcher();
    switchView('graph', false, true);
    syncHash();
  }

  function switchView(view, updateHash = true, resetGraphCamera = false) {
    state.view = view;
    $('view-river').hidden = view !== 'river';
    $('view-graph').hidden = view !== 'graph';
    $('view-catalog').hidden = view !== 'catalog';
    $('view-pages').hidden = view !== 'pages';
    hideTip();
    closeSwitcher();

    document.querySelectorAll('.nav-tabs button').forEach(btn => {
      if (btn.dataset.view === view) btn.setAttribute('aria-current', 'page');
      else btn.removeAttribute('aria-current');
    });

    if (view === 'river') {
      resizeRiver();
    } else if (view === 'graph') {
      if (!state.focusId) {
        const defaultKind = Object.keys(DIMENSIONS).find(k => dimensionEntries(k).length) || 'era';
        const defaultId = dimensionEntries(defaultKind)[0]?.id || '';
        state.focusKind = defaultKind;
        state.focusId = defaultId;
        state.clusterBy = defaultClusterFor(defaultKind);
      }
      resizeGraph();
      rebuildGraphScene(resetGraphCamera);
      renderGraphHud();
    } else if (view === 'catalog') {
      renderCatalog();
    } else if (view === 'pages') {
      renderPage(state.currentPage);
    }

    if (updateHash) syncHash();
  }

  function syncHash() {
    let next = '#river';
    if (state.view === 'graph' && stageOverlay?.type === 'attributes') {
      next = `#graph/attributes/${encodeURIComponent(stageOverlay.attributeSubject)}?dim=${state.dim}`;
    } else if (state.view === 'graph' && state.focusId) {
      next = `#graph/${state.focusKind}/${encodeURIComponent(state.focusId)}?by=${state.clusterBy}&dim=${state.dim}`;
    } else if (state.view === 'catalog') {
      next = `#catalog/${state.catalogTab}`;
    } else if (state.view === 'pages') {
      next = `#page/${state.currentPage}`;
    }
    if (location.hash !== next) history.replaceState(null, '', next);
  }

  function applyHash() {
    const raw = location.hash.slice(1);
    if (!raw || raw === 'river') { switchView('river', false); return; }
    const [path, qs] = raw.split('?');
    const parts = path.split('/');
    const params = new URLSearchParams(qs || '');
    if (parts[0] === 'graph' && parts[1] === 'attributes' && parts[2]) {
      state.dim = params.get('dim') === '3d' ? '3d' : '2d';
      openPatternAttributes(decodeURIComponent(parts[2]));
    } else if (parts[0] === 'graph' && parts[1] && parts[2]) {
      openGraph(parts[1], decodeURIComponent(parts[2]), {
        clusterBy: params.get('by') || undefined,
        dim: params.get('dim') === '3d' ? '3d' : (params.get('dim') === '2d' ? '2d' : undefined),
        pushHistory: false,
      });
    } else if (parts[0] === 'catalog') {
      state.catalogTab = parts[1] === 'interpretation' || Object.hasOwn(DIMENSIONS, parts[1]) ? parts[1] : 'era';
      switchView('catalog', false);
    } else if (parts[0] === 'page') {
      state.currentPage = Math.max(1, Math.min(G.pages.length, Number(parts[1]) || 1));
      switchView('pages', false);
    } else {
      switchView('river', false);
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     5. VIEW 1 — Full-Bleed Historical River Canvas Engine
     ═══════════════════════════════════════════════════════════════ */
  const river = {
    canvas: null, ctx: null, w: 0, h: 0, dpr: 1,
    panX: 0, panY: 0, zoom: 1, targetPanX: 0, targetPanY: 0, targetZoom: 1,
    mouseX: -9999, mouseY: -9999, dragging: false, dragMoved: false,
    dragSX: 0, dragSY: 0, hoveredItem: null, hoveredEra: null,
    stars: [], nodes: [], groups: [], visibleNodes: [], layoutVersion: 0,
  };

  function initRiver() {
    river.canvas = $('riverCanvas');
    river.ctx = river.canvas.getContext('2d');
    river.flowCanvas = $('riverFlowCanvas');
    river.flowCtx = river.flowCanvas.getContext('2d');
    river.motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    river.stars = Array.from({ length: 320 }, (_, i) => ({
      x: ((i * 7919) % 10000) / 10000, y: ((i * 104729) % 10000) / 10000,
      r: 0.5 + (i % 5) * 0.28, a: 0.08 + (i % 7) * 0.032,
    }));
    river.nodes = G.items.map(it => ({ item: it, baseR: 15, sx: NaN, sy: NaN, sr: 15,
      seed: (hashStr(it.id + ':glimmer') % 10000) / 10000 }));
    river.undated = river.nodes.filter(n => !n.item.hasPeriod);
    $('riverUndated').onclick = () => openRiverGroup({ members: river.filteredUndated, count: river.filteredUndated.length, pending: true });
    $('riverGroupClose').onclick = () => { $('riverGroup').hidden = true; };
    $('riverZoomIn').onclick = () => zoomRiver(1.5);
    $('riverZoomOut').onclick = () => zoomRiver(1 / 1.5);
    $('riverReset').onclick = resetRiver;
    renderRiverDock();
    bindRiverEvents();
    resizeRiver();
  }

  function matchesArtifactType(item, filter) {
    return !filter || (filter === '__untyped__' ? !item.artifactTypes.length : item.artifactTypes.includes(filter));
  }

  function populateTypeFilter(select, value) {
    const makeOption = (id, label) => {
      const option = document.createElement('option'); option.value = id; option.textContent = label;
      return option;
    };
    select.replaceChildren(makeOption('', '全部器类'), ...G.artifactTypes.map(type => makeOption(type.id, `${type.name} (${type.count})`)),
      makeOption('__untyped__', `未标器类 (${G.items.filter(item => !item.artifactTypes.length).length})`));
    select.value = value;
  }

  function updateRiverTypeFilter() {
    river.filteredUndated = river.undated.filter(n => matchesArtifactType(n.item, state.riverTypeFilter));
    $('riverUndated').textContent = `时代待定 · ${river.filteredUndated.length}`;
    $('riverUndated').hidden = state.riverDatedOnly || !river.filteredUndated.length;
    $('riverGroup').hidden = true;
    river.hoveredItem = null;
    river.pendingPointer = null;
    hideTip();
  }

  function renderRiverDock() {
    populateTypeFilter($('riverTypeFilter'), state.riverTypeFilter);
    updateRiverTypeFilter();
    const erasEl = $('riverEras');
    erasEl.replaceChildren();
    const eraLbl = document.createElement('span');
    eraLbl.className = 'dock-label';
    eraLbl.textContent = '时代';
    erasEl.append(eraLbl);
    for (const e of G.eras) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      const col = colorFor('era', e.name);
      b.innerHTML = `<span class="dot" style="background:${col}"></span><span>${esc(e.name)}</span><span class="num">${e.count}</span>`;
      b.onmouseenter = () => { river.hoveredEra = e.name; state.riverHighlightEra = e.name; };
      b.onmouseleave = () => { river.hoveredEra = null; state.riverHighlightEra = null; };
      b.onclick = () => openGraph('era', e.id);
      erasEl.append(b);
    }

    const matsEl = $('riverMats');
    matsEl.replaceChildren();
    const matLbl = document.createElement('span');
    matLbl.className = 'dock-label';
    matLbl.textContent = '材质';
    matsEl.append(matLbl);
    for (const m of G.materials.slice(0, 8)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      const col = colorFor('material', m.name);
      b.innerHTML = `<span class="dot" style="background:${col}"></span><span>${esc(m.name)}</span><span class="num">${m.count}</span>`;
      b.onmouseenter = () => { state.riverHighlightMat = m.name; };
      b.onmouseleave = () => { state.riverHighlightMat = null; };
      b.onclick = () => openGraph('material', m.id);
      matsEl.append(b);
    }
    if (G.materials.length > 8) {
      const more = document.createElement('button');
      more.type = 'button';
      more.className = 'chip';
      more.textContent = `+${G.materials.length - 8}`;
      more.onclick = () => { state.catalogTab = 'material'; switchView('catalog'); };
      matsEl.append(more);
    }
  }

  function resizeRiver() {
    if (!river.canvas) return;
    const w = window.innerWidth, h = window.innerHeight;
    const changed = river.w !== w || river.h !== h;
    river.dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    river.w = w; river.h = h;
    for (const canvas of [river.canvas, river.flowCanvas]) {
      canvas.width = Math.round(w * river.dpr);
      canvas.height = Math.round(h * river.dpr);
    }
    river.lastRenderKey = null; river.lastFlowAt = 0;
    if (!changed) return;
    river.layoutVersion++;
    buildRiverCurve();
    const breadth = Math.min(105, Math.max(50, river.mapHeight * .2));
    for (const n of river.nodes) {
      if (n.item.riverT === null) { n.wx = NaN; n.wy = NaN; continue; }
      const p = riverPoint(n.item.riverT), lane = n.item.riverLane;
      // A dense current with sparse, wide banks. Seeded positions never shuffle on a redraw.
      const envelope = .6 + .4 * Math.sin(n.item.riverT * 25 + 1.2) ** 2;
      const bank = Math.sign(lane) * Math.pow(Math.abs(lane), 1.45);
      const roomX = Math.max(8, Math.min(p.x - 24, w - 24 - p.x)) / Math.max(.15, Math.abs(p.nx));
      const roomY = Math.max(8, Math.min(p.y - 195, river.mapBottom + 22 - p.y)) / Math.max(.15, Math.abs(p.ny));
      const spread = Math.min(breadth * envelope, roomX, roomY);
      const drift = (n.seed - .5) * 24;
      n.wx = p.x + p.nx * bank * spread + p.tx * drift;
      n.wy = p.y + p.ny * bank * spread + p.ty * drift;
    }
    placeRiverLabels();
  }

  function buildRiverCurve() {
    const { w, h } = river;
    const dockHeight = $('riverEras').closest('.river-dock').getBoundingClientRect().height;
    const top = Math.min(230, h * .30), bottom = Math.max(top + 190, h - dockHeight - 58);
    river.mapBottom = bottom; river.mapHeight = bottom - top;
    const margin = Math.max(30, w * .035), span = w - margin * 2;
    // Uneven meanders fold the long current back into the viewport. No straight lanes or circular turns.
    const anchors = [
      [.06,.17], [.22,.08], [.40,.21], [.61,.03], [.81,.10], [.94,.29],
      [.79,.46], [.60,.39], [.43,.58], [.24,.43], [.07,.53], [.10,.77],
      [.28,.91], [.48,.78], [.69,.94], [.92,.76],
    ].map(([x, y]) => ({ x: margin + x * span, y: top + y * (bottom - top) }));
    const points = [];
    let distance = 0, previous = null;
    for (let seg = 0; seg < anchors.length - 1; seg++) {
      const p0 = anchors[Math.max(0, seg - 1)], p1 = anchors[seg];
      const p2 = anchors[seg + 1], p3 = anchors[Math.min(anchors.length - 1, seg + 2)];
      for (let step = seg ? 1 : 0; step <= 48; step++) {
        const t = step / 48, t2 = t * t, t3 = t2 * t;
        const at = axis => .5 * (2*p1[axis] + (-p0[axis]+p2[axis])*t
          + (2*p0[axis]-5*p1[axis]+4*p2[axis]-p3[axis])*t2
          + (-p0[axis]+3*p1[axis]-3*p2[axis]+p3[axis])*t3);
        const x = at('x'), y = at('y');
        if (previous) distance += Math.hypot(x - previous.x, y - previous.y);
        const point = { x, y, distance };
        points.push(point); previous = point;
      }
    }
    points.forEach((p, i) => {
      const a = points[Math.max(0, i - 1)], b = points[Math.min(points.length - 1, i + 1)];
      const length = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      p.tx = (b.x - a.x) / length; p.ty = (b.y - a.y) / length;
    });
    river.curve = points; river.curveLength = distance;
  }

  // Sample the cached spline by distance so chronology progresses evenly through bends.
  function riverPoint(t) {
    const points = river.curve, distance = Math.max(0, Math.min(1, t)) * river.curveLength;
    let lo = 0, hi = points.length - 1;
    while (lo + 1 < hi) {
      const mid = (lo + hi) >>> 1;
      if (points[mid].distance < distance) lo = mid; else hi = mid;
    }
    const a = points[lo], b = points[hi];
    const u = (distance - a.distance) / (b.distance - a.distance || 1);
    const tx = a.tx + (b.tx - a.tx) * u, ty = a.ty + (b.ty - a.ty) * u;
    const length = Math.hypot(tx, ty) || 1;
    return { x: a.x + (b.x-a.x)*u, y: a.y + (b.y-a.y)*u,
      tx: tx/length, ty: ty/length, nx: -ty/length, ny: tx/length };
  }

  function placeRiverLabels() {
    const placed = [];
    for (const era of G.eras) {
      const p = riverPoint(era.tMid), width = era.name.length * 14 + 26;
      let best = null, bestScore = Infinity;
      for (const offset of [-76, 76, -108, 108, -50, 50]) {
        const x = Math.max(width/2+16, Math.min(river.w-width/2-16, p.x+p.nx*offset));
        const y = Math.max(202, Math.min(river.mapBottom+24, p.y+p.ny*offset));
        const box = [x-width/2, y-18, x+width/2, y+18];
        const overlap = placed.reduce((sum, b) => sum + Math.max(0,Math.min(box[2]+8,b[2])-Math.max(box[0]-8,b[0]))
          * Math.max(0,Math.min(box[3]+8,b[3])-Math.max(box[1]-8,b[1])), 0);
        const score = overlap * 10 + Math.abs(offset) + (y < 215 && x < 630 ? 180 : 0);
        if (score < bestScore) { bestScore = score; best = { x, y, box }; }
      }
      era.riverLabel = best; placed.push(best.box);
    }
  }

  function riverToScreen(x, y) {
    return { x: river.w * .5 + (x - river.w * .5) * river.zoom + river.panX,
      y: river.h * .5 + (y - river.h * .5) * river.zoom + river.panY };
  }

  function zoomRiver(factor, x = river.w * .5, y = river.h * .5) {
    const next = Math.max(.65, Math.min(8, river.targetZoom * factor));
    const ratio = next / river.targetZoom, cx = x - river.w * .5, cy = y - river.h * .5;
    river.targetPanX = cx - (cx - river.targetPanX) * ratio;
    river.targetPanY = cy - (cy - river.targetPanY) * ratio;
    river.targetZoom = next;
    river.hoveredItem = null;
    hideTip();
  }

  function resetRiver() {
    river.targetPanX = 0; river.targetPanY = 0; river.targetZoom = 1;
    river.hoveredItem = null; river.hoveredEra = null;
    $('riverGroup').hidden = true;
    hideTip();
  }

  function openRiverGroup(node, page = 0) {
    const members = node.members;
    const start = page * 40, end = Math.min(start + 40, members.length);
    $('riverGroupTitle').textContent = node.pending ? `时代待定 · ${members.length} 条图录` : `此处聚合 ${members.length} 条图录`;
    $('riverGroupZoom').hidden = !Number.isFinite(node.wx);
    $('riverGroupZoom').onclick = () => {
      const next = Math.min(8, river.targetZoom * 2);
      river.targetPanX = -(node.wx - river.w * .5) * next;
      river.targetPanY = -(node.wy - river.h * .5) * next;
      river.targetZoom = next;
      $('riverGroup').hidden = true;
      hideTip();
    };
    const rows = members.slice(start, end).map(n => {
      const it = n.item, button = document.createElement('button');
      button.type = 'button'; button.className = 'river-group-item';
      const label = document.createElement('span'); label.textContent = it.title;
      const source = document.createElement('small');
      source.textContent = `${sourcePageLabel(it)} · ${[it.periods.join('、') || '尚未标注时代', it.artifactTypes.join('、')].filter(Boolean).join(' · ')}`;
      button.append(label, source);
      button.onclick = () => { $('riverGroup').hidden = true; openDrawer(it.id); };
      return button;
    });
    $('riverGroupList').replaceChildren(...rows);
    $('riverGroupList').scrollTop = 0;
    const foot = $('riverGroupFoot');
    foot.replaceChildren();
    const label = document.createElement('span');
    label.textContent = `${start + 1}—${end} / ${members.length} 条`;
    foot.append(label);
    for (const [text, target] of [['上一页', page - 1], ['下一页', page + 1]]) {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'chip'; button.textContent = text;
      button.disabled = target < 0 || target * 40 >= members.length;
      button.onclick = () => openRiverGroup(node, target);
      foot.append(button);
    }
    $('riverGroup').hidden = false;
  }

  function bindRiverEvents() {
    const c = river.canvas;
    c.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      river.dragging = true; river.dragMoved = false;
      river.hoveredItem = null; river.hoveredEra = null; river.pendingPointer = null;
      river.dragSX = e.clientX; river.dragSY = e.clientY;
      c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', e => {
      river.mouseX = e.clientX; river.mouseY = e.clientY;
      if (river.dragging) {
        const dx = e.clientX - river.dragSX, dy = e.clientY - river.dragSY;
        if (Math.hypot(dx, dy) > 3) river.dragMoved = true;
        river.targetPanX += dx; river.targetPanY += dy;
        river.dragSX = e.clientX; river.dragSY = e.clientY;
        hideTip();
      } else river.pendingPointer = { x: e.clientX, y: e.clientY };
    });
    c.addEventListener('pointerup', e => {
      if (!river.dragging) return;
      river.dragging = false;
      if (river.dragMoved) return;
      hitTestRiver(e.clientX, e.clientY);
      const n = river.hoveredItem;
      if (n) {
        if (n.count > 1) openRiverGroup(n);
        else openDrawer(n.item.id);
      } else if (river.hoveredEra) openGraph('era', river.hoveredEra);
      else { closeDrawer(); $('riverGroup').hidden = true; }
    });
    c.addEventListener('pointercancel', () => { river.dragging = false; });
    c.addEventListener('pointerleave', () => {
      river.mouseX = -9999; river.mouseY = -9999;
      river.pendingPointer = null; river.hoveredItem = null; river.hoveredEra = null; hideTip();
    });
    c.addEventListener('wheel', e => {
      e.preventDefault(); zoomRiver(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
    }, { passive: false });
    c.addEventListener('dblclick', e => {
      if (river.hoveredItem?.count > 1) zoomRiver(2, e.clientX, e.clientY);
      else if (river.hoveredItem) {
        const it = river.hoveredItem.item;
        if (it.motifs.length) openGraph('motif', it.motifs[0]);
        else if (it.eraGroups.length) openGraph('era', it.eraGroups[0]);
      } else resetRiver();
    });
  }

  function hitTestRiver(mx, my) {
    let best = null, bestD = Infinity;
    for (const n of river.visibleNodes) {
      const d = (mx - n.sx) ** 2 + (my - n.sy) ** 2;
      if (d <= (n.sr + 4) ** 2 && d < bestD) { best = n; bestD = d; }
    }
    river.hoveredItem = best;
    river.hoveredEra = null;
    if (!best) for (const e of G.eras) {
      const b = e._hitBox;
      if (b && mx >= b[0] && mx <= b[2] && my >= b[1] && my <= b[3]) { river.hoveredEra = e.name; break; }
    }
    river.canvas.classList.toggle('pointer', Boolean(best || river.hoveredEra));
    if (best?.count > 1) {
      const eras = [...new Set(best.members.flatMap(n => n.item.eraGroups))];
      showTip(mx, my, `<strong>${best.count} 条图录聚合</strong><div class="tip-tags">${eras.map(e => `<span class="tip-tag">${esc(e)}</span>`).join('')}</div><div class="tip-hint">点击查看全部记录 · 放大逐步展开</div>`);
    } else if (best) {
      const it = best.item;
      showTip(mx, my, `<strong>${esc(it.title)}</strong><div class="tip-tags">${[...it.periods, ...it.materials, ...it.artifactTypes, ...it.motifs.slice(0, 2)].map(t => `<span class="tip-tag">${esc(t)}</span>`).join('')}</div><div class="tip-hint">${esc(sourcePageLabel(it))} · 点击核读出处</div>`);
    } else if (river.hoveredEra) {
      const era = G.eraById.get(river.hoveredEra);
      showTip(mx, my, `<strong>${esc(era.name)}</strong><div class="tip-hint">${era.count} 条图录 · 点击进入时代星图</div>`);
    } else hideTip();
  }

  function ensureRiverGroups() {
    // World-space cells keep aggregates stable while panning. At close zoom every item is restored.
    const level = river.zoom >= 5 ? 99 : Math.floor(Math.log2(river.zoom) * 2);
    const key = `${river.layoutVersion}:${level}:${state.riverTypeFilter}`;
    if (river.groupKey === key && river.groupOverlay === stageOverlay) return;
    const cells = new Map(), cellSize = level === 99 ? 0 : 31 / Math.pow(2, level / 2);
    const forced = stageOverlay?.artifactSet;
    for (const n of river.nodes) {
      if (!matchesArtifactType(n.item, state.riverTypeFilter)) continue;
      if (!Number.isFinite(n.wx)) continue;
      const id = !cellSize || forced?.has(n.item.id) ? n.item.id
        : `${n.item.eraGroups[0]}:${Math.floor(n.wx / cellSize)}:${Math.floor(n.wy / cellSize)}`;
      let group = cells.get(id);

  function getFocalItems(kind, id) {

      const list = c.shownItems;

      list.forEach((it, i) => {
