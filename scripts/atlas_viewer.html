<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>纹样星图</title>
<style>
:root {
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html[data-theme="dark"] {
  --bg: #090b10;
  --bg-elev: rgba(16, 19, 27, 0.78);
  --bg-solid: #11141d;
  --bg-card: rgba(20, 24, 34, 0.68);
  --bg-hover: rgba(255, 255, 255, 0.06);
  --ink: #efece4;
  --ink-2: #a8a397;
  --ink-3: #6c685f;
  --line: rgba(239, 236, 228, 0.11);
  --line-strong: rgba(239, 236, 228, 0.22);
  --accent: #d8b377;
  --accent-soft: rgba(216, 179, 119, 0.15);
  --accent-ink: #12100d;
  --era-color: #d4a66a;
  --mat-color: #7ca896;
  --motif-color: #ce8264;
  --shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
  --canvas-bg: #090b10;
  --canvas-glow: #141925;
}

html[data-theme="light"] {
  --bg: #f8f6f1;
  --bg-elev: rgba(252, 250, 245, 0.84);
  --bg-solid: #fcfaf5;
  --bg-card: rgba(255, 254, 250, 0.88);
  --bg-hover: rgba(28, 26, 23, 0.05);
  --ink: #1e1c19;
  --ink-2: #625c53;
  --ink-3: #968f84;
  --line: rgba(30, 28, 25, 0.10);
  --line-strong: rgba(30, 28, 25, 0.22);
  --accent: #8f4e32;
  --accent-soft: rgba(143, 78, 50, 0.10);
  --accent-ink: #fcfaf5;
  --era-color: #8b6830;
  --mat-color: #3f6f5c;
  --motif-color: #9b4b32;
  --shadow: 0 18px 46px rgba(30, 26, 20, 0.12);
  --canvas-bg: #f8f6f1;
  --canvas-glow: #efeae0;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background 0.35s var(--ease), color 0.35s var(--ease);
}

button, input, select {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  outline: none;
}

button { cursor: pointer; }
button:focus-visible, input:focus-visible {
  outline: 1.5px solid var(--accent);
  outline-offset: 2px;
}

/* ── Top Floating Navigation ── */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  z-index: 40;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 22px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px) saturate(135%);
  -webkit-backdrop-filter: blur(18px) saturate(135%);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  justify-self: start;
  padding: 4px 6px;
  border-radius: 8px;
  transition: opacity 0.2s;
}
.brand:hover { opacity: 0.8; }
.brand-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}
.brand-name {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.12em;
  white-space: nowrap;
}
.brand-sub {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 240px;
}

.nav-tabs {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
}
.nav-tabs button {
  padding: 5px 15px;
  border-radius: 999px;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--ink-2);
  transition: all 0.22s var(--ease);
}
.nav-tabs button:hover { color: var(--ink); }
.nav-tabs button[aria-current="page"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 500;
}

.top-actions {
  justify-self: end;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.icon-pill {
  height: 32px;
  padding: 0 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  transition: all 0.2s var(--ease);
}
.icon-pill:hover {
  border-color: var(--line-strong);
  color: var(--ink);
  background: var(--bg-hover);
}
.icon-pill kbd {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  padding: 1px 4px;
  border-radius: 4px;
  border: 1px solid var(--line);
}
.icon-pill svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── Main Stage Container ── */
.stage-view {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.canvas-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  user-select: none;
  cursor: grab;
}
.canvas-layer:active { cursor: grabbing; }
.canvas-layer.pointer { cursor: pointer; }

/* ── River Homepage Overlay ── */
.river-hero {
  position: fixed;
  top: 72px;
  left: 28px;
  z-index: 20;
  pointer-events: none;
  transition: opacity 0.4s var(--ease);
}
.river-hero h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(24px, 3vw, 36px);
  font-weight: 600;
  letter-spacing: 0.14em;
  line-height: 1.2;
}
.river-hero p {
  margin: 6px 0 0;
  font-size: 12px;
  color: var(--ink-2);
  letter-spacing: 0.18em;
}

.river-dock {
  position: fixed;
  left: 20px;
  right: 20px;
  bottom: 18px;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 9px 16px;
  border-radius: 16px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}
.dock-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  min-width: 0;
}
.dock-label {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  margin-right: 4px;
  white-space: nowrap;
}
.dock-sep {
  width: 1px;
  height: 18px;
  background: var(--line);
  margin: 0 4px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  font-size: 12px;
  color: var(--ink-2);
  white-space: nowrap;
  transition: all 0.2s var(--ease);
}
.chip:hover {
  color: var(--ink);
  border-color: var(--line-strong);
  background: var(--bg-hover);
  transform: translateY(-1px);
}
.chip[aria-pressed="true"], .chip.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.chip .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
}
.chip .num {
  font-family: var(--mono);
  font-size: 10px;
  opacity: 0.65;
}

/* ── Graph HUD Overlay ── */
.graph-hud-top {
  position: fixed;
  top: 68px;
  left: 22px;
  right: 22px;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  pointer-events: none;
  flex-wrap: wrap;
}
.graph-hud-top > * { pointer-events: auto; }

.focus-bar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px 5px 6px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  position: relative;
}
.back-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--ink-2);
  transition: all 0.18s;
}
.back-btn:hover { background: var(--bg-hover); color: var(--ink); }
.back-btn:disabled { opacity: 0.3; cursor: default; }

.focus-kind {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  letter-spacing: 0.06em;
  font-weight: 500;
}
.focus-kind.era { background: rgba(212, 166, 106, 0.18); color: var(--era-color); }
.focus-kind.material { background: rgba(124, 168, 150, 0.18); color: var(--mat-color); }
.focus-kind.motif { background: rgba(206, 130, 100, 0.18); color: var(--motif-color); }

.focus-picker-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 2px 10px 2px 4px;
  border-radius: 999px;
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.06em;
  transition: background 0.18s;
}
.focus-picker-btn:hover { background: var(--bg-hover); }
.focus-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  padding-right: 6px;
}

.trail {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 4px;
  max-width: 340px;
  overflow: hidden;
}
.trail button {
  font-size: 12px;
  color: var(--ink-3);
  padding: 2px 6px;
  border-radius: 6px;
  white-space: nowrap;
}
.trail button:hover { color: var(--ink); background: var(--bg-hover); }
.trail span { font-size: 11px; color: var(--ink-3); opacity: 0.5; }

.graph-controls {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.seg {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.seg button {
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  color: var(--ink-2);
  transition: all 0.2s var(--ease);
  white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 500;
}

.graph-hud-bottom {
  position: fixed;
  left: 22px;
  bottom: 18px;
  z-index: 24;
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}
.graph-hud-bottom > * { pointer-events: auto; }
.cluster-strip {
  display: flex;
  align-items: center;
  gap: 5px;
  max-width: calc(100vw - 220px);
  overflow-x: auto;
  scrollbar-width: none;
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
}
.cluster-strip::-webkit-scrollbar { display: none; }

.zoom-pad {
  position: fixed;
  right: 22px;
  bottom: 18px;
  z-index: 24;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
}
.zoom-pad button {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 13px;
  color: var(--ink-2);
}
.zoom-pad button:hover { background: var(--bg-hover); color: var(--ink); }
.zoom-pad .reset-btn { width: auto; padding: 0 10px; border-radius: 999px; font-size: 11px; }

/* ── Entity Switcher Popover ── */
.switcher-pop {
  position: fixed;
  top: 120px;
  left: 22px;
  width: min(390px, calc(100vw - 44px));
  max-height: min(62vh, 500px);
  z-index: 45;
  border-radius: 16px;
  background: var(--bg-solid);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.switcher-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--line);
  padding: 6px;
  gap: 4px;
}
.switcher-tabs button {
  padding: 6px 8px;
  border-radius: 10px;
  font-size: 12px;
  color: var(--ink-2);
}
.switcher-tabs button[aria-selected="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}
.switcher-search {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  width: 100%;
}
.switcher-list {
  padding: 8px;
  overflow-y: auto;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-content: start;
}

/* ── Floating Tooltip on Canvas ── */
.canvas-tip {
  position: fixed;
  z-index: 35;
  pointer-events: none;
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--bg-elev);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  max-width: 260px;
  transform: translate(14px, -50%);
  transition: opacity 0.14s ease;
}
.canvas-tip strong {
  display: block;
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
}
.canvas-tip .tip-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 5px;
}
.canvas-tip .tip-tag {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ink-2);
}
.canvas-tip .tip-hint {
  margin-top: 5px;
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 0.04em;
}

/* ── Minimal Specimen & Evidence Slide-Over Drawer ── */
.drawer {
  position: fixed;
  top: 66px;
  right: 18px;
  bottom: 18px;
  width: min(370px, calc(100vw - 36px));
  z-index: 42;
  border-radius: 18px;
  background: var(--bg-elev);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateX(0);
  transition: transform 0.3s var(--ease), opacity 0.25s var(--ease);
}
.drawer.closed {
  transform: translateX(calc(100% + 28px));
  opacity: 0;
  pointer-events: none;
}
.drawer-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
}
.drawer-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.35;
}
.drawer-loc {
  margin-top: 3px;
  font-size: 11px;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 8px;
}
.drawer-close {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  flex: none;
  display: grid;
  place-items: center;
  color: var(--ink-2);
}
.drawer-close:hover { background: var(--bg-hover); color: var(--ink); }

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.drawer-figure {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  background: rgba(128, 128, 128, 0.08);
  border: 1px solid var(--line);
  aspect-ratio: 4 / 3;
  display: grid;
  place-items: center;
  cursor: zoom-in;
}
.drawer-figure img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
html[data-theme="dark"] .drawer-figure.mono img {
  filter: invert(0.92) sepia(0.24) saturate(1.1) brightness(0.96) contrast(1.1);
}
html[data-theme="light"] .drawer-figure.mono img {
  mix-blend-mode: multiply;
  filter: contrast(1.12);
}
.drawer-fig-badge {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  color: var(--ink-2);
}

.rel-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rel-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.rel-label {
  font-size: 11px;
  color: var(--ink-3);
  width: 34px;
  flex: none;
}
.rel-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.jump-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  transition: all 0.18s var(--ease);
}
.jump-pill:hover {
  transform: translateY(-1px);
  border-color: var(--accent);
  color: var(--accent);
}
.jump-pill.era { border-color: rgba(212, 166, 106, 0.35); color: var(--era-color); }
.jump-pill.material { border-color: rgba(124, 168, 150, 0.35); color: var(--mat-color); }
.jump-pill.motif { border-color: rgba(206, 130, 100, 0.35); color: var(--motif-color); }
.jump-pill::after {
  content: "↗";
  font-size: 10px;
  opacity: 0.6;
}

.proof-box {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.proof-quote {
  margin: 0;
  padding-left: 10px;
  border-left: 2px solid var(--accent);
  font-size: 12px;
  color: var(--ink-2);
  white-space: pre-line;
}
.proof-caption-img {
  max-width: 100%;
  max-height: 76px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: #fff;
}
html[data-theme="dark"] .proof-caption-img {
  filter: invert(0.92) sepia(0.12) contrast(1.1);
}
.proof-page-wrap {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--line);
  cursor: pointer;
}
.proof-page-wrap img { display: block; width: 100%; }
.bbox {
  position: absolute;
  border: 1.5px solid #e05a3f;
  background: rgba(224, 90, 63, 0.14);
  pointer-events: none;
}
.mini-link {
  font-size: 12px;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 0;
}
.mini-link:hover { text-decoration: underline; }

/* ── View 3: Catalog (MUSEO Morandi Grid) ── */
.scroll-view {
  position: fixed;
  inset: 54px 0 0 0;
  overflow-y: auto;
  padding: 28px clamp(18px, 4vw, 52px) 64px;
  background: var(--bg);
}
.view-inner {
  max-width: 1320px;
  margin: 0 auto;
}
.catalog-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.catalog-bar h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.08em;
}

.entity-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
}
.entity-card {
  position: relative;
  text-align: left;
  padding: 16px;
  border-radius: 16px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: all 0.24s var(--ease);
  overflow: hidden;
}
.entity-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--card-tint, var(--accent));
  opacity: 0.65;
}
.entity-card:hover {
  transform: translateY(-3px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow);
}
.entity-card-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.entity-card h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.entity-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
}
.entity-thumbs {
  display: flex;
  align-items: center;
  gap: 0;
  min-height: 44px;
}
.entity-thumbs img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--bg-solid);
  margin-left: -8px;
  background: var(--bg-solid);
}
.entity-thumbs img:first-child { margin-left: 0; }
.entity-subchips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.entity-subchips span {
  font-size: 11px;
  color: var(--ink-2);
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--bg-hover);
}
.entity-cta {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-3);
  padding-top: 6px;
  border-top: 1px solid var(--line);
}
.entity-card:hover .entity-cta { color: var(--accent); }

.specimen-section {
  margin-top: 34px;
}
.specimen-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.specimen-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 16px;
  color: var(--ink-2);
  font-weight: 500;
}
.specimen-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 12px;
}
.spec-card {
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: all 0.2s var(--ease);
}
.spec-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-2px);
}
.spec-img-wrap {
  aspect-ratio: 1 / 1;
  background: rgba(128, 128, 128, 0.06);
  display: grid;
  place-items: center;
  padding: 10px;
  cursor: pointer;
  overflow: hidden;
}
.spec-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 8px;
}
.spec-body {
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.spec-title {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
  cursor: pointer;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.spec-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.spec-tags button {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ink-2);
  transition: all 0.16s;
}
.spec-tags button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ── View 4: Original PDF Pages ── */
.pages-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: 28px;
  align-items: start;
}
.page-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.page-toolbar h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
}
.page-nav {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.page-nav input {
  width: 62px;
  text-align: center;
  padding: 4px 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  font-family: var(--mono);
  font-size: 12px;
}
.scan-frame {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #fff;
  box-shadow: var(--shadow);
}
.scan-frame img { display: block; width: 100%; }
.page-items {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.page-item-card {
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: all 0.18s;
}
.page-item-card:hover, .page-item-card.active {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.page-item-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.page-item-title strong {
  font-family: var(--serif);
  font-size: 15px;
}
.page-item-title small {
  font-size: 11px;
  color: var(--ink-3);
  white-space: nowrap;
}

/* ── Command Palette (⌘K Search) ── */
.palette-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(5, 7, 11, 0.56);
  backdrop-filter: blur(8px);
  display: grid;
  place-items: start center;
  padding-top: min(14vh, 110px);
}
.palette {
  width: min(560px, calc(100vw - 32px));
  max-height: 70vh;
  border-radius: 18px;
  background: var(--bg-solid);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.palette input {
  padding: 15px 18px;
  font-size: 15px;
  border-bottom: 1px solid var(--line);
  width: 100%;
}
.palette-results {
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.palette-group {
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.1em;
  padding: 8px 10px 4px;
}
.palette-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 10px;
  text-align: left;
  transition: background 0.15s;
}
.palette-item:hover, .palette-item.selected {
  background: var(--accent-soft);
  color: var(--accent);
}
.palette-item small {
  font-size: 11px;
  color: var(--ink-3);
}

/* ── Lightbox Modal ── */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: rgba(6, 7, 10, 0.88);
  backdrop-filter: blur(12px);
  display: grid;
  place-items: center;
  padding: 24px;
  cursor: zoom-out;
}
.lightbox-inner {
  max-width: min(94vw, 1080px);
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  cursor: default;
}
.lightbox img {
  max-width: 100%;
  max-height: 80vh;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
}
.lightbox-cap {
  color: #e8e4dc;
  font-family: var(--serif);
  font-size: 14px;
  letter-spacing: 0.05em;
}

@media (max-width: 820px) {
  .topbar { grid-template-columns: auto 1fr auto; padding: 0 12px; }
  .brand-sub, .icon-pill kbd, .trail { display: none; }
  .nav-tabs button { padding: 5px 10px; font-size: 12px; }
  .river-hero { top: 64px; left: 16px; }
  .river-dock { left: 10px; right: 10px; bottom: 10px; padding: 8px 10px; gap: 8px; }
  .graph-hud-top { left: 10px; right: 10px; top: 62px; }
  .cluster-strip { max-width: calc(100vw - 140px); }
  .pages-layout { grid-template-columns: 1fr; }
}

/* ── Dual-Mode Knowledge Reasoning Studio ── */
.icon-pill.accent-pill {
  border-color: rgba(216, 179, 119, 0.42);
  color: var(--accent);
}
.icon-pill.accent-pill[aria-expanded="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.icon-pill.accent-pill[aria-expanded="true"] kbd {
  color: var(--accent-ink);
  border-color: rgba(0, 0, 0, 0.2);
}

.overlay-banner {
  position: fixed;
  top: 122px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 6px 14px;
  border-radius: 999px;
  background: var(--bg-elev);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--accent);
  box-shadow: var(--shadow);
  font-size: 12px;
  max-width: min(560px, calc(100vw - 44px));
}
.overlay-banner .ob-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  flex: none;
}
.overlay-banner .ob-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--ink);
}
.overlay-banner .ob-clear {
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--bg-hover);
  color: var(--ink-2);
  font-size: 11px;
  flex: none;
}
.overlay-banner .ob-clear:hover { color: var(--ink); background: var(--accent-soft); }

.r-studio {
  position: fixed;
  top: 66px;
  right: 18px;
  bottom: 18px;
  width: min(424px, calc(100vw - 36px));
  z-index: 41;
  border-radius: 18px;
  background: var(--bg-elev);
  backdrop-filter: blur(24px) saturate(145%);
  -webkit-backdrop-filter: blur(24px) saturate(145%);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateX(0);
  transition: transform 0.3s var(--ease), opacity 0.25s var(--ease);
}
.r-studio.closed {
  transform: translateX(calc(100% + 28px));
  opacity: 0;
  pointer-events: none;
}
.r-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
}
.r-mode-seg {
  display: inline-flex;
  padding: 3px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  gap: 2px;
}
.r-mode-seg button {
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  color: var(--ink-2);
  transition: all 0.2s var(--ease);
}
.r-mode-seg button[aria-selected="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 500;
}
.r-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--ink-3);
}
.r-status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #6f9e86;
}
.r-status-dot.off { background: var(--ink-3); }

.r-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.r-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.r-lenses {
  display: inline-flex;
  gap: 4px;
}
.r-lenses button {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  color: var(--ink-2);
  border: 1px solid transparent;
}
.r-lenses button:hover { color: var(--ink); background: var(--bg-hover); }
.r-lenses button[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}

.ont-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--ink-2);
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  cursor: pointer;
  user-select: none;
}
.ont-toggle[aria-pressed="true"] {
  border-color: rgba(124, 168, 150, 0.55);
  background: rgba(124, 168, 150, 0.14);
  color: var(--mat-color);
}
.ont-toggle .sw-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.r-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.r-form {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.r-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.r-input, .r-select {
  flex: 1;
  min-width: 0;
  padding: 7px 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--ink);
  font-size: 12.5px;
}
.r-select option {
  background: var(--bg-solid);
  color: var(--ink);
}
.r-btn {
  padding: 7px 14px;
  border-radius: 10px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  transition: opacity 0.18s;
}
.r-btn:hover { opacity: 0.9; }
.r-btn:disabled { opacity: 0.45; cursor: default; }
.r-btn.ghost {
  background: var(--bg-card);
  color: var(--ink-2);
  border: 1px solid var(--line);
}
.r-btn.ghost:hover { color: var(--ink); border-color: var(--line-strong); }

.r-presets {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.r-preset {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ink-2);
  background: var(--bg-card);
  transition: all 0.16s;
}
.r-preset:hover { border-color: var(--accent); color: var(--accent); }

.r-card {
  padding: 11px 12px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color 0.18s;
}
.r-card:hover, .r-card.active {
  border-color: var(--accent);
}
.r-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.r-card-title {
  font-family: var(--serif);
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.35;
}
.r-badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
}
.r-badge.ont {
  background: rgba(124, 168, 150, 0.18);
  color: var(--mat-color);
  border: 1px dashed rgba(124, 168, 150, 0.5);
}

.chain-steps {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
}
.chain-node {
  padding: 2px 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg-hover);
  color: var(--ink);
  cursor: pointer;
}
.chain-node:hover { border-color: var(--accent); color: var(--accent); }
.chain-node.ont {
  border-style: dashed;
  border-color: rgba(124, 168, 150, 0.6);
  color: var(--mat-color);
}
.chain-edge {
  font-size: 10px;
  color: var(--ink-3);
  padding: 0 2px;
}
.chain-edge.ont { color: var(--mat-color); }

.proof-line {
  font-size: 11px;
  color: var(--ink-2);
  padding: 6px 8px;
  border-radius: 8px;
  background: var(--bg-hover);
  border-left: 2px solid var(--accent);
}
.proof-line code {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--accent);
  display: block;
  margin-bottom: 2px;
  word-break: break-all;
}

.conf-bar {
  height: 4px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
.conf-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--mat-color), var(--accent));
}

.cmp-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.cmp-stat {
  padding: 8px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  text-align: center;
}
.cmp-stat strong {
  display: block;
  font-family: var(--mono);
  font-size: 16px;
  line-height: 1.2;
}
.cmp-stat span { font-size: 10.5px; color: var(--ink-3); }
.cmp-stat.shared strong { color: var(--accent); }
.cmp-stat.onlyA strong { color: var(--motif-color); }
.cmp-stat.onlyB strong { color: var(--mat-color); }

.sparql-details {
  border-top: 1px solid var(--line);
  padding: 8px 14px 10px;
  background: var(--bg-card);
}
.sparql-details summary {
  cursor: pointer;
  font-size: 11.5px;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  list-style: none;
}
.sparql-details summary::-webkit-details-marker { display: none; }
.sparql-editor {
  width: 100%;
  min-height: 92px;
  margin-top: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.45;
  resize: vertical;
}
.sparql-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  margin-top: 8px;
}
.sparql-table th, .sparql-table td {
  text-align: left;
  padding: 4px 6px;
  border-bottom: 1px solid var(--line);
}
.sparql-table th { color: var(--ink-3); font-family: var(--mono); font-weight: 500; }

/* ── DeepSeek Agent Chat UI ── */
.agent-feed {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.agent-empty {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 4px;
}
.agent-empty h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
}
.agent-empty p {
  margin: 0;
  font-size: 12px;
  color: var(--ink-2);
}
.agent-prompt-btn {
  text-align: left;
  padding: 9px 11px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink);
  transition: all 0.18s;
}
.agent-prompt-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

.msg {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.msg.user { align-items: flex-end; }
.msg.user .msg-bubble {
  background: var(--accent-soft);
  border: 1px solid rgba(216, 179, 119, 0.35);
  color: var(--ink);
  border-radius: 14px 14px 4px 14px;
  padding: 8px 12px;
  max-width: 88%;
  font-size: 13px;
}
.msg.assistant .msg-bubble {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px 14px 14px 4px;
  padding: 11px 13px;
  font-size: 12.8px;
  line-height: 1.65;
  word-break: break-word;
}
.msg-bubble h4 {
  margin: 10px 0 4px;
  font-family: var(--serif);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--accent);
}
.msg-bubble h4:first-child { margin-top: 0; }
.msg-bubble p { margin: 4px 0; }
.msg-bubble ul, .msg-bubble ol { margin: 4px 0 6px; padding-left: 18px; }
.msg-bubble li { margin: 3px 0; }
.msg-bubble hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
.msg-bubble strong { font-weight: 600; color: var(--ink); }
.msg-bubble code {
  font-family: var(--mono);
  font-size: 11px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--bg-hover);

<script>
(() => {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════
     1. Generic Knowledge Graph Engine (Zero Book-Specific Rules)
     ═══════════════════════════════════════════════════════════════ */

  // Universal Chinese historical chronology table (works across Vol 1, 2, 3 & any future volume)
  const DYNASTY_TABLE = [
    { group: '新石器时代', re: /新石器|原始社会|仰韶|半坡|庙底沟|马家窑|半山|马厂|河姆渡|良渚|龙山|大汶口|红山|裴李岗|磁山|屈家岭|马家浜|大溪/ },
    { group: '夏代', re: /夏代|二里头|夏文化/ },
    { group: '商代', re: /商|殷/ },
    { group: '西周', re: /西周/ },
    { group: '东周', re: /东周/ },
    { group: '春秋', re: /春秋/ },
    { group: '战国', re: /战国/ },
    { group: '秦代', re: /秦/ },
    { group: '汉代', re: /西汉|东汉|两汉|汉/ },
    { group: '三国', re: /三国|曹魏|蜀汉|孙吴/ },
    { group: '魏晋南北朝', re: /魏晋|两晋|西晋|东晋|南北朝|北朝|南朝|十六国|北魏|东魏|西魏|北齐|北周/ },
    { group: '隋代', re: /隋/ },
    { group: '唐代', re: /唐/ },
    { group: '五代', re: /五代|十国/ },
    { group: '宋代', re: /北宋|南宋|宋|辽|金|西夏/ },
    { group: '元代', re: /元/ },
    { group: '明代', re: /明/ },
    { group: '清代', re: /清/ },
    { group: '近现代', re: /民国|近代|现代|当代/ },
  ];

  function eraChronology(label) {
    if (!label) return { order: 999, group: '未标时代', sub: 5 };
    let idx = DYNASTY_TABLE.findIndex(d => d.re.test(label));
    const group = idx >= 0 ? DYNASTY_TABLE[idx].group : label;
    if (idx < 0) idx = 500 + hashStr(label) % 100;
    let sub = 4;
    if (/初|早|前/.test(label)) sub = 1;
    else if (/中/.test(label)) sub = 4;
    else if (/后/.test(label)) sub = 7;
    else if (/晚|末/.test(label)) sub = 9;
    // Place 东周 seamlessly between 西周 and 春秋
    return { order: idx * 10 + sub, group, sub };
  }

  function hashStr(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  // Generic mineral / Morandi color resolver for ANY material, era, or motif name
  const MATERIAL_HUES = [
    { re: /彩陶|红陶/, dark: '#D47F5B', light: '#A64D2C' },
    { re: /白陶|瓷|青瓷/, dark: '#C7C1B2', light: '#6F6A5F' },
    { re: /黑陶|灰陶/, dark: '#9A968F', light: '#524F4A' },
    { re: /陶/, dark: '#C29B74', light: '#825F3E' },
    { re: /青铜|铜/, dark: '#77A894', light: '#356B57' },
    { re: /玉|翠|玛瑙/, dark: '#93B9A3', light: '#47725B' },
    { re: /金/, dark: '#E0BE74', light: '#997428' },
    { re: /银|锡/, dark: '#B6C0CC', light: '#5B6775' },
    { re: /铁/, dark: '#8C94A0', light: '#4A515C' },
    { re: /漆|朱/, dark: '#CD6D64', light: '#973831' },
    { re: /木|竹/, dark: '#B48E65', light: '#785735' },
    { re: /丝|锦|绣|绢|织|布|帛|罗|绫/, dark: '#A894C4', light: '#624E82' },
    { re: /象牙|骨|角|牙|贝|蚌/, dark: '#D6C6A4', light: '#81704C' },
    { re: /石|砖|瓦|壁画/, dark: '#93A3B8', light: '#4E5F75' },
  ];

  const MORANDI_PALETTE_DARK = [
    '#D49B6A', '#7EA897', '#C97B63', '#8E9FC4', '#B79BC2',
    '#CBB679', '#7FA5B5', '#C28A8E', '#97B08A', '#B89B82',
  ];
  const MORANDI_PALETTE_LIGHT = [
    '#9A5C32', '#3B6E5B', '#9E4B35', '#475B82', '#6F507C',
    '#8A7130', '#3E687A', '#8B4D54', '#4F6E44', '#7C6047',
  ];

  function colorFor(kind, name, theme = currentTheme()) {
    if (!name || name.startsWith('未标')) return theme === 'dark' ? '#6D717C' : '#969189';
    if (kind === 'material') {
      const m = MATERIAL_HUES.find(r => r.re.test(name));
      if (m) return theme === 'dark' ? m.dark : m.light;
    }
    const pal = theme === 'dark' ? MORANDI_PALETTE_DARK : MORANDI_PALETTE_LIGHT;
    const idx = kind === 'era'
      ? Math.max(0, DYNASTY_TABLE.findIndex(d => d.group === eraChronology(name).group))
      : hashStr(kind + ':' + name);
    return pal[idx % pal.length];
  }

  function hexAlpha(hex, a) {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') || 'dark';
  }

  /* ═══════════════════════════════════════════════════════════════
     2. Build Normalized In-Memory Graph from Pure manifest.json
     ═══════════════════════════════════════════════════════════════ */
  function buildGraphModel(manifest) {
    const evMap = new Map((manifest.evidence || []).map(e => [e.id, e]));
    const rowsByArt = new Map();
    for (const r of (manifest.rows || [])) {
      if (!rowsByArt.has(r.artifactId)) rowsByArt.set(r.artifactId, []);
      rowsByArt.get(r.artifactId).push(r);
    }

    // Build complete artifact list from manifest.items (fallback to unique rows if items absent)
    const rawItems = (manifest.items && manifest.items.length)
      ? manifest.items
      : [...new Map((manifest.rows || []).map(r => [r.artifactId, r])).values()];

    const items = rawItems.map((it, idx) => {
      const rs = rowsByArt.get(it.artifactId) || [];
      const periods = [...new Set(rs.filter(r => r.predicate === 'period').map(r => r.object))];
      const materials = [...new Set(rs.filter(r => r.predicate === 'made_of').map(r => r.object))];
      const motifs = [...new Set(rs.filter(r => r.predicate === 'decorated_with').map(r => r.object))];
      const techniques = [...new Set(rs.filter(r => r.predicate === 'uses_technique').map(r => r.object))];
      const eraGroups = [...new Set(periods.map(p => eraChronology(p).group))];
      const ev = evMap.get(it.evidenceId) || {};
      const thumbUrl = it.detailUrl || it.imageUrl || ev.previewUrl || '';
      const plateUrl = it.imageUrl || it.detailUrl || ev.previewUrl || '';
      return {
        idx,
        id: it.artifactId,
        title: it.artifact || it.item || it.artifactId,
        page: Number(it.page || ev.ordinal || 1),
        locator: it.locator || ev.locator || '',
        status: it.status || '',
        findspot: it.findspot || '',
        observation: it.observation || '',
        quote: ev.text || it.quote || '',
        periods,
        eraGroups,
        materials,
        motifs,
        techniques,
        rows: rs,
        thumbUrl,
        plateUrl,
        captionUrl: it.captionUrl || ev.captionUrl || '',
        pageUrl: ev.previewUrl || '',
        bbox: ev.bbox || null,
        hasPeriod: periods.length > 0,
        hasRelation: periods.length > 0 || materials.length > 0 || motifs.length > 0,
      };
    });

    // Aggregate canonical Era entries (grouped cleanly by dynasty family, preserving raw sub-periods)
    const eraMap = new Map();
    for (const it of items) {
      for (const p of it.periods) {
        const ch = eraChronology(p);
        if (!eraMap.has(ch.group)) {
          eraMap.set(ch.group, { id: ch.group, name: ch.group, order: ch.order, subPeriods: new Set(), items: [] });
        }
        const entry = eraMap.get(ch.group);
        entry.subPeriods.add(p);
        if (!entry.items.includes(it)) entry.items.push(it);
        entry.order = Math.min(entry.order, ch.order);
      }
    }
    const eras = [...eraMap.values()]
      .sort((a, b) => a.order - b.order)
      .map(e => ({ ...e, subPeriods: [...e.subPeriods].sort((a, b) => eraChronology(a).order - eraChronology(b).order), count: e.items.length }));

    // Aggregate Materials (exact manifest values)
    const matMap = new Map();
    for (const it of items) {
      for (const m of it.materials) {
        if (!matMap.has(m)) matMap.set(m, { id: m, name: m, items: [] });
        matMap.get(m).items.push(it);
      }
    }
    const materials = [...matMap.values()]
      .sort((a, b) => b.items.length - a.items.length || a.name.localeCompare(b.name, 'zh-Hans'))
      .map(m => ({ ...m, count: m.items.length }));

    // Aggregate Motifs (exact manifest values)
    const motifMap = new Map();
    for (const it of items) {
      for (const mo of it.motifs) {
        if (!motifMap.has(mo)) motifMap.set(mo, { id: mo, name: mo, items: [] });
        motifMap.get(mo).items.push(it);
      }
    }
    const motifs = [...motifMap.values()]
      .sort((a, b) => b.items.length - a.items.length || a.name.localeCompare(b.name, 'zh-Hans'))
      .map(m => ({ ...m, count: m.items.length }));

    // Compute era timeline position [0.05..0.95] for each item (generic, no book hardcoding!)
    const eraPos = new Map();
    if (eras.length === 1) {
      eraPos.set(eras[0].name, [0.15, 0.85]);
    } else if (eras.length > 1) {
      // Proportional allocation with clean minimum width per era so every era breathes
      const weights = eras.map(e => Math.max(0.75, Math.pow(e.count, 0.42)));
      const totalW = weights.reduce((s, w) => s + w, 0);
      let cursor = 0.04;
      const span = 0.92;
      eras.forEach((e, i) => {
        const w = (weights[i] / totalW) * span;
        eraPos.set(e.name, [cursor, cursor + w]);
        e.t0 = cursor;
        e.t1 = cursor + w;
        e.tMid = cursor + w * 0.5;
        cursor += w;
      });
    }

    // Compute affinity timeline center for each motif & material from dated items (purely for ambient drift layout)
    const motifTime = new Map();
    for (const mo of motifs) {
      const ts = mo.items.filter(i => i.eraGroups.length).map(i => eraPos.get(i.eraGroups[0])?.[0] + (eraPos.get(i.eraGroups[0])?.[1] - eraPos.get(i.eraGroups[0])?.[0]) * 0.5).filter(Number.isFinite);
      if (ts.length) motifTime.set(mo.name, ts.reduce((a, b) => a + b, 0) / ts.length);
    }
    const matTime = new Map();
    for (const ma of materials) {
      const ts = ma.items.filter(i => i.eraGroups.length).map(i => {
        const seg = eraPos.get(i.eraGroups[0]);
        return seg ? (seg[0] + seg[1]) * 0.5 : NaN;
      }).filter(Number.isFinite);
      if (ts.length) matTime.set(ma.name, ts.reduce((a, b) => a + b, 0) / ts.length);
    }

    for (const it of items) {
      const r1 = (hashStr(it.id + ':x') % 10000) / 10000;
      const r2 = (hashStr(it.id + ':y') % 10000) / 10000;
      if (it.eraGroups.length && eraPos.has(it.eraGroups[0])) {
        const [t0, t1] = eraPos.get(it.eraGroups[0]);
        const ch = eraChronology(it.periods[0]);
        // Slight sub-period progression inside the era band
        const subBias = (ch.sub / 10) * 0.45 + r1 * 0.55;
        it.riverT = t0 + (t1 - t0) * (0.1 + 0.8 * subBias);
        it.riverLane = (r2 - 0.5) * 2; // [-1, 1] central river band
      } else {
        // Ambient undated item: drift gently across canvas (biased softly toward motif/material affinity if present, else golden spread)
        let anchor = (it.idx * 0.6180339887) % 1;
        for (const mo of it.motifs) { if (motifTime.has(mo)) { anchor = motifTime.get(mo) + (r1 - 0.5) * 0.24; break; } }
        if (it.motifs.length === 0) {
          for (const ma of it.materials) { if (matTime.has(ma)) { anchor = matTime.get(ma) + (r1 - 0.5) * 0.34; break; } }
        }
        it.riverT = Math.max(0.03, Math.min(0.97, anchor));
        // Spread richly above and below the main river spine to fill the full screen
        const side = (hashStr(it.id + ':side') % 2 === 0) ? 1 : -1;
        it.riverLane = side * (0.28 + r2 * 0.68);
      }
    }

    const pages = (manifest.pages && manifest.pages.length)
      ? manifest.pages
      : [...new Set(items.map(i => i.page))].sort((a, b) => a - b).map(p => ({
          page: p,
          previewUrl: items.find(i => i.page === p)?.pageUrl || '',
          entries: items.filter(i => i.page === p).length,
        }));

    return {
      title: manifest.title || '纹样知识图谱',
      items,
      itemById: new Map(items.map(i => [i.id, i])),
      eras,
      eraById: new Map(eras.map(e => [e.id, e])),
      materials,
      matById: new Map(materials.map(m => [m.id, m])),
      motifs,
      motifById: new Map(motifs.map(m => [m.id, m])),
      pages,
      evMap,
    };
  }

  /* ═══════════════════════════════════════════════════════════════
     3. Smart Generic Circular Sprite Cache (Auto Color vs Ink)
     ═══════════════════════════════════════════════════════════════ */
  const spriteCache = new Map();
  let onSpriteReady = () => {};

  function getSprite(url) {
    if (!url) return null;
    let rec = spriteCache.get(url);
    if (rec) return rec;
    rec = { status: 'loading', isMono: false, dark: null, light: null };
    spriteCache.set(url, rec);

    const img = new Image();
    img.decoding = 'async';
    img.onload = () => {
      try {
        bakeMedallionSprites(img, rec);
        rec.status = 'ready';
      } catch {
        rec.status = 'error';
      }
      onSpriteReady();
    };
    img.onerror = () => { rec.status = 'error'; };
    img.src = url;
    return rec;
  }

  function bakeMedallionSprites(img, rec) {
    const sw = img.naturalWidth || img.width;
    const sh = img.naturalHeight || img.height;
    if (!sw || !sh) return;

    // 1) Fast 64x64 analysis to auto-detect monochrome ink drawing vs color photograph
    const aSize = 64;
    const ac = document.createElement('canvas');
    ac.width = aSize;
    ac.height = aSize;
    const actx = ac.getContext('2d', { willReadFrequently: true });
    actx.drawImage(img, 0, 0, aSize, aSize);
    const data = actx.getImageData(0, 0, aSize, aSize).data;

    let satSum = 0, whiteCount = 0;
    let minX = aSize, minY = aSize, maxX = 0, maxY = 0, inkCount = 0;
    const total = aSize * aSize;

    for (let y = 0; y < aSize; y++) {
      for (let x = 0; x < aSize; x++) {
        const i = (y * aSize + x) * 4;
        const r = data[i], g = data[i + 1], b = data[i + 2];
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        satSum += (mx - mn);
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        if (lum > 218) whiteCount++;
        if (lum < 195 && x > 1 && x < aSize - 2 && y > 1 && y < aSize - 2) {
          inkCount++;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    const avgSat = satSum / total;
    const whiteRatio = whiteCount / total;
    const isMono = avgSat < 18 && whiteRatio > 0.30;
    rec.isMono = isMono;

    // Determine crisp source crop rectangle
    let sx = 0, sy = 0, cw = sw, ch = sh;
    if (isMono && inkCount > 25 && (maxX - minX) >= 8 && (maxY - minY) >= 8) {
      // Tight crop around ink motif with balanced square framing
      const pad = 3;
      const bx1 = Math.max(0, minX - pad) / aSize * sw;
      const by1 = Math.max(0, minY - pad) / aSize * sh;
      const bx2 = Math.min(aSize, maxX + pad + 1) / aSize * sw;
      const by2 = Math.min(aSize, maxY + pad + 1) / aSize * sh;
      sx = bx1; sy = by1; cw = bx2 - bx1; ch = by2 - by1;
    } else {
      // Center square cover for color plates
      const side = Math.min(sw, sh);
      sx = (sw - side) * 0.5;
      sy = (sh - side) * 0.5;
      cw = side;
      ch = side;
    }

    const sz = 128;
    const rad = sz * 0.5;

    if (!isMono) {
      // Rich natural color circular medallion (used in both Dark & Light modes)
      const c = document.createElement('canvas');
      c.width = sz; c.height = sz;
      const ctx = c.getContext('2d');
      ctx.save();
      ctx.beginPath();
      ctx.arc(rad, rad, rad - 1, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, sx, sy, cw, ch, 0, 0, sz, sz);
      // Gentle archival edge vignette
      const vig = ctx.createRadialGradient(rad, rad, rad * 0.55, rad, rad, rad);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.22)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, sz, sz);
      ctx.restore();
      rec.dark = c;
      rec.light = c;
    } else {
      // Render monochrome ink drawing onto clean buffer, then tint into Dark Gold-Ink & Light Sumi-Ink!
      const raw = document.createElement('canvas');
      raw.width = sz; raw.height = sz;
      const rctx = raw.getContext('2d', { willReadFrequently: true });
      rctx.fillStyle = '#ffffff';
      rctx.fillRect(0, 0, sz, sz);
      const scale = Math.min((sz - 20) / cw, (sz - 20) / ch);
      const dw = cw * scale, dh = ch * scale;
      rctx.drawImage(img, sx, sy, cw, ch, (sz - dw) * 0.5, (sz - dh) * 0.5, dw, dh);
      const px = rctx.getImageData(0, 0, sz, sz).data;

      // Dark sprite: obsidian disc (#141822) + glowing warm antique ivory/gold ink (#E7D2AE)
      const dc = document.createElement('canvas');
      dc.width = sz; dc.height = sz;
      const dctx = dc.getContext('2d');
      const dImg = dctx.createImageData(sz, sz);

      // Light sprite: pure cotton paper (#FAF8F3) + crisp sumi charcoal ink (#221E1A)
      const lc = document.createElement('canvas');
      lc.width = sz; lc.height = sz;
      const lctx = lc.getContext('2d');
      const lImg = lctx.createImageData(sz, sz);

      const rr = (rad - 1) * (rad - 1);
      for (let y = 0; y < sz; y++) {
        for (let x = 0; x < sz; x++) {
          const dx = x - rad + 0.5, dy = y - rad + 0.5;
          const dist2 = dx * dx + dy * dy;
          const o = (y * sz + x) * 4;
          if (dist2 > rr) {
            dImg.data[o + 3] = 0;
            lImg.data[o + 3] = 0;
            continue;
          }
          const lum = 0.299 * px[o] + 0.587 * px[o + 1] + 0.114 * px[o + 2];
          // Map ink intensity [0..1], cleanly suppressing paper bleed-through > 212
          const ink = Math.max(0, Math.min(1, (214 - lum) / 168));
          const edgeAlpha = dist2 > (rad - 2.5) * (rad - 2.5)
            ? Math.max(0, Math.min(1, (rad - 1 - Math.sqrt(dist2)) / 1.5)) * 255
            : 255;

          // Dark medallion: interpolate obsidian (20,24,34) -> luminous warm gold-ivory (236,214,174)
          dImg.data[o] = Math.round(20 + ink * 216);
          dImg.data[o + 1] = Math.round(24 + ink * 190);
          dImg.data[o + 2] = Math.round(34 + ink * 140);
          dImg.data[o + 3] = Math.round(edgeAlpha);

          // Light medallion: interpolate paper (250,248,243) -> sumi ink (34,30,26)
          lImg.data[o] = Math.round(250 - ink * 216);
          lImg.data[o + 1] = Math.round(248 - ink * 218);
          lImg.data[o + 2] = Math.round(243 - ink * 217);
          lImg.data[o + 3] = Math.round(edgeAlpha);
        }
      }
      dctx.putImageData(dImg, 0, 0);
      lctx.putImageData(lImg, 0, 0);
      rec.dark = dc;
      rec.light = lc;
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     4. Application State & Router
     ═══════════════════════════════════════════════════════════════ */
  let G = null;

  const state = {
    view: 'river', // 'river' | 'graph' | 'catalog' | 'pages'
    // River state
    riverDatedOnly: false,
    riverHighlightEra: null,
    riverHighlightMat: null,
    // Graph state
    focusKind: 'era',      // 'era' | 'material' | 'motif'
    focusId: '',
    clusterBy: 'material', // 'era' | 'material' | 'motif'
    dim: '2d',             // '2d' | '3d'
    showUnlabeled: true,
    history: [],           // navigation trail [{kind, id, clusterBy}]
    // Catalog state
    catalogTab: 'era',
    catalogPage: 0,
    // Pages state
    currentPage: 1,
    activePageItemId: null,
    // Drawer
    drawerItemId: null,
  };

  function defaultClusterFor(kind) {
    if (kind === 'era') return 'material';   // 查看某时代的纹样 → 默认按材质聚类
    if (kind === 'material') return 'motif'; // 查看某材质的纹样 → 默认按纹样聚类
    return 'era';                            // 查看某纹样 → 默认按时代聚类
  }

  function clusterOptionsFor(kind) {
    if (kind === 'era') return [['material', '按材质'], ['motif', '按纹样']];
    if (kind === 'material') return [['motif', '按纹样'], ['era', '按时代']];
    return [['era', '按时代'], ['material', '按材质']];
  }

  const KIND_LABEL = { era: '时代', material: '材质', motif: '纹样' };

  const $ = id => document.getElementById(id);

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('atlas-theme', theme); } catch {}
    $('themeLabel').textContent = theme === 'dark' ? '深空' : '宣纸';
    $('themeIcon').innerHTML = theme === 'dark'
      ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/>';
    if (G) {
      renderRiverDock();
      if (state.view === 'graph') renderGraphHud();
      if (state.view === 'catalog') renderCatalog();
    }
  }

  function openGraph(kind, id, opts = {}) {
    // Normalize era sub-period to macro-era group if needed
    if (kind === 'era' && !G.eraById.has(id)) {
      const grp = eraChronology(id).group;
      if (G.eraById.has(grp)) id = grp;
    }
    // Validate entity exists, fallback gracefully
    if (kind === 'era' && !G.eraById.has(id)) id = G.eras[0]?.id || '';
    if (kind === 'material' && !G.matById.has(id)) id = G.materials[0]?.id || '';
    if (kind === 'motif' && !G.motifById.has(id)) id = G.motifs[0]?.id || '';
    if (!id) {
      // Fallback to whichever taxonomy has entries
      if (G.eras.length) { kind = 'era'; id = G.eras[0].id; }
      else if (G.materials.length) { kind = 'material'; id = G.materials[0].id; }
      else if (G.motifs.length) { kind = 'motif'; id = G.motifs[0].id; }
    }

    const pushHistory = opts.pushHistory !== false;
    if (pushHistory && state.view === 'graph' && (state.focusKind !== kind || state.focusId !== id)) {
      state.history.push({ kind: state.focusKind, id: state.focusId, clusterBy: state.clusterBy });
      if (state.history.length > 16) state.history.shift();
    }

    state.focusKind = kind;
    state.focusId = id;
    state.clusterBy = opts.clusterBy || defaultClusterFor(kind);
    if (opts.dim) state.dim = opts.dim;
    if (!opts.keepOverlay && typeof clearStageOverlay === 'function') clearStageOverlay();
    closeSwitcher();
    switchView('graph', false);
    rebuildGraphScene(true);
    renderGraphHud();
    syncHash();
  }

  function switchView(view, updateHash = true) {
    state.view = view;
    $('view-river').hidden = view !== 'river';
    $('view-graph').hidden = view !== 'graph';
    $('view-catalog').hidden = view !== 'catalog';
    $('view-pages').hidden = view !== 'pages';
    hideTip();
    closeSwitcher();

    document.querySelectorAll('.nav-tabs button').forEach(btn => {
      if (btn.dataset.view === view) btn.setAttribute('aria-current', 'page');
      else btn.removeAttribute('aria-current');
    });

    if (view === 'river') {
      resizeRiver();
    } else if (view === 'graph') {
      if (!state.focusId) {
        const defaultKind = G.eras.length ? 'era' : (G.materials.length ? 'material' : 'motif');
        const defaultId = (defaultKind === 'era' ? G.eras[0]?.id : defaultKind === 'material' ? G.materials[0]?.id : G.motifs[0]?.id) || '';
        state.focusKind = defaultKind;
        state.focusId = defaultId;
        state.clusterBy = defaultClusterFor(defaultKind);
      }
      resizeGraph();
      rebuildGraphScene(false);
      renderGraphHud();
    } else if (view === 'catalog') {
      renderCatalog();
    } else if (view === 'pages') {
      renderPage(state.currentPage);
    }

    if (updateHash) syncHash();
  }

  function syncHash() {
    let next = '#river';
    if (state.view === 'graph' && state.focusId) {
      next = `#graph/${state.focusKind}/${encodeURIComponent(state.focusId)}?by=${state.clusterBy}&dim=${state.dim}`;
    } else if (state.view === 'catalog') {
      next = `#catalog/${state.catalogTab}`;
    } else if (state.view === 'pages') {
      next = `#page/${state.currentPage}`;
    }
    if (location.hash !== next) history.replaceState(null, '', next);
  }

  function applyHash() {
    const raw = location.hash.slice(1);
    if (!raw || raw === 'river') { switchView('river', false); return; }
    const [path, qs] = raw.split('?');
    const parts = path.split('/');
    const params = new URLSearchParams(qs || '');
    if (parts[0] === 'graph' && parts[1] && parts[2]) {
      openGraph(parts[1], decodeURIComponent(parts[2]), {
        clusterBy: params.get('by') || undefined,
        dim: params.get('dim') === '3d' ? '3d' : (params.get('dim') === '2d' ? '2d' : undefined),
        pushHistory: false,
      });
    } else if (parts[0] === 'catalog') {
      state.catalogTab = ['era', 'material', 'motif'].includes(parts[1]) ? parts[1] : 'era';
      switchView('catalog', false);
    } else if (parts[0] === 'page') {
      state.currentPage = Math.max(1, Math.min(G.pages.length, Number(parts[1]) || 1));
      switchView('pages', false);
    } else {
      switchView('river', false);
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     5. VIEW 1 — Full-Bleed Historical River Canvas Engine
     ═══════════════════════════════════════════════════════════════ */
  const river = {
    canvas: null, ctx: null, w: 0, h: 0, dpr: 1,
    panX: 0, panY: 0, zoom: 1,
    targetPanX: 0, targetPanY: 0, targetZoom: 1,
    mouseX: -9999, mouseY: -9999,
    dragging: false, dragMoved: false, dragSX: 0, dragSY: 0,
    hoveredItem: null, hoveredEra: null,
    stars: [],
    nodes: [],
    lastTap: 0, lastTapId: null,
  };

  function initRiver() {
    river.canvas = $('riverCanvas');
    river.ctx = river.canvas.getContext('2d');
    // Subtle ambient starfield
    river.stars = Array.from({ length: 140 }, (_, i) => ({
      x: ((i * 7919) % 10000) / 10000,
      y: ((i * 104729) % 10000) / 10000,
      r: 0.5 + (i % 5) * 0.28,
      p: (i * 1.37) % (Math.PI * 2),
      a: 0.08 + (i % 7) * 0.032,
    }));

    // Build river nodes
    river.nodes = G.items.map((it, i) => ({
      item: it,
      baseR: it.hasPeriod ? (17 + (i % 4) * 3) : (12 + (i % 4) * 2.5),
      phase: ((hashStr(it.id + ':ph') % 628) / 100),
      ampY: 2.5 + (i % 5) * 1.1,
      ampX: 1.5 + (i % 3) * 0.9,
      sx: 0, sy: 0, sr: 14,
    }));

    // Pre-warm visible sprites cleanly
    G.items.slice(0, 60).forEach(it => getSprite(it.thumbUrl));
    setTimeout(() => G.items.slice(60).forEach(it => getSprite(it.thumbUrl)), 350);

    renderRiverDock();
    bindRiverEvents();
    resizeRiver();
  }

  function renderRiverDock() {
    const erasEl = $('riverEras');
    erasEl.replaceChildren();
    const eraLbl = document.createElement('span');
    eraLbl.className = 'dock-label';
    eraLbl.textContent = '时代';
    erasEl.append(eraLbl);
    for (const e of G.eras) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      const col = colorFor('era', e.name);
      b.innerHTML = `<span class="dot" style="background:${col}"></span><span>${esc(e.name)}</span><span class="num">${e.count}</span>`;
      b.onmouseenter = () => { river.hoveredEra = e.name; state.riverHighlightEra = e.name; };
      b.onmouseleave = () => { river.hoveredEra = null; state.riverHighlightEra = null; };
      b.onclick = () => openGraph('era', e.id);
      erasEl.append(b);
    }

    const matsEl = $('riverMats');
    matsEl.replaceChildren();
    const matLbl = document.createElement('span');
    matLbl.className = 'dock-label';
    matLbl.textContent = '材质';
    matsEl.append(matLbl);
    for (const m of G.materials.slice(0, 8)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      const col = colorFor('material', m.name);
      b.innerHTML = `<span class="dot" style="background:${col}"></span><span>${esc(m.name)}</span><span class="num">${m.count}</span>`;
      b.onmouseenter = () => { state.riverHighlightMat = m.name; };
      b.onmouseleave = () => { state.riverHighlightMat = null; };
      b.onclick = () => openGraph('material', m.id);
      matsEl.append(b);
    }
    if (G.materials.length > 8) {
      const more = document.createElement('button');
      more.type = 'button';
      more.className = 'chip';
      more.textContent = `+${G.materials.length - 8}`;
      more.onclick = () => { state.catalogTab = 'material'; switchView('catalog'); };
      matsEl.append(more);
    }
  }

  function resizeRiver() {
    if (!river.canvas) return;
    river.dpr = Math.min(window.devicePixelRatio || 1, 2);
    river.w = window.innerWidth;
    river.h = window.innerHeight;
    river.canvas.width = Math.round(river.w * river.dpr);
    river.canvas.height = Math.round(river.h * river.dpr);
  }

  // Smooth river spine curve across full viewport width
  function riverSpineY(t, h) {
    const mid = h * 0.51;
    const amp = Math.min(68, h * 0.085);
    return mid + Math.sin(t * Math.PI * 2.1 - 0.55) * amp + Math.cos(t * Math.PI * 1.1) * (amp * 0.32);
  }

  function bindRiverEvents() {
    const c = river.canvas;
    c.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      river.dragging = true;
      river.dragMoved = false;
      river.dragSX = e.clientX;
      river.dragSY = e.clientY;
      c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', e => {
      river.mouseX = e.clientX;
      river.mouseY = e.clientY;
      if (river.dragging) {
        const dx = e.clientX - river.dragSX;
        const dy = e.clientY - river.dragSY;
        if (Math.hypot(dx, dy) > 4) river.dragMoved = true;
        river.targetPanX += dx;
        river.targetPanY += dy;
        river.dragSX = e.clientX;
        river.dragSY = e.clientY;
        hideTip();
        return;
      }
      hitTestRiver(e.clientX, e.clientY);
    });
    c.addEventListener('pointerup', e => {
      if (!river.dragging) return;
      river.dragging = false;
      if (!river.dragMoved) {
        hitTestRiver(e.clientX, e.clientY);
        if (river.hoveredItem) {
          const it = river.hoveredItem.item;
          const now = performance.now();
          if (river.lastTapId === it.id && now - river.lastTap < 360) {
            // Double-click jumps directly to its clustered graph!
            if (it.motifs.length) openGraph('motif', it.motifs[0]);
            else if (it.materials.length) openGraph('material', it.materials[0]);
            else if (it.eraGroups.length) openGraph('era', it.eraGroups[0]);
          } else {
            openDrawer(it.id);
          }
          river.lastTap = now;
          river.lastTapId = it.id;
        } else if (river.hoveredEra) {
          openGraph('era', river.hoveredEra);
        } else {
          closeDrawer();
        }
      }
    });
    c.addEventListener('pointerleave', () => {
      river.mouseX = -9999; river.mouseY = -9999;
      river.hoveredItem = null; river.hoveredEra = null;
      hideTip();
    });
    c.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      const nextZ = Math.max(0.75, Math.min(2.6, river.targetZoom * factor));
      const ratio = nextZ / river.targetZoom;
      const cx = e.clientX - river.w * 0.5;
      const cy = e.clientY - river.h * 0.5;
      river.targetPanX = cx - (cx - river.targetPanX) * ratio;
      river.targetPanY = cy - (cy - river.targetPanY) * ratio;
      river.targetZoom = nextZ;
    }, { passive: false });
    c.addEventListener('dblclick', e => {
      if (!river.hoveredItem && !river.hoveredEra) {
        river.targetPanX = 0; river.targetPanY = 0; river.targetZoom = 1;
      }
    });
  }

  function hitTestRiver(mx, my) {
    let best = null, bestD = Infinity;
    for (let i = river.nodes.length - 1; i >= 0; i--) {
      const n = river.nodes[i];
      if (state.riverDatedOnly && !n.item.hasPeriod) continue;
      const d = Math.hypot(mx - n.sx, my - n.sy);
      if (d <= n.sr + 5 && d < bestD) { best = n; bestD = d; }
    }
    river.hoveredItem = best;

    // Also check clickable era header pills on the river canvas
    let eraHit = null;
    if (!best) {
      for (const e of G.eras) {
        if (e._hitBox) {
          const [x1, y1, x2, y2] = e._hitBox;
          if (mx >= x1 && mx <= x2 && my >= y1 && my <= y2) { eraHit = e.name; break; }
        }
      }
    }
    river.hoveredEra = eraHit;
    river.canvas.classList.toggle('pointer', Boolean(best || eraHit));

    if (best) {
      const it = best.item;
      const tags = [
        ...it.periods.map(p => `<span class="tip-tag">${esc(p)}</span>`),
        ...it.materials.map(m => `<span class="tip-tag">${esc(m)}</span>`),
        ...it.motifs.slice(0, 3).map(m => `<span class="tip-tag">${esc(m)}</span>`),
      ];
      if (!tags.length) tags.push('<span class="tip-tag">未标关系</span>');
      showTip(mx, my, `<strong>${esc(it.title)}</strong><div class="tip-tags">${tags.join('')}</div><div class="tip-hint">点击查看关系与出处 · 双击进入图谱</div>`);
    } else if (eraHit) {
      const eObj = G.eraById.get(eraHit);
      showTip(mx, my, `<strong>${esc(eraHit)}</strong><div class="tip-tags"><span class="tip-tag">${eObj.count} 条图录</span><span class="tip-tag">默认按材质聚类</span></div><div class="tip-hint">点击进入时代 2D/3D 聚类图谱 →</div>`);
    } else {
      hideTip();
    }
  }

  function drawRiver(timeSec) {
    const { ctx, w, h, dpr } = river;
    if (!w || !h) return;

    // Smooth camera damping
    river.panX += (river.targetPanX - river.panX) * 0.14;
    river.panY += (river.targetPanY - river.panY) * 0.14;
    river.zoom += (river.targetZoom - river.zoom) * 0.14;

    const dark = currentTheme() === 'dark';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 1) Rich Atmospheric Background
    const bgGrad = ctx.createRadialGradient(w * 0.5, h * 0.48, 40, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
    if (dark) {
      bgGrad.addColorStop(0, '#131722');
      bgGrad.addColorStop(0.55, '#0b0d14');
      bgGrad.addColorStop(1, '#07080c');
    } else {
      bgGrad.addColorStop(0, '#fcfaf5');
      bgGrad.addColorStop(0.65, '#f6f3eb');
      bgGrad.addColorStop(1, '#eee9de');
    }
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    // 2) Starfield / Paper Grain Dots
    for (const s of river.stars) {
      const tw = 0.65 + 0.35 * Math.sin(timeSec * 0.9 + s.p);
      ctx.fillStyle = dark
        ? `rgba(232, 222, 200, ${(s.a * tw).toFixed(3)})`
        : `rgba(60, 52, 42, ${(s.a * 0.45 * tw).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // World transform helper
    const marginX = Math.max(48, w * 0.045);
    const spanW = w - marginX * 2;
    const toScreen = (wx, wy) => ({
      x: w * 0.5 + (wx - w * 0.5) * river.zoom + river.panX,
      y: h * 0.5 + (wy - h * 0.5) * river.zoom + river.panY,
    });

    // 3) Soft Era Nebula Washes along the Historical River
    const activeEra = state.riverHighlightEra || river.hoveredEra;
    for (const e of G.eras) {
      const col = colorFor('era', e.name);
      const wx = marginX + e.tMid * spanW;
      const wy = riverSpineY(e.tMid, h);
      const p = toScreen(wx, wy);
      const rad = Math.max(130, (e.t1 - e.t0) * spanW * 0.68) * river.zoom;
      const boost = activeEra === e.name ? 1.85 : 1.0;
      const ng = ctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, rad);
      ng.addColorStop(0, hexAlpha(col, (dark ? 0.14 : 0.09) * boost));
      ng.addColorStop(0.55, hexAlpha(col, (dark ? 0.05 : 0.03) * boost));
      ng.addColorStop(1, hexAlpha(col, 0));
      ctx.fillStyle = ng;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      ctx.fill();
    }

    // 4) Sweeping Multi-Strand River Stream Lines (Historical Current)
    const strands = [-28, -10, 0, 11, 30];
    strands.forEach((off, si) => {
      ctx.beginPath();
      const steps = 64;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const wx = marginX + t * spanW;
        const wave = Math.sin(t * 7 + timeSec * 0.35 + si) * (si === 2 ? 2 : 5);
        const wy = riverSpineY(t, h) + off + wave;
        const p = toScreen(wx, wy);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = si === 2
        ? (dark ? 'rgba(216,179,119,0.28)' : 'rgba(130,85,48,0.24)')
        : (dark ? 'rgba(239,236,228,0.065)' : 'rgba(40,35,28,0.06)');
      ctx.lineWidth = si === 2 ? 1.4 : 0.8;
      ctx.setLineDash(si === 0 || si === 4 ? [3, 6] : []);
      ctx.stroke();
    });
    ctx.setLineDash([]);

    // 5) Compute live positions for all floating medallions
    const verticalSpread = Math.min(h * 0.36, 270);
    const hoveredMotifs = new Set(river.hoveredItem?.item.motifs || []);
    const hoveredId = river.hoveredItem?.item.id || state.drawerItemId;
    const activeMat = state.riverHighlightMat;

    for (const n of river.nodes) {
      const it = n.item;
      const wx = marginX + it.riverT * spanW + Math.cos(timeSec * 0.42 + n.phase) * n.ampX;
      const spine = riverSpineY(it.riverT, h);
      const laneH = it.hasPeriod ? verticalSpread * 0.56 : verticalSpread * 0.96;
      const wy = spine + it.riverLane * laneH + Math.sin(timeSec * 0.55 + n.phase) * n.ampY;
      const p = toScreen(wx, wy);
      n.sx = p.x;
      n.sy = p.y;
      n.sr = n.baseR * Math.pow(river.zoom, 0.72);
    }

    // 6) Motif Lineage Filaments across the River (subtle ambient + glowing on hover!)
    if (hoveredMotifs.size > 0 && river.hoveredItem) {
      const src = river.hoveredItem;
      ctx.lineWidth = 1.25;
      for (const n of river.nodes) {
        if (n === src) continue;
        if (state.riverDatedOnly && !n.item.hasPeriod) continue;
        if (n.item.motifs.some(m => hoveredMotifs.has(m))) {
          const col = colorFor('motif', n.item.motifs.find(m => hoveredMotifs.has(m)));
          ctx.beginPath();
          const mx = (src.sx + n.sx) * 0.5;
          const my = (src.sy + n.sy) * 0.5 - Math.min(70, Math.abs(src.sx - n.sx) * 0.16);
          ctx.moveTo(src.sx, src.sy);
          ctx.quadraticCurveTo(mx, my, n.sx, n.sy);
          ctx.strokeStyle = hexAlpha(col, dark ? 0.55 : 0.48);
          ctx.stroke();
        }
      }
    } else {
      // Gentle constellation threads connecting same-era or same-motif neighbors along the stream
      ctx.lineWidth = 0.65;
      ctx.strokeStyle = dark ? 'rgba(216,179,119,0.08)' : 'rgba(60,52,42,0.07)';
      for (const e of G.eras) {
        const datedNodes = river.nodes.filter(n => n.item.eraGroups[0] === e.name).sort((a, b) => a.sx - b.sx);
        if (datedNodes.length < 2) continue;
        ctx.beginPath();
        for (let i = 0; i < datedNodes.length - 1; i++) {
          const a = datedNodes[i], b = datedNodes[i + 1];
          if (Math.hypot(a.sx - b.sx, a.sy - b.sy) < 160 * river.zoom) {
            ctx.moveTo(a.sx, a.sy);
            ctx.lineTo(b.sx, b.sy);
          }
        }
        ctx.stroke();
      }
    }

    // 7) Draw Floating Pattern Medallions (ambient first, dated & highlighted on top!)
    const overlaySet = stageOverlay?.artifactSet || null;
    const ordered = [...river.nodes].sort((a, b) => {
      const ah = a.item.id === hoveredId ? 3 : (overlaySet?.has(a.item.id) ? 2 : (a.item.hasPeriod ? 1 : 0));
      const bh = b.item.id === hoveredId ? 3 : (overlaySet?.has(b.item.id) ? 2 : (b.item.hasPeriod ? 1 : 0));
      return ah - bh;
    });

    // Draw glowing reasoning path energy arcs across the River when overlay is active!
    if (stageOverlay?.pathChains?.length) {
      const nodeByArt = new Map(river.nodes.map(n => [n.item.id, n]));
      for (const chain of stageOverlay.pathChains) {
        const pts = chain.map(aid => nodeByArt.get(aid)).filter(Boolean);
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1];
          const mx = (a.sx + b.sx) * 0.5;
          const my = (a.sy + b.sy) * 0.5 - Math.min(95, Math.max(36, Math.abs(a.sx - b.sx) * 0.22));
          ctx.beginPath();
          ctx.moveTo(a.sx, a.sy);
          ctx.quadraticCurveTo(mx, my, b.sx, b.sy);
          ctx.strokeStyle = dark ? 'rgba(228,191,122,0.72)' : 'rgba(155,78,48,0.68)';
          ctx.lineWidth = 2.2;
          ctx.stroke();
          // Traveling energy pulse along the river arc
          const tP = (timeSec * 0.55 + i * 0.27) % 1;
          const u = 1 - tP;
          const px = u * u * a.sx + 2 * u * tP * mx + tP * tP * b.sx;
          const py = u * u * a.sy + 2 * u * tP * my + tP * tP * b.sy;
          ctx.fillStyle = dark ? '#fff2cc' : '#8f4e32';
          ctx.beginPath();
          ctx.arc(px, py, 3.6, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    for (const n of ordered) {
      const it = n.item;
      if (state.riverDatedOnly && !it.hasPeriod && !overlaySet?.has(it.id)) continue;
      if (n.sx < -40 || n.sx > w + 40 || n.sy < -40 || n.sy > h + 40) continue;

      const isFocus = it.id === hoveredId;
      const ovMatch = overlaySet ? overlaySet.has(it.id) : false;
      const motifMatch = hoveredMotifs.size > 0 && it.motifs.some(m => hoveredMotifs.has(m));
      const eraMatch = activeEra && it.eraGroups.includes(activeEra);
      const matMatch = activeMat && it.materials.includes(activeMat);
      const filtering = Boolean(activeEra || activeMat || hoveredMotifs.size > 0 || overlaySet);
      const highlighted = isFocus || motifMatch || eraMatch || matMatch || ovMatch;

      let alpha = it.hasPeriod ? 0.94 : 0.62;
      if (filtering) alpha = highlighted ? 1 : 0.14;

      const r = isFocus ? n.sr * 1.28 : (highlighted && filtering ? n.sr * 1.1 : n.sr);
      const ringCol = it.materials.length
        ? colorFor('material', it.materials[0])
        : (it.eraGroups.length ? colorFor('era', it.eraGroups[0]) : (dark ? '#9c9588' : '#7a7266'));

      ctx.save();
      ctx.globalAlpha = alpha;

      // Soft outer halo on highlighted or dated nodes
      if (highlighted || (dark && it.hasPeriod)) {
        const glow = ctx.createRadialGradient(n.sx, n.sy, r * 0.7, n.sx, n.sy, r * (isFocus ? 2.1 : 1.55));
        glow.addColorStop(0, hexAlpha(ringCol, isFocus ? 0.42 : (highlighted ? 0.28 : 0.14)));
        glow.addColorStop(1, hexAlpha(ringCol, 0));
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(n.sx, n.sy, r * (isFocus ? 2.1 : 1.55), 0, Math.PI * 2);
        ctx.fill();
      }

      const sp = getSprite(it.thumbUrl);
      const bmp = sp?.status === 'ready' ? (dark ? sp.dark : sp.light) : null;
      if (bmp) {
        ctx.drawImage(bmp, n.sx - r, n.sy - r, r * 2, r * 2);
      } else {
        ctx.fillStyle = dark ? '#191d28' : '#ebe6dc';
        ctx.beginPath();
        ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Crisp hairline ring
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
      ctx.strokeStyle = isFocus
        ? (dark ? '#f6dfb2' : '#8f4e32')
        : hexAlpha(ringCol, highlighted ? 0.95 : (dark ? 0.55 : 0.48));
      ctx.lineWidth = isFocus ? 2.2 : (highlighted ? 1.5 : 1.0);
      ctx.stroke();

      // Show short motif label directly below prominent nodes when zoomed in or highlighted
      if ((isFocus || (highlighted && filtering) || (river.zoom > 1.35 && it.hasPeriod)) && (it.motifs[0] || it.title)) {
        const lbl = it.motifs[0] || it.title.slice(0, 8);
        ctx.font = `500 11px ${getComputedStyle(document.body).fontFamily}`;
        ctx.textAlign = 'center';
        ctx.fillStyle = dark ? 'rgba(239,236,228,0.92)' : 'rgba(30,28,25,0.88)';
        ctx.fillText(lbl, n.sx, n.sy + r + 14);
      }
      ctx.restore();
    }

    // 8) Clickable Era Gate Markers along the River Horizon
    for (const e of G.eras) {
      const wx = marginX + e.tMid * spanW;
      const wy = riverSpineY(e.tMid, h);
      const p = toScreen(wx, wy);
      const isHov = activeEra === e.name;
      const col = colorFor('era', e.name);
      const labelY = Math.max(108, p.y - Math.min(h * 0.25, 165) * Math.min(1.15, river.zoom));

      // Delicate vertical time hairline dropping from Era header into the river spine
      ctx.beginPath();
      ctx.moveTo(p.x, labelY + 18);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = hexAlpha(col, isHov ? 0.55 : 0.20);
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      // River anchor diamond
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, isHov ? 4.5 : 3, 0, Math.PI * 2);
      ctx.fill();

      // Serif Era Title Badge (clickable!)
      ctx.font = `600 15px "Noto Serif SC","Songti SC",serif`;
