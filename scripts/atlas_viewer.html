      river.pendingPointer = null; river.hoveredItem = null; river.hoveredEra = null; hideTip();
    });
    c.addEventListener('wheel', e => {
      e.preventDefault(); zoomRiver(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
    }, { passive: false });
    c.addEventListener('dblclick', () => {
      if (!river.hoveredItem && !river.hoveredEra) resetRiver();
    });
  }

  function hitTestRiver(mx, my) {
    let best = null, bestD = Infinity;
    for (const n of river.visibleNodes) {
      const d = (mx - n.sx) ** 2 + (my - n.sy) ** 2;
      if (d <= (n.sr + 5) ** 2 && d < bestD) { best = n; bestD = d; }
    }
    river.hoveredItem = best;
    river.hoveredEra = null;
    if (!best) for (const e of G.eras) {
      const b = e._hitBox;
      if (b && mx >= b[0] && mx <= b[2] && my >= b[1] && my <= b[3]) { river.hoveredEra = e.name; break; }
    }
    river.canvas.classList.toggle('pointer', Boolean(best || river.hoveredEra));
    if (best) {
      const it = best.item;
      const related = riverRelatedGroups(best);
      const targetMotif = best.motif || it.motifs[0] || null;
      const tags = [best.era, targetMotif || '未标纹样'];
      if (best.count > 1) tags.push(`${best.count} 件图录`);
      else tags.push(...it.materials.slice(0, 1), ...it.artifactTypes);
      if (it.imageKind === 'artifact_candidate') tags.push('自动裁图候选');
      const hint = best.count > 1
        ? `点击进入「${targetMotif}」聚类图谱 →`
        : `点击进入「${targetMotif || best.era}」聚类图谱并查看出处 →`;
      showTip(mx, my, `<strong>${esc(best.count > 1 ? targetMotif : it.title)}</strong><div class="tip-tags">${tags.map(t => `<span class="tip-tag">${esc(t)}</span>`).join('')}</div><div class="tip-hint">${esc(hint)}${related.length ? ` · 跨 ${related.length + 1} 个时代` : ''}</div>`);
    } else if (river.hoveredEra) {
      const era = G.eraById.get(river.hoveredEra);
      const motifCount = (river.byEra.get(era.id) || []).filter(g => g.motif).length;
      showTip(mx, my, `<strong>${esc(era.name)}</strong><div class="tip-tags"><span class="tip-tag">${era.count} 件图录</span>${motifCount ? `<span class="tip-tag">${motifCount} 种纹样</span>` : ''}</div><div class="tip-hint">点击进入「${esc(era.name)}」聚类图谱 →</div>`);
    } else hideTip();
  }

  const riverGlowCache = new Map();
  function riverGlow(color, dark) {
    const key = `${color}:${dark}`;
    if (riverGlowCache.has(key)) return riverGlowCache.get(key);
    const canvas = document.createElement('canvas'); canvas.width = canvas.height = 96;
    const ctx = canvas.getContext('2d'), glow = ctx.createRadialGradient(48, 48, 0, 48, 48, 48);
    glow.addColorStop(0, hexAlpha(color, dark ? 0.52 : 0.26));
    glow.addColorStop(0.32, hexAlpha(color, dark ? 0.18 : 0.10));
    glow.addColorStop(0.68, hexAlpha(color, dark ? 0.05 : 0.025));
    glow.addColorStop(1, hexAlpha(color, 0));
    ctx.fillStyle = glow; ctx.fillRect(0, 0, 96, 96);
    riverGlowCache.set(key, canvas); return canvas;
  }

  function riverPath(start, end, offset = 0, freq = 11, phase = 0, weaveAmp = 0) {
    const steps = Math.max(4, Math.ceil((end - start) * river.curveLength / 8));
    const points = Array.from({ length: steps + 1 }, (_, i) => {
      const t = start + (end - start) * i / steps;
      const p = riverPoint(t);
      const swell = 0.62 + 0.38 * Math.sin(t * freq + phase);
      const weave = weaveAmp ? Math.sin(t * (freq * 0.58) + phase * 1.7) * weaveAmp : 0;
      const drift = offset * swell + weave;
      return [p.x + p.nx * drift, p.y + p.ny * drift];
    });
    const coord = point => point.map(n => n.toFixed(1)).join(' ');
    let d = `M ${coord(points[0])}`;
    for (let i = 1; i < steps; i++) {
      const [x, y] = points[i], [nextX, nextY] = points[i + 1];
      d += ` Q ${coord(points[i])} ${coord([(x + nextX) / 2, (y + nextY) / 2])}`;
    }
    return `${d} L ${coord(points[steps])}`;
  }

  function riverRibbonPath(start, end, halfWidth) {
    const steps = Math.max(12, Math.ceil((end - start) * river.curveLength / 14));
    const upper = [], lower = [];
    for (let i = 0; i <= steps; i++) {
      const t = start + (end - start) * i / steps;
      const p = riverPoint(t);
      const taper = 0.76 + 0.24 * Math.sin(t * Math.PI);
      const wave = 0.86 + 0.14 * Math.sin(t * 10.5 + 0.4);
      const hw = halfWidth * taper * wave;
      upper.push([p.x + p.nx * hw, p.y + p.ny * hw]);
      lower.push([p.x - p.nx * hw, p.y - p.ny * hw]);
    }
    const fmt = pts => pts.map(pt => `${pt[0].toFixed(1)} ${pt[1].toFixed(1)}`);
    return `M ${fmt(upper).join(' L ')} L ${fmt(lower.reverse()).join(' L ')} Z`;
  }

  function drawRiverWaterway(theme) {
    const current = $('riverCurrent');
    const defs = $('riverDefs');
    const key = `${river.layoutVersion}:${theme}`;
    if (river.waterwayKey !== key) {
      const dark = theme === 'dark';
      const spineEras = G.eras.filter(e => !e.embedded);
      const p0 = riverPoint(0), p1 = riverPoint(1);
      const xSpan = Math.max(1, p1.x - p0.x);

      // Build seamless continuous horizontal linearGradient spanning all spine eras (ZERO gaps!)
      const grad = riverSvg('linearGradient', {
        id: 'riverEraGrad', gradientUnits: 'userSpaceOnUse',
        x1: p0.x.toFixed(1), y1: '0', x2: p1.x.toFixed(1), y2: '0',
      });
      const stops = [];
      for (const era of (spineEras.length ? spineEras : G.eras)) {
        const col = riverEraColor(era.id, theme);
        const f0 = Math.max(0, Math.min(1, (riverPoint(era.t0).x - p0.x) / xSpan));
        const f1 = Math.max(0, Math.min(1, (riverPoint(era.t1).x - p0.x) / xSpan));
        const feather = Math.min(0.015, (f1 - f0) * 0.18);
        stops.push(
          riverSvg('stop', { offset: `${((f0 + feather) * 100).toFixed(2)}%`, 'stop-color': col }),
          riverSvg('stop', { offset: `${((f1 - feather) * 100).toFixed(2)}%`, 'stop-color': col }),
        );
      }
      if (!stops.length) {
        const fallback = dark ? '#d8b377' : '#8f4e32';
        stops.push(
          riverSvg('stop', { offset: '0%', 'stop-color': fallback }),
          riverSvg('stop', { offset: '100%', 'stop-color': fallback }),
        );
      }
      grad.replaceChildren(...stops);

      const blurFilter = riverSvg('filter', {
        id: 'riverWashBlur', x: '-8%', y: '-40%', width: '116%', height: '180%',
      });
      blurFilter.replaceChildren(riverSvg('feGaussianBlur', { stdDeviation: '20' }));
      if (defs) defs.replaceChildren(grad, blurFilter);

      const washHalf = Math.min(132, Math.max(68, river.breadth * 0.72));
      const innerHalf = washHalf * 0.42;
      const bandScale = river.breadth / 185;
      const stroke = (d, width, opacity, dash) => {
        const attrs = {
          d, stroke: 'url(#riverEraGrad)', 'stroke-width': width, 'stroke-opacity': opacity,
          'vector-effect': 'non-scaling-stroke', fill: 'none',
        };
        if (dash) attrs['stroke-dasharray'] = dash;
        return riverSvg('path', attrs);
      };

      const paths = [
        // Layer 1: Wide watercolor / nebula pigment wash
        riverSvg('path', {
          d: riverRibbonPath(0, 1, washHalf),
          fill: 'url(#riverEraGrad)', 'fill-opacity': dark ? '0.15' : '0.13',
          stroke: 'none', filter: 'url(#riverWashBlur)', 'vector-effect': 'non-scaling-stroke',
        }),
        // Layer 2: Inner luminous silk current ribbon
        riverSvg('path', {
          d: riverRibbonPath(0, 1, innerHalf),
          fill: 'url(#riverEraGrad)', 'fill-opacity': dark ? '0.11' : '0.09',
          stroke: 'none', 'vector-effect': 'non-scaling-stroke',
        }),
        // Layer 3: Organically weaving silk-ribbon filaments (Dunhuang ribbon rhythm, zero rigid parallel wires)
        stroke(riverPath(0, 1, -58 * bandScale, 7.2, 0.4, 24 * bandScale), 0.75, dark ? 0.22 : 0.19),
        stroke(riverPath(0, 1, -24 * bandScale, 11.4, 1.9, 18 * bandScale), 1.0, dark ? 0.34 : 0.30),
        stroke(riverPath(0, 1, 18 * bandScale, 9.6, 3.1, 20 * bandScale), 1.0, dark ? 0.36 : 0.31),
        stroke(riverPath(0, 1, 54 * bandScale, 6.8, 2.2, 26 * bandScale), 0.75, dark ? 0.21 : 0.18),
        stroke(riverPath(0, 1, 0, 13.8, 0.8, 12 * bandScale), 0.9, dark ? 0.30 : 0.26),
        // Layer 4: Luminous core historical spine thread
        stroke(riverPath(0, 1, 0, 10, 0, 0), 2.1, dark ? 0.86 : 0.78),
      ];
      current.replaceChildren(...paths);
      river.waterwayKey = key;
    }
    current.setAttribute('transform', `translate(${river.panX + river.w * (1 - river.zoom) / 2} ${river.panY + river.h * (1 - river.zoom) / 2}) scale(${river.zoom})`);
  }

  function drawRiverMotifLinks(hovered, related, theme) {
    const links = hovered ? related.map(target => {
      const { sx: x, sy: y } = hovered, { sx: tx, sy: ty } = target;
      const dx = tx - x, dy = ty - y;
      const span = Math.hypot(dx, dy);
      // Arch cleanly above the river for far cross-era leaps so links read like celestial constellations
      const lift = Math.min(140, Math.max(36, span * 0.22)) * (y > river.h * 0.5 ? -1 : 1);
      const cx = (x + tx) * 0.5, cy = (y + ty) * 0.5 + lift;
      return riverSvg('path', {
        d: `M ${x} ${y} Q ${cx} ${cy} ${tx} ${ty}`,
        stroke: riverEraColor(target.era, theme), 'stroke-width': 1.7, 'stroke-opacity': 0.82,
        'stroke-dasharray': '5 4',
      });
    }) : [];
    $('riverMotifLinks').replaceChildren(...links);
  }

  // Only this transparent layer animates while idle; artwork and SVG ribbons stay crisp and cached.
  function drawRiverFlow(now) {
    if (!river.flowCtx || !river.curve || now - river.lastFlowAt < 48) return;
    const reduced = river.motionQuery.matches;
    const key = `${river.layoutVersion}:${river.panX}:${river.panY}:${river.zoom}:${currentTheme()}`;
    if (reduced && river.flowKey === key) return;
    river.lastFlowAt = now; river.flowKey = key;
    const ctx = river.flowCtx, { w, h, dpr } = river, dark = currentTheme() === 'dark', time = now * 0.001;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < 26; i++) {
      const t = (i * 0.61803398875 + (reduced ? 0 : time * 0.008)) % 1;
      const p = riverPoint(t);
      const drift = Math.sin(i * 6.3 + time * 0.18) * (10 + (i % 19) * 3.2);
      const q = riverToScreen(p.x + p.nx * drift, p.y + p.ny * drift);
      if (!inViewport(q.x, q.y, 18, w, h)) continue;
      const alpha = 0.16 + 0.20 * Math.sin(time * 0.8 + i * 2.1) ** 2;
      ctx.globalAlpha = dark ? alpha : alpha * 0.62;
      ctx.drawImage(riverGlow(dark ? '#e4cfa0' : '#9c7344', dark), q.x - 10, q.y - 10, 20, 20);
      ctx.beginPath(); ctx.arc(q.x, q.y, 0.8 + (i % 3) * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = dark ? '#f5e7c4' : '#9c7344'; ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawRiver() {
    const { ctx, w, h, dpr } = river;
    if (!w || !h) return;
    river.panX += (river.targetPanX - river.panX) * 0.22;
    river.panY += (river.targetPanY - river.panY) * 0.22;
    river.zoom += (river.targetZoom - river.zoom) * 0.22;

    const theme = currentTheme(), dark = theme === 'dark', overlay = stageOverlay?.artifactSet;
    const activeEra = state.riverHighlightEra || river.hoveredEra, activeMat = state.riverHighlightMat;
    const hovered = river.hoveredItem, related = new Set(riverRelatedGroups(hovered));
    const filtering = Boolean(activeEra || activeMat || hovered || overlay);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    drawRiverWaterway(theme);

    // Highlight hovered dynasty's segment directly on the river spine
    if (activeEra) {
      const eraObj = G.eraById.get(activeEra);
      if (eraObj) {
        const col = riverEraColor(eraObj.id, theme);
        const steps = Math.max(12, Math.ceil((eraObj.t1 - eraObj.t0) * 160));
        ctx.save();
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const t = eraObj.t0 + (eraObj.t1 - eraObj.t0) * i / steps;
          const pt = riverPoint(t), sp = riverToScreen(pt.x, pt.y);
          if (i === 0) ctx.moveTo(sp.x, sp.y); else ctx.lineTo(sp.x, sp.y);
        }
        ctx.lineCap = 'round';
        ctx.strokeStyle = hexAlpha(col, dark ? 0.22 : 0.16);
        ctx.lineWidth = Math.max(18, 28 * Math.pow(river.zoom, 0.35));
        ctx.stroke();
        ctx.strokeStyle = hexAlpha(col, 0.92);
        ctx.lineWidth = 3.2;
        ctx.stroke();
        ctx.restore();
      }
    }

    river.visibleNodes = [];
    const ordinarySingles = [], ordinaryClusters = [], highlighted = [], nodeByArt = new Map();
    const zoomScale = Math.pow(river.zoom, 0.42);

    for (const n of river.groups) {
      const p = riverToScreen(n.wx, n.wy);
      n.sx = p.x; n.sy = p.y;
      n.focus = n === hovered || (state.drawerItemId && n.members.some(m => m.item.id === state.drawerItemId));
      const isRelated = related.has(n);
      const matOrOverlayMatch = Boolean((overlay || activeMat) &&
        n.members.some(({ item }) => overlay?.has(item.id) || item.materials.includes(activeMat)));
      n.match = n.focus || isRelated || activeEra === n.era || matOrOverlayMatch;

      // Progressive zoom-in reveal: overview shows curated airy Tier 0; deeper tiers bloom on zoom
      // or temporarily reveal when linked to the hovered motif / active material / reasoning overlay!
      let reveal = n.tier === 0 ? 1 : Math.max(0, Math.min(1, (river.zoom - n.minZoom) / 0.45));
      if (n.focus || isRelated || matOrOverlayMatch) reveal = 1;
      n.reveal = reveal;
      if (reveal <= 0.02) { n.visible = false; continue; }

      n.sr = Math.max(6, (n.layoutR || n.baseR) * zoomScale);
      if (stageOverlay?.pathChains?.length) for (const { item } of n.members) {
        const previous = nodeByArt.get(item.id);
        if (!previous || (previous.era !== item.eraGroups[0] && n.era === item.eraGroups[0])) nodeByArt.set(item.id, n);
      }

      const extent = n.sr * (n.focus ? 1.3 : 1);
      n.visible = inViewport(n.sx, n.sy, extent + 28, w, h);
      if (!n.visible) continue;
      river.visibleNodes.push(n);
      if (n.match) highlighted.push(n);
      else if (n.count > 1) ordinaryClusters.push(n);
      else ordinarySingles.push(n);
    }

    drawRiverMotifLinks(hovered, [...related], theme);

    if (stageOverlay?.pathChains?.length) {
      ctx.beginPath();
      for (const chain of stageOverlay.pathChains) {
        const points = chain.map(id => nodeByArt.get(id)).filter(Boolean);
        points.forEach((n, i) => { if (i) ctx.lineTo(n.sx, n.sy); else ctx.moveTo(n.sx, n.sy); });
      }
      ctx.strokeStyle = dark ? '#e4bf7a' : '#9b4e30'; ctx.lineWidth = 2.2; ctx.stroke();
    }

    // Pre-reserve era plaque regions so medallion labels never collide with dynasty plaques
    const occupiedLabelBoxes = [];
    for (const e of G.eras) {
      const labelP = riverToScreen(e.riverLabel.x, e.riverLabel.y);
      e._hitBox = null;
      if (!inViewport(labelP.x, labelP.y, 90, w, h)) continue;
      const isMinor = Boolean(e.embedded);
      ctx.font = `${isMinor ? 500 : 600} ${isMinor ? 12 : 14}px "Noto Serif SC","Songti SC",serif`;
      const countText = ` ${e.count}`;
      const nameW = ctx.measureText(e.name).width;
      ctx.font = '500 10px ui-monospace,monospace';
      const numW = ctx.measureText(countText).width;
      const bw = nameW + numW + (isMinor ? 22 : 28), bh = isMinor ? 24 : 28;
      e._hitBox = [labelP.x - bw / 2, labelP.y - bh / 2, labelP.x + bw / 2, labelP.y + bh / 2];
      e._labelMeta = { x: labelP.x, y: labelP.y, bw, bh, nameW, numW, countText, isMinor };
      occupiedLabelBoxes.push([e._hitBox[0] - 4, e._hitBox[1] - 4, e._hitBox[2] + 4, e._hitBox[3] + 4]);
    }

    // Draw whisper-thin dynasty leader lines & spine pearls UNDERNEATH the medallions for a clean layered feel
    for (const e of G.eras) {
      if (!e._hitBox || !e._labelMeta) continue;
      const { x, y, bh, isMinor } = e._labelMeta;
      const anchor = riverPoint(e.tMid), p = riverToScreen(anchor.x, anchor.y);
      const col = riverEraColor(e.name, theme), active = activeEra === e.name;
      const dimmed = filtering && !active && (!hovered || hovered.era !== e.name);
      ctx.globalAlpha = dimmed ? 0.28 : 1;
      const edgeY = y < p.y ? y + bh / 2 : y - bh / 2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(x, edgeY);
      ctx.strokeStyle = hexAlpha(col, active ? 0.75 : 0.30);
      ctx.lineWidth = active ? 1.2 : 0.75;
      ctx.setLineDash(isMinor ? [2, 4] : [1.5, 4]);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.drawImage(riverGlow(col, dark), p.x - 14, p.y - 14, 28, 28);
      ctx.beginPath(); ctx.arc(p.x, p.y, active ? 3.5 : (isMinor ? 2.1 : 2.7), 0, Math.PI * 2);
      ctx.fillStyle = col; ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Draw medallions: ordinary singletons → ordinary clusters → highlighted/hovered on top
    const drawOrder = [...ordinarySingles, ...ordinaryClusters, ...highlighted];
    const captionQueue = [];

    for (const n of drawOrder) {
      const isRelated = related.has(n);
      const r = n.focus ? n.sr * 1.14 : (isRelated ? n.sr * 1.10 : n.sr);
      const col = riverEraColor(n.era, theme);
      const baseAlpha = filtering && !n.match ? 0.16 : n.match ? 1 : (n.count > 1 ? 0.96 : 0.86);
      ctx.globalAlpha = baseAlpha * n.reveal;

      const sprite = r >= 7 ? getSprite(n.item.thumbUrl, n.focus ? 3 : n.match ? 2 : n.count > 1 ? 1 : 0, n.item.plateUrl) : null;
      const bitmap = spriteBitmap(sprite, dark);

      // Soft ambient mineral glow behind large clusters & highlighted nodes
      if (n.match || n.count >= 4) {
        const glowR = r * (n.match ? 2.25 : 1.75);
        ctx.drawImage(riverGlow(col, dark), n.sx - glowR, n.sy - glowR, glowR * 2, glowR * 2);
      }

      // Delicate outer constellation halo ring distinguishing multi-item motif clusters
      if (n.count > 1) {
        ctx.beginPath();
        ctx.arc(n.sx, n.sy, r + (n.match ? 4.5 : 3.2), 0, Math.PI * 2);
        ctx.strokeStyle = hexAlpha(col, n.match ? 0.72 : (dark ? 0.30 : 0.26));
        ctx.lineWidth = n.match ? 1.25 : 0.85;
        ctx.stroke();
      }

      // Medallion body fill & artwork sprite
      ctx.beginPath(); ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
      ctx.fillStyle = dark ? '#121622' : '#fbf8f1';
      ctx.fill();
      if (bitmap) {
        paintSprite(ctx, sprite, bitmap, n.sx, n.sy, r - 0.8);
      } else {
        ctx.beginPath(); ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
        ctx.fillStyle = hexAlpha(col, n.count > 1 ? (dark ? 0.28 : 0.22) : (dark ? 0.45 : 0.34));
        ctx.fill();
        ctx.beginPath(); ctx.arc(n.sx, n.sy, Math.max(2.2, r * 0.26), 0, Math.PI * 2);
        ctx.fillStyle = col; ctx.fill();
      }

      // Refined mineral rim
      ctx.beginPath(); ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
      ctx.strokeStyle = n.focus ? (dark ? '#f7e6c4' : '#3a2210') : col;
      ctx.lineWidth = n.focus ? 2.5 : (n.match ? 2.1 : (n.count > 1 ? 1.65 : 1.15));
      ctx.stroke();

      // Count micro-badge tucked cleanly at bottom-right rim for large / focused motif clusters
      if (n.count > 1 && (n.focus || isRelated || r >= 20)) {
        const bx = n.sx + r * 0.72, by = n.sy + r * 0.70;
        const label = String(n.count);
        const bw = Math.max(18, label.length * 6.2 + 9);
        ctx.fillStyle = dark ? 'rgba(17, 21, 32, 0.92)' : 'rgba(253, 250, 243, 0.95)';
        roundRect(ctx, bx - bw / 2, by - 8.5, bw, 17, 8.5);
        ctx.fill();
        ctx.strokeStyle = hexAlpha(col, 0.75);
        ctx.lineWidth = 0.9;
        ctx.stroke();
        ctx.font = '600 9.5px ui-monospace,monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = dark ? '#f0e6d2' : '#433528';
        ctx.fillText(label, bx, by + 0.5);
      }

      // Queue caption for hovered, cross-era related, or flagship large clusters
      if (n.focus || isRelated || (n.isFlagship && (!filtering || n.match)) || (n.count > 1 && river.zoom > 1.8 && r >= 22)) {
        captionQueue.push({ n, r, col, priority: n.focus ? 3 : isRelated ? 2 : n.isFlagship ? 1 : 0 });
      }
    }

    // Render collision-free serif captions beneath flagship & focused medallions
    captionQueue.sort((a, b) => b.priority - a.priority || b.n.count - a.n.count);
    for (const { n, r, col, priority } of captionQueue) {
      const rawLabel = n.count > 1 ? (n.motif || n.item.title) : (n.motif || n.item.title);
      const label = rawLabel.length > 9 ? rawLabel.slice(0, 8) + '…' : rawLabel;
      ctx.font = `${priority >= 2 ? 600 : 500} ${priority >= 2 ? 11.5 : 10.5}px "Noto Serif SC","Songti SC",serif`;
      const tw = ctx.measureText(label).width;
      const pw = tw + 12, ph = 18;
      const lx = n.sx, ly = n.sy + r + 14;
      const box = [lx - pw / 2, ly - ph / 2, lx + pw / 2, ly + ph / 2];
      if (priority < 2 && occupiedLabelBoxes.some(b =>
        box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;
      occupiedLabelBoxes.push(box);

      ctx.globalAlpha = priority >= 2 ? 1 : 0.9;
      ctx.fillStyle = dark ? 'rgba(12, 15, 24, 0.82)' : 'rgba(252, 249, 242, 0.88)';
      roundRect(ctx, box[0], box[1], pw, ph, 9);
      ctx.fill();
      if (priority >= 2) {
        ctx.strokeStyle = hexAlpha(col, 0.72);
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = priority >= 2 ? (dark ? '#f7efe0' : '#231d16') : (dark ? '#dad4c7' : '#3d362d');
      ctx.fillText(label, lx, ly + 0.5);
    }

    // Draw dignified museum-seal dynasty plaques along the upper & lower river banks
    ctx.globalAlpha = 1;
    for (const e of G.eras) {
      if (!e._hitBox || !e._labelMeta) continue;
      const { x, y, bw, bh, nameW, countText, isMinor } = e._labelMeta;
      const col = riverEraColor(e.name, theme), active = activeEra === e.name;
      const dimmed = filtering && !active && (!hovered || hovered.era !== e.name);
      ctx.globalAlpha = dimmed ? 0.42 : 1;

      // Frosted dynasty plaque
      ctx.fillStyle = dark
        ? (active ? 'rgba(22, 27, 40, 0.94)' : 'rgba(13, 17, 26, 0.80)')
        : (active ? 'rgba(255, 253, 248, 0.96)' : 'rgba(252, 249, 243, 0.86)');
      roundRect(ctx, x - bw / 2, y - bh / 2, bw, bh, bh / 2);
      ctx.fill();
      ctx.strokeStyle = hexAlpha(col, active ? 0.96 : (isMinor ? 0.45 : 0.62));
      ctx.lineWidth = active ? 1.6 : 0.95;
      if (isMinor && !active) ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Dynasty name + subtle item count
      const leftPad = x - bw / 2 + (isMinor ? 11 : 14);
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = `${isMinor ? 500 : 600} ${isMinor ? 12 : 14}px "Noto Serif SC","Songti SC",serif`;
      ctx.fillStyle = col;
      ctx.fillText(e.name, leftPad, y + 0.5);
      ctx.font = '500 10px ui-monospace,monospace';
      ctx.fillStyle = dark ? 'rgba(218, 212, 200, 0.58)' : 'rgba(92, 83, 72, 0.62)';
      ctx.fillText(countText, leftPad + nameW, y + 0.5);
    }

    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';
    const filterLabel = state.riverTypeFilter === '__untyped__' ? '未标器类' : state.riverTypeFilter;
    const text = `${filterLabel ? `${filterLabel} · ${river.filteredDatedCount} 条已定代 · ` : ''}${Math.round(river.zoom * 100)}% · 拖拽漫游`;
    if ($('riverDisplayStatus').textContent !== text) $('riverDisplayStatus').textContent = text;
    $('riverUndated').hidden = state.riverDatedOnly || !river.filteredUndated.length;
  }

  /* ═══════════════════════════════════════════════════════════════
     6. VIEW 2 — Clustered 2D / 3D Knowledge Graph Engine
     ═══════════════════════════════════════════════════════════════ */
  const graph = {
    canvas: null, ctx: null, w: 0, h: 0, dpr: 1,
    // 2D camera
    panX: 0, panY: 0, zoom: 1,
    targetPanX: 0, targetPanY: 0, targetZoom: 1,
    overviewZoom: 1, cameraDistance: 980,
    // 3D camera
    yaw: -0.32, pitch: 0.24, targetYaw: -0.32, targetPitch: 0.24,
    velYaw: 0, velPitch: 0,
    // Scene graph
    core: null,
    clusters: [],   // { id, name, kind, isUnlabeled, color, items, tx,ty,tz, x,y,z, r, sr, sx,sy,sz }
    nodes: [],      // { item, cluster, tx,ty,tz, x,y,z, baseR, sx,sy,sz, sr }
    hoveredNode: null,
    hoveredCluster: null,
    dragging: false, dragMoved: false, dragSX: 0, dragSY: 0,
    stars: [],
    morphT: 1,
  };

  function initGraph() {
    graph.canvas = $('graphCanvas');
    graph.ctx = graph.canvas.getContext('2d');
    graph.motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    graph.stars = Array.from({ length: 110 }, (_, i) => ({
      x: ((i * 6271) % 10000) / 10000,
      y: ((i * 93563) % 10000) / 10000,
      r: 0.5 + (i % 4) * 0.3,
      a: 0.06 + (i % 6) * 0.025,
    }));
    bindGraphEvents();
    resizeGraph();
  }

  function resizeGraph() {
    if (!graph.canvas) return;
    graph.dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    graph.w = window.innerWidth;
    graph.h = window.innerHeight;
    graph.canvas.width = Math.round(graph.w * graph.dpr);
    graph.canvas.height = Math.round(graph.h * graph.dpr);
    graph.lastRenderKey = null;
  }

  function getFocalItems(kind, id) {
    return dimensionIndex(kind)?.get(id)?.items || [];
  }

  function activeGraphFilterCount() {
    return Object.values(state.graphFilters).reduce((count, values) => count + values.length, 0);
  }

  function getFilteredFocalItems(kind, id) {
    const base = getFocalItems(kind, id);
    if (!activeGraphFilterCount()) return base;
    const filters = Object.entries(state.graphFilters).filter(([, values]) => values.length);
    return base.filter(item => filters.every(([dimension, values]) => values.some(value =>
      dimensionValues(item, dimension).includes(value) || (dimension === 'era' && item.periods.includes(value)))));
  }

  function graphFilterCategories() {
    const base = getFocalItems(state.focusKind, state.focusId);
    const collect = (kind, label, extract) => {
      const counts = new Map();
      for (const it of base) {
        for (const val of new Set(extract(it))) {
          if (!val) continue;
          counts.set(val, (counts.get(val) || 0) + 1);
        }
      }
      const tags = [...counts.entries()].map(([name, count]) => ({ name, count }));
      if (kind === 'era') tags.sort((a, b) => eraChronology(a.name).order - eraChronology(b.name).order || b.count - a.count);
      else tags.sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh-Hans'));
      return { kind, label, tags };
    };

    const cats = [];
    if (state.focusKind === 'era') {
      cats.push(collect('material', '材质', it => it.materials));
      cats.push(collect('motif', '纹样', it => it.motifs));
      const subPeriods = collect('era', '细分时代', it => it.periods);
      if (subPeriods.tags.length > 1) cats.push(subPeriods);
    } else if (state.focusKind === 'material') {
      cats.push(collect('motif', '纹样', it => it.motifs));
      cats.push(collect('era', '时代', it => it.eraGroups));
      const coMats = collect('material', '共现材质', it => it.materials.filter(m => m !== state.focusId));
      if (coMats.tags.length) cats.push(coMats);
    } else {
      cats.push(collect('era', '时代', it => it.eraGroups));
      cats.push(collect('material', '材质', it => it.materials));
      const coMotifs = collect('motif', '共现纹样', it => it.motifs.filter(m => m !== state.focusId));
      if (coMotifs.tags.length) cats.push(coMotifs);
    }
    for (const kind of Object.keys(DIMENSIONS)) {
      if (['era', 'material', 'motif'].includes(kind)) continue;
      const label = KIND_LABEL[kind];
      const focused = kind === state.focusKind;
      cats.push(collect(kind, focused ? `共现${label}` : label, item =>
        dimensionValues(item, kind).filter(value => !focused || value !== state.focusId)));
    }
    return cats.filter(c => c.tags.length > 0);
  }

  function toggleGraphFilter(kind, value) {
    if (!Object.hasOwn(DIMENSIONS, kind)) return;
    const arr = state.graphFilters[kind] ??= [];
    const idx = arr.indexOf(value);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(value);
    rebuildGraphScene(true);
    renderGraphHud();
  }

  function clearGraphFilters() {
    state.graphFilters = {};
    state.graphFilterQuery = '';
    const searchEl = $('graphFilterSearch');
    if (searchEl) searchEl.value = '';
    rebuildGraphScene(true);
    renderGraphHud();
  }

  function renderGraphFilterBar() {
    const bar = $('graphFilterBar');
    const tabsEl = $('graphFilterTabs');
    const chipsEl = $('graphFilterChips');
    const searchEl = $('graphFilterSearch');
    const expandBtn = $('graphFilterExpand');
    const clearBtn = $('graphFilterClear');
    if (!bar || !tabsEl || !chipsEl) return;

    const cats = graphFilterCategories();
    const totalActive = activeGraphFilterCount();
    bar.hidden = !cats.length && !totalActive;
    if (bar.hidden) return;

    if (!cats.some(c => c.kind === state.graphFilterKind)) {
      state.graphFilterKind = cats[0]?.kind || 'motif';
    }
    const activeCat = cats.find(c => c.kind === state.graphFilterKind) || cats[0];
    const query = (state.graphFilterQuery || '').trim().toLowerCase();
    const expanded = Boolean(state.graphFilterOpen || query);

    bar.classList.toggle('expanded', expanded);
    bar.classList.toggle('has-active', totalActive > 0);
    if (searchEl) searchEl.placeholder = `筛选${activeCat ? activeCat.label : '关联'}标签…`;
    if (expandBtn) {
      expandBtn.textContent = expanded ? '收起 ▴' : `展开 (${activeCat?.tags.length || 0}) ▾`;
      expandBtn.setAttribute('aria-expanded', String(expanded));
    }
    if (clearBtn) {
      clearBtn.hidden = totalActive === 0;
      clearBtn.textContent = `清空 (${totalActive})`;
    }

    // Tag category selector tabs (标签种类)
    tabsEl.replaceChildren();
    for (const cat of cats) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', String(cat.kind === activeCat?.kind));
      const selCount = state.graphFilters[cat.kind]?.length || 0;
      btn.innerHTML = `<span>${esc(cat.label)}</span>${selCount ? `<span class="f-badge">${selCount}</span>` : ''}`;
      btn.onclick = () => {
        state.graphFilterKind = cat.kind;
        renderGraphFilterBar();
      };
      tabsEl.append(btn);
    }

    // Tag filter chips: active selections across ALL categories pinned first, then matching tags in active category
    chipsEl.replaceChildren();
    const pinnedSet = new Set();
    for (const kind of Object.keys(state.graphFilters)) {
      for (const val of (state.graphFilters[kind] || [])) {
        pinnedSet.add(`${kind}:${val}`);
        const col = colorFor(kind === 'technique' ? 'motif' : kind, val);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-tag-chip';
        btn.setAttribute('aria-pressed', 'true');
        btn.style.setProperty('--chip-col', col);
        btn.style.setProperty('--chip-bg', hexAlpha(col, currentTheme() === 'dark' ? 0.24 : 0.14));
        btn.innerHTML = `<span class="dot" style="background:${col}"></span><span class="kind-mini">${esc(KIND_LABEL[kind])}</span><span>${esc(val)}</span><span class="x-mark">×</span>`;
        btn.onclick = () => toggleGraphFilter(kind, val);
        chipsEl.append(btn);
      }
    }

    const candidates = (activeCat?.tags || []).filter(t =>
      !pinnedSet.has(`${activeCat.kind}:${t.name}`) && (!query || t.name.toLowerCase().includes(query))
    );
    const limit = expanded ? 80 : 12;
    for (const tag of candidates.slice(0, limit)) {
      const col = colorFor(activeCat.kind === 'technique' ? 'motif' : activeCat.kind, tag.name);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'filter-tag-chip';
      btn.setAttribute('aria-pressed', 'false');
      btn.style.setProperty('--chip-col', col);
      btn.innerHTML = `<span class="dot" style="background:${col}"></span><span>${esc(tag.name)}</span><span class="num">${tag.count}</span>`;
      btn.onclick = () => toggleGraphFilter(activeCat.kind, tag.name);
      chipsEl.append(btn);
    }
    if (!chipsEl.childElementCount) {
      const empty = document.createElement('span');
      empty.className = 'filter-empty-note';
      empty.textContent = query ? `未找到包含「${state.graphFilterQuery}」的${activeCat?.label || ''}标签` : '暂无可筛选标签';
      chipsEl.append(empty);
    }
  }

  function clusterKeysOf(item, clusterBy) {
    const values = dimensionValues(item, clusterBy);
    return values.length ? values : ['未标' + KIND_LABEL[clusterBy]];
  }

  const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

  function packGraphClusters(clusters, aspect) {
    const spread = Math.sqrt(Math.max(0.55, Math.min(2.2, aspect)));
    const occupied = [{ x: 0, y: 0, r: 64 }];
    const candidates = [];
    const ordered = [...clusters].sort((a, b) => b.haloR - a.haloR);
    let start = 0, previousRadius = 0;
    for (const c of ordered) {
      const r = c.haloR + 7;
      // Equal-sized circles cannot use slots already rejected by the growing layout.
      if (r !== previousRadius) start = 0;
      previousRadius = r;
      for (let i = start + 1; ; i++) {
        const angle = i * GOLDEN_ANGLE;
        const distance = 15 * Math.sqrt(i);
        const { x, y } = candidates[i] ??= { x: Math.cos(angle) * distance * spread, y: Math.sin(angle) * distance / spread };
        if (occupied.some(p => (p.x - x) ** 2 + (p.y - y) ** 2 < (p.r + r) ** 2)) continue;
        occupied.push({ x, y, r });
        c.tx = x;
        c.ty = y;
        c.tz = 0;
        start = i;
        break;
      }
    }
  }

  function packGraphShell(clusters) {
    if (!clusters.length) return 120;
    const ordered = [...clusters].sort((a, b) => b.haloR - a.haloR);
    const gap = 4;
    const sampleCount = Math.max(64, clusters.length * 5);
    const sampleX = new Float64Array(sampleCount);
    const sampleY = new Float64Array(sampleCount);
    const sampleZ = new Float64Array(sampleCount);
    const sqrt = Math.sqrt;
    for (let i = 0; i < sampleCount; i++) {
      const y = 1 - 2 * (i + .5) / sampleCount;
      const angle = i * GOLDEN_ANGLE;
      const horizontal = sqrt(1 - y * y);
      sampleX[i] = Math.cos(angle) * horizontal;
      sampleY[i] = y;
      sampleZ[i] = Math.sin(angle) * horizontal;
    }
    sampleX[0] = Math.sin(.32) * Math.cos(.24);
    sampleY[0] = Math.sin(.24);
    sampleZ[0] = Math.cos(.32) * Math.cos(.24);
    let radius = Math.max(120, ordered[0].haloR * 1.6,
      Math.sqrt(ordered.reduce((sum, c) => sum + (c.haloR + gap) ** 2, 0) / 2.6));
    const available = new Float64Array(sampleCount);
    while (true) {
      available.fill(Infinity);
      let packed = true;
      for (const c of ordered) {
        const clearance = c.haloR + gap;
        // The first hub faces the initial camera. Later hubs fill the widest gaps.
        let slot = 0;
        for (let i = 0; i < sampleCount; i++) {
          if (available[i] > available[slot]) slot = i;
        }
        if (available[slot] < clearance) { packed = false; break; }
        const x = sampleX[slot], y = sampleY[slot], z = sampleZ[slot];
        c.direction = [x, y, z];
        c.tx = x * radius;
        c.ty = y * radius;
        c.tz = z * radius;
        for (let i = 0; i < sampleCount; i++) {
          const distance = sqrt((x - sampleX[i]) ** 2 + (y - sampleY[i]) ** 2 + (z - sampleZ[i]) ** 2) * radius;
          if (distance - clearance < available[i]) available[i] = distance - clearance;
        }
      }
      if (packed) return radius;
      radius *= 1.12;
    }
  }

  function shellTangentBasis([x, y, z]) {
    const length = Math.hypot(x, z);
    const u = length > 1e-6 ? [z / length, 0, -x / length] : [1, 0, 0];
    const v = [y * u[2] - z * u[1], z * u[0] - x * u[2], x * u[1] - y * u[0]];
    return [u, v];
  }

  function orbitGraphClusters(clusters) {
    const gap = 28;
    const totalSpan = clusters.reduce((sum, c) => sum + c.haloR + gap / 2, 0);
    const maxHalo = Math.max(52, ...clusters.map(c => c.haloR));
    const radius = Math.max(118 + maxHalo, totalSpan / Math.PI);
    let angle = -Math.PI / 2;
    for (const c of clusters) {
      const wedge = (c.haloR + gap / 2) / totalSpan * Math.PI * 2;
      const mid = angle + wedge / 2;
      angle += wedge;
      c.tx = radius * Math.cos(mid);
      c.ty = radius * Math.sin(mid);
      c.tz = 0;
    }
    return radius;
  }

  function rebuildGraphScene(resetCamera = true) {
    const items = getFilteredFocalItems(state.focusKind, state.focusId);
    const groupMap = new Map();

    for (const it of items) {
      const keys = clusterKeysOf(it, state.clusterBy);
      for (const k of keys) {
        const isUnlabeled = k.startsWith('未标');
        if (isUnlabeled && !state.showUnlabeled) continue;
        if (!groupMap.has(k)) {
          groupMap.set(k, { id: k, name: k, kind: state.clusterBy, isUnlabeled, items: [] });
        }
        const grp = groupMap.get(k);
        if (!grp.itemIds) grp.itemIds = new Set();
        if (!grp.itemIds.has(it.id)) { grp.itemIds.add(it.id); grp.items.push(it); }
      }
    }

    let clusters = [...groupMap.values()];
    if (state.clusterBy === 'era') {
      clusters.sort((a, b) => {
        if (a.isUnlabeled !== b.isUnlabeled) return a.isUnlabeled ? 1 : -1;
        return eraChronology(a.name).order - eraChronology(b.name).order;
      });
    } else {
      clusters.sort((a, b) => {
        if (a.isUnlabeled !== b.isUnlabeled) return a.isUnlabeled ? 1 : -1;
        return b.items.length - a.items.length || a.name.localeCompare(b.name, 'zh-Hans');
      });
    }

    // Previous node coordinates for silky spring transitions
    const prevNodePos = new Map(graph.nodes.map(n => [n.item.id + '|' + n.cluster.id, [n.x, n.y, n.z]]));
    const prevClusPos = new Map(graph.clusters.map(c => [c.id, [c.x, c.y, c.z]]));

    // Representative thumbnail for the focal center core
    const representative = items.find(item => item.thumbUrl);
    graph.core = {
      id: state.focusId,
      name: state.focusId,
      kind: state.focusKind,
      count: items.length,
      thumbUrl: representative?.thumbUrl || '',
      plateUrl: representative?.plateUrl || '',
      x: 0, y: 0, z: 0, r: 44, sx: 0, sy: 0, sr: 44,
    };

    const is3D = state.dim === '3d';
    const compact = clusters.length > 8;
    for (const c of clusters) {
      const cnt = c.isUnlabeled ? Math.min(c.items.length, 18) : c.items.length;
      c.shownItems = c.items.slice(0, cnt);
      c.hiddenCount = c.items.length - cnt;
      c.singleton = cnt === 1 ? c.shownItems[0] : null;
      c.hubR = c.singleton ? 15 : Math.min(34, 17 + 2.4 * Math.sqrt(cnt));
      c.collapsedR = c.singleton ? (is3D ? 15 : 22) : c.hubR * (is3D ? 1.15 : 1.8);
      c.nodeR = cnt <= 4 ? 15 : cnt <= 10 ? 13 : 10.5;
      if (c.singleton) {
        c.haloR = c.collapsedR + 2;
      } else {
        const first = c.hubR + c.nodeR + 7;
        c.innerR = cnt <= 6 ? Math.max(first, (c.nodeR + 2) / Math.sin(Math.PI / cnt)) : first;
        c.spiralStep = (c.nodeR + 2) * 1.45;
        const outer = cnt <= 6 ? c.innerR : Math.hypot(c.innerR, c.spiralStep * Math.sqrt(cnt - 1));
        c.haloR = outer + c.nodeR + 4;
      }
    }

    graph.compact = compact;
    graph.orbitRadius = 0;
    graph.shellRadius = is3D ? packGraphShell(clusters) : 0;
    if (!is3D && compact) {
      const { width, height } = graphViewport();
      packGraphClusters(clusters, width / height);
    } else if (!is3D && clusters.length) {
      graph.orbitRadius = orbitGraphClusters(clusters);
    }

    const nodes = [];
    for (const c of clusters) {
      const prev = prevClusPos.get(c.id);
      c.x = is3D ? c.tx : prev?.[0] ?? c.tx * 0.25;
      c.y = is3D ? c.ty : prev?.[1] ?? c.ty * 0.25;
      c.z = c.tz;
      c.reveal = 0;
      if (c.singleton) continue;
      const angle = Math.atan2(c.ty, c.tx);
      const list = c.shownItems;
      const cnt = list.length;
      const nodeR = c.nodeR;
      const basis = is3D ? shellTangentBasis(c.direction) : null;
      c.basis = basis;
      list.forEach((it, i) => {
        const a = angle + (cnt <= 6 ? i / cnt * Math.PI * 2 : i * GOLDEN_ANGLE);
        const distance = cnt <= 6 ? c.innerR : Math.hypot(c.innerR, c.spiralStep * Math.sqrt(i));
        let tx, ty, tz;
        if (is3D) {
          const [u, v] = basis;
          const arc = 2 * Math.asin(distance / (2 * graph.shellRadius));
          const along = graph.shellRadius * Math.sin(arc);
          const radial = graph.shellRadius * Math.cos(arc);
          const tangentX = Math.cos(a) * along, tangentY = Math.sin(a) * along;
          [tx, ty, tz] = c.direction.map((value, axis) => value * radial + tangentX * u[axis] + tangentY * v[axis]);
        } else {
          tx = c.tx + Math.cos(a) * distance;
          ty = c.ty + Math.sin(a) * distance;
          tz = 0;
        }
        const prev = prevNodePos.get(it.id + '|' + c.id);
        nodes.push({
          item: it,
          cluster: c,
          tx, ty, tz,
          x: is3D ? tx : prev?.[0] ?? c.tx * 0.35,
          y: is3D ? ty : prev?.[1] ?? c.ty * 0.35,
          z: tz,
          baseR: nodeR,
          sx: 0, sy: 0, sz: 0, sr: nodeR,
        });
      });
    }

    graph.clusters = clusters;
    graph.nodes = nodes;
    graph.spaceRadius = is3D ? graph.shellRadius + Math.max(8, ...clusters.map(c => c.collapsedR)) : 0;
    graph.cameraDistance = Math.max(980, 2.8 * graph.spaceRadius);
    graph.hoveredNode = graph.hoveredCluster = null;
    graph.lastRenderKey = null;

    if (resetCamera) resetGraphView();
  }

  function graphViewport() {
    const top = graph.w <= 820 ? 158 : 138;
    const bottom = Math.max(top + 1, graph.h - 66);
    return { width: Math.max(1, graph.w - 56), height: bottom - top, centerY: (top + bottom) / 2 };
  }

  function resetGraphView() {
    graph.targetYaw = -0.32;
    graph.targetPitch = 0.24;
    graph.velYaw = graph.velPitch = 0;
    const { width, height, centerY } = graphViewport();
    const scene = stageOverlay?.graphScene;
    if (scene?.kind === 'path' && scene.nodes.length) {
      const panelWidth = rState.open && graph.w > 820 ? 442 : 0;
      let left = Infinity, right = -Infinity, top = Infinity, bottom = -Infinity;
      for (const node of scene.nodes) {
        const p = graphProjection(node.tx, node.ty, node.tz, graph.targetYaw, graph.targetPitch, 980);
        const r = node.baseR * p.k;
        left = Math.min(left, p.x - r);
        right = Math.max(right, p.x + r);
        top = Math.min(top, p.y - r);
        bottom = Math.max(bottom, p.y + r);
      }
      const zoom = Math.min(1.12, Math.max(1, width - panelWidth - 24) / Math.max(240, right - left),
        Math.max(1, height - 24) / Math.max(240, bottom - top));
      graph.targetZoom = zoom;
      graph.targetPanX = -panelWidth / 2 - (left + right) * zoom / 2;
      graph.targetPanY = centerY - graph.h * 0.52 - (top + bottom) * zoom / 2;
      return;
    }
    if (scene) {
      const span = Math.max(240, ((scene.extent || 360) + 30) * 2);
      const availW = Math.max(360, graph.w - 80), availH = Math.max(320, graph.h - 170);
      graph.targetZoom = Math.max(0.36, Math.min(1.18, Math.min(availW, availH) / span));
      graph.targetPanX = 0;
      graph.targetPanY = 10;
      return;
    }

    const radius = state.dim === '3d' ? graph.spaceRadius / Math.sqrt(1 - (graph.spaceRadius / graph.cameraDistance) ** 2) : 60;
    let left = -radius, right = radius, top = -radius, bottom = radius;
    if (state.dim === '2d') {
      for (const c of graph.clusters) {
        left = Math.min(left, c.tx - c.haloR); right = Math.max(right, c.tx + c.haloR);
        top = Math.min(top, c.ty - c.haloR); bottom = Math.max(bottom, c.ty + c.haloR);
      }
    }
    const zoom = Math.min(1.18, width / Math.max(240, right - left), height / Math.max(240, bottom - top));
    graph.targetZoom = graph.overviewZoom = zoom;
    graph.targetPanX = -(left + right) * zoom / 2;
    graph.targetPanY = centerY - graph.h * 0.52 - (top + bottom) * zoom / 2;
  }

  function zoomGraph(factor) {
    const scene = stageOverlay?.graphScene;
    const minZoom = scene?.kind === 'path' ? 0.05 : scene ? 0.28 : Math.min(0.28, graph.overviewZoom);
    graph.targetZoom = Math.max(minZoom, Math.min(3.2, graph.targetZoom * factor));
  }

  function graphProjection(x, y, z, yaw, pitch, cameraDistance) {
    if (state.dim === '2d') return { x, y, z: 0, k: 1 };
    const cyaw = Math.cos(yaw), syaw = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const rx = x * cyaw + z * syaw;
    const rz = z * cyaw - x * syaw;
    const ry = y * cp - rz * sp;
    const depth = y * sp + rz * cp;
    const k = cameraDistance / Math.max(180, cameraDistance - depth);
    return { x: rx * k, y: ry * k, z: depth, k };
  }

  function renderGraphHud() {
    renderGraphPatternAttributes();
    const kindEl = $('focusKind');
    kindEl.textContent = KIND_LABEL[state.focusKind];
    kindEl.className = 'focus-kind ' + state.focusKind;
    $('focusLabel').textContent = state.focusId;
    const baseCount = getFocalItems(state.focusKind, state.focusId).length;
    const shownCount = getFilteredFocalItems(state.focusKind, state.focusId).length;
    const documentCount = dimensionIndex(state.focusKind)?.get(state.focusId)?.documentRecords?.length || 0;
    $('focusMeta').textContent = (activeGraphFilterCount()
      ? `${shownCount} / ${baseCount} 条 · ${graph.clusters.length} 簇`
      : `${baseCount} 条 · ${graph.clusters.length} 簇`) + (documentCount ? ` · ${documentCount} 处文献` : '');
    $('graphBack').hidden = state.history.length === 0;
    $('graphBack').disabled = state.history.length === 0;

    renderGraphFilterBar();

    // ClusterBy toggle buttons
    const cs = $('clusterSwitch');
    cs.replaceChildren();
    const clusterOptions = clusterOptionsFor(state.focusKind);
    for (const [val, lbl] of clusterOptions.filter(([kind]) => !Object.hasOwn(EXTRA_DIMENSIONS, kind))) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = lbl;
      b.setAttribute('aria-pressed', String(state.clusterBy === val));
      b.onclick = () => {
        if (state.clusterBy === val) return;
        state.clusterBy = val;
        rebuildGraphScene(true);
        renderGraphHud();
        syncHash();
      };
      cs.append(b);
    }
    const extraOptions = clusterOptions.filter(([kind]) => Object.hasOwn(EXTRA_DIMENSIONS, kind));
    if (extraOptions.length) {
      const select = document.createElement('select'); select.id = 'clusterExtraDimension';
      select.className = 'type-filter'; select.setAttribute('aria-label', '其他聚类维度');
      const placeholder = document.createElement('option'); placeholder.value = ''; placeholder.textContent = '更多聚类';
      select.append(placeholder);
      for (const [kind, label] of extraOptions) {
        const option = document.createElement('option'); option.value = kind; option.textContent = label; select.append(option);
      }
      select.value = Object.hasOwn(EXTRA_DIMENSIONS, state.clusterBy) ? state.clusterBy : '';
      select.onchange = () => {
        if (!select.value) return;
        state.clusterBy = select.value; rebuildGraphScene(true); renderGraphHud(); syncHash();
      };
      cs.append(select);
    }

    // 2D / 3D toggle
    $('dimSwitch').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.dim === state.dim));
    });

    $('toggleUnlabeled').setAttribute('aria-pressed', String(state.showUnlabeled));

    // Bottom quick cluster chips (click to pivot directly into that cluster's graph!)
    const strip = $('clusterStrip');
    strip.replaceChildren();
    const stripLbl = document.createElement('span');
    stripLbl.className = 'dock-label';
    stripLbl.textContent = KIND_LABEL[state.clusterBy] + '簇';
    strip.append(stripLbl);

    for (const c of graph.clusters) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      const col = colorFor(c.kind, c.name);
      b.innerHTML = `<span class="dot" style="background:${col}"></span><span>${esc(c.name)}</span><span class="num">${c.items.length}</span>`;
      b.onmouseenter = () => { graph.hoveredCluster = c; };
      b.onmouseleave = () => { if (graph.hoveredCluster === c) graph.hoveredCluster = null; };
      b.onclick = () => {
        if (!c.isUnlabeled) openGraph(c.kind, c.id);
      };
      if (c.isUnlabeled) b.style.opacity = '0.62';
      strip.append(b);
    }
  }

  function projectPoint(x, y, z) {
    const cx = graph.w * 0.5 + graph.panX;
    const cy = graph.h * 0.52 + graph.panY;
    const cameraDistance = stageOverlay?.graphScene ? 980 : graph.cameraDistance;
    const p = graphProjection(x, y, z, graph.yaw, graph.pitch, cameraDistance);
    return { x: cx + p.x * graph.zoom, y: cy + p.y * graph.zoom, z: p.z, k: p.k * graph.zoom };
  }

  function graphDepthFade(depth) {
    if (state.dim === '2d') return 1;
    const range = graph.spaceRadius || 360;
    return Math.max(0.32, Math.min(1, 0.72 + depth / (2 * range)));
  }

  function graphNodeOpacity(node) {
    return graphDepthFade(node.sz) * (node.backFacing ? 0.38 : 1);
  }

  function clusterShowsSpecimens(cluster, activeCluster) {
    if (cluster.singleton) return false;
    if (cluster === activeCluster) return true;
    const zoom = Math.min(graph.zoom, graph.targetZoom);
    if (zoom >= 1.45 * graph.overviewZoom && cluster.nodeR * cluster.sk >= 8) return true;
    return Boolean(stageOverlay?.artifactSet && cluster.shownItems.some(item => stageOverlay.artifactSet.has(item.id)));
  }

  function graphAutoRotates() {
    return state.dim === '3d' && !stageOverlay?.graphScene && !graph.motionQuery?.matches &&
      !graph.dragging && !graph.hoveredCluster && !graph.hoveredNode && !state.drawerItemId;
  }

  function bindGraphEvents() {
    const c = graph.canvas;
    c.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      graph.dragging = true;
      graph.dragMoved = false;
      graph.dragSX = e.clientX;
      graph.dragSY = e.clientY;
      graph.velYaw = 0; graph.velPitch = 0;
      c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', e => {
      if (graph.dragging) {
        const dx = e.clientX - graph.dragSX;
        const dy = e.clientY - graph.dragSY;
        if (Math.hypot(dx, dy) > 4) graph.dragMoved = true;
        if (graph.dragMoved) {
          graph.pendingPointer = null;
          graph.hoveredNode = graph.hoveredCluster = null;
        }
        if (state.dim === '3d') {
          graph.targetYaw += dx * 0.0065;
          graph.targetPitch = Math.max(-1.15, Math.min(1.15, graph.targetPitch - dy * 0.006));
          graph.velYaw = dx * 0.002;
          graph.velPitch = -dy * 0.0018;
        } else {
          graph.targetPanX += dx;
          graph.targetPanY += dy;
        }
        graph.dragSX = e.clientX;
        graph.dragSY = e.clientY;
        hideTip();
        return;
      }
      graph.pendingPointer = { x: e.clientX, y: e.clientY };
    });
    c.addEventListener('pointerup', e => {
      if (!graph.dragging) return;
      graph.dragging = false;
      if (!graph.dragMoved) {
        graph.pendingPointer = null;
        hitTestGraph(e.clientX, e.clientY, true);
        if (stageOverlay?.graphScene) {
          const hit = stageOverlay.hoveredNode;
          if (hit) {
            if (hit.onActivate) hit.onActivate();
            else if (hit.artifactId) openDrawer(hit.artifactId);
            else if (Object.hasOwn(DIMENSIONS, hit.kind) && !hit.isOntology) {
              clearStageOverlay();
              openGraph(hit.kind, hit.label);
            }
          } else {
            closeDrawer();
          }
          return;
        }
        if (graph.hoveredNode) {
          openDrawer(graph.hoveredNode.item.id);
        } else if (graph.hoveredCluster?.singleton) {
          openDrawer(graph.hoveredCluster.singleton.id);
        } else if (graph.hoveredCluster && !graph.hoveredCluster.isUnlabeled) {
          openGraph(graph.hoveredCluster.kind, graph.hoveredCluster.id);
        } else {
          closeDrawer();
        }
      }
    });
    c.addEventListener('pointerleave', () => {
      graph.pendingPointer = null;
      graph.hoveredNode = null;
      graph.hoveredCluster = null;
      if (stageOverlay) stageOverlay.hoveredNode = null;
      hideTip();
    });
    c.addEventListener('wheel', e => {
      e.preventDefault();
      const previousZoom = graph.targetZoom;
      zoomGraph(e.deltaY < 0 ? 1.12 : 0.89);
      if (!stageOverlay?.graphScene) {
        const change = graph.targetZoom / previousZoom - 1;
        graph.targetPanX -= (e.clientX - graph.w * 0.5 - graph.targetPanX) * change;
        graph.targetPanY -= (e.clientY - graph.h * 0.52 - graph.targetPanY) * change;
      }
    }, { passive: false });
    c.addEventListener('dblclick', () => {
      if (!graph.hoveredNode && !graph.hoveredCluster) resetGraphView();
    });
  }

  function hitTestGraph(mx, my, clicking = false) {
    // Dedicated Reasoning Overlay Stage hit-testing (works in both 2D & 3D!)
    if (stageOverlay?.graphScene) {
      let best = null, bestZ = -Infinity;
      for (const n of stageOverlay.graphScene.nodes) {
        const d = Math.hypot(mx - n.sx, my - n.sy);
        if (d <= n.sr + 6 && n.sz >= bestZ) { best = n; bestZ = n.sz; }
      }
      stageOverlay.hoveredNode = best;
      graph.canvas.classList.toggle('pointer', Boolean(best));
      if (best) {
        const tags = [];
        if (best.roleTag) tags.push(`<span class="tip-tag">${esc(best.roleTag)}</span>`);
        if (best.sub) tags.push(`<span class="tip-tag">${esc(best.sub)}</span>`);
        const hint = best.hint || (best.artifactId ? '点击查看原书扫描图与红框证据' : (best.isOntology ? 'RDFS 本体抽象类节点' : '点击进入该实体的聚类图谱 →'));
        showTip(mx, my, `<strong>${esc(best.label)}</strong>${tags.length ? `<div class="tip-tags">${tags.join('')}</div>` : ''}<div class="tip-hint">${hint}</div>`);
      } else {
        hideTip();
      }
      return;
    }

    const activeCluster = graph.hoveredNode?.cluster || graph.hoveredCluster;
    let hitNode = null, hitCluster = null;
    let bestZ = -Infinity, bestDistance = Infinity;
    const is3D = state.dim === '3d';
    const wins = (z, distance) => {
      if (is3D ? z < bestZ || (z === bestZ && distance >= bestDistance) : distance >= bestDistance) return false;
      bestZ = z;
      bestDistance = distance;
      return true;
    };
    for (const n of graph.nodes) {
      if (!n.visible || n.backFacing) continue;
      const d = Math.hypot(mx - n.sx, my - n.sy);
      const radius = Math.max(3, n.sr) + 2;
      if (d <= radius && wins(n.sz, d)) hitNode = n;
    }
    for (const c of graph.clusters) {
      if (!c.visible || c.backFacing) continue;
      const [left, top, right, bottom] = c._labelBox || [];
      const inPill = mx >= left && mx <= right && my >= top && my <= bottom;
      const d = Math.hypot(mx - c.sx, my - c.sy);
      if (inPill) {
        hitCluster = c;
        hitNode = null;
        break;
      }
      const radius = c.drawR ?? Math.max(4, c.sr);
      if (d <= radius + 3 && wins(c.sz + 0.5, d)) {
        hitCluster = c;
        hitNode = null;
      }
    }
    // Keep the cluster open while the pointer crosses the gap from its hub to a specimen.
    const stayOpen = !hitCluster && !hitNode && !clicking && activeCluster?.expanded && !activeCluster.backFacing &&
      Math.hypot(mx - activeCluster.sx, my - activeCluster.sy) <= activeCluster.haloSr + 8;
    graph.hoveredNode = hitNode;
    graph.hoveredCluster = stayOpen ? activeCluster : hitCluster;
    graph.canvas.classList.toggle('pointer', Boolean(hitNode || hitCluster?.singleton || (hitCluster && !hitCluster.isUnlabeled)));

    if (hitNode) {
      const it = hitNode.item;
      const tags = [
        ...it.periods.map(p => `<span class="tip-tag">${esc(p)}</span>`),
        ...it.materials.map(m => `<span class="tip-tag">${esc(m)}</span>`),
        ...it.motifs.slice(0, 3).map(m => `<span class="tip-tag">${esc(m)}</span>`),
      ];
      showTip(mx, my, `<strong>${esc(it.title)}</strong><div class="tip-tags">${tags.join('')}</div><div class="tip-hint">点击查看详情、原页证据与快捷跳转</div>`);
    } else if (hitCluster) {
      const nextDefault = defaultClusterFor(hitCluster.kind);
      const hint = hitCluster.singleton ? '点击查看图录与原页证据'
        : hitCluster.isUnlabeled ? '该条目在原数据中尚未标注此属性'
          : `点击进入「${esc(hitCluster.name)}」图谱（默认按${KIND_LABEL[nextDefault]}聚类）→`;
      const properties = hitCluster.kind === 'motif' ? getPatternAttributes(hitCluster.name) : [];
      const propertyTags = properties.map(p => `<span class="tip-tag">${p.label} · ${esc(p.value)}</span>`).join('');
      showTip(mx, my, `<strong>${esc(hitCluster.name)}</strong><div class="tip-tags"><span class="tip-tag">${KIND_LABEL[hitCluster.kind]}聚类</span><span class="tip-tag">${hitCluster.items.length} 条</span>${propertyTags}</div><div class="tip-hint">${hint}</div>`);
    } else {
      hideTip();
    }
  }

  function drawGraph(timeSec) {
    const { ctx, w, h, dpr } = graph;
    if (!w || !h || !graph.core) return;
    const elapsed = Math.max(0, Math.min(.05, timeSec - (graph.lastFrameTime ?? timeSec)));
    graph.lastFrameTime = timeSec;
    const is3D = state.dim === '3d';

    // Smooth camera & inertia
    graph.panX += (graph.targetPanX - graph.panX) * 0.14;
    graph.panY += (graph.targetPanY - graph.panY) * 0.14;
    graph.zoom += (graph.targetZoom - graph.zoom) * 0.14;
    if (is3D) {
      if (graphAutoRotates()) graph.targetYaw += elapsed * 0.14;
      if (!graph.dragging) {
        graph.targetYaw += graph.velYaw;
        graph.targetPitch = Math.max(-1.15, Math.min(1.15, graph.targetPitch + graph.velPitch));
        graph.velYaw *= 0.92;
        graph.velPitch *= 0.92;
      }
      graph.yaw += (graph.targetYaw - graph.yaw) * 0.14;
      graph.pitch += (graph.targetPitch - graph.pitch) * 0.14;
    }

    // Spring-morph cluster and node coordinates
    if (!is3D && !stageOverlay?.graphScene) {
      for (const c of graph.clusters) {
        c.x += (c.tx - c.x) * 0.15;
        c.y += (c.ty - c.y) * 0.15;
        c.z += (c.tz - c.z) * 0.15;
      }
      for (const n of graph.nodes) {
        n.x += (n.tx - n.x) * 0.15;
        n.y += (n.ty - n.y) * 0.15;
        n.z += (n.tz - n.z) * 0.15;
      }
    }

    const dark = currentTheme() === 'dark';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    paintBackdrop(ctx, graph, dark);

    // If a dedicated Reasoning Overlay Scene (path / compare / predict) is active, render it in full 2D/3D!
    if (stageOverlay?.graphScene) {
      drawReasoningStage(ctx, stageOverlay.graphScene, dark, timeSec);
      return;
    }

    const coreP = projectPoint(0, 0, 0);
    graph.core.sx = coreP.x; graph.core.sy = coreP.y; graph.core.sr = graph.core.r * coreP.k;
    const shellHorizon = is3D ? graph.shellRadius ** 2 / graph.cameraDistance : -Infinity;

    const coreCol = colorFor(graph.core.kind, graph.core.name);
    if (is3D) {
      // Subtle warm armillary-bronze depth vignette (no glossy sci-fi planet sphere)
      const r = graph.zoom * graph.shellRadius / Math.sqrt(1 - (graph.shellRadius / graph.cameraDistance) ** 2);
      const surface = ctx.createRadialGradient(coreP.x, coreP.y, r * .12, coreP.x, coreP.y, r);
      surface.addColorStop(0, dark ? hexAlpha(coreCol, .09) : hexAlpha(coreCol, .07));
      surface.addColorStop(.68, dark ? 'rgba(34,27,20,.16)' : 'rgba(220,206,180,.20)');
      surface.addColorStop(1, dark ? 'rgba(18,14,10,0)' : 'rgba(220,206,180,0)');
      ctx.beginPath();
      ctx.arc(coreP.x, coreP.y, r, 0, Math.PI * 2);
      ctx.fillStyle = surface;
      ctx.fill();
    }

    if (graph.orbitRadius) {
      ctx.beginPath();
      const segs = 90;
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        const p = projectPoint(Math.cos(a) * graph.orbitRadius, Math.sin(a) * graph.orbitRadius, 0);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = hexAlpha(coreCol, dark ? 0.18 : 0.22);
      ctx.lineWidth = 1.1;
      ctx.setLineDash([4, 7]);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    const activeCluster = graph.hoveredCluster || graph.hoveredNode?.cluster || null;
    const selectedItemId = graph.hoveredNode?.item.id || state.drawerItemId;
    graph.revealing = false;

    for (const c of graph.clusters) {
      const p = projectPoint(c.x, c.y, c.z);
      c.sx = p.x; c.sy = p.y; c.sz = p.z; c.sk = p.k;
      c.sr = c.hubR * p.k;
      c.haloSr = c.haloR * p.k;
      c.expanded = clusterShowsSpecimens(c, activeCluster);
      const target = c.expanded ? 1 : 0;
      const step = graph.motionQuery?.matches ? 1 : Math.min(1, elapsed / .12);
      c.reveal += Math.sign(target - c.reveal) * Math.min(Math.abs(target - c.reveal), step);
      graph.revealing ||= c.reveal !== target;
      c.revealEased = 1 - (1 - c.reveal) ** 3;
      const overviewR = Math.max(4, c.collapsedR * p.k);
      const coreR = Math.max(3, Math.min(8, c.sr * .23));
      c.drawR = overviewR + (coreR - overviewR) * c.revealEased;
      c.surfaceR = overviewR + (c.haloSr - overviewR) * c.revealEased;
      c.backFacing = p.z < shellHorizon;
      c.visible = inViewport(c.sx, c.sy, Math.max(c.haloSr, c.drawR) + 40, w, h);
    }

    const sortedClusters = graph.clusters.filter(c => c.visible);
    if (state.dim === '3d') sortedClusters.sort((a, b) => a.sz - b.sz);
    for (const c of sortedClusters) {
      if (c.reveal > 0 && !c.backFacing) drawClusterSurface(ctx, c, activeCluster, dark, is3D);
    }

    // Batch filaments by paint style.
    const filaments = new Map();
    const filament = (col, alpha, width) => {
      const key = `${col}:${alpha}:${width}`;
      let batch = filaments.get(key);
      if (!batch) {
        batch = { path: new Path2D(), col, alpha, width };
        filaments.set(key, batch);
      }
      return batch.path;
    };
    for (const c of is3D ? [] : graph.clusters) {
      const col = colorFor(c.kind, c.name), isAct = activeCluster === c;
      if (graph.compact && !isAct && (c.shownItems.length <= 2 || !c.visible)) continue;
      if (!lineInViewport(coreP.x, coreP.y, c.sx, c.sy, w, h)) continue;
      const depth = Math.round(graphDepthFade(c.sz) * 8) / 8;
      const alpha = (isAct ? .86 : graph.compact ? .20 : .42) * (activeCluster && !isAct ? .28 : 1) * depth;
      const path = filament(col, alpha, isAct ? 1.9 : 1.1);
      path.moveTo(coreP.x, coreP.y);
      path.quadraticCurveTo((coreP.x + c.sx) * .5 - (c.sy - coreP.y) * .09,
        (coreP.y + c.sy) * .5 + (c.sx - coreP.x) * .09, c.sx, c.sy);
    }
    for (const n of graph.nodes) {
      const c = n.cluster;
      n.visible = false;
      if (!c.visible || c.reveal === 0) continue;
      const spread = c.revealEased;
      let x = c.x + (n.x - c.x) * spread;
      let y = c.y + (n.y - c.y) * spread;
      let z = c.z + (n.z - c.z) * spread;
      if (is3D) {
        const scale = graph.shellRadius / Math.hypot(x, y, z);
        x *= scale; y *= scale; z *= scale;
      }
      const p = projectPoint(x, y, z);
      n.sx = p.x; n.sy = p.y; n.sz = p.z; n.sk = p.k; n.sr = n.baseR * p.k;
      n.backFacing = p.z < shellHorizon;
      n.visible = inViewport(n.sx, n.sy, Math.max(5, n.sr) * 2.5 + 20, w, h);
      if (is3D || !n.visible || !lineInViewport(c.sx, c.sy, n.sx, n.sy, w, h)) continue;
      const isAct = activeCluster === c || n.item.id === selectedItemId;
      const depth = Math.round(graphDepthFade(n.sz) * 8) / 8;
      const alpha = (isAct ? .60 : .26) * (activeCluster && !isAct ? .22 : 1) * depth;
      const path = filament(colorFor(c.kind, c.name), alpha, isAct ? 1.25 : .85);
      path.moveTo(c.sx, c.sy); path.lineTo(n.sx, n.sy);
    }
    for (const batch of filaments.values()) {
      ctx.strokeStyle = hexAlpha(batch.col, batch.alpha); ctx.lineWidth = batch.width;
      ctx.stroke(batch.path);
    }

    // Cache semantic neighbors until the hovered specimen changes.
    if (graph.hoveredNode && !is3D) {
      const hn = graph.hoveredNode;
      if (graph.linkHover !== hn) {
        const motifs = new Set(hn.item.motifs);
        graph.hoverLinks = graph.nodes.filter(n => n !== hn && n.cluster !== hn.cluster
          && (n.item.id === hn.item.id || n.item.motifs.some(m => motifs.has(m))));
        graph.linkHover = hn;
      }
      ctx.beginPath();
      for (const n of graph.hoverLinks) {
        if (!n.visible) continue;
        ctx.moveTo(hn.sx, hn.sy);
        ctx.quadraticCurveTo(coreP.x, coreP.y, n.sx, n.sy);
      }
      ctx.strokeStyle = dark ? 'rgba(216,179,119,0.48)' : 'rgba(143,78,50,0.42)';
      ctx.lineWidth = 1.2; ctx.setLineDash([3, 4]); ctx.stroke(); ctx.setLineDash([]);
    }

    // 6) Depth-sorted paint pass: Core + Cluster Hubs + Specimen Medallions
    const drawables = [];
    if (!is3D) drawables.push({ type: 'core', z: coreP.z });
    for (const c of sortedClusters) drawables.push({ type: 'cluster', z: c.sz + 0.5, obj: c });
    for (const n of graph.nodes.filter(n => n.visible)) drawables.push({ type: 'node', z: n.sz, obj: n });
    drawables.sort((a, b) => a.z - b.z);

    for (const d of drawables) {
      if (d.type === 'core') {
        drawCoreHub(ctx, graph.core, coreCol, dark, timeSec);
      } else if (d.type === 'cluster') {
        drawClusterHub(ctx, d.obj, activeCluster, dark);
      } else {
        drawSpecimenNode(ctx, d.obj, activeCluster, selectedItemId, dark);
      }
    }

    const labelBoxes = [];
    for (const c of graph.clusters) {
      c._labelBox = null;
      if (!c.visible || c.backFacing || c === activeCluster) continue;
      if (graph.compact && c.drawR < (c.singleton ? 13 : 8)) continue;
      drawClusterLabel(ctx, c, activeCluster, dark, labelBoxes);
    }
    if (activeCluster?.visible && !activeCluster.backFacing) drawClusterLabel(ctx, activeCluster, activeCluster, dark);
  }

  function drawCoreHub(ctx, core, col, dark, timeSec) {
    const r = core.sr;
    const pulse = 1 + 0.025 * Math.sin(timeSec * 1.4);

    // Restrained antique bronze-lamp halo (warm archival weight, no neon flare)
    const glow = ctx.createRadialGradient(core.sx, core.sy, r * 0.72, core.sx, core.sy, r * 2.15 * pulse);
    glow.addColorStop(0, hexAlpha(col, dark ? 0.24 : 0.16));
    glow.addColorStop(0.55, hexAlpha(col, dark ? 0.07 : 0.05));
    glow.addColorStop(1, hexAlpha(col, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(core.sx, core.sy, r * 2.15 * pulse, 0, Math.PI * 2);
    ctx.fill();

    // Engraved bronze-mirror outer chord ring (铜镜连珠弦纹圈)
    ctx.beginPath();
    ctx.arc(core.sx, core.sy, r + 6.5, 0, Math.PI * 2);
    ctx.strokeStyle = hexAlpha(col, dark ? 0.48 : 0.44);
    ctx.lineWidth = 1.05;
    ctx.setLineDash([2.5, 4.5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Matte burnished lacquer / cast-bronze medallion body
    const sp = getSprite(core.thumbUrl, 0, core.plateUrl);
    const bmp = spriteBitmap(sp, dark);
    if (bmp && core.kind === 'motif') {
      paintSprite(ctx, sp, bmp, core.sx, core.sy, r);
      const patina = ctx.createRadialGradient(core.sx, core.sy, r * 0.1, core.sx, core.sy, r);
      patina.addColorStop(0, dark ? 'rgba(20,16,12,0.46)' : 'rgba(249,244,233,0.52)');
      patina.addColorStop(1, dark ? 'rgba(14,11,8,0.72)' : hexAlpha(col, 0.20));
      ctx.fillStyle = patina;
      ctx.beginPath();
      ctx.arc(core.sx, core.sy, r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const dg = ctx.createRadialGradient(core.sx, core.sy, r * 0.06, core.sx, core.sy, r);
      if (dark) {
        dg.addColorStop(0, mixHex(col, 32, 25, 19, 0.56));
        dg.addColorStop(0.72, mixHex(col, 22, 18, 14, 0.76));
        dg.addColorStop(1, mixHex(col, 14, 11, 9, 0.86));
      } else {
        dg.addColorStop(0, '#faf5e8');
        dg.addColorStop(0.74, mixHex(col, 244, 236, 220, 0.84));
        dg.addColorStop(1, mixHex(col, 232, 220, 198, 0.72));
      }
      ctx.fillStyle = dg;
      ctx.beginPath();
      ctx.arc(core.sx, core.sy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Cast bronze outer rim + recessed inner hairline ring (双廓铜镜边)
    ctx.beginPath();
    ctx.arc(core.sx, core.sy, r, 0, Math.PI * 2);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.4;
    ctx.stroke();

    if (r >= 18) {
      ctx.beginPath();
      ctx.arc(core.sx, core.sy, r - 4.2, 0, Math.PI * 2);
      ctx.strokeStyle = hexAlpha(col, dark ? 0.52 : 0.44);
      ctx.lineWidth = 0.85;
      ctx.stroke();
    }

    // Core serif seal typography inside medallion
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const fs = Math.max(12, Math.min(18, r * 0.38));
    ctx.font = `600 ${fs}px "Noto Serif SC","Songti SC",serif`;
    ctx.fillStyle = dark ? '#f5ebd6' : '#221a12';
    const shortName = core.name.length > 6 ? core.name.slice(0, 6) + '…' : core.name;
    ctx.fillText(shortName, core.sx, core.sy - 4);
    ctx.font = `600 ${Math.max(9.5, fs * 0.56)}px ui-monospace,monospace`;
    ctx.fillStyle = dark ? mixHex(col, 245, 232, 204, 0.28) : col;
    ctx.fillText(`${KIND_LABEL[core.kind]} · ${core.count}`, core.sx, core.sy + fs * 0.74);
    ctx.textBaseline = 'alphabetic';
  }

  function drawClusterSurface(ctx, c, activeCluster, dark, is3D) {
    const col = colorFor(c.kind, c.name);
    const isActive = activeCluster === c;
    const alpha = (activeCluster && !isActive ? .32 : 1) * graphDepthFade(c.sz) * c.revealEased;
    const r = c.surfaceR;
    ctx.beginPath();
    if (is3D) {
      const [u, v] = c.basis;
      const sphereRadius = graph.shellRadius;
      const capAngle = 2 * Math.asin(Math.min(1, r / (2 * c.sk * sphereRadius)));
      for (let i = 0; i < 40; i++) {
        const theta = i * Math.PI * 2 / 40;
        const alongU = Math.cos(theta), alongV = Math.sin(theta);
        const project = angle => {
          const axial = sphereRadius * Math.cos(angle), tangent = sphereRadius * Math.sin(angle);
          const [x, y, z] = c.direction.map((value, axis) => value * axial + (u[axis] * alongU + v[axis] * alongV) * tangent);
          return projectPoint(x, y, z);
        };
        let point = project(capAngle);
        const horizon = sphereRadius ** 2 / graph.cameraDistance;
        if (point.z < horizon) {
          // End the patch at the visible rim when the cap wraps around the globe.
          let lo = 0, hi = capAngle;
          for (let step = 0; step < 8; step++) {
            const mid = (lo + hi) / 2;
            const candidate = project(mid);
            if (candidate.z < horizon) hi = mid;
            else { lo = mid; point = candidate; }
          }
        }
        if (i === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      }
      ctx.closePath();
    } else {
      ctx.arc(c.sx, c.sy, r, 0, Math.PI * 2);
    }
    // Recessed matte museum lacquer / parchment tray fill
    const fill = ctx.createRadialGradient(c.sx, c.sy, r * .1, c.sx, c.sy, r);
    fill.addColorStop(0, hexAlpha(col, (dark ? .18 : .13) * alpha));
    fill.addColorStop(.78, hexAlpha(col, (dark ? .11 : .08) * alpha));
    fill.addColorStop(1, hexAlpha(col, (dark ? .22 : .16) * alpha));
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = isActive ? 1.8 : 1.15;
    ctx.strokeStyle = hexAlpha(col, (isActive ? .86 : .52) * alpha);
    ctx.stroke();
  }

  function drawClusterHub(ctx, c, activeCluster, dark) {
    const col = colorFor(c.kind, c.name);
    const isAct = activeCluster === c;
    const isSelected = c.singleton && (c.singleton.id === state.drawerItemId || stageOverlay?.artifactSet?.has(c.singleton.id));
    const dimAlpha = activeCluster && !isAct && !isSelected ? 0.30 : 1;
    const alpha = dimAlpha * graphNodeOpacity(c);
    const r = c.drawR;

    ctx.save();
    ctx.globalAlpha = alpha;

    // Subtle grounded drop shadow / museum depth (NO glossy planet aura)
    if (!c.backFacing && c.reveal === 0 && (isAct || isSelected || (!c.singleton && r >= 8))) {
      const g = ctx.createRadialGradient(c.sx, c.sy + r * 0.12, r * 0.65, c.sx, c.sy + r * 0.12, r * 1.65);
      g.addColorStop(0, dark ? 'rgba(0,0,0,0.48)' : 'rgba(42,30,18,0.18)');
      g.addColorStop(0.55, hexAlpha(col, isAct ? 0.24 : 0.08));
      g.addColorStop(1, hexAlpha(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(c.sx, c.sy + r * 0.12, r * 1.65, 0, Math.PI * 2);
      ctx.fill();
    }

    const sprite = !c.backFacing && c.singleton && (isAct || isSelected || r >= 14)
      ? getSprite(c.singleton.thumbUrl, 0, c.singleton.plateUrl) : null;
    const bitmap = spriteBitmap(sprite, dark);
    if (bitmap) {
      paintSprite(ctx, sprite, bitmap, c.sx, c.sy, r);
    } else {
      // Matte burnished antique bronze / lacquered stoneware disc (rich museum-lit patina, zero plastic sheen)
      const surface = ctx.createRadialGradient(c.sx, c.sy - r * 0.10, r * 0.06, c.sx, c.sy, r);
      if (dark) {
        surface.addColorStop(0, mixHex(col, 46, 36, 26, 0.16));
        surface.addColorStop(0.65, mixHex(col, 26, 20, 15, 0.42));
        surface.addColorStop(1, mixHex(col, 14, 11, 8, 0.64));
      } else {
        surface.addColorStop(0, mixHex(col, 246, 238, 222, 0.22));
        surface.addColorStop(0.66, mixHex(col, 235, 224, 202, 0.08));
        surface.addColorStop(1, mixHex(col, 30, 20, 12, 0.22));
      }
      ctx.fillStyle = surface;
      ctx.beginPath();
      ctx.arc(c.sx, c.sy, r, 0, Math.PI * 2);
      ctx.fill();

      // Engraved inner bronze-mirror concentric hairline ring (铜镜内弦纹)
      if (!c.backFacing && !c.singleton && r >= 11) {
        ctx.beginPath();
        ctx.arc(c.sx, c.sy, r - 3.2, 0, Math.PI * 2);
        ctx.strokeStyle = dark ? hexAlpha(col, 0.56) : 'rgba(250,244,232,0.46)';
        ctx.lineWidth = 0.85;
        ctx.stroke();
      }
    }
    ctx.beginPath();
    ctx.arc(c.sx, c.sy, r, 0, Math.PI * 2);
    ctx.strokeStyle = isAct || isSelected
      ? (dark ? '#f3dfb6' : '#3a2414')
      : (dark ? mixHex(col, 238, 222, 190, 0.16) : mixHex(col, 34, 24, 16, 0.18));
    ctx.lineWidth = isAct || isSelected ? 2.4 : r < 8 ? 1.15 : 1.85;
    ctx.stroke();

    // Dignified antique-ivory count engraved in center of medallion
    if (!c.backFacing && !c.singleton && c.reveal < .35 && r >= 8) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `600 ${Math.max(10, Math.min(13.5, r * 0.58))}px ui-monospace,monospace`;
      ctx.fillStyle = dark ? '#f5ebd6' : '#faf5ea';
      ctx.fillText(String(c.items.length), c.sx, c.sy + 0.5);
    }
    ctx.restore();
  }

  function drawClusterLabel(ctx, c, activeCluster, dark, labelBoxes) {
    const col = colorFor(c.kind, c.name);
    const isAct = activeCluster === c;
    const labelText = c.name + (c.expanded ? ` · ${c.items.length}` : '') + (c.hiddenCount > 0 ? ` (+${c.hiddenCount})` : '');
    const ly = c.sy - c.surfaceR - 14;
    ctx.save();
    ctx.font = `600 12.5px "Noto Serif SC","Songti SC",serif`;
    const tw = ctx.measureText(labelText).width;
    const dotSpace = 11;
    const pw = tw + 18 + dotSpace, ph = 23;
    const px = c.sx - pw * 0.5, py = ly - ph * 0.5;
    if (graph.compact && labelBoxes?.some(([l, t, r, b]) => px < r + 4 && px + pw > l - 4 && py < b + 4 && py + ph > t - 4)) {
      ctx.restore();
      return;
    }
    c._labelBox = [px, py, px + pw, py + ph];
    labelBoxes?.push(c._labelBox);
    ctx.globalAlpha = (activeCluster && !isAct ? 0.30 : 1) * graphDepthFade(c.sz);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    // Archival museum specimen plaque (warm lacquer tablet / aged ivory tag)
    ctx.fillStyle = isAct
      ? (dark ? mixHex(col, 24, 19, 14, 0.72, 0.96) : mixHex(col, 248, 241, 226, 0.84, 0.96))
      : (dark ? 'rgba(22,18,14,0.90)' : 'rgba(250,245,234,0.94)');
    roundRect(ctx, px, py, pw, ph, 6);
    ctx.fill();
    ctx.strokeStyle = hexAlpha(col, isAct ? 0.94 : 0.54);
    ctx.lineWidth = isAct ? 1.45 : 0.95;
    ctx.stroke();

    // Small engraved square-seal swatch (印章色块)
    ctx.fillStyle = col;
    ctx.fillRect(px + 8, ly - 3, 6, 6);

    ctx.fillStyle = isAct ? (dark ? '#faf1df' : col) : (dark ? '#efe6d4' : '#241c14');
    ctx.fillText(labelText, px + 19, ly + 0.5);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  function drawSpecimenNode(ctx, n, activeCluster, selectedItemId, dark) {
    const it = n.item;
    const col = colorFor(n.cluster.kind, n.cluster.name);
    const isSel = it.id === selectedItemId || Boolean(stageOverlay?.artifactSet?.has(it.id));
    const isAct = isSel || activeCluster === n.cluster;
    const dimAlpha = (activeCluster || stageOverlay?.artifactSet) && !isAct ? 0.22 : 1;
    const depthFade = graphNodeOpacity(n);
    const r = Math.max(2.5, n.sr * (isSel ? 1.12 : 1));

    ctx.save();
    ctx.globalAlpha = dimAlpha * depthFade * n.cluster.revealEased;

    if (isSel && !n.backFacing) {
      const g = ctx.createRadialGradient(n.sx, n.sy, r * 0.65, n.sx, n.sy, r * 1.9);
      g.addColorStop(0, hexAlpha(col, 0.38));
      g.addColorStop(1, hexAlpha(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r * 1.9, 0, Math.PI * 2);
      ctx.fill();
    }

    const sp = n.backFacing ? null : getSprite(it.thumbUrl, 0, it.plateUrl);
    const bmp = spriteBitmap(sp, dark);
    if (bmp) {
      paintSprite(ctx, sp, bmp, n.sx, n.sy, r);
    } else {
      ctx.fillStyle = n.backFacing ? col : (dark ? mixHex(col, 26, 21, 16, 0.72) : mixHex(col, 245, 238, 224, 0.74));
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
    ctx.strokeStyle = isSel ? (dark ? '#f2d9a2' : '#8f3a22') : hexAlpha(col, isAct ? 0.90 : 0.64);
    ctx.lineWidth = isSel ? 2.2 : 1.25;
    ctx.stroke();

    // Concise label beneath node only when selected, hovered cluster, or zoomed closely
    if (!n.backFacing && n.cluster.reveal > .7 && (isSel || (activeCluster === n.cluster && r >= 13) || r >= 22)) {
      const lbl = (it.motifs[0] && state.clusterBy !== 'motif' && state.focusKind !== 'motif')
        ? it.motifs[0]
        : (it.title.length > 9 ? it.title.slice(0, 8) + '…' : it.title);
      ctx.font = `500 10.5px ${canvasFont()}`;
      ctx.textAlign = 'center';
      ctx.fillStyle = dark ? 'rgba(240,232,216,0.92)' : 'rgba(34,27,20,0.88)';
      ctx.fillText(lbl, n.sx, n.sy + r + 13);
    }
    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ═══════════════════════════════════════════════════════════════
     7. VIEW 3 — MUSEO Morandi Grid Catalog
     ═══════════════════════════════════════════════════════════════ */
  function renderCatalog() {
    const interpretations = Object.hasOwn(INTERPRETATION_CATALOGS, state.catalogTab);
    $('interpretationTools').hidden = !interpretations;
    $('catalogSpecimens').hidden = interpretations;
    $('catalogTabs').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.cat === state.catalogTab));
    });
    $('catalogExtraDimension').value = state.catalogTab === 'interpretation' ? 'interpretation'
      : ['technique', 'composition'].includes(state.catalogTab) ? ''
      : Object.hasOwn(EXTRA_DIMENSIONS, state.catalogTab) ? state.catalogTab : '';
